services:
  auslastung:
    build: .
    container_name: fitinn-auslastung
    restart: unless-stopped
    env_file: .env
    ports:
      # Nur lokal erreichbar – öffentlich via Reverse Proxy (Caddy/nginx) + HTTPS.
      # Willst du ihn direkt offen testen, ändere auf "8080:8080".
      - "127.0.0.1:8080:8080"
