<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Online Mitglied werden</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:#eef2f3;color:#15171B}
  input,select,button{font-family:inherit}
  ::placeholder{color:#a9b1b6}
  input:focus,select:focus{outline:none;border-color:#0a4958 !important;box-shadow:0 0 0 3px rgba(10,73,88,.12) !important}
  a{-webkit-tap-highlight-color:transparent}
  @keyframes fiUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .topbar{background:#0a4958}
  .topbar .in{max-width:760px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
  .topbar img{height:26px;width:auto;display:block}
  .topbar .addr{font-size:13px;font-weight:600;color:#9fc3ca}

  .wrap{max-width:760px;margin:0 auto;padding:44px 24px 64px}
  .head{text-align:center}
  .badge{display:inline-flex;align-items:center;gap:9px;background:#fff3e8;border:1px solid #f6dcc4;border-radius:100px;padding:8px 16px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#E08C53;display:inline-block}
  .badge span{font-size:12px;font-weight:700;color:#E08C53;letter-spacing:.4px}
  .head h1{margin:18px 0 0;font-size:38px;font-weight:900;letter-spacing:-1px;color:#15171B;line-height:1.1}
  .head p{margin:12px auto 0;max-width:460px;font-size:16px;font-weight:500;color:#5a636a;line-height:1.6}

  .prog{margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .prog .l{font-size:13px;font-weight:800;color:#0a4958;letter-spacing:.2px}
  .prog .r{font-size:13px;font-weight:700;color:#8a8178}
  .track{margin-top:10px;height:7px;border-radius:100px;background:#dce3e4;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#0a4958,#0e6072);border-radius:100px;transition:width .3s ease}

  .card{margin-top:22px;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(10,73,88,.08);padding:34px;animation:fiUp .25s ease}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#E08C53}
  .q{margin-top:6px;font-size:22px;font-weight:900;letter-spacing:-.5px;color:#15171B}
  .sub{margin:8px 0 0;font-size:14px;font-weight:500;color:#6b7780;line-height:1.55}

  .ratepick{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;margin:18px 0 2px;-webkit-overflow-scrolling:touch}
  .ratepill{flex:0 0 auto;padding:11px 16px;border-radius:11px;border:1.5px solid #dce3e4;background:#fff;color:#15171B;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .ratepill.sel{border-color:#0a4958;background:#0a4958;color:#fff}

  .plan{margin-top:18px;border:1.5px solid #dce7e9;border-radius:16px;overflow:hidden}
  .planhd{background:#0a4958;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .planhd .pn{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.3px}
  .planhd .pt{margin-top:3px;font-size:13px;font-weight:600;color:#9fc3ca}
  .planhd .pp{text-align:right}
  .planhd .pv{font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px}
  .planhd .pu{font-size:12px;font-weight:600;color:#9fc3ca}
  .planbody{padding:18px 22px}
  .planbody .prow{display:flex;justify-content:space-between;font-size:14px;padding:7px 0}
  .planbody .pk{color:#6b7780;font-weight:500}
  .planbody .pvv{color:#15171B;font-weight:700}
  .planbody .bonus{border-top:1px solid #eef1f2;margin-top:4px}
  .planbody .bonus .pk{color:#0a4958;font-weight:700}
  .planbody .green{color:#0a8f5b;font-weight:800}

  .field{margin-top:18px}
  .field label{display:block;font-size:13px;font-weight:700;color:#42454b;margin-bottom:7px}
  .field input,.field select{width:100%;padding:13px 15px;border:1.5px solid #dce3e4;border-radius:11px;font-size:15px;background:#fff;color:#15171B}
  .field input[type="date"]{min-height:50px;font-size:16px;-webkit-appearance:none;appearance:none}
  .codewrap{display:flex;gap:10px}
  .codewrap input{flex:1;font-weight:700;letter-spacing:.5px;color:#0a4958}
  .redeemed{display:inline-flex;align-items:center;gap:7px;background:#e7f6ee;border:1px solid #bce6d1;border-radius:11px;padding:0 16px}
  .redeemed b{color:#0a8f5b;font-size:15px;font-weight:900}
  .redeemed span{font-size:13px;font-weight:700;color:#0a8f5b}

  .form{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .full{grid-column:1 / -1}
  .form .field{margin-top:0}
  .form label{display:block;font-size:13px;font-weight:700;color:#42454b;margin-bottom:7px}
  .form input,.form select{width:100%;padding:13px 15px;border:1.5px solid #dce3e4;border-radius:11px;font-size:15px;background:#fff;color:#15171B}
  .form input[type="date"]{min-height:50px;font-size:16px;-webkit-appearance:none;appearance:none}
  .form input[readonly]{background:#f7f9f9;color:#8a8178}

  .sepahint{margin-top:18px;display:flex;gap:11px;background:#f1f6f7;border-radius:13px;padding:14px 16px}
  .sepahint span{font-size:12px;font-weight:600;color:#5a636a;line-height:1.5}

  .pricebox{margin-top:20px;background:#f1f6f7;border-radius:14px;padding:6px 20px}
  .srow{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #e2eaeb}
  .srow:last-child{border-bottom:none}
  .srow .sk{font-size:14px;font-weight:500;color:#6b7780}
  .srow .sv{font-size:14px;font-weight:700;color:#15171B;text-align:right}
  .srow .green{color:#0a8f5b;font-weight:800}

  .consents{margin-top:22px;display:flex;flex-direction:column;gap:14px}
  .agree{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .agree input{margin-top:2px;width:18px;height:18px;accent-color:#0a4958;flex-shrink:0}
  .agree .at{flex:1;font-size:13px;font-weight:500;color:#42454b;line-height:1.5}
  .agree a{color:#0a4958}
  .agree .toggle{background:none;border:none;color:#0a4958;font-weight:700;font-size:13px;cursor:pointer;padding:0}
  .accbody{font-size:13px;color:#6b7780;line-height:1.55;margin:6px 0 0 30px}

  .submit{margin-top:26px;width:100%;border:none;font-size:16px;font-weight:800;padding:17px;border-radius:14px;background:#0a4958;color:#fff;cursor:pointer}
  .submit:disabled{background:#dce3e4;color:#9aa3a8;cursor:not-allowed}
  .fineprint{margin:14px 0 0;text-align:center;font-size:12px;font-weight:500;color:#8a8178}

  .nav{margin-top:18px;display:flex;gap:12px}
  .nav .back{flex:0 0 auto;background:#fff;border:1.5px solid #dce3e4;color:#42454b;font-size:15px;font-weight:700;padding:16px 26px;border-radius:14px;cursor:pointer}
  .nav .next{flex:1;background:#0a4958;color:#fff;border:none;font-size:16px;font-weight:800;padding:16px;border-radius:14px;cursor:pointer}
  .nav .next:disabled{background:#dce3e4;color:#9aa3a8;cursor:not-allowed}

  .msg{margin-top:14px;font-size:13px;padding:11px 14px;border-radius:11px;display:none;white-space:pre-wrap}
  .msg.err{display:block;background:#FCEBEA;color:#b53a2c;font-weight:600}

  .trust{margin-top:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:22px}
  .trust div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#6b7780}

  .done{margin-top:22px;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(10,73,88,.08);padding:40px 34px;text-align:center;animation:fiUp .25s ease}
  .done .chk{width:64px;height:64px;border-radius:50%;background:#E7F6EC;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}

  .legal{max-width:760px;margin:0 auto;padding:8px 24px 36px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
  .legal a{color:#7a8a8e;font-size:12px;font-weight:600;text-decoration:none}
  .legal a:hover{color:#0a4958}
  .legal span{color:#aab6b8;font-size:12px}

  @media (max-width:720px){
    .topbar .addr{display:none}
    .wrap{padding:32px 18px 48px}
    .card{padding:26px 20px}
    .head h1{font-size:30px}
    .form{grid-template-columns:1fr}
  }
</style>
</head>
<body>

  <div class="topbar"><div class="in">
    <a href="/mitglieder"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier" /></a>
    <div class="addr">Auf Hirtenberg 8 · 54296 Trier</div>
  </div></div>

  <div class="wrap">
    <div class="head">
      <div class="badge"><span class="dot"></span><span id="badgeText">Online abschließen · in wenigen Minuten</span></div>
      <h1>Mitglied werden</h1>
      <p id="headSub">Schließ deine Mitgliedschaft bequem online ab — jederzeit anpassbar, keine versteckten Kosten.</p>
    </div>
    <div id="flow"></div>
  </div>

  <div class="legal">
    <a href="https://www.fit-inn-trier.de/impressum-fit-inn-trier" target="_blank" rel="noopener">Impressum</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/datenschutz-fit-inn-trier" target="_blank" rel="noopener">Datenschutz</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/agbs-fit-inn-trier" target="_blank" rel="noopener">AGB</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/kundigungsbedingungen-fit-inn-trier" target="_blank" rel="noopener">Widerruf</a>
  </div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var TEAL='#0a4958';
  var params=new URLSearchParams(location.search);
  var REF=(params.get('ref')||params.get('code')||'').trim().toUpperCase().slice(0,40);
  var rawName=(params.get('name')||'').trim().replace(/[^\p{L}\s\-]/gu,'').slice(0,40);
  var REFNAME=rawName?(rawName.charAt(0).toUpperCase()+rawName.slice(1)):'';

  if(REFNAME){ $('badgeText').textContent='Empfohlen von '+REFNAME+' · 2 Wochen gratis'; $('headSub').textContent='Nur wenige Schritte bis zu deiner Mitgliedschaft — dein Werbe-Bonus ist automatisch hinterlegt.'; }
  else if(REF){ $('badgeText').textContent='Empfohlen von einem Mitglied · 2 Wochen gratis'; }

  var unitDE={WEEK:'Woche',MONTH:'Monat',YEAR:'Jahr',DAY:'Tag'};
  var pluralDE={WEEK:'Wochen',MONTH:'Monate',YEAR:'Jahre',DAY:'Tage'};
  var eur=function(n){return (Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2})+' €';};
  var TITLES=['Tarif','Persönliche Daten','Adresse','Zahlung','Abschluss'];
  var COUNTRIES=[['DE','Deutschland'],['LU','Luxemburg'],['AT','Österreich'],['CH','Schweiz']];

  var RATES=[], SEL=null, STEP=1, DONE=null, BUSY=false, ERR='', PRICE=null, ACC={};
  var F={ country:'DE', code:REF, startDate:new Date().toISOString().slice(0,10) };

  function termText(t){ var u=(t.termValue>1?pluralDE[t.termUnit]:unitDE[t.termUnit])||t.termUnit; return t.termValue+' '+u; }
  function effCode(){ return String(F.code||'').trim().toUpperCase(); }
  window.__f=function(id,v){ F[id]=v; };

  var DATA_FIELDS=['firstname','lastname','email','dateOfBirth','street','houseNumber','zipCode','city','iban','startDate'];
  function reqTextBlocks(){ return ((SEL&&SEL.textBlocks)||[]).filter(function(tb){return tb.isConfirmationRequired;}); }
  function stepValid(n){
    if(n===1) return !!SEL && !!(F.startDate||'').trim();
    if(n===2) return ['firstname','lastname','phone','dateOfBirth'].every(function(k){return (F[k]||'').trim();}) && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email||'');
    if(n===3) return ['street','houseNumber','zipCode','city'].every(function(k){return (F[k]||'').trim();});
    if(n===4) return !!(F.accountHolder||((F.firstname||'')+(F.lastname||''))).trim() && !!(F.iban||'').trim();
    if(n===5){ return F.conf_sepa && reqTextBlocks().every(function(tb){return F['conf_'+tb.id];}); }
    return true;
  }

  // ---- Render ----
  function progressBar(){
    return '<div class="prog"><div class="l">Schritt '+STEP+' von 5</div><div class="r">'+esc(TITLES[STEP-1])+'</div></div>'+
      '<div class="track"><div class="fill" style="width:'+Math.round(STEP/5*100)+'%"></div></div>';
  }

  function planCard(){
    if(!SEL) return '<div class="sub" style="margin-top:18px">Tarif wird geladen …</div>';
    var t=(SEL.terms||[])[0]||{};
    var picker='';
    if(RATES.length>1){ picker='<div class="ratepick">'+RATES.map(function(b){ var tt=(b.terms||[])[0]||{}; return '<button type="button" class="ratepill'+(SEL.id===b.id?' sel':'')+'" data-pick="'+b.id+'">'+esc(b.name)+' · '+eur(tt.price)+'</button>'; }).join('')+'</div>'; }
    var fee=(t.flatFees&&t.flatFees.length)?eur(t.flatFees[0].price):'keine';
    var bonus=REF?'<div class="prow bonus"><span class="pk">Werbe-Bonus</span><span class="green">2 Wochen gratis</span></div>':'';
    return picker+
      '<div class="plan"><div class="planhd"><div><div class="pn">'+esc(SEL.name)+'</div><div class="pt">Laufzeit '+termText(t)+'</div></div>'+
      '<div class="pp"><div class="pv">'+eur(t.price)+'</div><div class="pu">pro '+(unitDE[t.paymentFrequencyUnit]||'Woche')+'</div></div></div>'+
      '<div class="planbody"><div class="prow"><span class="pk">Aufnahmegebühr</span><span class="pvv">'+fee+'</span></div>'+bonus+'</div></div>';
  }

  function step1(){
    var redeemed=effCode()?'<div class="redeemed"><b>✓</b><span>Eingelöst</span></div>':'';
    return '<div class="card"><div class="eyebrow">Schritt 1</div><div class="q">Dein Tarif</div>'+
      planCard()+
      '<div class="field"><label>Startdatum</label><input data-f="startDate" type="date" min="'+new Date().toISOString().slice(0,10)+'" value="'+esc(F.startDate||'')+'" /></div>'+
      '<div class="field"><label>Gutschein- / Werbe-Code</label><div class="codewrap"><input data-f="code" placeholder="Code (optional)" value="'+esc(F.code||'')+'" />'+redeemed+'</div></div>'+
      '</div>';
  }

  function fInput(id,label,type,attrs){ attrs=attrs||{}; var extra='';
    if(type==='date'&&id==='dateOfBirth') extra=' max="'+new Date().toISOString().slice(0,10)+'"';
    return '<div class="field'+(attrs.full?' full':'')+'"><label>'+label+'</label><input data-f="'+id+'" '+(type?('type="'+type+'"'):'')+extra+(attrs.ph?(' placeholder="'+attrs.ph+'"'):'')+(attrs.style?(' style="'+attrs.style+'"'):'')+(attrs.ro?' readonly':'')+(attrs.attr||'')+' value="'+esc(F[id]||'')+'" /></div>'; }

  function step2(){
    return '<div class="card"><div class="eyebrow">Schritt 2</div><div class="q">Persönliche Daten</div><div class="form">'+
      '<div class="field full"><label>Anrede</label><select data-f="gender"><option value="">Bitte wählen</option><option value="MALE"'+(F.gender==='MALE'?' selected':'')+'>Herr</option><option value="FEMALE"'+(F.gender==='FEMALE'?' selected':'')+'>Frau</option><option value="UNISEX"'+(F.gender==='UNISEX'?' selected':'')+'>Divers</option></select></div>'+
      fInput('firstname','Vorname','text',{ph:'Max'})+fInput('lastname','Nachname','text',{ph:'Mustermann'})+
      fInput('dateOfBirth','Geburtsdatum','date')+fInput('phone','Telefon','tel',{ph:'0151 23456789'})+
      fInput('email','E-Mail','email',{full:true,ph:'max@beispiel.de'})+
      '</div></div>';
  }

  function step3(){
    return '<div class="card"><div class="eyebrow">Schritt 3</div><div class="q">Deine Adresse</div><div class="form" style="grid-template-columns:3fr 1fr">'+
      fInput('street','Straße','text',{ph:'Musterstraße'})+fInput('houseNumber','Nr.','text',{ph:'1'})+
      '<div class="field"><label>PLZ</label><input data-f="zipCode" inputmode="numeric" maxlength="5" placeholder="54296" value="'+esc(F.zipCode||'')+'" /></div>'+
      fInput('city','Ort','text',{ph:'Trier'})+
      '<div class="field full"><label>Land</label><select data-f="country">'+COUNTRIES.map(function(c){return '<option value="'+c[0]+'"'+(F.country===c[0]?' selected':'')+'>'+c[1]+'</option>';}).join('')+'</select></div>'+
      '</div></div>';
  }

  function step4(){
    return '<div class="card"><div class="eyebrow">Schritt 4</div><div class="q">Zahlung per SEPA-Lastschrift</div>'+
      '<p class="sub">Deine Beiträge werden bequem von deinem Konto eingezogen.</p>'+
      '<div class="form" style="grid-template-columns:1fr">'+
      fInput('accountHolder','Kontoinhaber','text',{full:true,ph:'Max Mustermann'})+
      fInput('iban','IBAN','text',{full:true,ph:'DE00 0000 0000 0000 0000 00',style:'letter-spacing:.5px'})+
      '<div class="field full"><label>Kreditinstitut</label><input placeholder="Wird automatisch erkannt" readonly /></div>'+
      '</div>'+
      '<div class="sepahint"><span>🔒</span><span>Mit Angabe deiner IBAN erteilst du Fit-Inn Trier ein SEPA-Lastschriftmandat zum Einzug der fälligen Beiträge.</span></div>'+
      '</div>';
  }

  function step5(){
    var t=(SEL.terms||[])[0]||{};
    var price='';
    if(PRICE===null) price='<div class="pricebox" style="padding:16px 20px;color:#8a929a;font-size:13px">Preis wird berechnet …</div>';
    else if(PRICE===false){
      price='<div class="pricebox"><div class="srow"><span class="sk">Tarif</span><span class="sv">'+esc(SEL.name)+' · '+termText(t)+'</span></div>'+
        '<div class="srow"><span class="sk">Beitrag</span><span class="sv">'+eur(t.price)+' / '+(unitDE[t.paymentFrequencyUnit]||'Woche')+'</span></div>'+
        (REF?'<div class="srow"><span class="sk">Werbe-Bonus</span><span class="green">2 Wochen gratis</span></div>':'')+'</div>';
    } else {
      var base=PRICE.discountedBasePrice!=null?PRICE.discountedBasePrice:PRICE.basePrice;
      var rows='<div class="srow"><span class="sk">Tarif</span><span class="sv">'+esc(SEL.name)+' · '+termText(t)+'</span></div>'+
        '<div class="srow"><span class="sk">Beitrag</span><span class="sv">'+eur(base)+' / '+(unitDE[t.paymentFrequencyUnit]||'Woche')+'</span></div>';
      (PRICE.flatFees||[]).forEach(function(f){ rows+='<div class="srow"><span class="sk">'+esc(f.name)+' (einmalig)</span><span class="sv">'+eur(f.discountedPrice!=null?f.discountedPrice:f.price)+'</span></div>'; });
      if(REF) rows+='<div class="srow"><span class="sk">Werbe-Bonus</span><span class="green">2 Wochen gratis</span></div>';
      if(PRICE.contractVolume&&PRICE.contractVolume.totalContractVolume!=null) rows+='<div class="srow"><span class="sk" style="font-weight:800;color:#15171B">Gesamt-Vertragsvolumen</span><span class="sv" style="font-size:16px;color:'+TEAL+'">'+eur(PRICE.contractVolume.totalContractVolume)+'</span></div>';
      price='<div class="pricebox">'+rows+'</div>';
    }
    // Pflicht-Bestätigungen aus Magicline-Textblöcken + SEPA-Mandat
    var tbs=reqTextBlocks().map(function(tb){ var open=!!ACC[tb.id];
      return '<div><label class="agree"><input type="checkbox" data-conf="'+tb.id+'" '+(F['conf_'+tb.id]?'checked':'')+' /><span class="at">'+esc(tb.title)+(tb.text?' <button type="button" class="toggle" data-acc="'+tb.id+'">'+(open?'(schließen)':'(lesen)')+'</button>':'')+'</span></label>'+(open&&tb.text?'<div class="accbody">'+esc(tb.text)+'</div>':'')+'</div>'; }).join('');
    var sepa='<label class="agree"><input type="checkbox" data-conf="sepa" '+(F.conf_sepa?'checked':'')+' /><span class="at">Ich erteile das SEPA-Lastschriftmandat zum Einzug der Beiträge.</span></label>';
    var mkt='<label class="agree"><input type="checkbox" data-conf="mkt" '+(F.conf_mkt?'checked':'')+' /><span class="at" style="color:#6b7780">Ich möchte Infos zu Angeboten & Kursen per E-Mail erhalten (optional).</span></label>';
    return '<div class="card"><div class="eyebrow">Schritt 5</div><div class="q">Zusammenfassung & Abschluss</div>'+
      price+
      '<div class="consents">'+tbs+sepa+mkt+'</div>'+
      '<button type="button" class="submit" data-finish'+(stepValid(5)?'':' disabled')+'>'+(BUSY?'Wird abgeschlossen …':'Zahlungspflichtig Mitglied werden')+'</button>'+
      '<p class="fineprint">Mit Klick schließt du einen kostenpflichtigen Vertrag ab.</p>'+
      '<div class="msg'+(ERR?' err':'')+'" id="msg">'+esc(ERR)+'</div>'+
      '</div>';
  }

  function navBar(){
    var back=STEP>1?'<button type="button" class="back" data-back>Zurück</button>':'';
    var next=STEP<5?'<button type="button" class="next" data-next'+(stepValid(STEP)?'':' disabled')+'>Weiter</button>':'';
    if(!back&&!next) return '';
    return '<div class="nav">'+back+next+'</div>';
  }

  function trust(){
    return '<div class="trust"><div><span style="color:#0a8f5b">✓</span>Familiäres Studio in Trier</div><div><span style="color:#F0A868">★</span>4,9 Google-Bewertung</div><div><span style="color:#0a8f5b">✓</span>SSL-verschlüsselt</div></div>';
  }

  function doneView(){
    return '<div class="done"><div class="chk"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>'+
      '<div style="font-size:24px;font-weight:900">Willkommen im Fit-Inn Trier!</div>'+
      '<div style="font-size:14px;color:#6b7780;margin-top:8px;line-height:1.55">Deine Mitgliedschaft ist aktiv. Schön, dass du dabei bist.</div>'+
      (DONE&&DONE.customerNumber?('<div style="background:#f1f6f7;border-radius:14px;padding:18px;margin-top:20px"><div style="font-size:12px;color:#8a929a;font-weight:600">Deine Mitgliedsnummer</div><div style="font-size:24px;font-weight:900;color:'+TEAL+';margin-top:2px">'+esc(DONE.customerNumber)+'</div></div>'):'')+
      '<a href="/mitglieder" style="display:inline-block;margin-top:20px;padding:15px 28px;border-radius:13px;background:'+TEAL+';color:#fff;font-weight:800;text-decoration:none">Zum Login</a></div>';
  }

  function render(){
    if(DONE){ $('flow').innerHTML=doneView(); window.scrollTo(0,0); return; }
    var html=progressBar();
    if(STEP===1) html+=step1();
    else if(STEP===2) html+=step2();
    else if(STEP===3) html+=step3();
    else if(STEP===4) html+=step4();
    else html+=step5();
    html+=navBar()+trust();
    $('flow').innerHTML=html;
  }
  function setStep(n){ STEP=n; ERR=''; render(); window.scrollTo(0,0); }

  function refreshButtons(){
    var nx=document.querySelector('[data-next]'); if(nx) nx.disabled=!stepValid(STEP);
    var fin=document.querySelector('[data-finish]'); if(fin) fin.disabled=!stepValid(5)||BUSY;
  }

  // ---- Events ----
  document.addEventListener('click',function(e){
    var pick=e.target.closest?e.target.closest('[data-pick]'):null;
    if(pick){ var id=+pick.getAttribute('data-pick'); SEL=RATES.filter(function(b){return b.id===id;})[0]; render(); return; }
    if(e.target.closest&&e.target.closest('[data-next]')){ onNext(); return; }
    if(e.target.closest&&e.target.closest('[data-back]')){ setStep(STEP-1); return; }
    if(e.target.closest&&e.target.closest('[data-finish]')){ onFinish(); return; }
    var acc=e.target.closest?e.target.closest('[data-acc]'):null; if(acc){ var aid=acc.getAttribute('data-acc'); ACC[aid]=!ACC[aid]; render(); return; }
  });
  document.addEventListener('input',function(e){ var el=e.target; if(el.hasAttribute&&el.hasAttribute('data-f')){ F[el.getAttribute('data-f')]=el.value; refreshButtons(); } });
  document.addEventListener('change',function(e){ var el=e.target;
    if(el.hasAttribute&&el.hasAttribute('data-f')){ F[el.getAttribute('data-f')]=el.value; refreshButtons(); }
    if(el.hasAttribute&&el.hasAttribute('data-conf')){ F['conf_'+el.getAttribute('data-conf')]=el.checked; refreshButtons(); } });

  function onNext(){
    if(!stepValid(STEP)){
      if(STEP===2 && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email||'')) { ERR='Bitte eine gültige E-Mail angeben.'; }
      return;
    }
    if(STEP===4){ PRICE=null; setStep(5); loadPreview(); return; }
    setStep(STEP+1);
  }

  function collect(){
    var d={ paymentChoice:'DIRECT_DEBIT', referralCode:effCode()||undefined, marketing:!!F.conf_mkt,
      accountHolder:(F.accountHolder||((F.firstname||'')+' '+(F.lastname||''))).trim(),
      rateBundleTermId:(SEL.terms[0]||{}).id, gender:F.gender||undefined, countryCode:F.country||'DE', phone:(F.phone||'').trim() };
    DATA_FIELDS.forEach(function(f){ d[f]=(F[f]||'').trim(); });
    return d;
  }
  function loadPreview(){
    fetch('/api/contract/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())})
      .then(function(r){return r.json();}).then(function(p){ PRICE=p.ok?p:false; render(); }).catch(function(){ PRICE=false; render(); });
  }
  function onFinish(){
    ERR='';
    if(!F.conf_sepa){ ERR='Bitte das SEPA-Lastschriftmandat bestätigen.'; render(); return; }
    var blocks=reqTextBlocks(); var confirmed=[];
    for(var i=0;i<blocks.length;i++){ if(!F['conf_'+blocks[i].id]){ ERR='Bitte alle Bedingungen bestätigen.'; render(); return; } confirmed.push(blocks[i].id); }
    var d=collect(); d.confirmedTextBlockIds=confirmed;
    BUSY=true; render();
    fetch('/api/contract/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
      .then(function(r){return r.json();}).then(function(res){
        BUSY=false;
        if(res.ok){ DONE={customerNumber:res.customerNumber}; render(); }
        else { ERR=res.message||'Abschluss fehlgeschlagen.'; render(); }
      }).catch(function(){ BUSY=false; ERR='Es ist ein Fehler aufgetreten. Bitte später erneut.'; render(); });
  }

  // ---- Tarife laden ----
  fetch('/api/contract/rates',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ RATES=(d.rates||[]); var best=RATES.filter(function(b){return /basic/i.test(b.name);})[0]; SEL=best||RATES[0]||null; render(); }).catch(function(){ render(); });
  render();
})();
</script>
</body>
</html>
