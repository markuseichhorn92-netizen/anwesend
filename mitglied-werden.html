<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Online Mitglied werden</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:#eef2f3;color:#15171B}
  input,select,button{font-family:inherit}
  ::placeholder{color:#a9b1b6}
  input:focus,select:focus{outline:none;border-color:#0a4958 !important;box-shadow:0 0 0 3px rgba(10,73,88,.12) !important}
  a{-webkit-tap-highlight-color:transparent}
  @keyframes fiUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .topbar{background:#0a4958}
  .topbar .in{max-width:760px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
  .topbar img{height:26px;width:auto;display:block}
  .topbar .addr{font-size:13px;font-weight:600;color:#9fc3ca}

  .wrap{max-width:760px;margin:0 auto;padding:44px 24px 64px}
  .head{text-align:center}
  .badge{display:inline-flex;align-items:center;gap:9px;background:#fff3e8;border:1px solid #f6dcc4;border-radius:100px;padding:8px 16px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#E08C53;display:inline-block}
  .badge span{font-size:12px;font-weight:700;color:#E08C53;letter-spacing:.4px}
  .head h1{margin:18px 0 0;font-size:38px;font-weight:900;letter-spacing:-1px;color:#15171B;line-height:1.1}
  .head p{margin:12px auto 0;max-width:460px;font-size:16px;font-weight:500;color:#5a636a;line-height:1.6}

  .prog{margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .prog .l{font-size:13px;font-weight:800;color:#0a4958;letter-spacing:.2px}
  .prog .r{font-size:13px;font-weight:700;color:#8a8178}
  .track{margin-top:10px;height:7px;border-radius:100px;background:#dce3e4;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#0a4958,#0e6072);border-radius:100px;transition:width .3s ease}

  .card{margin-top:22px;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(10,73,88,.08);padding:34px;animation:fiUp .25s ease}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#E08C53}
  .q{margin-top:6px;font-size:22px;font-weight:900;letter-spacing:-.5px;color:#15171B}
  .sub{margin:8px 0 0;font-size:14px;font-weight:500;color:#6b7780;line-height:1.55}
  .sec{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#0a4958;margin:24px 0 12px}

  .rate{text-align:left;width:100%;background:#fff;border:1.5px solid #dce3e4;border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .rate:hover{border-color:#bcd0d3}
  .rate.sel{border-color:#0a4958;box-shadow:0 0 0 2px #0a4958}
  .rate .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rate .nm{display:flex;align-items:center;gap:11px}
  .radio{width:22px;height:22px;border-radius:50%;border:2px solid #c9d3d5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rate.sel .radio{border-color:#0a4958}
  .radio i{width:11px;height:11px;border-radius:50%;background:transparent;display:block}
  .rate.sel .radio i{background:#0a4958}
  .rate .rn{font-size:18px;font-weight:900;color:#15171B}
  .rate .pr{text-align:right}
  .rate .pr b{font-size:20px;font-weight:900;color:#0a4958}
  .rate .pr small{font-size:12px;color:#8a929a;display:block}
  .rate .term{font-size:12px;color:#6b7780;margin:8px 0 0 33px;font-weight:600}
  .rate .feats{display:flex;flex-direction:column;gap:7px;margin:12px 0 0 33px}
  .rate .feat{display:flex;align-items:center;gap:8px}
  .rate .feat span{font-size:13px;color:#42454b}

  .form{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .full{grid-column:1 / -1}
  .field label{display:block;font-size:13px;font-weight:700;color:#42454b;margin-bottom:7px}
  .field input,.field select{width:100%;padding:13px 15px;border:1.5px solid #dce3e4;border-radius:11px;font-size:15px;background:#fff;color:#15171B}
  .field input[type="date"]{min-height:50px;font-size:16px;-webkit-appearance:none;appearance:none}

  .pricebox{background:#f1f6f7;border-radius:14px;padding:16px 20px;margin-top:6px}
  .prow{display:flex;justify-content:space-between;gap:16px;padding:7px 0}
  .prow .pk{font-size:14px;color:#6b7780}
  .prow .pv{font-size:14px;font-weight:700;color:#15171B}
  .ptotal{display:flex;justify-content:space-between;align-items:center;padding:12px 0 2px;margin-top:8px;border-top:1px solid #dbe5e6}
  .ptotal .pk{font-size:15px;font-weight:800}
  .ptotal .pv{font-size:18px;font-weight:900;color:#0a4958}
  .note{display:flex;align-items:flex-start;gap:8px;background:#f1f6f7;border-radius:12px;padding:12px 14px;margin-top:12px}
  .note span{font-size:12px;color:#6b7780;line-height:1.45}

  .conf{border:1.5px solid #e3eaeb;border-radius:13px;padding:13px 14px}
  .conf .ch{display:flex;align-items:center;gap:10px}
  .conf input{width:18px;height:18px;accent-color:#0a4958;flex-shrink:0}
  .conf .ct{flex:1;font-size:14px;font-weight:600;color:#15171B}
  .conf .toggle{background:none;border:none;color:#0a4958;font-weight:700;font-size:13px;cursor:pointer}
  .conf .body{font-size:13px;color:#6b7780;line-height:1.55;margin-top:10px}
  .agree{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .agree input{width:18px;height:18px;margin-top:1px;accent-color:#0a4958;flex-shrink:0}
  .agree span{font-size:13px;color:#42454b;line-height:1.5}
  .agree b{color:#15171B}

  .submit{margin-top:20px;width:100%;background:#0a4958;color:#fff;border:none;font-size:16px;font-weight:800;padding:17px;border-radius:14px;cursor:pointer}
  .submit:hover{background:#0c5566}.submit:disabled{background:#9fb9bf;cursor:not-allowed}
  .fineprint{font-size:12px;color:#8a929a;text-align:center;margin-top:8px}

  .nav{margin-top:18px;display:flex;gap:12px}
  .nav .back{flex:0 0 auto;background:#fff;border:1.5px solid #dce3e4;color:#42454b;font-size:15px;font-weight:700;padding:16px 26px;border-radius:14px;cursor:pointer}
  .nav .next{flex:1;background:#0a4958;color:#fff;border:none;font-size:16px;font-weight:800;padding:16px;border-radius:14px;cursor:pointer}
  .nav .next:disabled{background:#dce3e4;color:#9aa3a8;cursor:not-allowed}

  .msg{margin-top:14px;font-size:13px;padding:11px 14px;border-radius:11px;display:none;white-space:pre-wrap}
  .msg.err{display:block;background:#FCEBEA;color:#b53a2c;font-weight:600}

  .xsell{margin-top:24px;background:#0a4958;border-radius:18px;padding:24px 26px;display:flex;flex-wrap:wrap;align-items:center;gap:18px}
  .xsell .t1{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.2px}
  .xsell .t2{margin-top:4px;font-size:13px;font-weight:500;color:#9fc3ca;line-height:1.5}
  .xsell a{flex:0 0 auto;background:#F0A868;color:#15171B;font-size:14px;font-weight:800;padding:13px 22px;border-radius:11px;text-decoration:none}
  .xsell a:hover{background:#f2b27c}

  .done{margin-top:22px;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(10,73,88,.08);padding:40px 34px;text-align:center;animation:fiUp .25s ease}
  .done .chk{width:64px;height:64px;border-radius:50%;background:#E7F6EC;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}

  .legal{max-width:760px;margin:0 auto;padding:8px 24px 36px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
  .legal a{color:#7a8a8e;font-size:12px;font-weight:600;text-decoration:none}
  .legal a:hover{color:#0a4958}
  .legal span{color:#aab6b8;font-size:12px}

  @media (max-width:720px){
    .topbar .addr{display:none}
    .wrap{padding:32px 18px 48px}
    .card{padding:26px 20px}
    .head h1{font-size:30px}
    .form{grid-template-columns:1fr}
  }
</style>
</head>
<body>

  <div class="topbar"><div class="in">
    <a href="/mitglieder"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier" /></a>
    <div class="addr">Auf Hirtenberg 8 · 54296 Trier</div>
  </div></div>

  <div class="wrap">
    <div class="head">
      <div class="badge"><span class="dot"></span><span id="badgeText">Online abschließen · in wenigen Minuten</span></div>
      <h1>Mitglied werden</h1>
      <p>Schließ deine Mitgliedschaft bequem online ab — jederzeit anpassbar, keine versteckten Kosten.</p>
    </div>
    <div id="flow"></div>
  </div>

  <div class="legal">
    <a href="https://www.fit-inn-trier.de/impressum-fit-inn-trier" target="_blank" rel="noopener">Impressum</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/datenschutz-fit-inn-trier" target="_blank" rel="noopener">Datenschutz</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/agbs-fit-inn-trier" target="_blank" rel="noopener">AGB</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/kundigungsbedingungen-fit-inn-trier" target="_blank" rel="noopener">Widerruf</a>
  </div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var TEAL='#0a4958';
  var params=new URLSearchParams(location.search);
  var REF=(params.get('ref')||params.get('code')||'').trim().toUpperCase().slice(0,40);
  var rawName=(params.get('name')||'').trim().replace(/[^\p{L}\s\-]/gu,'').slice(0,40);
  var REFNAME=rawName?(rawName.charAt(0).toUpperCase()+rawName.slice(1)):'';
  var trialHref='/probetraining'+(REF?('?ref='+encodeURIComponent(REF)+(REFNAME?('&name='+encodeURIComponent(REFNAME)):'')):'');

  if(REFNAME) $('badgeText').textContent='Empfohlen von '+REFNAME+' · 2 Wochen gratis';
  else if(REF) $('badgeText').textContent='Empfohlen von einem Mitglied · 2 Wochen gratis';

  var unitDE={WEEK:'Woche',MONTH:'Monat',YEAR:'Jahr',DAY:'Tag'};
  var eur=function(n){return (Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2})+' €';};
  var TITLES=['Tarif','Daten & Zahlung','Übersicht'];

  var RATES=[], SEL=null, STEP=1, DONE=null, BUSY=false, ERR='', PRICE=null, ACC={};
  var F={};

  function termText(t){ return 'Laufzeit '+t.termValue+' '+(unitDE[t.termUnit]||t.termUnit)+(t.termValue>1?'n':'')+((t.flatFees&&t.flatFees.length)?(' · zzgl. '+eur(t.flatFees[0].price)+' '+t.flatFees[0].name):''); }
  window.__f=function(id,v){ F[id]=v; };

  // ---- Validierung ----
  var DATA_FIELDS=['firstname','lastname','email','dateOfBirth','street','houseNumber','zipCode','city','iban','startDate'];
  function step2Valid(){ return DATA_FIELDS.every(function(k){return (F[k]||'').trim();}) && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email||''); }

  // ---- Render ----
  function progressBar(){
    return '<div class="prog"><div class="l">Schritt '+STEP+' von 3</div><div class="r">'+esc(TITLES[STEP-1])+'</div></div>'+
      '<div class="track"><div class="fill" style="width:'+Math.round(STEP/3*100)+'%"></div></div>';
  }

  function step1(){
    var cards;
    if(!RATES.length) cards='<div class="sub" style="margin-top:18px">Tarife werden geladen …</div>';
    else cards=RATES.map(function(b){
      var t=(b.terms||[])[0]||{}; var sel=SEL&&SEL.id===b.id;
      var feats=(b.subDescription||'').split('\n').map(function(s){return s.replace(/^[-\s]+/,'').trim();}).filter(Boolean).slice(0,7);
      return '<button type="button" class="rate'+(sel?' sel':'')+'" data-pick="'+b.id+'" style="margin-top:12px">'+
        '<div class="top"><div class="nm"><span class="radio"><i></i></span><span class="rn">'+esc(b.name)+'</span></div>'+
        '<div class="pr"><b>'+eur(t.price)+'</b><small>/ '+(unitDE[t.paymentFrequencyUnit]||'Woche')+'</small></div></div>'+
        '<div class="term">'+termText(t)+'</div>'+
        '<div class="feats">'+feats.map(function(f){return '<div class="feat"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg><span>'+esc(f)+'</span></div>';}).join('')+'</div>'+
        '</button>';
    }).join('');
    return '<div class="card"><div class="eyebrow">Schritt 1</div><div class="q">Wähle deinen Tarif</div><div class="sub">Jederzeit anpassbar. Keine versteckten Kosten.</div>'+cards+'</div>';
  }

  function fld(id,label,type,attrs){ var mx=(type==='date'&&id==='dateOfBirth')?(' max="'+new Date().toISOString().slice(0,10)+'"'):''; var mn=(type==='date'&&id==='startDate')?(' min="'+new Date().toISOString().slice(0,10)+'"'):'';
    return '<div class="field'+(attrs&&attrs.full?' full':'')+'"><label>'+label+'</label><input data-f="'+id+'" '+(type?('type="'+type+'"'):'')+mx+mn+(attrs&&attrs.ph?(' placeholder="'+attrs.ph+'"'):'')+(attrs&&attrs.style?(' style="'+attrs.style+'"'):'')+' value="'+esc(F[id]||'')+'" /></div>'; }
  function step2(){
    return '<div class="card"><div class="eyebrow">Schritt 2</div><div class="q">Daten & Zahlung</div>'+
      '<div class="sec">Persönliche Daten</div>'+
      '<div class="form">'+fld('firstname','Vorname')+fld('lastname','Nachname')+
        fld('email','E-Mail','email',{full:true})+fld('phone','Telefon','tel')+fld('dateOfBirth','Geburtsdatum','date')+'</div>'+
      '<div class="sec">Adresse</div>'+
      '<div class="form" style="grid-template-columns:3fr 1fr">'+fld('street','Straße')+fld('houseNumber','Nr.')+
        '<div class="field"><label>PLZ</label><input data-f="zipCode" inputmode="numeric" maxlength="5" value="'+esc(F.zipCode||'')+'" /></div>'+
        fld('city','Ort')+'</div>'+
      '<div class="sec">SEPA-Lastschrift</div>'+
      '<div class="form" style="grid-template-columns:1fr">'+
        fld('iban','IBAN','text',{full:true,ph:'DE00 0000 0000 0000 0000 00',style:'letter-spacing:.5px'})+
        fld('startDate','Startdatum','date',{full:true})+'</div>'+
      '<div class="msg'+(ERR?' err':'')+'" id="msg">'+esc(ERR)+'</div>'+
      '<div class="nav"><button type="button" class="back" data-back>Zurück</button><button type="button" class="next" data-next>Weiter zur Übersicht</button></div>'+
      '</div>';
  }

  function step3(){
    var price='';
    if(PRICE===null) price='<div class="pricebox" style="color:#8a929a;font-size:13px">Preis wird berechnet …</div>';
    else if(PRICE===false) price='<div class="pricebox" style="color:#6b7780;font-size:13px">Preisübersicht gerade nicht verfügbar – Abschluss ist trotzdem möglich.</div>';
    else { var t=(SEL.terms||[])[0]||{};
      var rows='<div class="prow"><span class="pk">Tarif</span><span class="pv">'+esc(SEL.name)+' · '+t.termValue+' '+(unitDE[t.termUnit]||t.termUnit)+'n</span></div>'+
        '<div class="prow"><span class="pk">Wochenbeitrag</span><span class="pv">'+eur(PRICE.discountedBasePrice!=null?PRICE.discountedBasePrice:PRICE.basePrice)+'</span></div>';
      (PRICE.flatFees||[]).forEach(function(f){ rows+='<div class="prow"><span class="pk">'+esc(f.name)+' (einmalig)</span><span class="pv">'+eur(f.discountedPrice!=null?f.discountedPrice:f.price)+'</span></div>'; });
      if(PRICE.contractVolume&&PRICE.contractVolume.totalContractVolume!=null) rows+='<div class="ptotal"><span class="pk">Gesamt-Vertragsvolumen</span><span class="pv">'+eur(PRICE.contractVolume.totalContractVolume)+'</span></div>';
      price='<div class="pricebox">'+rows+'</div>'; }
    var blocks=(SEL.textBlocks||[]).filter(function(tb){return tb.isConfirmationRequired;});
    var conf=blocks.map(function(tb){ var open=!!ACC[tb.id]; return '<div class="conf"><div class="ch"><input type="checkbox" data-conf="'+tb.id+'" '+(F['conf_'+tb.id]?'checked':'')+' /><span class="ct">'+esc(tb.title)+'</span>'+(tb.text?'<button type="button" class="toggle" data-acc="'+tb.id+'">'+(open?'schließen':'öffnen')+'</button>':'')+'</div>'+(open&&tb.text?'<div class="body">'+esc(tb.text)+'</div>':'')+'</div>'; }).join('');
    return '<div class="card"><div class="eyebrow">Schritt 3</div><div class="q">Übersicht & Abschluss</div>'+
      '<div style="margin-top:16px">'+price+'</div>'+
      '<div class="note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg><span>Abbuchung im Voraus per SEPA-Lastschrift gemäß deinem Tarif.</span></div>'+
      '<div class="sec">SEPA-Mandat</div>'+
      '<label class="agree"><input type="checkbox" data-conf="sepa" '+(F.conf_sepa?'checked':'')+' /><span>Ich ermächtige das Fit-Inn Trier, Zahlungen von meinem Konto per <b>SEPA-Lastschrift</b> einzuziehen, und weise mein Kreditinstitut an, die Lastschriften einzulösen.</span></label>'+
      (conf?('<div class="sec">Bestätigungen</div><div style="display:flex;flex-direction:column;gap:10px">'+conf+'</div>'):'')+
      '<label class="agree" style="margin-top:14px"><input type="checkbox" data-conf="mkt" '+(F.conf_mkt?'checked':'')+' /><span style="color:#6b7780">Ich möchte Infos zu Angeboten & Kursen per E-Mail erhalten (optional).</span></label>'+
      '<button type="button" class="submit" data-finish>'+(BUSY?'Wird abgeschlossen …':'Zahlungspflichtig abschließen')+'</button>'+
      '<div class="fineprint">Es entsteht ein kostenpflichtiger Mitgliedsvertrag.</div>'+
      '<div class="msg'+(ERR?' err':'')+'" id="msg">'+esc(ERR)+'</div>'+
      '<div class="nav" style="margin-top:12px"><button type="button" class="back" data-back>Zurück</button></div>'+
      '</div>';
  }

  function navStep1(){ return '<div class="nav"><button type="button" class="next" data-next'+(SEL?'':' disabled')+'>Weiter</button></div>'; }

  function xsell(){
    return '<div class="xsell"><div style="flex:1;min-width:220px"><div class="t1">Lieber erst testen?</div><div class="t2">Buch ein kostenloses, unverbindliches Probetraining und lern uns kennen.</div></div><a href="'+trialHref+'">Probetraining buchen →</a></div>';
  }

  function doneView(){
    return '<div class="done"><div class="chk"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>'+
      '<div style="font-size:24px;font-weight:900">Willkommen im Fit-Inn Trier!</div>'+
      '<div style="font-size:14px;color:#6b7780;margin-top:8px;line-height:1.55">Deine Mitgliedschaft ist aktiv. Schön, dass du dabei bist.</div>'+
      (DONE&&DONE.customerNumber?('<div style="background:#f1f6f7;border-radius:14px;padding:18px;margin-top:20px"><div style="font-size:12px;color:#8a929a;font-weight:600">Deine Mitgliedsnummer</div><div style="font-size:24px;font-weight:900;color:'+TEAL+';margin-top:2px">'+esc(DONE.customerNumber)+'</div></div>'):'')+
      '<a href="/mitglieder" style="display:inline-block;margin-top:20px;padding:15px 28px;border-radius:13px;background:'+TEAL+';color:#fff;font-weight:800;text-decoration:none">Zum Login</a></div>';
  }

  function render(){
    if(DONE){ $('flow').innerHTML=doneView(); window.scrollTo(0,0); return; }
    var html=progressBar();
    if(STEP===1) html+=step1()+navStep1();
    else if(STEP===2) html+=step2();
    else html+=step3();
    html+=xsell();
    $('flow').innerHTML=html;
  }
  function setStep(n){ STEP=n; ERR=''; render(); window.scrollTo(0,0); }

  // ---- Events ----
  document.addEventListener('click',function(e){
    var pick=e.target.closest?e.target.closest('[data-pick]'):null;
    if(pick){ var id=+pick.getAttribute('data-pick'); SEL=RATES.filter(function(b){return b.id===id;})[0]; render(); return; }
    var nx=e.target.closest?e.target.closest('[data-next]'):null; if(nx){ onNext(); return; }
    var bk=e.target.closest?e.target.closest('[data-back]'):null; if(bk){ setStep(STEP-1); return; }
    var fin=e.target.closest?e.target.closest('[data-finish]'):null; if(fin){ onFinish(); return; }
    var acc=e.target.closest?e.target.closest('[data-acc]'):null; if(acc){ var aid=acc.getAttribute('data-acc'); ACC[aid]=!ACC[aid]; render(); return; }
  });
  document.addEventListener('input',function(e){ var el=e.target; if(el.hasAttribute&&el.hasAttribute('data-f')) F[el.getAttribute('data-f')]=el.value; });
  document.addEventListener('change',function(e){ var el=e.target; if(el.hasAttribute&&el.hasAttribute('data-conf')) F['conf_'+el.getAttribute('data-conf')]=el.checked; if(el.hasAttribute&&el.hasAttribute('data-f')) F[el.getAttribute('data-f')]=el.value; });

  function onNext(){
    if(STEP===1){ if(!SEL) return; setStep(2); return; }
    if(STEP===2){
      if(!step2Valid()){ ERR=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email||'')?'Bitte alle Felder ausfüllen.':'Bitte eine gültige E-Mail angeben.'; render(); return; }
      ERR=''; PRICE=null; setStep(3); loadPreview();
    }
  }
  function collect(){ var d={paymentChoice:'DIRECT_DEBIT',referralCode:REF||undefined,marketing:!!F.conf_mkt,accountHolder:((F.firstname||'')+' '+(F.lastname||'')).trim(),rateBundleTermId:(SEL.terms[0]||{}).id};
    DATA_FIELDS.forEach(function(f){ d[f]=(F[f]||'').trim(); }); d.phone=(F.phone||'').trim(); return d; }
  function loadPreview(){
    fetch('/api/contract/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())}).then(function(r){return r.json();}).then(function(p){ PRICE=p.ok?p:false; render(); }).catch(function(){ PRICE=false; render(); });
  }
  function onFinish(){
    ERR='';
    if(!F.conf_sepa){ ERR='Bitte das SEPA-Lastschriftmandat bestätigen.'; render(); return; }
    var blocks=(SEL.textBlocks||[]).filter(function(tb){return tb.isConfirmationRequired;});
    var confirmed=[];
    for(var i=0;i<blocks.length;i++){ if(!F['conf_'+blocks[i].id]){ ERR='Bitte alle Bedingungen bestätigen.'; render(); return; } confirmed.push(blocks[i].id); }
    var d=collect(); d.confirmedTextBlockIds=confirmed;
    BUSY=true; render();
    fetch('/api/contract/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json();}).then(function(res){
      BUSY=false;
      if(res.ok){ DONE={customerNumber:res.customerNumber}; render(); }
      else { ERR=res.message||'Abschluss fehlgeschlagen.'; render(); }
    }).catch(function(){ BUSY=false; ERR='Es ist ein Fehler aufgetreten. Bitte später erneut.'; render(); });
  }

  // ---- Tarife laden ----
  fetch('/api/contract/rates',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ RATES=(d.rates||[]); var best=RATES.filter(function(b){return /basic/i.test(b.name);})[0]; SEL=best||RATES[0]||null; render(); }).catch(function(){ render(); });
  render();
})();
</script>
</body>
</html>
