<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Online Mitglied werden</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;}
  body{margin:0; min-height:100dvh; background:linear-gradient(165deg,#0e6072 0%,#063540 100%);
    font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased;
    color:#15171B; display:flex; align-items:flex-start; justify-content:center; padding:max(env(safe-area-inset-top,0px),24px) 16px 48px;}
  .card{width:100%; max-width:480px; background:#fff; border-radius:22px; box-shadow:0 18px 50px rgba(4,33,40,.30); padding:24px 22px;}
  .brand img{height:24px; filter:invert(1) brightness(.3);}
  h1{font-size:21px; font-weight:900; margin:10px 0 2px;}
  .sub{color:#6b7780; font-size:13px; margin:0 0 14px; line-height:1.5;}
  label{display:block; font-size:12px; font-weight:700; color:#42454b; margin:12px 0 5px;}
  input,select{width:100%; padding:12px 13px; border:1px solid #d6dee0; border-radius:11px; font-size:15px; font-family:inherit; color:#15171B; background:#fff;}
  input:focus,select:focus{outline:none; border-color:#0a4958; box-shadow:0 0 0 3px rgba(10,73,88,.12);}
  button{width:100%; margin-top:16px; padding:13px; border:none; border-radius:12px; background:#0a4958; color:#fff; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;}
  button:hover{background:#0c5566;} button:disabled{opacity:.55; cursor:default;}
  button.secondary{background:#eef3f4; color:#0a4958;}
  button.ghost{background:none; color:#8a929a; font-weight:600; font-size:13px;}
  .row2{display:flex; gap:10px;} .row2 > div{flex:1;}
  .msg{margin-top:14px; font-size:13px; padding:10px 12px; border-radius:10px; display:none;}
  .msg.ok{display:block; background:#E7F6EC; color:#1d7a3e;}
  .msg.err{display:block; background:#FCEBEA; color:#b53a2c;}
  .ref{display:flex; gap:10px; align-items:center; background:linear-gradient(100deg,#E7F1F3,#D6E8EB); border:1px solid #C2DCE0; border-radius:14px; padding:11px 13px; margin:0 0 16px; font-size:13px; color:#0a4958;}
  .ref b{font-weight:900; letter-spacing:1px;}
  .steps{display:flex; gap:6px; margin:2px 0 16px;}
  .steps span{flex:1; height:4px; border-radius:3px; background:#e3eaeb;}
  .steps span.on{background:#0a4958;}
  .tariff{border:2px solid #e1e8e9; border-radius:14px; padding:14px; margin-top:12px; cursor:pointer; transition:border-color .15s;}
  .tariff.sel{border-color:#0a4958; background:#f5fafa;}
  .tariff .tn{font-size:17px; font-weight:900; color:#0a4958;}
  .tariff .tp{font-size:15px; font-weight:800; margin:2px 0 6px;}
  .tariff .td{font-size:12px; color:#5a636b; white-space:pre-line; line-height:1.5;}
  .tariff .tf{font-size:11px; color:#8a929a; margin-top:6px;}
  .summary{background:#f5fafa; border:1px solid #dbeaea; border-radius:12px; padding:12px 14px; margin-top:6px; font-size:14px;}
  .summary .li{display:flex; justify-content:space-between; padding:3px 0;}
  .summary .tot{font-weight:900; border-top:1px solid #dbeaea; margin-top:6px; padding-top:8px;}
  .legal{border:1px solid #e6ecec; border-radius:11px; padding:11px 12px; margin-top:10px;}
  .legal .lt{display:flex; gap:9px; align-items:flex-start; font-size:13px; color:#3a4248;}
  .legal .lt input{width:18px;height:18px;flex:none;margin-top:1px;}
  .legal .more{display:block; font-size:11px; color:#0a4958; margin:6px 0 0 27px; text-decoration:underline; cursor:pointer;}
  .legal .body{display:none; font-size:11px; color:#6b7780; line-height:1.5; margin:6px 0 0 27px; max-height:160px; overflow:auto; white-space:pre-line;}
  .legal .body.open{display:block;}
  .center{text-align:center;}
  .badge{display:inline-block; background:#0a4958; color:#fff; font-size:34px; line-height:1; padding:14px; border-radius:16px; margin:6px 0 12px;}
  .big{font-size:19px; font-weight:900; margin:4px 0 2px;}
  .hint{font-size:11px;color:#8a929a;margin:8px 0 0;}
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier"></div>
    <h1>Online Mitglied werden</h1>
    <p class="sub">In wenigen Schritten – komplett online abschließen.</p>
    <div class="ref" id="refBadge" style="display:none">🎁 <span>Empfohlen von einem Mitglied – Code <b id="refShow">—</b></span></div>
    <p class="hint" id="trialLink" style="margin:0 0 12px"></p>
    <div class="steps"><span id="s1" class="on"></span><span id="s2"></span><span id="s3"></span></div>

    <!-- Schritt 1: Tarif -->
    <div id="step1">
      <div id="tariffs"><p class="hint" id="tariffState">Lade Tarife …</p></div>
      <button id="to2" type="button" disabled>Weiter</button>
    </div>

    <!-- Schritt 2: Daten + Zahlung -->
    <div id="step2" class="hidden">
      <div class="row2">
        <div><label for="firstname">Vorname</label><input id="firstname" autocomplete="given-name"></div>
        <div><label for="lastname">Nachname</label><input id="lastname" autocomplete="family-name"></div>
      </div>
      <label for="email">E-Mail</label><input id="email" type="email" autocomplete="email" placeholder="name@beispiel.de">
      <label for="phone">Telefon / Handy</label><input id="phone" type="tel" autocomplete="tel">
      <div class="row2">
        <div><label for="gender">Anrede</label>
          <select id="gender"><option value="">Bitte wählen</option><option value="FEMALE">Weiblich</option><option value="MALE">Männlich</option><option value="UNISEX">Divers</option></select></div>
        <div><label for="dateOfBirth">Geburtsdatum</label><input id="dateOfBirth" type="date"></div>
      </div>
      <div class="row2">
        <div><label for="street">Straße</label><input id="street" autocomplete="address-line1"></div>
        <div style="flex:0 0 90px"><label for="houseNumber">Nr.</label><input id="houseNumber"></div>
      </div>
      <div class="row2">
        <div style="flex:0 0 120px"><label for="zipCode">PLZ</label><input id="zipCode" inputmode="numeric" maxlength="5"></div>
        <div><label for="city">Ort</label><input id="city" autocomplete="address-level2"></div>
      </div>

      <label for="paymentChoice">Zahlungsart</label>
      <select id="paymentChoice"></select>
      <div id="sepaFields">
        <label for="accountHolder">Kontoinhaber</label><input id="accountHolder" autocomplete="name">
        <label for="iban">IBAN</label><input id="iban" placeholder="DE.." autocomplete="off">
      </div>
      <label for="startDate">Startdatum</label><input id="startDate" type="date">

      <button id="to3" type="button">Weiter zur Übersicht</button>
      <button class="ghost" id="back1" type="button" style="margin-top:8px">Zurück</button>
      <div id="msg2" class="msg"></div>
    </div>

    <!-- Schritt 3: Übersicht + Bestätigung -->
    <div id="step3" class="hidden">
      <div class="summary" id="summary"><p class="hint">Berechne Preis …</p></div>
      <div id="legalBlocks"></div>
      <label class="lt" style="display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#5a636b;margin-top:12px">
        <input id="marketing" type="checkbox" style="width:18px;height:18px;flex:none;margin-top:1px">
        <span>Ich möchte über Angebote & News informiert werden (optional, jederzeit widerrufbar).</span>
      </label>
      <button id="submit" type="button">Zahlungspflichtig abschließen</button>
      <button class="ghost" id="back2" type="button" style="margin-top:8px">Zurück</button>
      <p class="hint">Mit dem Abschluss schließt du einen kostenpflichtigen Mitgliedsvertrag. Die SEPA-Lastschrift bestätigst du oben.</p>
      <div id="msg3" class="msg"></div>
    </div>

    <!-- Erfolg -->
    <div id="done" class="hidden center">
      <div class="badge">✓</div>
      <div class="big">Willkommen im Fit-Inn Trier!</div>
      <p class="sub" id="doneText" style="margin-top:8px"></p>
    </div>
  </div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function msg(el,ok,t){el.className='msg '+(ok?'ok':'err');el.textContent=t;}
  function hide(el){el.className='msg';el.textContent='';}
  var params=new URLSearchParams(location.search);
  var REF=(params.get('ref')||params.get('code')||'').trim().toUpperCase();
  if(REF){$('refShow').textContent=REF;$('refBadge').style.display='flex';}
  $('trialLink').innerHTML='Lieber erst unverbindlich testen? <a href="/probetraining'+(REF?('?ref='+encodeURIComponent(REF)):'')+'" style="color:#0a4958;font-weight:700">Kostenloses Probetraining buchen ↗</a>';

  var RATES=[], SELECTED=null;
  var fmtEUR=function(n){return (Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2})+' €';};
  var unitDE={WEEK:'Woche',MONTH:'Monat',YEAR:'Jahr',DAY:'Tag'};
  function termText(t){ return t.termValue+' '+(unitDE[t.termUnit]||t.termUnit)+(t.termValue>1?'n':''); }

  function setStep(n){
    $('step1').classList.toggle('hidden',n!==1);$('step2').classList.toggle('hidden',n!==2);
    $('step3').classList.toggle('hidden',n!==3);$('done').classList.toggle('hidden',n!==4);
    $('s1').className=n>=1?'on':'';$('s2').className=n>=2?'on':'';$('s3').className=n>=3?'on':'';
    window.scrollTo(0,0);
  }

  // Tarife laden
  fetch('/api/contract/rates',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(!d.ok||!d.rates||!d.rates.length){$('tariffState').textContent='Tarife konnten nicht geladen werden. Bitte später erneut.';return;}
    RATES=d.rates; renderTariffs();
  }).catch(function(){$('tariffState').textContent='Tarife konnten nicht geladen werden.';});

  function renderTariffs(){
    var box=$('tariffs'); box.innerHTML='';
    RATES.forEach(function(b){
      var t=(b.terms||[])[0]; if(!t) return;
      var el=document.createElement('div'); el.className='tariff';
      var fees=(t.flatFees||[]).map(function(f){return f.name+': '+fmtEUR(f.price);}).join(' · ');
      el.innerHTML='<div class="tn">'+b.name+'</div><div class="tp">'+fmtEUR(t.price)+' / '+(unitDE[t.paymentFrequencyUnit]||t.paymentFrequencyUnit)+' · Laufzeit '+termText(t)+'</div>'
        +'<div class="td">'+(b.subDescription||'')+'</div>'+(fees?'<div class="tf">'+fees+'</div>':'');
      el.addEventListener('click',function(){
        SELECTED=b; var all=box.querySelectorAll('.tariff'); for(var i=0;i<all.length;i++)all[i].classList.remove('sel');
        el.classList.add('sel'); $('to2').disabled=false;
      });
      box.appendChild(el);
    });
    if(!RATES.length)$('tariffState').textContent='Aktuell keine Tarife verfügbar.';
  }

  $('to2').addEventListener('click',function(){
    if(!SELECTED)return;
    // Zahlarten + Startdatum vorbereiten
    var sel=$('paymentChoice'); sel.innerHTML='';
    var labels={DIRECT_DEBIT:'SEPA-Lastschrift',CREDIT_CARD:'Kreditkarte',BANK_TRANSFER:'Überweisung',CASH:'Bar',TWINT:'TWINT'};
    (SELECTED.allowedPaymentChoices||['DIRECT_DEBIT']).forEach(function(p){
      var o=document.createElement('option');o.value=p;o.textContent=labels[p]||p;sel.appendChild(o);
    });
    togglePay();
    var t=(SELECTED.terms||[])[0];
    if(t&&t.defaultContractStartDate&&!$('startDate').value)$('startDate').value=t.defaultContractStartDate;
    if(!$('accountHolder').value)$('accountHolder').value=($('firstname').value+' '+$('lastname').value).trim();
    setStep(2);
  });
  function togglePay(){ $('sepaFields').style.display=$('paymentChoice').value==='DIRECT_DEBIT'?'block':'none'; }
  $('paymentChoice').addEventListener('change',togglePay);
  $('back1').addEventListener('click',function(){setStep(1);});
  $('back2').addEventListener('click',function(){setStep(2);});

  var DATA_FIELDS=['firstname','lastname','email','phone','gender','dateOfBirth','street','houseNumber','zipCode','city'];
  function collect(){
    var d={ rateBundleTermId:(SELECTED.terms[0]||{}).id, startDate:$('startDate').value,
      paymentChoice:$('paymentChoice').value, accountHolder:$('accountHolder').value, iban:$('iban').value,
      referralCode:REF||undefined, marketing:$('marketing')?$('marketing').checked:false };
    DATA_FIELDS.forEach(function(f){d[f]=($(f).value||'').trim();});
    return d;
  }

  $('to3').addEventListener('click',function(){
    hide($('msg2'));
    for(var i=0;i<DATA_FIELDS.length;i++){var v=($(DATA_FIELDS[i]).value||'').trim();if(!v){msg($('msg2'),false,'Bitte alle Felder ausfüllen.');$(DATA_FIELDS[i]).focus();return;}}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('email').value)){msg($('msg2'),false,'Bitte gültige E-Mail angeben.');return;}
    if(!$('startDate').value){msg($('msg2'),false,'Bitte Startdatum wählen.');return;}
    if($('paymentChoice').value==='DIRECT_DEBIT'&&!$('iban').value.trim()){msg($('msg2'),false,'Bitte IBAN angeben.');return;}
    renderLegal(); setStep(3); loadPreview();
  });

  function renderLegal(){
    var box=$('legalBlocks'); box.innerHTML='';
    var sepa=document.createElement('div'); sepa.className='legal';
    sepa.innerHTML='<label class="lt"><input type="checkbox" id="sepaConfirm"><span><b>SEPA-Lastschriftmandat:</b> Ich ermächtige das Fit-Inn Trier bzw. die Finion Capital GmbH, Zahlungen von meinem Konto per Lastschrift einzuziehen, und weise mein Kreditinstitut an, diese einzulösen.</span></label>';
    if($('paymentChoice').value==='DIRECT_DEBIT') box.appendChild(sepa);
    (SELECTED.textBlocks||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(tb){
      var d=document.createElement('div'); d.className='legal';
      var needBox=tb.isConfirmationRequired;
      var cb=needBox?'<input type="checkbox" class="tbConfirm" data-id="'+tb.id+'">':'<span style="width:18px"></span>';
      var link=tb.url?(' <a href="'+tb.url+'" target="_blank" rel="noopener" style="color:#0a4958">öffnen ↗</a>'):'';
      d.innerHTML='<label class="lt">'+cb+'<span>Ich akzeptiere <b>'+tb.title+'</b>'+link+'.</span></label>'
        +(tb.text?('<span class="more" data-t="'+tb.id+'">Text anzeigen</span><div class="body" id="tb'+tb.id+'">'+tb.text.replace(/</g,'&lt;')+'</div>'):'');
      box.appendChild(d);
    });
    var ms=box.querySelectorAll('.more');
    for(var i=0;i<ms.length;i++){ms[i].addEventListener('click',function(){var b=$('tb'+this.getAttribute('data-t'));if(b)b.classList.toggle('open');});}
  }

  function loadPreview(){
    var d=collect(); $('summary').innerHTML='<p class="hint">Berechne Preis …</p>';
    fetch('/api/contract/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
      .then(function(r){return r.json();}).then(function(p){
        if(!p.ok){$('summary').innerHTML='<p class="hint">Preisübersicht gerade nicht verfügbar – Abschluss ist trotzdem möglich.</p>';return;}
        var t=(SELECTED.terms[0]||{});
        var html='<div class="li"><span>'+SELECTED.name+' ('+termText(t)+')</span><span>'+fmtEUR(p.discountedBasePrice!=null?p.discountedBasePrice:p.basePrice)+' / '+(unitDE[t.paymentFrequencyUnit]||t.paymentFrequencyUnit)+'</span></div>';
        (p.flatFees||[]).forEach(function(f){html+='<div class="li"><span>'+f.name+'</span><span>'+fmtEUR(f.discountedPrice!=null?f.discountedPrice:f.price)+'</span></div>';});
        if(p.contractVolume&&p.contractVolume.totalContractVolume!=null)html+='<div class="li tot"><span>Gesamt-Vertragsvolumen</span><span>'+fmtEUR(p.contractVolume.totalContractVolume)+'</span></div>';
        if(p.voucherSuccessMessage)html+='<div class="li" style="color:#1d7a3e">'+p.voucherSuccessMessage+'</div>';
        $('summary').innerHTML=html;
      }).catch(function(){$('summary').innerHTML='<p class="hint">Preisübersicht nicht verfügbar.</p>';});
  }

  $('submit').addEventListener('click',function(){
    hide($('msg3'));
    if($('paymentChoice').value==='DIRECT_DEBIT'){var sc=$('sepaConfirm');if(!sc||!sc.checked){msg($('msg3'),false,'Bitte das SEPA-Lastschriftmandat bestätigen.');return;}}
    var need=document.querySelectorAll('.tbConfirm'), confirmed=[];
    for(var i=0;i<need.length;i++){if(!need[i].checked){msg($('msg3'),false,'Bitte alle Bedingungen bestätigen.');return;}confirmed.push(need[i].getAttribute('data-id'));}
    var d=collect(); d.confirmedTextBlockIds=confirmed;
    var b=$('submit');b.disabled=true;b.textContent='Wird abgeschlossen …';
    fetch('/api/contract/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
      .then(function(r){return r.json();}).then(function(res){
        if(res.ok){$('doneText').textContent=res.message||'Dein Vertrag ist abgeschlossen.';setStep(4);}
        else msg($('msg3'),false,res.message||'Abschluss fehlgeschlagen.');
      }).catch(function(){msg($('msg3'),false,'Es ist ein Fehler aufgetreten. Bitte später erneut.');})
      .finally(function(){b.disabled=false;b.textContent='Zahlungspflichtig abschließen';});
  });
})();
</script>
</body>
</html>
