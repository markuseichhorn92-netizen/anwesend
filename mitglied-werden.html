<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Online Mitglied werden</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#15171B;background:linear-gradient(165deg,#0e6072 0%,#063540 100%);min-height:100dvh}
  ::placeholder{color:#a9b1b6} input,select,button{font-family:inherit}
  @keyframes fiUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .shell{width:100%;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px}
  .bar img{height:26px;width:auto;display:block}
  .body{flex:1;padding:4px 16px 40px;animation:fiUp .25s ease}
  .hd{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
  .h1w{font-size:23px;font-weight:900;color:#fff;letter-spacing:-.4px}
  .back{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.13);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .card{background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(4,33,40,.30);padding:22px 20px}
  .lbl{font-size:13px;font-weight:600;color:#42454b;margin-bottom:6px;display:block}
  .inp{width:100%;padding:12px 13px;border:1.5px solid #d6dee0;border-radius:11px;font-size:15px;color:#15171B;outline:none;background:#fff}
  .inp:focus{border-color:#0a4958;box-shadow:0 0 0 3px rgba(10,73,88,.12)}
  input.inp[type="date"]{min-height:50px;font-size:16px;-webkit-appearance:none;appearance:none}
  input.inp[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
  input.inp[type="date"]::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer;padding-left:6px}
  .btn{width:100%;padding:15px;border:none;border-radius:13px;background:#0a4958;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .btn:hover{background:#0c5566} .btn:disabled{background:#9fb9bf;cursor:not-allowed}
  .btnw{width:100%;padding:15px;border:none;border-radius:13px;background:#fff;color:#0a4958;font-weight:800;font-size:15px;cursor:pointer}
  .btn2{width:100%;padding:13px;border:none;border-radius:13px;background:#eef3f4;color:#0a4958;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
  .row2{display:grid;gap:12px}
  .ref{display:flex;align-items:center;gap:9px;background:linear-gradient(135deg,#E7F1F3,#D6E8EB);border:1px solid #C2DCE0;border-radius:14px;padding:13px 15px;margin-bottom:16px}
  .ref span{font-size:13px;color:#0a4958;font-weight:600}
  .seg{height:5px;flex:1;border-radius:3px}
  .uc{font-size:13px;font-weight:700;color:#0a4958;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
  .msg{margin-top:14px;font-size:13px;padding:11px 13px;border-radius:11px;display:none;white-space:pre-wrap}
  .msg.err{display:block;background:#FCEBEA;color:#b53a2c;font-weight:600}
  .hidden{display:none}
</style>
</head>
<body>
<div class="shell">
  <div class="bar"><a href="/mitglieder"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier"></a></div>
  <div class="body">
    <div class="hd"><a class="back" href="/mitglieder"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a><div class="h1w">Mitglied werden</div></div>
    <div id="app"></div>
  </div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var TEAL='#0a4958';
  var params=new URLSearchParams(location.search);
  var REF=(params.get('ref')||params.get('code')||'').trim().toUpperCase();
  var unitDE={WEEK:'Woche',MONTH:'Monat',YEAR:'Jahr',DAY:'Tag'};
  var eur=function(n){return (Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2})+' €';};

  var RATES=[], SEL=null, STEP=1, DONE=false, BUSY=false, ERR='', PRICE=null, ACC={};
  var F={}; // form values

  function setStep(n){ STEP=n; render(); window.scrollTo(0,0); }
  function termText(t){ return 'Laufzeit '+t.termValue+' '+(unitDE[t.termUnit]||t.termUnit)+(t.termValue>1?'n':'')+((t.flatFees&&t.flatFees.length)?(' · zzgl. '+eur(t.flatFees[0].price)+' '+t.flatFees[0].name):''); }

  function render(){
    if(DONE){ $('app').innerHTML=doneView(); return; }
    var segs='';for(var i=1;i<=3;i++)segs+='<div class="seg" style="background:'+(i<=STEP?'#fff':'rgba(255,255,255,.28)')+'"></div>';
    var html='<div style="display:flex;gap:6px;margin:0 2px 6px">'+segs+'</div><div style="font-size:12px;color:#bfd7dc;font-weight:600;margin:0 2px 16px">Schritt '+STEP+' von 3</div>';
    if(STEP===1) html+=step1();
    else if(STEP===2) html+=step2();
    else html+=step3();
    $('app').innerHTML=html; bind();
  }

  function step1(){
    var badge = REF ? '<div class="ref">🎁 <span style="flex:1">Empfohlen von einem Mitglied · Code <b>'+esc(REF)+'</b></span></div>' : '';
    var trialHref='/probetraining'+(REF?('?ref='+encodeURIComponent(REF)):'');
    var x='<div style="text-align:center;margin-bottom:14px"><span style="color:#bfd7dc;font-size:13px">Lieber erst testen? </span><a href="'+trialHref+'" style="color:#fff;font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px">Probetraining buchen</a></div>';
    var head='<div style="font-size:21px;font-weight:900;color:#fff;letter-spacing:-.4px;margin:0 2px 4px">Wähle deinen Tarif</div><div style="font-size:14px;color:#bfd7dc;margin:0 2px 16px">Jederzeit anpassbar. Keine versteckten Kosten.</div>';
    var cards;
    if(!RATES.length) cards='<div class="card" style="text-align:center;color:#8a929a">Lade Tarife …</div>';
    else cards='<div style="display:flex;flex-direction:column;gap:13px">'+RATES.map(function(b){
      var t=(b.terms||[])[0]||{}; var sel=SEL&&SEL.id===b.id;
      var feats=(b.subDescription||'').split('\n').map(function(s){return s.replace(/^[-\s]+/,'').trim();}).filter(Boolean).slice(0,7);
      return '<div data-pick="'+b.id+'" style="background:#fff;border:1.5px solid '+(sel?TEAL:'#e3eaeb')+';box-shadow:'+(sel?'0 0 0 2px '+TEAL:'none')+';border-radius:18px;padding:20px;cursor:pointer">'+
        '<div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:11px"><span style="width:22px;height:22px;border-radius:50%;border:2px solid '+(sel?TEAL:'#c9d3d5')+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="width:11px;height:11px;border-radius:50%;background:'+(sel?TEAL:'transparent')+'"></span></span><span style="font-size:18px;font-weight:900">'+esc(b.name)+'</span></div>'+
        '<div style="text-align:right"><span style="font-size:20px;font-weight:900;color:'+TEAL+'">'+eur(t.price)+'</span><span style="font-size:12px;color:#8a929a;display:block">/ '+(unitDE[t.paymentFrequencyUnit]||'Woche')+'</span></div></div>'+
        '<div style="font-size:12px;color:#6b7780;margin:8px 0 0 33px;font-weight:600">'+termText(t)+'</div>'+
        '<div style="display:flex;flex-direction:column;gap:7px;margin:12px 0 0 33px">'+feats.map(function(f){return '<div style="display:flex;align-items:center;gap:8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg><span style="font-size:13px;color:#42454b">'+esc(f)+'</span></div>';}).join('')+'</div></div>';
    }).join('')+'</div>';
    return badge+x+head+cards+'<button class="btnw" data-next style="margin-top:16px"'+(SEL?'':' disabled')+'>Weiter</button>';
  }

  function fld(id,label,type,extra){ var mx=(type==='date'?' max="'+new Date().toISOString().slice(0,10)+'"':''); return '<div'+(extra||'')+'><label class="lbl">'+label+'</label><input id="'+id+'" '+(type?('type="'+type+'"'):'')+mx+' class="inp" value="'+esc(F[id]||'')+'" oninput="window.__f(\''+id+'\',this.value)"></div>'; }
  function step2(){
    return '<div class="card"><div style="font-size:18px;font-weight:800">Daten & Zahlung</div>'+
      '<div class="uc">Persönliche Daten</div>'+
      '<div class="row2" style="grid-template-columns:1fr 1fr">'+fld('firstname','Vorname')+fld('lastname','Nachname')+'</div>'+
      '<div style="margin-top:12px">'+fld('email','E-Mail','email').slice(5)+
      '<div class="row2" style="grid-template-columns:1fr 1fr;margin-top:12px">'+fld('phone','Telefon','tel')+fld('dateOfBirth','Geburtsdatum','date')+'</div>'+
      '<div class="uc">Adresse</div>'+
      '<div class="row2" style="grid-template-columns:2fr 1fr">'+fld('street','Straße')+fld('houseNumber','Nr.')+'</div>'+
      '<div class="row2" style="grid-template-columns:1fr 2fr;margin-top:12px">'+fld('zipCode','PLZ')+fld('city','Ort')+'</div>'+
      '<div class="uc">SEPA-Lastschrift</div>'+
      '<div>'+fld('iban','IBAN').slice(5).replace('class="inp"','class="inp" style="letter-spacing:.5px" placeholder="DE00 0000 0000 0000 0000 00"')+
      '<div style="margin-top:12px">'+fld('startDate','Startdatum','date').slice(5)+
      ERR?'':''+
      '<button class="btn" data-next style="margin-top:18px">Weiter zur Übersicht</button>'+
      '<button class="btn2" data-back>Zurück</button>'+
      '<div id="msg" class="msg'+(ERR?' err':'')+'">'+esc(ERR)+'</div></div>';
  }

  function step3(){
    var price='';
    if(PRICE===null) price='<div style="background:#f4f7f7;border-radius:14px;padding:16px 18px;margin-top:16px;color:#8a929a;font-size:13px">Preis wird berechnet …</div>';
    else if(PRICE===false) price='<div style="background:#f4f7f7;border-radius:14px;padding:16px 18px;margin-top:16px;color:#6b7780;font-size:13px">Preisübersicht gerade nicht verfügbar – Abschluss ist trotzdem möglich.</div>';
    else { var t=(SEL.terms||[])[0]||{}; var rows='<div style="display:flex;justify-content:space-between;padding:6px 0"><span style="font-size:14px;color:#6b7780">Tarif</span><span style="font-size:14px;font-weight:700">'+esc(SEL.name)+' · '+t.termValue+' '+(unitDE[t.termUnit]||t.termUnit)+'n</span></div>'+
      '<div style="display:flex;justify-content:space-between;padding:6px 0"><span style="font-size:14px;color:#6b7780">Wochenbeitrag</span><span style="font-size:14px;font-weight:700">'+eur(PRICE.discountedBasePrice!=null?PRICE.discountedBasePrice:PRICE.basePrice)+'</span></div>';
      (PRICE.flatFees||[]).forEach(function(f){ rows+='<div style="display:flex;justify-content:space-between;padding:6px 0"><span style="font-size:14px;color:#6b7780">'+esc(f.name)+' (einmalig)</span><span style="font-size:14px;font-weight:700">'+eur(f.discountedPrice!=null?f.discountedPrice:f.price)+'</span></div>'; });
      if(PRICE.contractVolume&&PRICE.contractVolume.totalContractVolume!=null) rows+='<div style="display:flex;justify-content:space-between;padding:10px 0 0;margin-top:8px;border-top:1px solid #e3eaeb"><span style="font-size:15px;font-weight:800">Gesamt-Vertragsvolumen</span><span style="font-size:18px;font-weight:900;color:'+TEAL+'">'+eur(PRICE.contractVolume.totalContractVolume)+'</span></div>';
      price='<div style="background:#f4f7f7;border-radius:14px;padding:16px 18px;margin-top:16px">'+rows+'</div>'; }
    // confirmations from selected tariff text blocks (only those requiring confirmation)
    var blocks=(SEL.textBlocks||[]).filter(function(tb){return tb.isConfirmationRequired;});
    var conf=blocks.map(function(tb){ var open=!!ACC[tb.id]; return '<div style="border:1.5px solid #e3eaeb;border-radius:13px;padding:13px 14px"><div style="display:flex;align-items:center;gap:10px"><input type="checkbox" data-conf="'+tb.id+'" '+(F['conf_'+tb.id]?'checked':'')+' style="width:18px;height:18px;accent-color:'+TEAL+';flex-shrink:0"><span style="flex:1;font-size:14px;font-weight:600">'+esc(tb.title)+'</span>'+(tb.text?'<button data-acc="'+tb.id+'" style="background:none;border:none;color:'+TEAL+';font-weight:700;font-size:13px;cursor:pointer">'+(open?'schließen':'öffnen')+'</button>':'')+'</div>'+(open&&tb.text?'<div style="font-size:13px;color:#6b7780;line-height:1.55;margin-top:10px">'+esc(tb.text)+'</div>':'')+'</div>'; }).join('');
    return '<div class="card"><div style="font-size:18px;font-weight:800">Übersicht & Abschluss</div>'+price+
      '<div style="display:flex;align-items:flex-start;gap:8px;background:#f4f7f7;border-radius:12px;padding:12px 14px;margin-top:12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg><span style="font-size:12px;color:#6b7780;line-height:1.45">Abbuchung im Voraus per SEPA-Lastschrift gemäß deinem Tarif.</span></div>'+
      '<div class="uc">SEPA-Mandat</div>'+
      '<label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer"><input type="checkbox" data-conf="sepa" '+(F.conf_sepa?'checked':'')+' style="width:18px;height:18px;margin-top:1px;accent-color:'+TEAL+';flex-shrink:0"><span style="font-size:13px;color:#42454b;line-height:1.5">Ich ermächtige das Fit-Inn Trier, Zahlungen von meinem Konto per <b>SEPA-Lastschrift</b> einzuziehen, und weise mein Kreditinstitut an, die Lastschriften einzulösen.</span></label>'+
      '<div class="uc">Bestätigungen</div><div style="display:flex;flex-direction:column;gap:10px">'+conf+'</div>'+
      '<label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-top:14px"><input type="checkbox" data-conf="mkt" '+(F.conf_mkt?'checked':'')+' style="width:18px;height:18px;margin-top:1px;accent-color:'+TEAL+';flex-shrink:0"><span style="font-size:13px;color:#6b7780;line-height:1.45">Ich möchte Infos zu Angeboten & Kursen per E-Mail erhalten (optional).</span></label>'+
      '<button class="btn" data-finish style="margin-top:18px">'+(BUSY?'Wird abgeschlossen …':'Zahlungspflichtig abschließen')+'</button>'+
      '<div style="font-size:12px;color:#8a929a;text-align:center;margin-top:8px">Es entsteht ein kostenpflichtiger Mitgliedsvertrag.</div>'+
      '<button class="btn2" data-back>Zurück</button>'+
      '<div id="msg" class="msg'+(ERR?' err':'')+'">'+esc(ERR)+'</div></div>';
  }

  function doneView(){
    return '<div class="card" style="text-align:center;padding:34px 24px"><div style="width:64px;height:64px;border-radius:50%;background:#E7F6EC;display:flex;align-items:center;justify-content:center;margin:0 auto 16px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>'+
      '<div style="font-size:22px;font-weight:900">Willkommen im Fit-Inn Trier!</div><div style="font-size:14px;color:#6b7780;margin-top:6px;line-height:1.5">Deine Mitgliedschaft ist aktiv. Schön, dass du dabei bist.</div>'+
      (DONE.customerNumber?('<div style="background:#f4f7f7;border-radius:14px;padding:18px;margin-top:20px"><div style="font-size:12px;color:#8a929a;font-weight:600">Deine Mitgliedsnummer</div><div style="font-size:24px;font-weight:900;color:'+TEAL+';margin-top:2px">'+esc(DONE.customerNumber)+'</div></div>'):'')+
      '<a href="/mitglieder" style="display:block;text-align:center;margin-top:20px;padding:14px;border-radius:13px;background:'+TEAL+';color:#fff;font-weight:700;text-decoration:none">Zum Login</a></div>';
  }

  window.__f=function(id,v){ F[id]=v; };

  function bind(){
    document.querySelectorAll('[data-pick]').forEach(function(el){ el.addEventListener('click',function(){ var id=+el.getAttribute('data-pick'); SEL=RATES.filter(function(b){return b.id===id;})[0]; render(); }); });
    var nx=document.querySelector('[data-next]'); if(nx) nx.addEventListener('click',onNext);
    var bk=document.querySelector('[data-back]'); if(bk) bk.addEventListener('click',function(){ ERR=''; setStep(STEP-1); });
    var fin=document.querySelector('[data-finish]'); if(fin) fin.addEventListener('click',onFinish);
    document.querySelectorAll('[data-conf]').forEach(function(el){ el.addEventListener('change',function(){ F['conf_'+el.getAttribute('data-conf')]=el.checked; }); });
    document.querySelectorAll('[data-acc]').forEach(function(el){ el.addEventListener('click',function(){ var id=el.getAttribute('data-acc'); ACC[id]=!ACC[id]; render(); }); });
  }

  var DATA_FIELDS=['firstname','lastname','email','dateOfBirth','street','houseNumber','zipCode','city','iban','startDate'];
  function onNext(){
    if(STEP===1){ if(!SEL) return; ERR=''; setStep(2); return; }
    if(STEP===2){
      ERR='';
      for(var i=0;i<DATA_FIELDS.length;i++){ if(!(F[DATA_FIELDS[i]]||'').trim()){ ERR='Bitte alle Felder ausfüllen.'; render(); return; } }
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email)){ ERR='Bitte eine gültige E-Mail angeben.'; render(); return; }
      PRICE=null; setStep(3); loadPreview();
    }
  }
  function collect(){ var d={paymentChoice:'DIRECT_DEBIT',referralCode:REF||undefined,marketing:!!F.conf_mkt,accountHolder:((F.firstname||'')+' '+(F.lastname||'')).trim(),rateBundleTermId:(SEL.terms[0]||{}).id};
    DATA_FIELDS.forEach(function(f){ d[f]=(F[f]||'').trim(); }); d.phone=(F.phone||'').trim(); return d; }
  function loadPreview(){
    fetch('/api/contract/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())}).then(function(r){return r.json();}).then(function(p){ PRICE=p.ok?p:false; render(); }).catch(function(){ PRICE=false; render(); });
  }
  function onFinish(){
    ERR='';
    if(!F.conf_sepa){ ERR='Bitte das SEPA-Lastschriftmandat bestätigen.'; render(); return; }
    var blocks=(SEL.textBlocks||[]).filter(function(tb){return tb.isConfirmationRequired;});
    var confirmed=[];
    for(var i=0;i<blocks.length;i++){ if(!F['conf_'+blocks[i].id]){ ERR='Bitte alle Bedingungen bestätigen.'; render(); return; } confirmed.push(blocks[i].id); }
    var d=collect(); d.confirmedTextBlockIds=confirmed;
    BUSY=true; render();
    fetch('/api/contract/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json();}).then(function(res){
      BUSY=false;
      if(res.ok){ DONE={customerNumber:res.customerNumber}; render(); window.scrollTo(0,0); }
      else { ERR=res.message||'Abschluss fehlgeschlagen.'; render(); }
    }).catch(function(){ BUSY=false; ERR='Es ist ein Fehler aufgetreten. Bitte später erneut.'; render(); });
  }

  // load tariffs
  fetch('/api/contract/rates',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ RATES=(d.rates||[]); var best=RATES.filter(function(b){return /basic/i.test(b.name);})[0]; SEL=best||RATES[0]||null; render(); }).catch(function(){ render(); });
  render();
})();
</script>
<div style="max-width:480px;margin:0 auto;padding:14px 16px 28px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center">
  <a href="https://www.fit-inn-trier.de/impressum-fit-inn-trier" target="_blank" rel="noopener" style="color:#bfd7dc;font-size:12px;font-weight:600;text-decoration:none">Impressum</a><span style="color:#5e8088;font-size:12px">·</span>
  <a href="https://www.fit-inn-trier.de/datenschutz-fit-inn-trier" target="_blank" rel="noopener" style="color:#bfd7dc;font-size:12px;font-weight:600;text-decoration:none">Datenschutz</a><span style="color:#5e8088;font-size:12px">·</span>
  <a href="https://www.fit-inn-trier.de/agbs-fit-inn-trier" target="_blank" rel="noopener" style="color:#bfd7dc;font-size:12px;font-weight:600;text-decoration:none">AGB</a><span style="color:#5e8088;font-size:12px">·</span>
  <a href="https://www.fit-inn-trier.de/kundigungsbedingungen-fit-inn-trier" target="_blank" rel="noopener" style="color:#bfd7dc;font-size:12px;font-weight:600;text-decoration:none">Widerruf</a>
</div>
</body>
</html>
