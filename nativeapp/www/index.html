<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fit-Inn Trier</title>
  <style>
    html,body{margin:0;height:100%;background:#0f1115;color:#fff;font-family:-apple-system,system-ui,sans-serif}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    small{opacity:.6}
  </style>
</head>
<body>
  <!--
    Platzhalter-/Splash-Seite. Diese App ist ein „Live-URL-Wrapper": Über
    capacitor.config.json (server.url) lädt sie direkt mitglieder.fit-inn-trier.de.
    Diese Datei erscheint nur ganz kurz beim Start bzw. wenn keine Verbindung
    besteht. Capacitor braucht trotzdem ein webDir (www) mit einer index.html.
  -->
  <div class="wrap">
    <div class="spin"></div>
    <small>Fit-Inn Trier wird geladen …</small>
  </div>
</body>
</html>
