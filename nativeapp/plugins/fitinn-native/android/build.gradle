// Fit-Inn · natives Android-Plugin (Health Connect + BLE-Herzgurt + GPS).
// Wird von Capacitor als Library-Modul eingebunden (npm-Paket "fitinn-native" in
// nativeapp/package.json -> `npx cap sync android` zieht es automatisch ein).
//
// WICHTIG: `buildscript {}` MUSS der erste Block der Datei sein (vor jedem anderen
// Statement) – sonst wird das Android-Gradle-Plugin nicht korrekt initialisiert und
// der android{}-Block "verpufft" (Fehler: "does not specify compileSdk").
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Auf die Toolchain von Capacitor 8 abgestimmt. Falls euer Projekt eine
        // andere AGP-/Kotlin-Version nutzt, hier an die des App-Moduls angleichen.
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'de.fitinn.native'
    // Feste Werte (Capacitor 8 nutzt 35). Health Connect (androidx.health.connect)
    // erfordert minSdk 26.
    compileSdk 35
    defaultConfig {
        minSdk 26
        targetSdk 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.core:core-ktx:1.13.1'
    // Health Connect (Google-Fit-Nachfolger): Trainings + Vitalwerte lesen/schreiben.
    implementation 'androidx.health.connect:connect-client:1.1.0'
    // Coroutinen fuer die suspend-basierte Health-Connect-API.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // GPS ueber die Fused-Location-API (Google Play Services).
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
