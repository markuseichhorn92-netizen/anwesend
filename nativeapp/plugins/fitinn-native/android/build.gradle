// Fit-Inn · natives Android-Plugin (Health Connect + BLE-Herzgurt + GPS).
// Wird von Capacitor als Library-Modul eingebunden (npm-Paket "fitinn-native" in
// nativeapp/package.json -> `npx cap sync android` zieht es automatisch ein).
//
// Struktur/Versionen bewusst 1:1 an @capacitor-community/bluetooth-le (v8.2.0)
// angelehnt, das in diesem Projekt bereits laeuft. WICHTIG: compileSdk und
// namespace MUeSSEN bei AGP 8 mit "=" gesetzt werden (Property-Zuweisung) – die
// Methoden-Schreibweise ohne "=" fuehrt zu "does not specify compileSdk".
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

ext {
    coreKtx = project.hasProperty('coreKtx') ? rootProject.ext.coreKtx : '1.12.0'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Uebernehmen die AGP-/Kotlin-Version des Projekts, wenn gesetzt – sonst dieselben
        // Defaults wie bluetooth-le (keine Versionskonflikte).
        classpath "com.android.tools.build:gradle:${project.findProperty('agpVersion') ?: '8.13.0'}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

android {
    namespace = "de.fitinn.native"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        // Health Connect (androidx.health.connect) erfordert minSdk 26.
        minSdkVersion 26
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.core:core-ktx:$coreKtx"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // Health Connect (Google-Fit-Nachfolger): Trainings + Vitalwerte lesen/schreiben.
    implementation 'androidx.health.connect:connect-client:1.1.0'
    // Coroutinen fuer die suspend-basierte Health-Connect-API.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // GPS ueber die Fused-Location-API (Google Play Services).
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
