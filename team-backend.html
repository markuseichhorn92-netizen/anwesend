<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#e9eef0;color:#15171B}
  ::placeholder{color:#a9b1b6}
  input,select,button,textarea{font-family:inherit}
  button{cursor:pointer}
  textarea:focus,input:focus,select:focus{outline:none}
  .scrl::-webkit-scrollbar{width:9px;height:9px}
  .scrl::-webkit-scrollbar-thumb{background:#d6dee0;border-radius:8px}
  .navbtn:hover{background:rgba(255,255,255,.10)}
  .convrow:hover{background:#f5f8f8}
  .lrow:hover{background:#f5f8f8}
  .miniact:hover{background:#f1f6f7;border-color:#c4d6da}
  .qtile:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(4,33,40,.18)}
  .qtile{transition:transform .15s,box-shadow .15s}
  @keyframes fiSpin{to{transform:rotate(360deg)}}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #cfe0e3;border-top-color:#0a4958;display:inline-block;animation:fiSpin .8s linear infinite}
  @media (max-width:1100px){
    .ctx-panel{position:fixed;top:0;right:0;height:100dvh;width:330px;max-width:88vw;z-index:58;transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 60px rgba(0,0,0,.30);border-left:none}
    .ctx-panel.open{transform:none}
    .ctx-toggle{display:inline-flex!important}
  }
  @media (min-width:1101px){ .ctx-toggle,.ctx-overlay{display:none!important} }
  @media (max-width:860px){
    .mb-sidebar{position:fixed;top:0;left:0;height:100dvh;width:264px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 70px rgba(0,0,0,.45)}
    .mb-sidebar.open{transform:none}
    .mb-burger{display:inline-flex!important}
    .inbox-list{width:100%!important;border-right:none!important}
    /* Mobile: Vorgänge als abgesetzte Karten (wie im Mockup) statt flacher Liste. */
    .inbox-list #convrows{padding:4px 14px 16px}
    .inbox-list .convrow{margin:0 0 11px!important;border-radius:16px!important;border-bottom:none!important;border-left:none!important;background:#fff!important;box-shadow:0 10px 26px rgba(4,33,40,.07)}
    .adm-inbox .inbox-thread{display:none!important}
    .adm-inbox.thread .inbox-list{display:none!important}
    .adm-inbox.thread .inbox-thread{display:flex!important}
    .mb-back{display:inline-flex!important}
    .prof-grid{grid-template-columns:1fr!important}
    main > header{padding:14px 16px!important}
  }
  @media (min-width:861px){ .mb-burger,.mb-overlay,.mb-back{display:none!important} }
  /* Mobile Bottom-Nav (neuer Look) */
  .bottomnav{display:none;flex-shrink:0;border-top:1px solid #e1e8ea;background:#fff}
  .bottomnav button:active{opacity:.6}
  @media (max-width:860px){
    .bottomnav{display:flex}
    .mb-burger{display:none!important}
    .hdr-mobile{background:linear-gradient(160deg,#0e6072,#063540)!important;border-bottom:none!important;border-radius:0 0 22px 22px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px!important}
    .hdr-mobile .hdr-title{color:#fff!important}
    .hdr-mobile .hdr-sub{color:#aed0d6!important}
    .hdr-mobile .hdr-refresh{background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.2)!important}
    .hdr-mobile .hdr-refresh svg{stroke:#fff!important}
    /* Mobiler Header bleibt schlank – Status/Glocke/Avatar nur auf Desktop (wie im Mockup). */
    .hdr-mobile .hdr-actions{display:none!important}
  }
</style>
<script>
  /* In der eigenen App (Capacitor): App-Feeling – kein Zoom, kein horizontales
     Wischen, keine sichtbare Scrollbar. Im Browser bleibt alles unverändert. */
  (function(){ try{
    var C=window.Capacitor;
    if(!(C && C.isNativePlatform && C.isNativePlatform())) return;
    document.documentElement.classList.add('is-native-app');
    var vp=document.querySelector('meta[name=viewport]');
    if(vp) vp.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover');
    var s=document.createElement('style');
    s.textContent='html,body{overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;}'
      +'::-webkit-scrollbar{width:0!important;height:0!important;display:none!important;}';
    document.head.appendChild(s);
    document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
  }catch(e){} })();
</script>

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function rel(ts){ if(!ts) return ''; var d=Date.now()-Number(ts); var min=Math.floor(d/60000);
  if(min<1) return 'gerade eben'; if(min<60) return 'vor '+min+' Min.'; var h=Math.floor(min/60);
  if(h<24) return 'vor '+h+' Std.'; var day=Math.floor(h/24); if(day===1) return 'gestern'; if(day<7) return 'vor '+day+' Tagen';
  var dt=new Date(Number(ts)); return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function timeShort(ts){ if(!ts) return ''; var dt=new Date(Number(ts)); var today=new Date();
  var sameDay=dt.toDateString()===today.toDateString();
  return sameDay ? ('Heute, '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))
                 : dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+', '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

async function tapi(path, opts){
  opts=opts||{}; opts.headers=opts.headers||{};
  if(S.token) opts.headers['Authorization']='Bearer '+S.token;
  if(opts.body && typeof opts.body!=='string'){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(opts.body); }
  var r=await fetch(path, opts);
  if(r.status===401){ logout(); throw new Error('unauthorized'); }
  return r.json();
}

  wartet:{l:'Wartet auf Mitglied',c:TEAL,b:'#e7f1f3',dot:'#2f7d8c'}, abgeschlossen:{l:'Abgeschlossen',c:'#1d7a3e',b:'#e7f6ec',dot:'#46c878'} };
function sm(s){ return STAT[s]||STAT.neu; }
var PRIO={ hoch:{l:'Hoch',c:'#b53a2c',b:'#fbeae7'}, mittel:{l:'Mittel',c:'#C77A2E',b:'#fbf0e3'}, niedrig:{l:'Niedrig',c:'#5a636a',b:'#eef1f2'} };
var CHAN={ portal:'Mitgliederbereich', whatsapp:'WhatsApp', email:'E-Mail', kontakt:'Kontaktformular' };
function chan(c){ return CHAN[c]||'Mitgliederbereich'; }
// Omnichannel: Kanal-Icon + Farbe fürs Listen-Tile (App/WhatsApp/E-Mail/Formular).
var CHS={ portal:{c:'#2f7d8c',b:'#e7f1f3'}, whatsapp:{c:'#1F9A4E',b:'#e8f6ed'}, email:{c:'#2C5FB8',b:'#eaf0fb'}, kontakt:{c:'#5B47C9',b:'#efeafb'} };
function chs(ch){ return CHS[ch]||CHS.portal; }
var CHIC={
  portal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
  whatsapp:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.5 0 12.05 0a11.82 11.82 0 0 1 8.413 3.488 11.82 11.82 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 0 0 1.51 5.26l-.999 3.648 3.487-.995z"/></svg>',
  email:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>',
  kontakt:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>'
};
function chic(ch){ return CHIC[ch]||CHIC.portal; }
// Zuständigkeit: neues Format {id,name} (Magicline-Mitarbeiter), Alt-Format einfacher Name.
function assigneeName(a){ if(!a) return ''; if(typeof a==='string') return a; return String(a.name||''); }

// Textbausteine (Schnellantworten) + KI-Entwurf für die Antwort-Komposition.
// TEMPLATES ist der Default-/Fallback-Satz: Er wird serverseitig (lib/snippets.js)
// als Seed genutzt und dient hier als Rückfallebene, falls das Laden der
// verwaltbaren Bausteine (S.snippets) scheitert. Nicht entfernen.
var TEMPLATES=[
  'Vielen Dank für deine Nachricht! Wir kümmern uns darum und melden uns zeitnah bei dir.',
  'Gerne kannst du dazu direkt bei uns an der Theke vorbeikommen – wir helfen dir sofort weiter.',

  'Kein Problem – wir haben das für dich erledigt. Melde dich jederzeit, wenn du noch etwas brauchst.'
];
function firstName(sel){ return ((sel && sel.member && sel.member.name)||'').split(' ')[0]||'du'; }
// Einfacher, editierbarer KI-Entwurf je Vorgangstyp (Platzhalter für echten LLM-Aufruf).
function aiDraftFor(sel){
  var f=firstName(sel), ty=(sel&&sel.type)||'allgemein';

    kuendigung:'Hallo '+f+', danke für deine Nachricht. Wir haben deine Kündigung erhalten und prüfen den nächstmöglichen Termin – die Bestätigung schicken wir dir zeitnah. Falls du magst, sprich uns gern auf Alternativen an.',

    kontakt:'Hallo '+f+', danke für deine Nachricht! Wir kümmern uns darum und melden uns so schnell wie möglich bei dir.'
  };

}

// ---------- auth ----------
function loadToken(){ try{ S.token=localStorage.getItem('fi_team_token')||null; }catch(e){} }
function saveToken(t){ S.token=t; try{ t?localStorage.setItem('fi_team_token',t):localStorage.removeItem('fi_team_token'); }catch(e){} }
function logout(){ saveToken(null); S.convs=[]; S.sel=null; S.selKey=null; render(); }

async function doLogin(pw){
  S.err=''; S.busy=true; render();
  try{
    var r=await tapi('/api/team/login',{method:'POST',body:{password:pw}});
    if(r.ok && r.token){ saveToken(r.token); S.busy=false; loadEmployees(); await loadInbox(); return; }
    S.err=r.message||'Login fehlgeschlagen.'; S.busy=false; render();
  }catch(e){ S.err='Verbindungsfehler.'; S.busy=false; render(); }
}

// ---------- data ----------
async function loadInbox(){
  if(!S.snippetsLoaded && !S.snippetsLoading) loadSnippets();   // Bausteine einmalig laden
  S.loading=true; render();
  try{
    var r=await tapi('/api/team/conversations');
    if(r.ok){ S.convs=r.conversations||[]; S.counts=r.counts||{}; }
    S.loading=false; render();
    if(S.screen==='inbox' && !S.selKey && S.convs.length && window.innerWidth>860){ openConv(S.convs[0].key); }
  }catch(e){ S.loading=false; render(); }
}
// Mitarbeiter (Magicline, Scope EMPLOYEE_READ) einmalig laden und in S cachen.
// available:false (Scope fehlt) -> S.employees bleibt null, die Auswahl wird nicht gerendert.
async function loadEmployees(){
  if(S.employeesLoaded) return;
  S.employeesLoaded=true;
  try{
    var r=await tapi('/api/team/employees');
    if(r && r.ok && r.available && Array.isArray(r.employees) && r.employees.length){ S.employees=r.employees; }
  }catch(e){}
  if(S.employees && S.sel) render();
}
function findConv(key){ for(var i=0;i<S.convs.length;i++) if(S.convs[i].key===key) return S.convs[i]; return null; }
function splitKey(key){ var i=key.indexOf(':'); return [key.slice(0,i), key.slice(i+1)]; }

async function openConv(key){
  stickBottom=true;   // beim Öffnen immer ans Ende
  S.selKey=key; S.draft=''; S.note=''; S.mobileThread=true; S.panelOpen=false; S.convProfile=null; S.convProfileLoading=false; render();
  var p=splitKey(key);
  loadConvProfile(p[0], key);
  try{
    var r=await tapi('/api/team/conversation?m='+encodeURIComponent(p[0])+'&id='+encodeURIComponent(p[1]));
    if(r.ok){ S.sel=r.conversation; var c=findConv(key); if(c) c.teamUnread=false; S.replyChannel=(S.sel&&S.sel.channel==='whatsapp')?'whatsapp':'email'; }
    render();
  }catch(e){ render(); }
}
// Vollständiges Magicline-Profil des Mitglieds fürs Kontext-Panel laden (nicht bei
// Interessenten/Pseudo-IDs "wa…"). Per key gegen Races abgesichert.
function loadConvProfile(memberId, key){
  if(!memberId || /^wa/.test(String(memberId))){ S.convProfile=null; S.convProfileLoading=false; return; }
  S.convProfile=null; S.convProfileLoading=true;
  tapi('/api/team/members?id='+encodeURIComponent(memberId))
    .then(function(r){ if(S.selKey!==key) return; S.convProfile=(r&&r.ok)?r.profile:null; S.convProfileLoading=false; render(); })
    .catch(function(){ if(S.selKey!==key) return; S.convProfileLoading=false; render(); });
}

// Nachrichten-HTML des offenen Vorgangs (für Voll-Render + Live-Update).
function threadMessagesHTML(sel){
  return (sel.messages||[]).map(function(m){
    if(m.from==='system') return '<div style="display:flex;justify-content:center"><div style="display:inline-flex;align-items:center;gap:8px;background:#eef3f4;border:1px solid #e0e9ea;border-radius:100px;padding:6px 13px;max-width:90%"><span style="font-size:12px;font-weight:600;color:#5a636a">'+esc(m.text)+'</span><span style="font-size:11px;color:#a9b1b6;font-weight:600">· '+esc(timeShort(m.at))+'</span></div></div>';
    if(m.from==='member') return '<div style="display:flex;gap:11px;align-items:flex-start;max-width:80%"><div style="width:34px;height:34px;border-radius:50%;background:#dfe9eb;color:#0a4958;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+esc(sel.member.initials||'·')+'</div><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="font-size:12.5px;font-weight:800">'+esc(sel.member.name)+'</span><span style="font-size:11px;color:#a9b1b6;font-weight:600">'+esc(timeShort(m.at))+'</span></div><div style="background:#fff;border:1px solid #eaeff0;border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:14px;line-height:1.6;color:#2a3338;white-space:pre-wrap">'+esc(m.text)+'</div></div></div>';
    return '<div style="display:flex;gap:11px;align-items:flex-start;max-width:80%;margin-left:auto;flex-direction:row-reverse"><div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(150deg,#0e6072,#073e4b);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+esc((m.author||'Team').slice(0,2).toUpperCase())+'</div><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-direction:row-reverse"><span style="font-size:12.5px;font-weight:800">'+esc(m.author||'Team')+'</span><span style="font-size:11px;color:#a9b1b6;font-weight:600">'+esc(timeShort(m.at))+'</span></div><div style="background:#0a4958;color:#fff;border-radius:16px 4px 16px 16px;padding:11px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap">'+esc(m.text)+'</div></div></div>';
  }).join('');
}
function scrollThreadEnd(){ var c=document.getElementById('threadmsgs'); if(c) c.scrollTop=c.scrollHeight; }
// Nur die Nachrichten austauschen (stört Composer/Fokus nicht), Scroll-Position erhalten.
function updateThreadMessages(){
  var c=document.getElementById('threadmsgs'); if(!c||!S.sel) return;
  var prev=c.scrollTop;
  c.innerHTML=threadMessagesHTML(S.sel);
  c.scrollTop = stickBottom ? c.scrollHeight : prev;   // neue Nachrichten hängen unten an
}
// Offenen Vorgang live nachladen (neue Nachrichten erscheinen automatisch).
async function pollThread(){
  if(!(S.token && S.screen==='inbox' && S.sel && !S.busy)) return;
  var key=S.selKey, p=splitKey(key);
  try{
    var r=await tapi('/api/team/conversation?m='+encodeURIComponent(p[0])+'&id='+encodeURIComponent(p[1]));
    if(!(r.ok && r.conversation) || S.selKey!==key) return;
    var oldM=S.sel.messages||[], newM=r.conversation.messages||[];
    var oldLast=oldM[oldM.length-1]||{}, newLast=newM[newM.length-1]||{};
    var changed = newM.length!==oldM.length || newLast.at!==oldLast.at || newLast.text!==oldLast.text;
    S.sel=r.conversation;
    if(changed) updateThreadMessages();
  }catch(e){}
}

async function actOn(memberId, id, action, extra){
  var body=Object.assign({ m:memberId, id:id, action:action }, extra||{});
  try{ return await tapi('/api/team/conversation',{method:'POST',body:body}); }
  catch(e){ return { ok:false }; }
}
async function act(action, extra){
  if(!S.sel) return; S.busy=true; render();
  var r=await actOn(S.sel.memberId, S.sel.id, action, extra);
  if(r.ok && r.conversation){ S.sel=r.conversation; }
  else if(r.message){ alert(r.message); }
  S.busy=false;
  if(action==='reply'){
    S.draft='';
    if(r.ok){
      if(r.channelUsed===null) alert('Antwort gespeichert, konnte aber weder per WhatsApp noch E-Mail zugestellt werden – es fehlen Kontaktdaten.');
      else if(r.channelFallback) alert('Konnte nicht per '+((extra&&extra.channel==='whatsapp')?'WhatsApp':'E-Mail')+' zustellen – stattdessen per '+(r.channelUsed==='whatsapp'?'WhatsApp':'E-Mail')+' verschickt.');
    }
  }
  if(action==='note'){ S.note=''; }
  render();
  loadInbox();   // Liste/Badges aktualisieren
}

// Filter umschalten: lädt die memberIds zum Tag (GET ?tag) und schränkt die Liste ein.
async function toggleTagFilter(tag){
  if(S.tagFilter===tag){ S.tagFilter=null; S.tagFilterIds=null; render(); return; }
  S.tagFilter=tag; S.tagFilterIds=null; S.tagFilterLoading=true; render();
  try{
    var r=await tapi('/api/team/tags?tag='+encodeURIComponent(tag));
    if(r&&r.ok){ var set={}; (r.memberIds||[]).forEach(function(id){ set[String(id)]=1; S.memberTags[String(id)]=mergeTag(S.memberTags[String(id)], tag); }); S.tagFilterIds=set; }
    else { S.tagFilterIds={}; }
  }catch(e){ S.tagFilterIds={}; }

}
function mergeTag(arr, tag){
  arr=(arr||[]).slice();
  if(!arr.some(function(x){ return x.toLowerCase()===String(tag).toLowerCase(); })) arr.push(tag);

}

// Termin eines Mitglieds absagen (Magicline-Storno über /api/team/appointments) und
// danach das Profil neu laden.
async function apptCancel(p, bookingId){
  if(!p || bookingId==null || bookingId==='') return;
  if(!window.confirm('Diesen Termin wirklich absagen?')) return;
  try{
    var r=await tapi('/api/team/appointments',{method:'POST',body:{action:'cancel',bookingId:bookingId}});
    if(r&&r.ok){ openProfile(p.id); }
    else { alert((r&&r.message)||'Absage fehlgeschlagen.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}
// Termin für ein Mitglied eintragen (best effort). Klappt die Open-API-Buchung nicht,
// übernimmt der Server den Wunsch als Vorgang + Studio-Benachrichtigung (via:'fallback').
async function apptBookFor(p){
  if(!p) return;
  var title=window.prompt('Terminart / Titel (z. B. „Beratungstermin", „Probetraining"):','');
  if(title==null || !title.trim()) return;
  var when=window.prompt('Wunschtermin (z. B. „Sa, 12.07. um 11:00 Uhr"):','');
  if(when==null) return;
  try{
    var r=await tapi('/api/team/appointments',{method:'POST',body:{action:'book',memberId:p.id,title:title.trim(),start:when.trim()}});
    if(r&&r.ok){
      alert(r.via==='fallback'
        ? 'Terminwunsch ans Studio übergeben – er liegt im Postfach des Mitglieds und wird manuell im Magicline-Kalender eingetragen.'
        : (r.message||'Termin eingetragen.'));
      openProfile(p.id);
    } else { alert((r&&r.message)||'Konnte nicht eingetragen werden.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}
// Studio-weite Wochenübersicht laden (best effort). Ist der Abruf nicht verfügbar
// (available:false), bleibt S.studioApptsAvailable false und die Karte erscheint gar nicht.
async function loadStudioAppts(){
  if(S.studioApptsLoaded) return; S.studioApptsLoaded=true;
  try{
    var now=new Date(); var from=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
    var to=new Date(from.getTime()+7*86400000);
    var r=await tapi('/api/team/appointments?from='+encodeURIComponent(from.toISOString())+'&to='+encodeURIComponent(to.toISOString()));
    if(r&&r.ok&&r.available){ S.studioApptsAvailable=true; S.studioAppts=r.appointments||[]; }
  }catch(e){}
  if(S.studioApptsAvailable && S.screen==='appts') render();
}

// ---------- render: inbox ----------
function filtered(){
  var f=S.filter, term=(S.search||'').trim().toLowerCase();
  var list=S.convs.slice();
  if(f==='open') list=list.filter(function(c){ return c.teamStatus!=='abgeschlossen'; });
  else if(f==='neu') list=list.filter(function(c){ return c.teamStatus==='neu'; });
  else if(f==='done') list=list.filter(function(c){ return c.teamStatus==='abgeschlossen'; });
  if(term) list=list.filter(function(c){ return (c.member.name+' '+(c.member.nr||'')+' '+tm(c.type).l+' '+c.ref).toLowerCase().indexOf(term)>=0; });
  return list;
}

function rowsHTML(){
  if(S.loading && !S.convs.length) return '<div style="padding:40px;text-align:center"><span class="spin"></span></div>';
  var rows=filtered();
  if(!rows.length){
    var msg = S.filter==='open' ? 'Keine offenen Vorgänge – alles erledigt! 🎉'
      : S.filter==='neu' ? 'Nichts Neues – alles in Arbeit. 👍'
      : S.filter==='done' ? 'Noch nichts abgeschlossen.'
      : 'Keine Vorgänge in diesem Filter.';
    return '<div style="padding:40px 20px;text-align:center;color:#8a929a;font-size:13.5px;font-weight:600">'+esc(msg)+'</div>';
  }
  return rows.map(function(c){
    var t=tm(c.type), st=sm(c.teamStatus), active=c.key===S.selKey;
    var prev=(c.lastFrom==='team'?'Team: ':c.lastFrom==='system'?'• ':'')+(c.lastText||'');
    return '<div class="convrow" data-open="'+esc(c.key)+'" style="padding:13px 16px;border-bottom:1px solid #f3f6f6;background:'+(active?'#f1f6f7':'#fff')+';border-left:3px solid '+(active?TEAL:'transparent')+'">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<div style="position:relative;flex-shrink:0"><div style="width:38px;height:38px;border-radius:11px;background:'+chs(c.channel).b+';color:'+chs(c.channel).c+';display:flex;align-items:center;justify-content:center">'+chic(c.channel)+'</div>'+
          (c.priority==='hoch'&&c.teamStatus!=='abgeschlossen'?'<span style="position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e2685a;border:2px solid #fff"></span>':'')+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="display:flex;align-items:center;gap:7px"><div style="flex:1;min-width:0;font-size:13.5px;font-weight:'+(c.teamUnread?'800':'700')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.member.name)+'</div>'+
            '<span style="font-size:11px;color:#a9b1b6;font-weight:600;flex-shrink:0">'+esc(rel(c.updatedAt))+'</span></div>'+
          '<div style="font-size:12.5px;color:#42454b;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.l)+' · '+esc(chan(c.channel))+'</div>'+
          '<div style="font-size:12px;color:#8a929a;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(prev)+'</div></div></div>'+
      '<div style="display:flex;align-items:center;gap:6px;margin-top:9px;padding-left:48px">'+
        '<span style="font-size:10.5px;font-weight:800;color:'+st.c+';background:'+st.b+';border-radius:20px;padding:3px 9px">'+st.l+'</span>'+
        (assigneeName(c.assignee)?'<span title="Zuständig: '+esc(assigneeName(c.assignee))+'" style="display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#0a4958;background:#e7f1f3;border-radius:20px;padding:3px 9px"><span style="width:6px;height:6px;border-radius:50%;background:#2f7d8c"></span>'+esc(assigneeName(c.assignee).split(' ')[0])+'</span>':'')+
        (c.teamUnread?'<span style="margin-left:auto;width:8px;height:8px;border-radius:50%;background:'+ORANGE+'"></span>':'')+'</div></div>';
  }).join('');
}

// Eine Zeile „Label: Wert" fürs Mitgliedsdaten-Panel (leere Werte werden weggelassen).
function pinfoRow(label, val){
  if(val==null || val==='') return '';
  return '<div style="display:flex;gap:8px;padding:4px 0;font-size:12.5px;align-items:baseline"><span style="color:#8a929a;font-weight:600;min-width:96px;flex-shrink:0">'+esc(label)+'</span><span style="color:#2a3338;font-weight:700;flex:1;text-align:right;word-break:break-word">'+esc(val)+'</span></div>';
}
// Magicline-Daten des Mitglieds (Vertrag, Kontakt, Termine) für das Kontext-Panel.
function convProfileHTML(sel){
  if(sel.member && sel.member.lead) return '<div style="font-size:12.5px;color:#8a929a;font-weight:600">Interessent – noch kein Magicline-Profil.'+(sel.member.phone?'<br>Tel.: '+esc(sel.member.phone):'')+'</div>';
  if(S.convProfileLoading) return '<div style="padding:12px;text-align:center"><span class="spin"></span></div>';
  var p=S.convProfile;
  if(!p) return '<div style="font-size:12.5px;color:#a9b1b6;font-weight:600">Keine Magicline-Daten verfügbar.</div>';
  var ct=p.contract||{};
  var hasContract = !!(p.contract && (ct.rateName || ct.startDate || ct.active!=null));
  var statusLabel = !hasContract ? null : (ct.active===false ? (ct.reversed?'Widerrufen':'Ehemalig') : 'Aktiv');
  var rows = pinfoRow('Mitgliedsnr.',p.nr)
    + pinfoRow('Status',statusLabel)
    + pinfoRow('Tarif',ct.rateName)
    + pinfoRow('Mitglied seit',ct.startDate)
    + pinfoRow('Vertragsende',ct.endDate||(ct.active===false?null:'läuft'))
    + pinfoRow('Nächste Kündigung',ct.nextCancellationDate)
    + pinfoRow('Telefon',p.phone)
    + pinfoRow('E-Mail',p.email)
    + pinfoRow('Geburtstag',p.birthday)
    + pinfoRow('Adresse',p.address)
    + pinfoRow('IBAN',p.ibanMasked);
  var appts = (p.appointments&&p.appointments.length)
    ? '<div style="margin-top:9px;padding-top:9px;border-top:1px solid #eef3f4"><div style="font-size:10.5px;font-weight:800;color:#8a929a;letter-spacing:.5px;margin-bottom:5px">NÄCHSTE TERMINE</div>'+p.appointments.slice(0,3).map(function(a){ return '<div style="font-size:12px;color:#2a3338;font-weight:600;padding:2px 0">'+esc(a.title)+' · '+esc(fmtDT(a.start))+'</div>'; }).join('')+'</div>'
    : '';
  var prof = '<div style="margin-top:9px;padding-top:9px;border-top:1px solid #eef3f4"><button data-openprof="'+esc(p.id||'')+'" style="font-size:12px;font-weight:800;color:'+TEAL+';background:none;border:none;padding:0;cursor:pointer">Vollständiges Profil ›</button></div>';
  return (rows||'<div style="font-size:12.5px;color:#a9b1b6;font-weight:600">Keine Stammdaten.</div>') + appts + prof;
}

function inboxNode(){
  var node=el('<div class="adm-inbox'+(S.mobileThread?' thread':'')+'" style="flex:1;min-height:0;display:flex;background:#eef2f3"></div>');

  // LIST
  var listWrap=el('<div class="inbox-list scrl" style="width:368px;flex-shrink:0;border-right:1px solid #e1e8ea;display:flex;flex-direction:column;min-height:0;background:#eef2f3"></div>');
  var fhead=el('<div style="padding:16px 16px 14px;flex-shrink:0"></div>');
  var filters=[['open','Offen',S.counts.open],['neu','Neu',S.counts.neu],['done','Erledigt',S.counts.done],['all','Alle',S.counts.all]];
  fhead.innerHTML='<div style="position:relative;margin-bottom:12px">'+
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a929a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
      '<input id="isearch" value="'+esc(S.search)+'" placeholder="Vorgang oder Mitglied suchen" style="width:100%;padding:12px 14px 12px 40px;border:none;border-radius:13px;font-size:14px;background:#fff;outline:none;box-shadow:0 6px 18px rgba(4,33,40,.06)"></div>'+
      '<div style="display:flex;gap:7px;flex-wrap:wrap">'+filters.map(function(f){ var a=S.filter===f[0];
        return '<button data-filter="'+f[0]+'" style="display:flex;align-items:center;gap:6px;border:none;background:'+(a?TEAL:'#fff')+';color:'+(a?'#fff':'#42454b')+';border-radius:11px;font-size:12.5px;font-weight:800;padding:8px 13px;box-shadow:0 6px 18px rgba(4,33,40,.06);cursor:pointer">'+f[1]+(f[2]!=null?'<span style="font-size:11px;font-weight:800;opacity:'+(a?'.8':'.55')+'">'+f[2]+'</span>':'')+'</button>';

// Bausteine vom Server laden; bei Fehler bleibt S.snippets=null -> TEMPLATES-Fallback.
async function loadSnippets(){
  if(S.snippetsLoading) return;
  S.snippetsLoading=true;
  try{ var r=await tapi('/api/team/snippets'); if(r && Array.isArray(r.snippets)) S.snippets=r.snippets; }
  catch(e){}
  S.snippetsLoaded=true; S.snippetsLoading=false; render();
}
// Mutation an den Server schicken; Antwort enthält immer die frische Liste.
async function snipMutate(body){
  S.snippetsBusy=true; render();
  var r=null;
  try{ r=await tapi('/api/team/snippets',{method:'POST',body:body}); }catch(e){}
  if(r && Array.isArray(r.snippets)) S.snippets=r.snippets;
  S.snippetsBusy=false; S.snippetsLoaded=true;
  if(r && r.ok===false && r.message) alert(r.message);
  return r;
}
async function addSnip(text){ var t=(text||'').trim(); if(!t) return; await snipMutate({action:'add', text:t}); S.snipNew=''; render(); }
async function updateSnip(id, text){ var t=(text||'').trim(); if(!t||!id) return; await snipMutate({action:'update', id:id, text:t}); S.snipEdit=null; render(); }
async function deleteSnip(id){ if(!id) return; if(!window.confirm('Diesen Baustein wirklich löschen?')) return; await snipMutate({action:'delete', id:id}); if(S.snipEdit && String(S.snipEdit.id)===String(id)) S.snipEdit=null; render(); }

function sendReply(){ var v=(S.draft||'').trim(); if(v && !S.busy){ stickBottom=true; act('reply',{text:v, channel:S.replyChannel}); } }

// KI-Antwortentwurf holen und ins Antwortfeld (#draft) setzen – gesendet wird nichts automatisch.
async function suggestReply(){
  if(!S.sel || S.aiBusy) return;
  var memberId=S.sel.memberId, id=S.sel.id;
  S.aiBusy=true; render();
  var r;
  try{ r=await tapi('/api/team/suggest-reply',{method:'POST',body:{memberId:memberId, id:id}}); }
  catch(e){ r={ok:false}; }
  S.aiBusy=false;
  if(r && r.ok && r.draft){
    // nur einfügen, wenn noch derselbe Vorgang offen ist
    if(S.sel && S.sel.memberId===memberId && String(S.sel.id)===String(id)){ S.draft=r.draft; S.quickOpen=false; }
  } else if(r && r.error==='no_ai'){
    S.aiUnavailable=true;
  } else {
    alert((r&&r.message)||'KI-Entwurf konnte nicht erstellt werden.');
  }
  render();
  var d=root.querySelector('#draft'); if(d && r && r.ok){ d.focus(); d.setSelectionRange(d.value.length,d.value.length); }
}

async function saveMember(id){
  if(S.editBusy) return;
  var g=function(i){ var e=document.getElementById(i); return e?e.value.trim():''; };
  var body={ id:id, street:g('ed_street'), houseNumber:g('ed_house'), zipCode:g('ed_zip'), city:g('ed_city') };
  if(!body.street||!body.zipCode||!body.city){ S.editMsg='Bitte Straße, PLZ und Ort ausfüllen.'; render(); return; }
  S.editBusy=true; S.editMsg=''; render();
  try{
    var r=await tapi('/api/team/member-update',{method:'POST',body:body});
    S.editBusy=false;
    if(r&&r.ok){ S.editMember=false; openProfile(id); }
    else { S.editMsg=(r&&r.message)||'Konnte nicht gespeichert werden.'; render(); }
  }catch(e){ S.editBusy=false; S.editMsg='Verbindung fehlgeschlagen.'; render(); }
}
// DSGVO: Mitglied anonymisieren – zweistufige Bestätigung (Warn-Dialog + exakte
// Eingabe der Mitgliedsnummer), erst dann geht der Aufruf an Magicline.
async function anonymiseMember(p){
  if(!p || !p.id) return;
  if(!window.confirm('Mitglied „'+p.name+'“ wirklich anonymisieren?\n\nACHTUNG: Dieser Schritt ist unwiderruflich. Alle personenbezogenen Daten werden in Magicline anonymisiert und können nicht wiederhergestellt werden.')) return;
  var nr=p.nr!=null?String(p.nr):'';
  if(!nr){ alert('Keine Mitgliedsnummer vorhanden – Anonymisierung hier nicht möglich.'); return; }
  var typed=window.prompt('Zur Bestätigung bitte die Mitgliedsnummer exakt eintippen ('+nr+'):','');
  if(typed==null) return;
  if(typed.trim()!==nr){ alert('Die Eingabe stimmt nicht mit der Mitgliedsnummer überein – Vorgang abgebrochen.'); return; }
  try{
    var r=await tapi('/api/team/member-update',{method:'POST',body:{id:p.id, action:'anonymise'}});
    if(r&&r.ok){
      alert('Mitglied wurde anonymisiert.');
      S.profile=null; S.membersLoaded=false; S.screen='members'; loadMembers();
    } else {
      alert((r&&r.message)||'Anonymisierung fehlgeschlagen.');
    }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}

var BCSEG=[
  {k:'app',l:'App-Nutzer',d:'Alle mit App & Push-Freigabe'},
  {k:'inactive',l:'Inaktive',d:'Aktiver Vertrag, ≥ 14 Tage nicht da'},
  {k:'risk',l:'Risiko',d:'Erhöhtes Kündigungsrisiko'},
  {k:'former',l:'Ehemalige',d:'Vertrag beendet oder gekündigt'}
];
function updateBroadcastCount(){
  var c=document.getElementById('bccount'); if(!c) return;
  c.innerHTML = S.bcCountLoading
    ? '<span class="spin" style="width:15px;height:15px;border-width:2px"></span><span style="color:#8a929a;font-weight:700;font-size:13px">Empfänger werden ermittelt …</span>'
    : (S.bcCount==null
        ? '<span style="color:#8a929a;font-weight:700;font-size:13px">Empfängerzahl nicht verfügbar.</span>'
        : '<span style="font-size:22px;font-weight:900;color:#0a4958">'+esc(String(S.bcCount))+'</span><span style="color:#6b7780;font-weight:700;font-size:13px">Empfänger'+(S.bcCount>=500?' (max. 500)':'')+'</span>');
}
async function loadBroadcastCount(){
  var seg=S.bcSegment;
  S.bcCountLoading=true; S.bcCount=null; updateBroadcastCount();
  try{ var r=await tapi('/api/team/broadcast?segment='+encodeURIComponent(seg)); if(S.bcSegment===seg){ S.bcCount=(r&&r.ok)?r.count:null; } }
  catch(e){ if(S.bcSegment===seg) S.bcCount=null; }
  if(S.bcSegment===seg){ S.bcCountLoading=false; updateBroadcastCount(); }
}
function setBcSegment(k){ if(S.bcSegment===k) return; S.bcSegment=k; S.bcResult=null; render(); loadBroadcastCount(); }
async function doSendBroadcast(){
  if(S.bcBusy) return;
  var title=(S.bcTitle||'').trim(), body=(S.bcBody||'').trim();
  if(!title||!body){ alert('Bitte Titel und Text ausfüllen.'); return; }
  if(!S.bcPush && !S.bcEmail){ alert('Bitte mindestens einen Kanal (Push oder E-Mail) wählen.'); return; }
  var seg=(BCSEG.find(function(s){ return s.k===S.bcSegment; })||{}).l||S.bcSegment;
  var n=(S.bcCount!=null)?S.bcCount:'?';
  if(!window.confirm('Rundnachricht an Segment „'+seg+'“ ('+n+' Empfänger) senden?')) return;
  S.bcBusy=true; S.bcResult=null; render();
  try{
    var r=await tapi('/api/team/broadcast',{method:'POST',body:{segment:S.bcSegment,title:title,body:body,channels:{push:!!S.bcPush,email:!!S.bcEmail}}});
    S.bcBusy=false;
    if(r && r.ok){ S.bcResult=r; S.bcTitle=''; S.bcBody=''; }
    else { alert((r&&r.message)||'Rundnachricht konnte nicht gesendet werden.'); }
  }catch(e){ S.bcBusy=false; alert('Verbindung fehlgeschlagen.'); }
  render();
}

var LEADORDER=['neu','kontaktiert','gewonnen','verloren'];

function leadInitials(nm){ var p=String(nm||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '·'; return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }

async function loadLeads(){

  catch(e){}

}
function setLeadFilter(k){ if(S.leadFilter===k) return; S.leadFilter=k; render(); }
function replaceLead(lead){ for(var i=0;i<S.leads.length;i++){ if(S.leads[i].id===lead.id){ S.leads[i]=lead; return; } } S.leads.unshift(lead); }
async function leadSetStatus(id,status){
  if(S.leadBusy) return;
  S.leadBusy=id; render();

    var r=await tapi('/api/team/leads',{method:'POST',body:{id:id,action:'status',status:status}});

  }catch(e){ alert('Verbindung fehlgeschlagen.'); }

async function leadAssign(id,emp){
  if(S.leadBusy) return;

  try{
    var r=await tapi('/api/team/leads',{method:'POST',body:{id:id,action:'assign',assignee:assignee}});
    if(r && r.ok && r.lead){ replaceLead(r.lead); }
    else { alert((r&&r.message)||'Zuweisung fehlgeschlagen.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }

function leadsNode(){
  var node=el('<div class="scrl" style="flex:1;min-height:0;overflow-y:auto;padding:24px 28px 44px"></div>');
  if(S.leadsLoading && !(S.leads&&S.leads.length)){
    node.innerHTML='<div style="display:flex;align-items:center;justify-content:center;padding:70px"><span class="spin"></span></div>';
    return node;
  }
  var leads=S.leads||[];
  var counts={neu:0,kontaktiert:0,gewonnen:0,verloren:0};
  leads.forEach(function(l){ if(counts[l.status]!=null) counts[l.status]++; else counts.neu++; });
  var total=leads.length;
  var tiles=LEADORDER.map(function(k){ var o=LEADSTAT[k];
    return '<div style="background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(4,33,40,.07);padding:14px 16px;border-left:4px solid '+o.dot+'">'+
      '<div style="font-size:26px;font-weight:900;color:'+o.c+';line-height:1">'+esc(String(counts[k]))+'</div>'+
      '<div style="font-size:12px;font-weight:700;color:#6b7780;margin-top:4px">'+esc(o.l)+'</div></div>';
  }).join('');
  var chipDefs=[{k:'all',l:'Alle',n:total}].concat(LEADORDER.map(function(k){ return {k:k,l:LEADSTAT[k].l,n:counts[k]}; }));
  var chips=chipDefs.map(function(c){ var a=S.leadFilter===c.k;
    return '<button data-lfilter="'+esc(c.k)+'" style="border:1.5px solid '+(a?TEAL:'#dce3e4')+';background:'+(a?'#e7f1f3':'#fff')+';color:'+(a?TEAL:'#6b7780')+';border-radius:100px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px">'+esc(c.l)+'<span style="font-size:11px;font-weight:800;color:'+(a?'#fff':'#8a929a')+';background:'+(a?TEAL:'#eef2f3')+';border-radius:20px;min-width:19px;height:18px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center">'+esc(String(c.n))+'</span></button>';
  }).join('');
  var list=(S.leadFilter==='all')?leads:leads.filter(function(l){ return l.status===S.leadFilter; });
  var rows=list.length ? list.map(leadRowHTML).join('')
    : '<div style="background:#fff;border-radius:16px;padding:44px 20px;text-align:center;box-shadow:0 10px 26px rgba(4,33,40,.07)"><div style="font-size:15px;font-weight:900;color:#15171B">Keine Interessenten</div><div style="font-size:13px;color:#8a929a;font-weight:600;margin-top:6px;line-height:1.5">'+(total?'In diesem Status ist gerade niemand.':'Neue Anfragen (Probetraining, WhatsApp, Kontakt) erscheinen hier automatisch.')+'</div></div>';
  node.innerHTML='<div style="max-width:820px">'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px">'+tiles+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">'+chips+'</div>'+
    rows+
  '</div>';
  setTimeout(function(){ wireLeads(node); },0);
  return node;

function wireLeads(node){
  node.querySelectorAll('[data-lfilter]').forEach(function(b){ b.onclick=function(){ setLeadFilter(b.getAttribute('data-lfilter')); }; });
  node.querySelectorAll('[data-lstatus]').forEach(function(b){ b.onclick=function(){ leadSetStatus(b.getAttribute('data-lid'), b.getAttribute('data-lstatus')); }; });
  node.querySelectorAll('[data-laid]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-laid'); leadAssign(b.getAttribute('data-lid'), id?{id:id,name:b.getAttribute('data-laname')}:{none:true}); }; });
}

// ---------- Statistiken ----------
function statsNode(){
  var node=el('<div class="scrl" style="flex:1;min-height:0;overflow-y:auto;padding:18px 18px 28px"></div>');
  if(S.statsLoading && !S.stats){ node.innerHTML='<div style="padding:60px;text-align:center"><span class="spin"></span></div>'; return node; }
  var s=S.stats||{counts:{},vorgangBreakdown:[],checkinDays:[],topArticles:[],avgUtil:0,articlesPublished:0,articleViews:0,employeeStats:[]};
  var c=s.counts||{};
  var kpis=[['Offene Vorgänge',c.open||0,TEAL],['Aktion erforderlich',c.neu||0,'#b53a2c'],['Ø Auslastung',(s.avgUtil||0)+' Pers.','#1d7a3e'],['Veröffentl. Artikel',s.articlesPublished||0,ORANGE]];
  if(S.util && S.util.percent!=null) kpis.splice(2,0,['Auslastung jetzt',S.util.percent+' %','#0e6072']);
  var vbTotal=(s.vorgangBreakdown||[]).reduce(function(a,b){return a+b.count;},0)||1;
  var vbHtml=(s.vorgangBreakdown||[]).map(function(v){ var t=tm(v.type); var pct=Math.round(v.count/vbTotal*100); return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:#15171B">'+esc(t.l)+'</span><span style="font-size:12.5px;font-weight:800;color:#0a4958">'+v.count+'</span></div><div style="height:8px;border-radius:5px;background:#eef2f3;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+t.c+';border-radius:5px"></div></div></div>'; }).join('') || '<div style="font-size:12.5px;color:#a3abb0;font-weight:600">Noch keine Vorgänge.</div>';
  var maxC=Math.max.apply(null,(s.checkinDays||[]).map(function(d){return d.v;}).concat([1]));
  var ciHtml=(s.checkinDays||[]).map(function(d){ var h=Math.round(d.v/maxC*100); return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end"><div style="font-size:11px;font-weight:800;color:#0a4958">'+d.v+'</div><div style="width:100%;background:linear-gradient(180deg,#0e6072,#063540);border-radius:5px;height:'+Math.max(h,5)+'%;min-height:6px"></div><div style="font-size:9.5px;font-weight:800;color:#a3abb0">'+esc(d.d)+'</div></div>'; }).join('');
  var topHtml=(s.topArticles||[]).filter(function(a){return a.title;}).map(function(a,i){ var cc=hcat(a.cat); return '<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #f0f3f4"><span style="font-size:13px;font-weight:900;color:#c9d3d5;width:18px;flex-shrink:0">'+(i+1)+'</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:#15171B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.title)+'</div><div style="font-size:11px;font-weight:800;color:'+cc.c+';margin-top:2px">'+cc.l+'</div></div><span style="font-size:12.5px;font-weight:800;color:#0a4958;flex-shrink:0">'+deNum(a.views)+'</span></div>'; }).join('') || '<div style="font-size:12.5px;color:#a3abb0;font-weight:600;padding:10px 0;border-top:1px solid #f0f3f4">Noch keine Artikel-Aufrufe.</div>';
  // Mitarbeiter-Leistung (nur echte Daten; Karte entfällt, wenn keine Aggregation vorliegt).
  var emp=(s.employeeStats||[]);
  var empHead='<div style="display:flex;align-items:center;gap:11px;padding:6px 0 8px;font-size:10.5px;font-weight:800;color:#a3abb0;text-transform:uppercase;letter-spacing:.4px"><div style="flex:1;min-width:0">Mitarbeiter</div><span style="width:64px;text-align:right;flex-shrink:0">Zugew.</span><span style="width:76px;text-align:right;flex-shrink:0">Abgeschl.</span><span style="width:52px;text-align:right;flex-shrink:0">Offen</span><span style="width:84px;text-align:right;flex-shrink:0">Ø Reaktion</span></div>';
  var empRows=emp.map(function(e){ return '<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #f0f3f4"><div style="flex:1;min-width:0;font-size:13px;font-weight:700;color:#15171B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(e.name)+'</div><span style="width:64px;text-align:right;font-size:12.5px;font-weight:800;color:#0a4958;flex-shrink:0">'+deNum(e.assigned)+'</span><span style="width:76px;text-align:right;font-size:12.5px;font-weight:800;color:#1d7a3e;flex-shrink:0">'+deNum(e.resolved)+'</span><span style="width:52px;text-align:right;font-size:12.5px;font-weight:800;color:#6b7780;flex-shrink:0">'+deNum(e.open)+'</span><span style="width:84px;text-align:right;font-size:12.5px;font-weight:800;color:#0a4958;flex-shrink:0">'+esc(rtLabel(e.avgResponseMin))+'</span></div>'; }).join('');
  var empCard=emp.length?('<div style="background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:18px"><div style="font-size:14px;font-weight:900;color:#15171B;margin-bottom:4px">Mitarbeiter-Leistung</div><div style="font-size:11.5px;color:#8a929a;font-weight:600;margin-bottom:8px">Bearbeitete Vorgänge & Ø Reaktionszeit</div>'+empHead+empRows+'</div>'):'';
  node.innerHTML='<div style="max-width:1000px;display:flex;flex-direction:column;gap:14px">'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px">'+
    kpis.map(function(k){ return '<div style="background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:17px"><div style="font-size:12.5px;font-weight:700;color:#6b7780">'+k[0]+'</div><div style="font-size:28px;font-weight:900;margin-top:8px;letter-spacing:-.5px;color:'+k[2]+'">'+(typeof k[1]==='number'?deNum(k[1]):esc(k[1]))+'</div></div>'; }).join('')+'</div>'+
    '<div class="prof-grid" style="display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start">'+
      '<div style="background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:18px"><div style="font-size:14px;font-weight:900;color:#15171B;margin-bottom:4px">Typische Auslastung</div><div style="font-size:11.5px;color:#8a929a;font-weight:600;margin-bottom:14px">Ø Spitzenwert pro Wochentag · '+(s.avgUtil||0)+' Personen</div><div style="display:flex;align-items:flex-end;gap:7px;height:160px">'+(ciHtml||'<div style="margin:auto;color:#a3abb0;font-size:12.5px;font-weight:600">Noch keine Auslastungsdaten.</div>')+'</div></div>'+
      '<div style="background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:18px"><div style="font-size:14px;font-weight:900;color:#15171B;margin-bottom:4px">Vorgänge nach Art</div><div style="font-size:11.5px;color:#8a929a;font-weight:600;margin-bottom:16px">Aktueller Posteingang</div>'+vbHtml+'</div>'+
    '</div>'+
    '<div style="background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:18px"><div style="font-size:14px;font-weight:900;color:#15171B;margin-bottom:4px">Meistgelesene Artikel</div><div style="font-size:11.5px;color:#8a929a;font-weight:600;margin-bottom:4px">Top-Artikel nach Aufrufen</div>'+topHtml+'</div>'+
    empCard+
  '</div>';
  return node;
}

function placeholderNode(title){
  var w=el('<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px"></div>');
  w.innerHTML='<div style="text-align:center;max-width:380px"><div style="font-size:18px;font-weight:900">'+esc(title)+'</div><div style="font-size:14px;color:#6b7780;font-weight:500;margin-top:8px;line-height:1.6">Dieser Bereich folgt als Nächstes. Der Posteingang (Empfang & Antworten) ist bereits voll funktionsfähig.</div></div>';
  return w;
}

// ---------- main render ----------
function render(){
  if(!S.token){ renderLogin(); return; }
  var titles={dash:'Übersicht',inbox:'Posteingang',members:'Mitglieder',appts:'Termine',help:'Hilfe-Artikel',stats:'Statistiken',msg:'Nachrichten',leads:'Leads'};
  var subs={dash:'Dein Studio auf einen Blick',inbox:'Alle Vorgänge & Anfragen',members:'Mitgliederverwaltung',appts:'Anfragen & Buchungen',help:'Wissensdatenbank verwalten',stats:'Auswertungen & Trends',msg:'Rundnachricht & Direktnachricht',leads:'Interessenten-Pipeline'};
  var content;
  if(S.screen==='inbox') content=inboxNode();
  else if(S.screen==='dash') content=dashNode();
  else if(S.screen==='members') content=membersNode();
  else if(S.screen==='appts') content=apptsNode();
  else if(S.screen==='help') content=helpNode();
  else if(S.screen==='stats') content=statsNode();
  else if(S.screen==='msg') content=msgNode();
  else if(S.screen==='leads') content=leadsNode();
  else content=placeholderNode(titles[S.screen]||'');
  renderShell(content, titles[S.screen]||'', subs[S.screen]||'');
}
function goScreen(k){
  S.screen=k; S.navOpen=false;
  if(k==='dash'){ loadUtil(); loadChurn(); loadDues(); if(!S.convs.length && !S.loading) loadInbox(); }
  if(k==='members'){ S.profile=null; if(!S.membersLoaded){ loadMembers(); return; } }
  if(k==='appts' && !S.convs.length && !S.loading){ loadInbox(); return; }
  if(k==='help'){ S.helpView='list'; S.editor=null; if(!S.articlesLoaded){ loadArticles(); return; } }
  if(k==='stats'){ loadUtil(); loadStats(); return; }
  if(k==='msg'){ S.bcResult=null; }
  if(k==='leads'){ if(!S.leadsLoaded){ loadLeads(); return; } }
  render();
}

// ---------- boot ----------
loadToken();
if(S.token){ render(); loadEmployees(); loadInbox(); } else { render(); }
// Offenen Chat live nachladen (neue Nachrichten erscheinen automatisch).
setInterval(pollThread, 6000);
// Liste/Badges seltener aktualisieren (kein Voll-Render, wenn gerade getippt wird).
setInterval(function(){ if(S.token && (S.screen==='inbox'||S.screen==='appts') && !S.busy && !(S.draft||'').trim()) loadInbox(); }, 30000);
</script>
