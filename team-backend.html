  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  /* Overscroll (iOS-Gummiband): Hintergrund hinter der App = Seitenfarbe, kein
     Farb-Balken beim Über-Scrollen; innere Listen reichen ihr Scrollen nicht
     an die Seite weiter. */
  html{background:#e9eef0}
  html,body{overscroll-behavior:none}
  .scrl{overscroll-behavior:contain}
  body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#e9eef0;color:#15171B}
  ::placeholder{color:#a9b1b6}
  input,select,button,textarea{font-family:inherit}
  button{cursor:pointer}
  textarea:focus,input:focus,select:focus{outline:none}
  .scrl::-webkit-scrollbar{width:9px;height:9px}
  .scrl::-webkit-scrollbar-thumb{background:#d6dee0;border-radius:8px}
  .navbtn:hover{background:rgba(255,255,255,.10)}

  .lrow:hover{background:#f5f8f8}

  @keyframes fiSpin{to{transform:rotate(360deg)}}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #cfe0e3;border-top-color:#0a4958;display:inline-block;animation:fiSpin .8s linear infinite}
  /* Boot-Splash: statisch in #root, sichtbar während die Seite lädt/parst;
     das erste render() ersetzt den Inhalt automatisch. */
  .bootsplash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .bootsplash .ring{width:34px;height:34px;border-radius:50%;border:3px solid #d6dee0;border-top-color:#0a4958;animation:fiSpin .8s linear infinite}

  .hsnap{scrollbar-width:none}.hsnap::-webkit-scrollbar{display:none}

  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes popIn{0%{transform:scale(.92) translateY(10px)}100%{transform:scale(1) translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:1100px){

    .ctx-panel.open{transform:none}
    .ctx-toggle{display:inline-flex!important}
  }
  @media (min-width:1101px){ .ctx-toggle,.ctx-overlay{display:none!important} }
  @media (max-width:860px){
    .mb-sidebar{position:fixed;top:0;left:0;height:100dvh;width:264px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 70px rgba(0,0,0,.45)}

    .mb-burger{display:inline-flex!important}
    .inbox-list{width:100%!important;border-right:none!important}

  @media (min-width:861px){ .mb-burger,.mb-overlay,.mb-back{display:none!important} }
  /* Mobile Bottom-Nav (neuer Look) */
  .bottomnav{display:none}
  .bottomnav button:active{opacity:.6}
  @media (max-width:860px){

<script>
  /* In der eigenen App (Capacitor): App-Feeling – kein Zoom, kein horizontales
     Wischen, keine sichtbare Scrollbar. Im Browser bleibt alles unverändert. */
  (function(){ try{
    var C=window.Capacitor;
    if(!(C && C.isNativePlatform && C.isNativePlatform())) return;
    document.documentElement.classList.add('is-native-app');
    var vp=document.querySelector('meta[name=viewport]');
    if(vp) vp.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover');
    var s=document.createElement('style');
    s.textContent='html,body{overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;}'
      +'::-webkit-scrollbar{width:0!important;height:0!important;display:none!important;}';
    document.head.appendChild(s);
    document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
  }catch(e){} })();
</script>

// Mehrere render()-Aufrufe im selben Frame zu EINEM Rebuild bündeln. Verhindert das

// Nur für nachträgliche Loader-Renders benutzen – einleitende Lade-Renders bleiben synchron.
var _renderScheduled=false;
function scheduleRender(){
  if(_renderScheduled) return;
  _renderScheduled=true;
  var raf=window.requestAnimationFrame||function(cb){ return setTimeout(cb,16); };
  raf(function(){ _renderScheduled=false; render(); });
}
// Schlüssel für die Scroll-Merkung: pro Screen, beim Mitgliedsprofil zusätzlich pro Mitglied.
function curMainKey(){ return S.screen+(((S.screen==='members')&&(S.profile||S.profileLoading)&&S._profId)?(':'+S._profId):''); }
// Screen-Level-Scroller ist der erste direkte .scrl-Nachfahre des Inhaltsbereichs.
// (Postfach nutzt eigene Scroller – dort matcht nichts und wir lassen es unangetastet.)
function restoreMainScroll(bodyEl){
  if(!bodyEl) return; var sc=null, kids=bodyEl.children;
  for(var i=0;i<kids.length;i++){ if(kids[i].classList&&kids[i].classList.contains('scrl')){ sc=kids[i]; break; } }
  if(!sc) return; var key=curMainKey(); var saved=mainScrollMap[key]||0;
  if(saved>0){ try{ sc.scrollTop=saved; }catch(e){} }
  sc.addEventListener('scroll',function(){ mainScrollMap[key]=sc.scrollTop; },{passive:true});
}

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function rel(ts){ if(!ts) return ''; var d=Date.now()-Number(ts); var min=Math.floor(d/60000);
  if(min<1) return 'gerade eben'; if(min<60) return 'vor '+min+' Min.'; var h=Math.floor(min/60);
  if(h<24) return 'vor '+h+' Std.'; var day=Math.floor(h/24); if(day===1) return 'gestern'; if(day<7) return 'vor '+day+' Tagen';
  var dt=new Date(Number(ts)); return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function timeShort(ts){ if(!ts) return ''; var dt=new Date(Number(ts)); var today=new Date();
  var sameDay=dt.toDateString()===today.toDateString();
  return sameDay ? ('Heute, '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))
                 : dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+', '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

async function tapi(path, opts){
  opts=opts||{}; opts.headers=opts.headers||{};
  if(S.token) opts.headers['Authorization']='Bearer '+S.token;
  if(opts.body && typeof opts.body!=='string'){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(opts.body); }
  var r=await fetch(path, opts);
  if(r.status===401){ logout(); throw new Error('unauthorized'); }
  // Body defensiv parsen: ein 500 mit HTML-Fehlerseite darf r.json() nicht werfen lassen
  // (sonst geht die Server-Meldung verloren und Aufrufer ohne try/catch stürzen ab).
  var j=null; try{ j=await r.json(); }catch(e){ j=null; }
  if(j==null) return { ok:false, http:r.status };
  if(j.ok===undefined && !r.ok) j.ok=false;
  return j;
}

// Zustell-/Lesestatus einer gesendeten Team-Nachricht (WhatsApp: ✓/✓✓/gelesen; E-Mail: zugestellt/geöffnet).
function msgStatusHTML(m){
  if(!m || m.from!=='team' || !m.st) return '';
  var ch=m.ch||'', lbl='', col='#a9b1b6';
  if(m.st==='failed'){ lbl='⚠ nicht zugestellt'; col='#b5402f'; }
  else if(ch==='email'){
    if(m.st==='sent') lbl='gesendet';
    else if(m.st==='delivered') lbl='✓✓ zugestellt';
    else if(m.st==='read'){ lbl='geöffnet (ca.)'; col='#2f7d8c'; }
  } else {
    if(m.st==='sent') lbl='✓ gesendet';
    else if(m.st==='delivered') lbl='✓✓ zugestellt';
    else if(m.st==='read'){ lbl='✓✓ gelesen'; col='#2f7d8c'; }
  }
  return lbl?'<span style="font-size:10.5px;font-weight:700;color:'+col+'">'+esc(lbl)+'</span>':'';
}
function msgStatusSig(arr){ return (arr||[]).map(function(m){ return (m.at||0)+':'+(m.st||''); }).join('|'); }

function updateThreadMessages(){
  var c=document.getElementById('threadmsgs'); if(!c||!S.sel) return;

// Offenen Vorgang live nachladen (neue Nachrichten erscheinen automatisch).
async function pollThread(){
  if(!(S.token && S.screen==='inbox' && S.sel && !S.busy)) return;
  var key=S.selKey, p=splitKey(key);
  try{
    var r=await tapi('/api/team/conversation?m='+encodeURIComponent(p[0])+'&id='+encodeURIComponent(p[1]));
    if(!(r.ok && r.conversation) || S.selKey!==key) return;
    var oldM=S.sel.messages||[], newM=r.conversation.messages||[];
    var oldLast=oldM[oldM.length-1]||{}, newLast=newM[newM.length-1]||{};
    var changed = newM.length!==oldM.length || newLast.at!==oldLast.at || newLast.text!==oldLast.text || msgStatusSig(oldM)!==msgStatusSig(newM);
    S.sel=r.conversation;
    if(changed) updateThreadMessages();
  }catch(e){}
}

async function actOn(memberId, id, action, extra){
  var body=Object.assign({ m:memberId, id:id, action:action }, extra||{});
  try{ return await tapi('/api/team/conversation',{method:'POST',body:body}); }
  catch(e){ return { ok:false }; }
}
async function act(action, extra){
  if(!S.sel || S.busy) return;   // re-entrant guard: Doppelklick auf Status/Prio/Zuständig/Schließen ignorieren
  S.busy=true; render();
  var r=await actOn(S.sel.memberId, S.sel.id, action, extra);
  if(r.ok && r.conversation){ S.sel=r.conversation; }
  else if(r.message){ alert(r.message); }
  S.busy=false;
  if(action==='reply'){
    // Entwurf NUR bei Erfolg leeren – sonst geht der getippte Text bei einem Sende-Fehler
    // verloren, obwohl die Antwort nie zugestellt wurde (stiller Datenverlust).
    if(r.ok){
      S.draft='';
      if(r.channelUsed===null) alert('Antwort gespeichert, konnte aber weder per WhatsApp noch E-Mail zugestellt werden – es fehlen Kontaktdaten.');
      else if(r.channelFallback) alert('Konnte nicht per '+((extra&&extra.channel==='whatsapp')?'WhatsApp':'E-Mail')+' zustellen – stattdessen per '+(r.channelUsed==='whatsapp'?'WhatsApp':'E-Mail')+' verschickt.');
    } else if(!r.message){ alert('Antwort konnte nicht gesendet werden – dein Text bleibt stehen, bitte erneut senden.'); }
  }
  if(action==='note'){ if(r.ok){ S.note=''; } else if(!r.message){ alert('Notiz konnte nicht gespeichert werden – dein Text bleibt stehen.'); } }
  render();
  loadInbox();   // Liste/Badges aktualisieren
}

// Datum (yyyy-mm-dd) hübsch (dd.mm.yyyy). Leer/ungültig -> ''.
function docDate(s){ if(!s) return ''; var d=new Date(String(s).slice(0,10)+'T00:00:00Z'); if(isNaN(d)) return String(s); var p=function(n){ return (n<10?'0':'')+n; }; return p(d.getUTCDate())+'.'+p(d.getUTCMonth()+1)+'.'+d.getUTCFullYear(); }
// Dokument herunterladen: GET liefert Rohbytes (Blob) ODER {ok:true,url} ODER 404.
async function downloadDoc(memberId, docId, name){
  try{
    var opts={ headers:{} }; if(S.token) opts.headers['Authorization']='Bearer '+S.token;
    var r=await fetch('/api/team/documents?memberId='+encodeURIComponent(memberId)+'&docId='+encodeURIComponent(docId)+'&name='+encodeURIComponent(name||'dokument'), opts);
    if(r.status===401){ logout(); return; }
    var ctype=String(r.headers.get('content-type')||'');
    if(/json/i.test(ctype)){
      var j=null; try{ j=await r.json(); }catch(e){}
      if(j&&j.ok&&j.url){ window.open(j.url,'_blank','noopener'); return; }
      alert((j&&j.message)||'Dokument nicht verfügbar.'); return;
    }
    if(!r.ok){ alert('Dokument nicht verfügbar.'); return; }
    var blob=await r.blob();
    var u=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=u; a.download=name||'dokument'; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
  }catch(e){ alert('Download fehlgeschlagen.'); }
}
// Datei (aus <input type=file>) als base64 hochladen -> POST. Größencheck clientseitig (~8 MB).
function uploadDocFile(memberId, file){
  if(!file) return;
  if(file.size>8*1024*1024){ S.docUploadMsg='Datei zu groß (max. 8 MB).'; render(); return; }
  S.docUploadBusy=true; S.docUploadMsg=''; render();
  var reader=new FileReader();
  reader.onload=async function(){
    var res=String(reader.result||''); var bi=res.indexOf('base64,'); var b64=bi>=0?res.slice(bi+7):res;
    var r=null;
    try{ r=await tapi('/api/team/documents',{method:'POST',body:{ memberId:memberId, name:file.name, contentType:file.type||'application/octet-stream', base64:b64 }}); }catch(e){}
    S.docUploadBusy=false;
    if(r&&r.ok){ S.docUploadMsg=''; loadProfileDocs(memberId); }
    else { S.docUploadMsg=(r&&r.message)||'Der Upload hat nicht geklappt.'; render(); }
  };
  reader.onerror=function(){ S.docUploadBusy=false; S.docUploadMsg='Datei konnte nicht gelesen werden.'; render(); };
  reader.readAsDataURL(file);
}

// ---------- Ernährungs-Premium: Vorschau freischalten (nur Admin) ----------

async function loadMemberPreview(id){

  catch(e){ S.memberPreview=null; }
  S.memberPreviewLoading=false; scheduleRender();
}
async function nutritionPreviewAction(id, action, extra){
  if(S.memberPreviewBusy) return;
  S.memberPreviewBusy=true; S.memberPreviewMsg=''; render();
  try{
    var body=Object.assign({ id:id, action:action }, extra||{});
    var r=await tapi('/api/team/nutrition-preview', { method:'POST', body:body });
    if(r&&r.ok){ S.memberPreview=r; if(action==='grant') S.memberPreviewMsg=(extra&&extra.permanent)?'Dauerhaft gratis freigeschaltet.':'Gratis-Zugang freigeschaltet.'; else if(action==='magicline-clear') S.memberPreviewMsg='Modul-Premium in der App zurückgesetzt. Bitte das Zusatzmodul auch in Magicline kündigen.'; }
    else if(r&&r.error==='not_magicline'){ S.memberPreviewMsg='Kein Modul-Premium – nichts zurückzusetzen.'; }
    else if(r&&r.error==='has_real_subscription'){ S.memberPreview={ ok:true, tier:r.tier, source:'magicline' }; S.memberPreviewMsg='Mitglied hat Premium bereits über das Zusatzmodul – Gratis-Zugang nicht nötig.'; }
    else if(r&&r.error==='not_a_preview'){ S.memberPreviewMsg='Premium läuft über das Zusatzmodul – nutze „Modul-Premium zurücksetzen".'; }

}

function mnWeekCard(d){
  var wk=(d.week||[]).slice().reverse(); var t=d.targets||{}; var maxK=Math.max(t.kcal||2000, 1);
  (d.week||[]).forEach(function(w){ if(w.kcal>maxK) maxK=w.kcal; });

// yyyy-mm-dd-Presets für den Zeitraum. ...Silent: nur State setzen (kein render), fürs Öffnen.
function ci2(n){ return (n<10?'0':'')+n; }
function ciYmd(d){ return d.getFullYear()+'-'+ci2(d.getMonth()+1)+'-'+ci2(d.getDate()); }
function ciPresetSilent(which){

async function doMerge(c){

async function apptCancel(p, bookingId){

}
// Termin für ein Mitglied eintragen (best effort). Klappt die Open-API-Buchung nicht,
// übernimmt der Server den Wunsch als Vorgang + Studio-Benachrichtigung (via:'fallback').
// Echter Buchungs-Ablauf für ein Mitglied: Terminart -> freier Slot -> buchen.
function apptBookFor(p){
  if(!p) return;
  S.apOpen=true; S.apMemberId=p.id; S.apMemberName=p.name||'';
  S.apTypeId=''; S.apTypeTitle=''; S.apSlots=null; S.apSlotSel=null; S.apBusy=false; S.apResult=null;
  S.apTypes=null; S.apUnavail=false; S.apTypesLoading=true; render();
  tapi('/api/team/appointments?bookable=1').then(function(r){
    S.apTypesLoading=false;
    if(r&&r.ok&&r.available&&Array.isArray(r.types)&&r.types.length){ S.apTypes=r.types; }
    else { S.apTypes=[]; S.apUnavail=!(r&&r.available); }

  }).catch(function(){ S.apTypesLoading=false; S.apTypes=[]; S.apUnavail=true; render(); });
}
function closeApptBook(){ if(S.apBusy) return; var had=!!S.apResult; var pid=S.apMemberId; S.apOpen=false; S.apResult=null; if(had&&pid) openProfile(pid); else render(); }
function apChooseType(id, title){
  S.apTypeId=String(id); S.apTypeTitle=title||''; S.apSlots=null; S.apSlotSel=null; S.apSlotsLoading=true; render();
  tapi('/api/team/appointments?slotsFor='+encodeURIComponent(id)+'&memberId='+encodeURIComponent(S.apMemberId)+'&days=28').then(function(r){
    S.apSlotsLoading=false; S.apSlots=(r&&r.ok&&Array.isArray(r.slots))?r.slots:[]; render();

async function apDoBook(){
  if(S.apBusy||!S.apSlotSel||!S.apTypeId) return;
  S.apBusy=true; render();
  var s=S.apSlotSel;
  try{
    var r=await tapi('/api/team/appointments',{method:'POST',body:{ action:'book', memberId:S.apMemberId, bookableAppointmentId:S.apTypeId, start:s.start, end:s.end, instructorIds:(s.instructorIds||[]), title:S.apTypeTitle }});

// Slot-Zeit-Helfer (deutsches Format).
function slDay(iso){ var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10); return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}); }
function slTime(iso){ var d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
// Slots nach Tag gruppieren (Reihenfolge erhalten). -> [{day, items:[{i, slot}]}]
function slGroup(slots){
  var groups=[], byDay={};
  (slots||[]).forEach(function(s,i){ var k=String(s.start).slice(0,10); if(!byDay[k]){ byDay[k]={day:k,label:slDay(s.start),items:[]}; groups.push(byDay[k]); } byDay[k].items.push({i:i, slot:s}); });
  return groups;
}

// ---------- render: inbox ----------
function filtered(){
  var f=S.filter, term=(S.search||'').trim().toLowerCase();
  var list=S.convs.slice();
  if(f==='open') list=list.filter(function(c){ return c.teamStatus!=='abgeschlossen'; });
  else if(f==='neu') list=list.filter(function(c){ return c.teamStatus==='neu'; });
  else if(f==='done') list=list.filter(function(c){ return c.teamStatus==='abgeschlossen'; });
  if(term) list=list.filter(function(c){ return (c.member.name+' '+(c.member.nr||'')+' '+tm(c.type).l+' '+c.ref).toLowerCase().indexOf(term)>=0; });
  return list;
}

function rowsHTML(){
  if(S.loading && !S.convs.length) return '<div style="padding:40px;text-align:center"><span class="spin"></span></div>';
  if(S.inboxErr && !S.convs.length) return '<div style="padding:36px 22px;text-align:center"><div style="font-size:13.5px;color:#42454b;font-weight:700;margin-bottom:4px">Postfach konnte nicht geladen werden.</div><div style="font-size:12.5px;color:#8a929a;font-weight:600;margin-bottom:14px">Prüf deine Verbindung – deine Vorgänge sind sicher gespeichert.</div><button data-inboxretry="1" style="border:1.5px solid #d6dee0;background:#fff;border-radius:11px;font-size:13px;font-weight:800;padding:9px 16px;color:'+TEAL+';cursor:pointer">Erneut laden</button></div>';
  var rows=filtered();
  if(!rows.length){
    var msg = S.filter==='open' ? 'Keine offenen Vorgänge – alles erledigt! 🎉'
      : S.filter==='neu' ? 'Nichts Neues – alles in Arbeit. 👍'
      : S.filter==='done' ? 'Noch nichts abgeschlossen.'
      : 'Keine Vorgänge in diesem Filter.';
    return '<div style="padding:40px 20px;text-align:center;color:#8a929a;font-size:13.5px;font-weight:600">'+esc(msg)+'</div>';
  }
  return rows.map(function(c){
    var t=tm(c.type), st=sm(c.teamStatus), active=c.key===S.selKey;
    var checked=!!(S.selMode && S.selected && S.selected[c.key]);
    var prev=(c.lastFrom==='team'?'Team: ':c.lastFrom==='system'?'• ':'')+(c.lastText||'');
    var cbox=S.selMode?('<div style="flex-shrink:0;width:22px;height:22px;border-radius:7px;border:2px solid '+(checked?TEAL:'#c4ccce')+';background:'+(checked?TEAL:'#fff')+';display:flex;align-items:center;justify-content:center">'+(checked?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>':'')+'</div>'):'';
    return '<div class="convrow" data-open="'+esc(c.key)+'" style="padding:13px 16px;border-bottom:1px solid #f3f6f6;background:'+(checked?'#e7f1f3':(active?'#f1f6f7':'#fff'))+';border-left:3px solid '+((checked||active)?TEAL:'transparent')+'">'+
      '<div style="display:flex;align-items:center;gap:10px">'+cbox+
        '<div style="position:relative;flex-shrink:0"><div style="width:38px;height:38px;border-radius:11px;background:'+chs(c.channel).b+';color:'+chs(c.channel).c+';display:flex;align-items:center;justify-content:center">'+chic(c.channel)+'</div>'+
          (c.priority==='hoch'&&c.teamStatus!=='abgeschlossen'?'<span style="position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e2685a;border:2px solid #fff"></span>':'')+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="display:flex;align-items:center;gap:7px"><div style="flex:1;min-width:0;font-size:13.5px;font-weight:'+(c.teamUnread?'800':'700')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.member.name)+'</div>'+
            '<span style="font-size:11px;color:#a9b1b6;font-weight:600;flex-shrink:0">'+esc(rel(c.updatedAt))+'</span></div>'+
          '<div style="font-size:12.5px;color:#42454b;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.l)+' · '+esc(chan(c.channel))+'</div>'+
          '<div style="font-size:12px;color:#8a929a;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(prev)+'</div></div></div>'+

// Aktion auf alle ausgewählten Vorgänge anwenden (der Reihe nach; kein Bulk-Endpoint).
async function bulkApply(action, extra){
  var keys=selKeys(); if(!keys.length || S.bulkBusy) return;
  if(action==='status' && extra && extra.value==='abgeschlossen' && keys.length>1){ if(!window.confirm(keys.length+' Vorgänge als erledigt markieren?')) return; }
  S.bulkBusy=true; S.bulkMenu=''; render();
  var okc=0, fail=0;
  for(var i=0;i<keys.length;i++){ var c=findConv(keys[i]); if(!c){ fail++; continue; } var r=await actOn(c.memberId, c.id, action, extra); if(r&&r.ok) okc++; else fail++; }
  S.bulkBusy=false; S.selected={}; S.selMode=false; S.bulkMenu='';
  try{ await loadInbox(); }catch(e){}
  render();
  if(fail) alert(fail+' von '+keys.length+' Vorgängen konnten nicht aktualisiert werden.');
}

// ---------- Textbausteine (verwaltbare Schnellantworten) ----------
// Aktive Baustein-Liste: geladene Bausteine (auch bewusst leer) – sonst Fallback
// auf die eingebauten TEMPLATES (vor dem Laden bzw. bei Ladefehler).
function snipItems(){
  if(S.snippets) return S.snippets;
  return TEMPLATES.map(function(t){ return { id:null, text:t }; });
}
// Inhalt des aufklappbaren Vorlagen-Panels (data-tpl-Buttons + „verwalten").

  var items=snipItems();
  var rows=items.length
    ? items.map(function(tp,i){ return '<button data-tpl="'+i+'" style="text-align:left;border:1px solid #e4eaeb;background:#fff;border-radius:12px;padding:9px 12px;font-size:12.5px;color:#42454b;font-weight:600;cursor:pointer;line-height:1.45">'+esc(tp.text)+'</button>'; }).join('')
    : '<div style="font-size:12px;color:#a9b1b6;font-weight:600;padding:5px 2px">Noch keine Bausteine – lege im Verwalten-Dialog welche an.</div>';

    '<button data-managesnip="1" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:2px;border:1px dashed #cdd6d8;background:#f7fafb;color:#0a4958;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Bausteine verwalten</button>'+

          '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:9px">'+
            '<button id="snipeditcancel" style="border:1.5px solid #d6dee0;background:#fff;border-radius:10px;font-size:12.5px;font-weight:800;padding:8px 14px;color:#6b7780;cursor:pointer">Abbrechen</button>'+
            '<button id="snipeditsave" '+(S.snippetsBusy?'disabled':'')+' style="border:none;background:'+TEAL+';color:#fff;border-radius:10px;font-size:12.5px;font-weight:800;padding:8px 16px;cursor:pointer;opacity:'+(S.snippetsBusy?'.6':'1')+'">Speichern</button>'+

        '</div></div>';

    '<div style="display:flex;justify-content:flex-end;margin-top:9px">'+
      '<button id="snipadd" '+(S.snippetsBusy?'disabled':'')+' style="border:none;background:'+ORANGE+';color:#fff;border-radius:11px;font-size:13px;font-weight:800;padding:9px 18px;cursor:pointer;opacity:'+(S.snippetsBusy?'.6':'1')+'">Hinzufügen</button>'+

  return head+list+add;

// Bausteine vom Server laden; bei Fehler bleibt S.snippets=null -> TEMPLATES-Fallback.
async function loadSnippets(){
  if(S.snippetsLoading) return;
  S.snippetsLoading=true;
  try{ var r=await tapi('/api/team/snippets'); if(r && Array.isArray(r.snippets)) S.snippets=r.snippets; }
  catch(e){}
  S.snippetsLoaded=true; S.snippetsLoading=false; render();
}
// Mutation an den Server schicken; Antwort enthält immer die frische Liste.
async function snipMutate(body){
  S.snippetsBusy=true; render();
  var r=null;
  try{ r=await tapi('/api/team/snippets',{method:'POST',body:body}); }catch(e){}
  if(r && Array.isArray(r.snippets)) S.snippets=r.snippets;
  S.snippetsBusy=false; S.snippetsLoaded=true;
  if(r && r.ok===false && r.message) alert(r.message);
  return r;
}
async function addSnip(text){ var t=(text||'').trim(); if(!t) return; await snipMutate({action:'add', text:t}); S.snipNew=''; render(); }
async function updateSnip(id, text){ var t=(text||'').trim(); if(!t||!id) return; await snipMutate({action:'update', id:id, text:t}); S.snipEdit=null; render(); }
async function deleteSnip(id){ if(!id) return; if(!window.confirm('Diesen Baustein wirklich löschen?')) return; await snipMutate({action:'delete', id:id}); if(S.snipEdit && String(S.snipEdit.id)===String(id)) S.snipEdit=null; render(); }

function wireInbox(node){
  var is=node.querySelector('#isearch'); if(is) is.oninput=function(){ S.search=is.value; var c=node.querySelector('#convrows'); if(c){ c.innerHTML=rowsHTML(); wireRows(c); } };
  node.querySelectorAll('[data-filter]').forEach(function(b){ b.onclick=function(){ S.filter=b.getAttribute('data-filter'); render(); }; });
  // Mehrfachauswahl + Sammelaktionen
  var smb=node.querySelector('[data-selmode]'); if(smb) smb.onclick=function(){ S.selMode=true; S.selected={}; S.bulkMenu=''; render(); };
  var sax=node.querySelector('[data-selall]'); if(sax) sax.onclick=bulkSelectAll;
  var snx=node.querySelector('[data-selnone]'); if(snx) snx.onclick=bulkClear;
  var sex=node.querySelector('[data-selexit]'); if(sex) sex.onclick=exitSelMode;
  var bmn=node.querySelector('[data-bulkmenu]'); if(bmn) bmn.onclick=function(){ var m=bmn.getAttribute('data-bulkmenu'); S.bulkMenu=(S.bulkMenu===m?'':m); render(); };
  node.querySelectorAll('[data-bulkstatus]').forEach(function(b){ b.onclick=function(){ bulkApply('status',{value:b.getAttribute('data-bulkstatus')}); }; });
  node.querySelectorAll('[data-bulkassignid]').forEach(function(b){ b.onclick=function(){ bulkApply('assign',{assigneeId:b.getAttribute('data-bulkassignid')||null, assigneeName:b.getAttribute('data-bulkassignname')||null}); }; });
  wireRows(node);
  var back=node.querySelector('[data-back]'); if(back) back.onclick=function(){ S.mobileThread=false; render(); };
  var pt=node.querySelector('[data-panel]'); if(pt) pt.onclick=function(){ S.panelOpen=!S.panelOpen; render(); };
  var dr=node.querySelector('#draft'); if(dr){ asGrow(dr); dr.oninput=function(){ S.draft=dr.value; asGrow(dr); var sb=node.querySelector('#send'); if(sb) sb.style.background=(dr.value.trim()?TEAL:'#9fb4b8'); };
    dr.onkeydown=function(e){ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); sendReply(); } }; }
  var sd=node.querySelector('#send'); if(sd) sd.onclick=sendReply;
  node.querySelectorAll('[data-ch]').forEach(function(b){ b.onclick=function(){ S.replyChannel=b.getAttribute('data-ch'); render(); }; });
  var aid=node.querySelector('[data-aidraft]'); if(aid) aid.onclick=suggestReply;
  var qk=node.querySelector('[data-quick]'); if(qk) qk.onclick=function(){ S.quickOpen=!S.quickOpen; if(S.quickOpen && !S.snippetsLoaded) loadSnippets(); render(); };
  node.querySelectorAll('[data-tpl]').forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute('data-tpl'); var items=snipItems(); var tp=(items[i]&&items[i].text)||''; S.draft=(S.draft&&S.draft.trim())?(S.draft.replace(/\s+$/,'')+'\n\n'+tp):tp; S.quickOpen=false; render(); var d=root.querySelector('#draft'); if(d){ asGrow(d); d.focus(); d.setSelectionRange(d.value.length,d.value.length); } }; });
  // Textbausteine verwalten (Dialog)
  var msb=node.querySelector('[data-managesnip]'); if(msb) msb.onclick=function(){ S.manageOpen=true; S.snipEdit=null; if(!S.snippetsLoaded) loadSnippets(); render(); };
  var scl=node.querySelector('[data-snipclose]'); if(scl) scl.onclick=function(){ S.manageOpen=false; S.snipEdit=null; render(); };
  var snn=node.querySelector('#snipnew'); if(snn) snn.oninput=function(){ S.snipNew=snn.value; };
  var sna=node.querySelector('#snipadd'); if(sna) sna.onclick=function(){ addSnip(S.snipNew); };
  node.querySelectorAll('[data-snipedit]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-snipedit'); var it=(S.snippets||[]).filter(function(s){ return String(s.id)===String(id); })[0]; S.snipEdit={id:id, text:it?it.text:''}; render(); }; });
  node.querySelectorAll('[data-snipdelete]').forEach(function(b){ b.onclick=function(){ deleteSnip(b.getAttribute('data-snipdelete')); }; });
  var seb=node.querySelector('#snipeditbox'); if(seb) seb.oninput=function(){ if(S.snipEdit) S.snipEdit.text=seb.value; };
  var ses=node.querySelector('#snipeditsave'); if(ses) ses.onclick=function(){ if(S.snipEdit) updateSnip(S.snipEdit.id, S.snipEdit.text); };
  var sec=node.querySelector('#snipeditcancel'); if(sec) sec.onclick=function(){ S.snipEdit=null; render(); };
  var nt=node.querySelector('#note'); if(nt){ asGrow(nt); nt.oninput=function(){ S.note=nt.value; asGrow(nt); }; }
  var an=node.querySelector('#addnote'); if(an) an.onclick=function(){ var v=(S.note||'').trim(); if(v) act('note',{text:v}); };
  node.querySelectorAll('[data-status]').forEach(function(b){ b.onclick=function(){ act('status',{value:b.getAttribute('data-status')}); }; });
  node.querySelectorAll('[data-prio]').forEach(function(b){ b.onclick=function(){ act('priority',{value:b.getAttribute('data-prio')}); }; });

// KI-Antwortentwurf holen und ins Antwortfeld (#draft) setzen – gesendet wird nichts automatisch.
async function suggestReply(){
  if(!S.sel || S.aiBusy) return;
  var memberId=S.sel.memberId, id=S.sel.id;
  S.aiBusy=true; render();
  var r;
  try{ r=await tapi('/api/team/suggest-reply',{method:'POST',body:{memberId:memberId, id:id}}); }
  catch(e){ r={ok:false}; }
  S.aiBusy=false;
  if(r && r.ok && r.draft){
    // nur einfügen, wenn noch derselbe Vorgang offen ist. Bereits getippten Text NICHT
    // überschreiben – den KI-Vorschlag anhängen (sonst geht die Handarbeit verloren).
    if(S.sel && S.sel.memberId===memberId && String(S.sel.id)===String(id)){ var cur=(S.draft||'').trim(); S.draft=cur?(cur+'\n\n'+r.draft):r.draft; S.quickOpen=false; }
  } else if(r && r.error==='no_ai'){
    S.aiUnavailable=true;
  } else {
    alert((r&&r.message)||'KI-Entwurf konnte nicht erstellt werden.');
  }
  render();
  var d=root.querySelector('#draft'); if(d && r && r.ok){ asGrow(d); d.focus(); d.setSelectionRange(d.value.length,d.value.length); }
}

async function saveMember(id){
  if(S.editBusy) return;
  var g=function(i){ var e=document.getElementById(i); return e?e.value.trim():''; };
  var body={ id:id, street:g('ed_street'), houseNumber:g('ed_house'), zipCode:g('ed_zip'), city:g('ed_city') };
  if(!body.street||!body.zipCode||!body.city){ S.editMsg='Bitte Straße, PLZ und Ort ausfüllen.'; render(); return; }
  S.editBusy=true; S.editMsg=''; render();
  try{
    var r=await tapi('/api/team/member-update',{method:'POST',body:body});
    S.editBusy=false;
    if(r&&r.ok){ S.editMember=false; openProfile(id); }
    else { S.editMsg=(r&&r.message)||'Konnte nicht gespeichert werden.'; render(); }
  }catch(e){ S.editBusy=false; S.editMsg='Verbindung fehlgeschlagen.'; render(); }
}
// DSGVO: Mitglied anonymisieren – zweistufige Bestätigung (Warn-Dialog + exakte
// Eingabe der Mitgliedsnummer), erst dann geht der Aufruf an Magicline.
async function anonymiseMember(p){
  if(!p || !p.id) return;
  if(!window.confirm('Mitglied „'+p.name+'“ wirklich anonymisieren?\n\nACHTUNG: Dieser Schritt ist unwiderruflich. Alle personenbezogenen Daten werden in Magicline anonymisiert und können nicht wiederhergestellt werden.')) return;
  var nr=p.nr!=null?String(p.nr):'';
  if(!nr){ alert('Keine Mitgliedsnummer vorhanden – Anonymisierung hier nicht möglich.'); return; }
  var typed=window.prompt('Zur Bestätigung bitte die Mitgliedsnummer exakt eintippen ('+nr+'):','');
  if(typed==null) return;
  if(typed.trim()!==nr){ alert('Die Eingabe stimmt nicht mit der Mitgliedsnummer überein – Vorgang abgebrochen.'); return; }
  try{
    var r=await tapi('/api/team/member-update',{method:'POST',body:{id:p.id, action:'anonymise'}});
    if(r&&r.ok){
      alert('Mitglied wurde anonymisiert.');
      S.profile=null; S.membersLoaded=false; S.screen='members'; loadMembers();
    } else {
      alert((r&&r.message)||'Anonymisierung fehlgeschlagen.');
    }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}

function apptsNode(){

  var node=el('<div class="scrl" style="flex:1;min-height:0;overflow-y:auto;padding:24px 28px 40px"></div>');

  var studioCard=(S.studioApptsAvailable && S.studioAppts)
    ? '<div style="background:#fff;border-radius:18px;box-shadow:0 10px 28px rgba(4,33,40,.07);padding:18px 20px;margin-bottom:18px">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="width:9px;height:9px;border-radius:50%;background:'+TEAL+'"></span><div style="font-size:15px;font-weight:900;letter-spacing:-.3px;color:#15171B">Termine diese Woche</div><span style="font-size:12px;font-weight:800;color:#2f7d8c;background:#e7f1f3;border-radius:100px;padding:3px 11px">'+S.studioAppts.length+'</span></div>'+
        (S.studioAppts.length
          ? S.studioAppts.slice(0,40).map(function(a){ return '<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid #f0f3f4"><span style="flex:1;font-size:13.5px;font-weight:700;color:#15171B">'+esc(a.title)+'</span><span style="font-size:12.5px;color:#8a929a;font-weight:600">'+esc(fmtDT(a.start))+'</span></div>'; }).join('')
          : '<div style="font-size:12.5px;color:#a9b1b6;font-weight:600;padding:4px 0">Diese Woche keine Termine.</div>')+
      '</div>'

    var first=(c.member.name||'').split(' ')[0]||'';
    return '<div style="background:#fff;border-radius:18px;box-shadow:0 10px 28px rgba(4,33,40,.07);padding:16px 18px">'+
      '<div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(165deg,#0e6072,#063540);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;letter-spacing:-.3px;flex-shrink:0">'+esc(c.member.initials||'·')+'</div>'+

        '<span style="font-size:11px;font-weight:800;color:'+sm(c.teamStatus).c+';background:'+sm(c.teamStatus).b+';border-radius:100px;padding:5px 11px;flex-shrink:0">'+sm(c.teamStatus).l+'</span></div>'+
      '<div style="margin-top:12px;background:#f4f7f7;border-radius:13px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:#2a3338">'+esc(c.lastText||'Terminwunsch')+'</div>'+
      (c.teamStatus!=='abgeschlossen'?
        '<div style="display:flex;gap:8px;margin-top:13px"><button data-confirm="'+esc(c.key)+'" data-first="'+esc(first)+'" style="flex:1;padding:10px;border:none;border-radius:11px;background:#0a4958;color:#fff;font-size:13px;font-weight:800;cursor:pointer">Bestätigen</button>'+
        '<button data-decline="'+esc(c.key)+'" data-first="'+esc(first)+'" style="flex:1;padding:10px;border:1.5px solid #e3b8b1;border-radius:11px;background:#fff;color:#b5402f;font-size:13px;font-weight:800;cursor:pointer">Ablehnen</button>'+
        '<button data-open="'+esc(c.key)+'" style="padding:10px 13px;border:1.5px solid #d6dee0;border-radius:11px;background:#fff;color:#0a4958;font-size:13px;font-weight:800;cursor:pointer">Postfach</button></div>'

// Anonymen, kopierfertigen Report für den Chat mit Claude bauen (ein Feedback).
function fbReport(f){
  var cat=(FB_CAT[f.category]||FB_CAT.sonstiges); var m=f.meta||{}; var L=[];
  L.push('[App-Feedback · '+cat[1]+']');
  if(fbDate(f.ts)) L.push('Datum: '+fbDate(f.ts));
  L.push(''); L.push(String(f.text||'').trim()); L.push('');
  L.push('Technisch (anonym, nur zur Fehlersuche):');
  var tech=[];
  if(m.platform||m.appMode) tech.push('Plattform: '+(m.platform||'?')+(m.appMode?(' · Modus: '+m.appMode):''));
  if(m.device||m.os) tech.push('Gerät: '+(m.device||'?')+(m.os?(' · System: '+m.os):''));
  if(m.screen||m.viewport) tech.push('Bereich: '+(m.screen||'?')+(m.viewport?(' · Ansicht: '+m.viewport):'')+(m.dpr?(' · DPR: '+m.dpr):''));
  var lo=[]; if(m.lang) lo.push('Sprache: '+m.lang); if(m.theme) lo.push('Theme: '+m.theme); if(m.online!=null) lo.push('Online: '+(m.online?'ja':'nein')); if(lo.length) tech.push(lo.join(' · '));
  if(m.ua) tech.push('UA: '+m.ua);
  tech.forEach(function(t){ L.push('- '+t); });
  return L.join('\n');
}

// ---------- Kassenbuch (Barkasse, nur Admin) ----------
// Bildet die Excel-Vorlage nach: pro Tag verkaufte Artikel + Sonstiges + Ausgaben;
// Einnahmen/Bestand werden live berechnet (Spiegel von lib/kassenbuch.js). Monate werden
// gespeichert, sind abrufbar, FINN prüft steuerlich/plausibel, PDF-Export + Druck, Abschluss.
var KB_ART=['kaffee','eiweissshake','eiweissbeutel'];
var KB_PDEF={kaffee:1.5,eiweissshake:2.5,eiweissbeutel:20.5};
var KB_MON=['','Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function kbNum(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n)?n:0; }
function kbInt(v){ var n=parseInt(String(v==null?'':v).replace(',','.'),10); return isFinite(n)&&n>0?n:0; }
function kbR2(n){ return Math.round((Number(n)||0)*100)/100; }
function kbEuro(n){ return kbR2(n).toFixed(2).replace('.',',')+' €'; }
function kbMonthLabel(key){ var p=String(key||'').split('-'); if(p.length<2) return String(key||''); return (KB_MON[parseInt(p[1],10)]||p[1])+' '+p[0]; }
function kbDaysInMonth(y,m){ var d=new Date(Date.UTC(y,m,0)).getUTCDate(); return (d>=28&&d<=31)?d:31; }
// Reine Berechnung – identisch zur Server-Logik, für die sofortige Live-Vorschau.
function kbCompute(m){
  m=m||{};
  var prices={}; KB_ART.forEach(function(a){ var p=kbR2(kbNum((m.prices||{})[a])); prices[a]=p>0?p:KB_PDEF[a]; });
  var days=m.days||{}, anfang=kbR2(kbNum(m.anfangsbestand)), running=anfang, sumEin=0, sumAus=0, rows=[];
  for(var d=1;d<=31;d++){
    var e=days[String(d)]||{};
    var kaffee=kbInt(e.kaffee), shake=kbInt(e.eiweissshake), beutel=kbInt(e.eiweissbeutel);
    var sonst=Math.max(0,kbR2(kbNum(e.sonstigesBetrag))), aus=Math.max(0,kbR2(kbNum(e.ausgaben)));
    var einn=kbR2(kaffee*prices.kaffee+shake*prices.eiweissshake+beutel*prices.eiweissbeutel+sonst);
    var parts=[]; if(kaffee) parts.push(kaffee+' Kaffee'); if(shake) parts.push(shake+' Eiweißshake'); if(beutel) parts.push(beutel+' Eiweißbeutel');
    if(e.sonstigesText&&String(e.sonstigesText).trim()) parts.push(String(e.sonstigesText).trim());
    var ausText=(e.ausgabenText&&String(e.ausgabenText).trim())?String(e.ausgabenText).trim():'';
    var hasEntry=!!(kaffee||shake||beutel||sonst||aus||parts.length||ausText);
    running=kbR2(running+einn-aus); sumEin=kbR2(sumEin+einn); sumAus=kbR2(sumAus+aus);
    rows.push({day:d,kaffee:kaffee,eiweissshake:shake,eiweissbeutel:beutel,sonstigesText:(e.sonstigesText||''),sonstigesBetrag:sonst,einnahmen:einn,ausgaben:aus,beschreibung:parts.join(' + '),ausgabenText:ausText,bestand:running,hasEntry:hasEntry});
  }
  var ent=rows.filter(function(r){return r.hasEntry;}).length;
  // Archiv-/Import-Monat: erfasste Summen sind maßgeblich (Spiegel der Server-Logik).
  if(m.imported && !ent){
    var ie=kbR2(kbNum(m.imported.sumEinnahmen)), ia=kbR2(kbNum(m.imported.sumAusgaben));
    var endI=(m.imported.endbestand==null)?kbR2(anfang+ie-ia):kbR2(kbNum(m.imported.endbestand));
    var gezI=(m.gezaehlterEndbestand===''||m.gezaehlterEndbestand==null)?null:kbR2(kbNum(m.gezaehlterEndbestand));
    return {prices:prices,anfangsbestand:anfang,rows:rows,sumEinnahmen:ie,sumAusgaben:ia,endbestand:endI,gezaehlterEndbestand:gezI,differenz:gezI==null?null:kbR2(gezI-endI),kontrolleOk:gezI==null?true:Math.abs(kbR2(gezI-endI))<0.005,entriesCount:0,imported:true};
  }
  var end=kbR2(anfang+sumEin-sumAus);
  var gez=(m.gezaehlterEndbestand===''||m.gezaehlterEndbestand==null)?null:kbR2(kbNum(m.gezaehlterEndbestand));
  var diff=gez==null?null:kbR2(gez-end);
  return {prices:prices,anfangsbestand:anfang,rows:rows,sumEinnahmen:kbR2(sumEin),sumAusgaben:kbR2(sumAus),endbestand:end,gezaehlterEndbestand:gez,differenz:diff,kontrolleOk:diff==null?true:Math.abs(diff)<0.005,entriesCount:ent};
}
// Server-Monat -> editierbarer Entwurf (Zahlen als Eingabetexte, 0 wird zu leer).
function kbSeedDraft(c){
  c=c||{};
  var sInt=function(v){ v=kbInt(v); return v?String(v):''; };
  var sEur=function(v){ v=kbNum(v); return v?String(v).replace('.',','):''; };
  var days={}, src=c.days||{};
  Object.keys(src).forEach(function(k){ var e=src[k]||{}; days[k]={kaffee:sInt(e.kaffee),eiweissshake:sInt(e.eiweissshake),eiweissbeutel:sInt(e.eiweissbeutel),sonstigesText:e.sonstigesText||'',sonstigesBetrag:sEur(e.sonstigesBetrag),ausgaben:sEur(e.ausgaben),ausgabenText:e.ausgabenText||'',belegOk:!!e.belegOk}; });
  var pr=c.prices||{};
  return { blattNr:c.blattNr||'', anfangsbestand:sEur(c.anfangsbestand),
    gezaehlterEndbestand:(c.gezaehlterEndbestand===''||c.gezaehlterEndbestand==null)?'':sEur(c.gezaehlterEndbestand),
    prices:{kaffee:sEur(pr.kaffee||KB_PDEF.kaffee),eiweissshake:sEur(pr.eiweissshake||KB_PDEF.eiweissshake),eiweissbeutel:sEur(pr.eiweissbeutel||KB_PDEF.eiweissbeutel)},
    days:days };
}

      S.kbDraft=kbSeedDraft(r.current); S.kbDirty=false; S.kbMsg='';

    } else S.kbErr=!S.kb;

function kbSetField(day,field,val){

async function kbSave(silent){

    var r=await tapi('/api/team/kassenbuch',{method:'POST',body:{action:'suggest',month:S.kbMonth}});
    if(r && r.ok && r.suggest && r.suggest.carried){
      var s=r.suggest;

async function kbApplyFix(idx){

  if(!f||!f.aktion||f._done||S.kbBusy) return;
  if(S.kb&&S.kb.closed){ S.kbMsg='Der Monat ist abgeschlossen – bitte zuerst „Wieder öffnen".'; render(); return; }
  if(!S.kbHasStore){ S.kbMsg='Speicher nicht aktiv – Vorschlag kann nicht übernommen werden.'; render(); return; }

  if(a.typ==='dayText'){ var k=String(a.tag); S.kbDraft.days=S.kbDraft.days||{}; S.kbDraft.days[k]=S.kbDraft.days[k]||{}; S.kbDraft.days[k][a.feld]=a.text; }

  if(okS){ f._done=true; S.kbMsg='Vorschlag übernommen und gespeichert.'; } else S.kbMsg='Konnte nicht übernehmen.';
  render();
}

// ── Beleg scannen / hochladen / anhängen ──
function kbBelegFile(file){
  if(!file || S.kbBelegBusy) return;
  var okType=/^image\//.test(file.type)||file.type==='application/pdf';
  if(!okType){ S.kbMsg='Bitte ein Foto oder PDF wählen.'; render(); return; }
  if(file.size>12*1024*1024){ S.kbMsg='Datei zu groß (max. 12 MB).'; render(); return; }
  S.kbBelegBusy='scan'; S.kbMsg=''; render();
  kbBelegCompress(file,function(dataUrl,mime){
    if(!dataUrl){ S.kbBelegBusy=''; S.kbMsg='Datei konnte nicht gelesen werden.'; render(); return; }
    kbBelegDoScan(dataUrl,mime);
  });
}
function kbBelegCompress(file,cb){
  try{
    var fr=new FileReader();
    fr.onload=function(){
      if(file.type==='application/pdf'){ cb(fr.result,'application/pdf'); return; }
      var img=new Image();
      img.onload=function(){
        try{
          var mx=1500,w=img.width,h=img.height;
          if(w>mx||h>mx){ var s=Math.min(mx/w,mx/h); w=Math.round(w*s); h=Math.round(h*s); }
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          cb(c.toDataURL('image/jpeg',0.72),'image/jpeg');
        }catch(e){ cb(fr.result,file.type||'image/jpeg'); }
      };
      img.onerror=function(){ cb(fr.result,file.type||'image/jpeg'); };
      img.src=fr.result;
    };
    fr.onerror=function(){ cb(null); };
    fr.readAsDataURL(file);
  }catch(e){ cb(null); }
}
async function kbBelegDoScan(dataUrl){
  var scan=null;

    if(r&&r.ok&&r.scan) scan=r.scan; else { S.kbBelegBusy=''; S.kbMsg=(r&&r.message)||'Der Beleg konnte nicht gelesen werden.'; render(); return; }
  }catch(e){ S.kbBelegBusy=''; S.kbMsg='Verbindung fehlgeschlagen.'; render(); return; }
  S.kbBelegScan={ image:dataUrl, kind:scan.kind, date:scan.date, amount:scan.amount, vendor:scan.vendor, note:scan.note, confidence:scan.confidence, day:kbBelegDayFromDate(scan.date) };
  S.kbBelegBusy=''; render();
}
function kbBelegDayFromDate(iso){
  var cur=S.kb||{}, y=cur.year, m=cur.month;
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))){ var p=iso.split('-'); if(parseInt(p[0],10)===y && parseInt(p[1],10)===m){ var d=parseInt(p[2],10); if(d>=1&&d<=31) return d; } }
  var now=new Date(); if(now.getFullYear()===y && (now.getMonth()+1)===m) return now.getDate();
  return 1;
}

function todoInitials(nm){ var p=String(nm||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '·'; return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }
function todoDueLabel(due){ var m=String(due||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?(m[3]+'.'+m[2]+'.'+m[1]):''; }
function todoDueState(due){
  var m=String(due||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
  var d=new Date(m[1]+'-'+m[2]+'-'+m[3]+'T00:00:00'); var today=new Date(); today.setHours(0,0,0,0);
  var diff=Math.round((d-today)/86400000);
  return { label:todoDueLabel(due), overdue:diff<0, soon:diff>=0&&diff<=2, diff:diff };
}

// Eigener Store (lib/shifts.js, Upstash) – bewusst ohne Magicline-Abhängigkeit.
// UI 1:1 nach Design-Vorgabe (Phone-Layout, zentrierte Spalte max. 520px).
var SH_ROLES={ theke:{label:'Theke',chipColor:'#2f6fd6',chipBg:'#E7F0FB',accent:'#F6A964'},
  flaeche:{label:'Fläche',chipColor:'#176b37',chipBg:'#E7F6EC',accent:'#0e6072'},
  kurs:{label:'Kurs',chipColor:'#6b4fd8',chipBg:'#EFEBFB',accent:'#8E7BF0'} };
function shRole(r){ return SH_ROLES[r]||SH_ROLES.theke; }
var SH_DOW=['So','Mo','Di','Mi','Do','Fr','Sa'];
var SH_DOWFULL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function shPad(n){ return (n<10?'0':'')+n; }
function shParse(iso){ var m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return new Date(); return new Date(+m[1],+m[2]-1,+m[3]); }
function shISO(d){ return d.getFullYear()+'-'+shPad(d.getMonth()+1)+'-'+shPad(d.getDate()); }
function shToday(){ return shISO(new Date()); }
function shMonday(iso){ var d=shParse(iso||shToday()); d.setDate(d.getDate()-((d.getDay()+6)%7)); return shISO(d); }
function shAddDays(iso,n){ var d=shParse(iso); d.setDate(d.getDate()+n); return shISO(d); }
function shWeekDates(){ var out=[],mon=S.shWeek||shMonday(); for(var i=0;i<7;i++) out.push(shAddDays(mon,i)); return out; }
// ISO-Kalenderwoche (Donnerstags-Regel) fürs "KW n"-Label.
function shKW(iso){ var d=shParse(iso); var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var firstThu=new Date(t.getFullYear(),0,4);
  firstThu.setDate(firstThu.getDate()+3-((firstThu.getDay()+6)%7));
  return 1+Math.round((t-firstThu)/604800000); }
function shDM(iso){ var d=shParse(iso); return shPad(d.getDate())+'.'+shPad(d.getMonth()+1)+'.'; }
function shStr(sh){ return SH_DOW[shParse(sh.date).getDay()]+' '+shDM(sh.date)+' · '+sh.start+'–'+sh.end+' '+shRole(sh.role).label; }
function shInitials(nm){ var p=String(nm||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }
function shFirstName(nm){ return String(nm||'').split(' ')[0]||''; }
function shMe(){ return (S.shData&&S.shData.me)||{employeeId:null,name:'Team',role:'admin',initials:'FI'}; }
function shFindShift(id){ var found=null; (((S.shData||{}).days)||[]).forEach(function(x){ (x.shifts||[]).forEach(function(sh){ if(String(sh.id)===String(id)) found=sh; }); }); return found; }
function shSunIcon(sz){ return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="#F6A964" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6l1.5 1.5M18 18l-1.5-1.5M6 18l1.5-1.5M18 6l-1.5 1.5"/></svg>'; }

// ---- Laden ----
async function loadShifts(){
  if(!S.shWeek) S.shWeek=shMonday(shToday());
  if(S.shLoading) return;
  S.shLoading=true; render();
  try{
    var r=await tapi('/api/team/shifts?week='+encodeURIComponent(S.shWeek));
    if(r && r.days){ S.shData=r; }
    S.shLoaded=true;
  }catch(e){}
  if(!S.shDay || shMonday(S.shDay)!==S.shWeek){ var t=shToday(); S.shDay=(shMonday(t)===S.shWeek)?t:S.shWeek; }
  S.shLoading=false; render();
}
async function loadShSwaps(){
  S.shSwapLoading=true; render();
  loadShThreads();
  try{ var r=await tapi('/api/team/swap?week='+encodeURIComponent(S.shWeek||shMonday())); if(r && r.incoming!==undefined){ S.shSwap=r; } }catch(e){}
  S.shSwapLoading=false; render();
}
async function loadShThreads(){
  try{ var r=await tapi('/api/team/tchat'); if(r && r.ok){ S.shThreads=r.threads||[]; S.shChatMe=r.me||S.shChatMe; render(); } }catch(e){}
}

// Mutation an /api/team/shifts; Server antwortet mit der frischen Woche.
async function shPost(body){
  body=body||{}; body.week=S.shWeek||shMonday();

    var r=await tapi('/api/team/shifts',{method:'POST',body:body});
    if(r && r.days){ S.shData=r; }

    return r;
  }catch(e){ alert('Verbindung fehlgeschlagen.'); return null; }
}

// KI-Planung: Phase 1 (~1,6 s Puls-Schritte) parallel zum echten plan-Call.
function shRunKi(){
  if(S.shKiOpen) return;
  S.shKiOpen=true; S.shKiPhase='think'; S.shKiResult=null; render();
  var minWait=new Promise(function(res){ setTimeout(res,1600); });
  var call=tapi('/api/team/shifts',{method:'POST',body:{action:'plan',week:S.shWeek||shMonday()}}).catch(function(){ return null; });
  Promise.all([call,minWait]).then(function(rr){
    if(!S.shKiOpen) return;
    var r=rr[0];
    S.shKiResult=(r&&r.ok)?r:{proposals:[],leftover:[],summary:'Der Vorschlag konnte nicht erstellt werden. Bitte später erneut versuchen.'};
    S.shKiPhase='result'; render();
  });
}
function shCloseKi(){ if(S.shKiBusy) return; S.shKiOpen=false; S.shKiPhase=''; S.shKiResult=null; render(); }
async function shAcceptKi(){
  var r=S.shKiResult;
  if(!r || !(r.proposals||[]).length){ shCloseKi(); return; }
  if(S.shKiBusy) return;
  S.shKiBusy=true; render();
  await shPost({action:'apply',assignments:r.proposals.map(function(p){ return {shiftId:p.shiftId, employee:p.employee}; })});
  S.shKiBusy=false; shCloseKi();
}

function shEdAssignee(){
  if(!S.shEdWho) return null;

  for(var j=0;j<(S.shEdApplicants||[]).length;j++){ var a=S.shEdApplicants[j]; if(String(a.id)===String(S.shEdWho)) return {id:String(a.id),name:a.name,initials:a.initials||shInitials(a.name)}; }

// ---- Direktnachricht an ein Mitglied (Compose-Dialog aus dem Profil) ----
// Zugangs-Info (Willkommen + Anmelde-Hinweis) per E-Mail ans Mitglied schicken –
// v. a. für frisch (auch in Magicline) abgeschlossene Mitglieder, ein Klick.
// Support-Login: sich zu Support-Zwecken direkt im Mitgliederbereich des Mitglieds
// anmelden. Holt einen kurzlebigen Einmal-Login-Link (Server, nur Admin) und öffnet
// ihn in einem neuen Tab. Das Popup wird SYNCHRON vor dem await geöffnet, sonst
// blockiert der Popup-Blocker den erst nach der Antwort gesetzten window.open.
async function loginAsMember(p){
  if(!p||!p.id) return;
  if(!confirm('Zu Support-Zwecken direkt im Mitgliederbereich von '+(p.name||'diesem Mitglied')+' anmelden?\n\nDu übernimmst dabei die Sicht des Mitglieds. Die Anmeldung wird protokolliert.')) return;
  var w=null; try{ w=window.open('', '_blank'); }catch(e){}
  if(w){ try{ w.document.write('<!doctype html><meta charset="utf-8"><title>Anmeldung …</title><body style="font-family:system-ui;padding:40px;color:#0a4958">Mitglieder-Login wird vorbereitet …</body>'); }catch(e){} }
  try{
    var r=await tapi('/api/team/impersonate',{method:'POST',body:{id:p.id}});
    if(r && r.ok && r.url){ if(w){ w.location.href=r.url; } else { window.open(r.url,'_blank'); } }
    else { if(w){ try{ w.close(); }catch(e){} } alert((r&&r.message)||'Login als Mitglied ist gerade nicht möglich.'); }
  }catch(e){ if(w){ try{ w.close(); }catch(_e){} } alert('Verbindung fehlgeschlagen.'); }
}
async function sendAccessInfo(p){
  if(!p||!p.id) return;
  if(!p.email){ alert('Für dieses Mitglied ist keine E-Mail hinterlegt.'); return; }
  if(!confirm('Zugangs-Info (Anmeldung zum Mitgliederbereich) an '+p.email+' senden?')) return;
  try{
    var r=await tapi('/api/team/access-info',{method:'POST',body:{id:p.id}});
    if(r && r.ok && r.sent){ alert('Zugangs-Info wurde an '+(r.email||p.email)+' gesendet.'); }
    else { alert((r&&r.message)||'Konnte nicht gesendet werden.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}

// ---------- Rückhol-Angebot senden (Admin) – ECHTES Angebot mit rechtssicherem Annahme-Link ----------
// Öffnet sich aus dem Mitglieds-Profil. Nur Leistungen im Rahmen; Server prüft nochmals hart.
function openRho(p){
  S.rhoMemberId=p.id; S.rhoName=p.name; S.rhoBusy=false; S.rhoResult=null; S.rhoMsg='';
  S.rhoDisc=0; S.rhoDiscWk=0; S.rhoFree=0; S.rhoWaive=false; S.rhoPause=0; S.rhoMsgEdited=false;
  S.rhoFrame=S.wbFrame||null; S.rhoSuggesting=false; S.rhoOpen=true; render();
  var suggest=function(){
    if(!S.rhoFrame||!S.rhoFrame.active) return;   // ohne aktiven Rahmen kein Vorschlag
    S.rhoSuggesting=true; render();
    tapi('/api/team/retention',{method:'POST',body:{action:'suggest-offer',memberId:p.id,memberName:p.name}}).then(function(r){
      S.rhoSuggesting=false;
      if(r&&r.ok && S.rhoOpen && S.rhoMemberId===p.id){ var d=r.details||{}; S.rhoDisc=d.discountPct||0; S.rhoDiscWk=d.discountWeeks||0; S.rhoFree=d.freeWeeks||0; S.rhoWaive=!!d.waiveActivation; S.rhoPause=d.pauseWeeks||0; if(r.message) S.rhoMsg=r.message; }
      render();
    }).catch(function(){ S.rhoSuggesting=false; render(); });
  };
  if(!S.rhoFrame){ tapi('/api/team/retention').then(function(r){ if(r&&r.ok){ S.wbFrame=r.frame; S.rhoFrame=r.frame; } render(); suggest(); }).catch(function(){ render(); }); }
  else suggest();
}
function closeRho(){ if(S.rhoBusy) return; S.rhoOpen=false; S.rhoResult=null; render(); }
function rhoSend(){
  if(S.rhoBusy||!S.rhoMemberId) return;
  var details={ discountPct:S.rhoDisc||0, discountWeeks:S.rhoDiscWk||0, freeWeeks:S.rhoFree||0, waiveActivation:!!S.rhoWaive, pauseWeeks:S.rhoPause||0 };
  if(!details.discountPct && !details.freeWeeks && !details.waiveActivation && !details.pauseWeeks){ alert('Bitte mindestens eine Leistung auswählen.'); return; }
  S.rhoBusy=true; render();
  tapi('/api/team/retention',{method:'POST',body:{action:'create-offer',memberId:S.rhoMemberId,memberName:S.rhoName,message:S.rhoMsg||'',details:details}}).then(function(r){
    S.rhoBusy=false;
    if(r&&r.ok){ S.rhoResult=r; }
    else if(r&&r.error==='out_of_frame'){ alert('Über dem Rahmen:\n'+((r.violations||[]).join('\n'))); }
    else { alert((r&&r.message)||'Angebot konnte nicht erstellt werden.'); }
    render();
  }).catch(function(){ S.rhoBusy=false; alert('Verbindung fehlgeschlagen.'); render(); });
}

function pxDE(iso){ if(!iso) return '—'; var s=String(iso).slice(0,10); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?(m[3]+'.'+m[2]+'.'+m[1]):s; }
function pxUnitLabel(u,n){ u=String(u||'WEEK').toUpperCase(); if(u==='MONTH') return n===1?'Monat':'Monate'; if(u==='DAY') return n===1?'Tag':'Tage'; return n===1?'Woche':'Wochen'; }
// Voraussichtliches Ende (Schätzung – das echte Ende liefert Magicline beim Anlegen).
function pxEndISO(){
  var cfg=S.pxCfg||{}, u=String(cfg.temporalUnit||'WEEK').toUpperCase(), t=S.pxTerm||1, s=S.pxStart;
  if(!s) return ''; var d=new Date(s+'T00:00:00Z'); if(isNaN(d.getTime())) return '';
  if(u==='MONTH') d.setUTCMonth(d.getUTCMonth()+t); else if(u==='DAY') d.setUTCDate(d.getUTCDate()+t); else d.setUTCDate(d.getUTCDate()+t*7);
  return d.toISOString().slice(0,10);
}

function wirePx(scope, p){
  if(!S.pxOpen) return;
  var ov=scope.querySelector('[data-pxoverlay]'); if(ov) ov.onclick=function(){ closePause(p); };
  var card=scope.querySelector('[data-pxcard]'); if(card) card.onclick=function(e){ e.stopPropagation(); };
  var x=scope.querySelector('[data-pxx]'); if(x) x.onclick=function(){ closePause(p); };
  var cc=scope.querySelector('[data-pxcancel]'); if(cc) cc.onclick=function(){ closePause(p); };
  var dt=scope.querySelector('[data-datefield="pxstart"]'); if(dt) dt.onclick=function(){ openDatePicker(dt, { value:S.pxStart||'', min:((S.pxCfg&&S.pxCfg.firstPossibleStartDate)||''), onPick:function(iso){ S.pxStart=iso; render(); } }); };
  var tm=scope.querySelector('#pxterm'); if(tm) tm.oninput=function(){ S.pxTerm=Math.max(1,parseInt(tm.value,10)||1); };
  if(tm) tm.onchange=function(){ S.pxTerm=Math.max(1,parseInt(tm.value,10)||1); render(); };
  var rsel=scope.querySelector('#pxreason'); if(rsel) rsel.onchange=function(){ S.pxReason=rsel.value; render(); };  // Grund-Wechsel -> Nachweis-Block aktualisieren
  var fi=scope.querySelector('#pxdoc'); if(fi) fi.onchange=function(){
    var f=fi.files&&fi.files[0]; if(!f) return;
    if(f.size>6*1024*1024){ alert('Datei zu groß (max. 6 MB). Bitte kleiner wählen.'); fi.value=''; return; }
    var rd=new FileReader();
    rd.onload=function(){ S.pxDoc=String(rd.result||''); S.pxDocName=f.name||'Nachweis'; render(); };
    rd.onerror=function(){ alert('Datei konnte nicht gelesen werden.'); };
    rd.readAsDataURL(f);
  };
  var dd=scope.querySelector('[data-pxdocdel]'); if(dd) dd.onclick=function(){ S.pxDoc=''; S.pxDocName=''; render(); };
  var sb=scope.querySelector('[data-pxsubmit]'); if(sb) sb.onclick=function(){ doPauseSubmit(p); };
  scope.querySelectorAll('[data-pxwithdraw]').forEach(function(b){ b.onclick=function(){ doPauseWithdraw(p, b.getAttribute('data-pxwithdraw')); }; });
}

function helpfulPct(a){ var y=a.helpfulYes||0,n=a.helpfulNo||0; return (y+n)>0?Math.round(y/(y+n)*100)+'%':'–'; }

function rtLabel(min){ if(min==null||isNaN(min)) return '—'; var m=Number(min); if(m<60) return Math.round(m)+' Min.'; var h=m/60; return (h>=10?Math.round(h):Number(h.toFixed(1))).toLocaleString('de-DE')+' h'; }

// Nutzt den öffentlichen, bereits erprobten Website-Flow (/api/trial/slots + /api/trial/book).
function loadTrialSlots(){
  if(S.trSlotsLoading) return;
  S.trSlots=null; S.trSlotsLoading=true; S.trDone=''; S.trResult=''; S.trSlotSel=null; render();
  fetch('/api/trial/slots?days=28&trainer=0',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    S.trSlotsLoading=false;
    var slots=((d&&d.slots)||[]).filter(function(s){return s&&s.startDateTime;}).map(function(s){return {start:s.startDateTime};});
    slots.sort(function(a,b){return new Date(a.start)-new Date(b.start);});
    S.trSlots=slots; render();
  }).catch(function(){ S.trSlotsLoading=false; S.trSlots=[]; render(); });
}
function trPickSlot(i){ var s=(S.trSlots||[])[i]; if(s){ S.trSlotSel=s; render(); } }
async function trBook(){
  if(S.trBusy) return;
  var f={ firstname:(S.trFirst||'').trim(), lastname:(S.trLast||'').trim(), email:(S.trEmail||'').trim(),
    phone:(S.trPhone||'').trim(), gender:S.trGender||'', dateOfBirth:S.trDob||'',
    street:(S.trStreet||'').trim(), houseNumber:(S.trHouse||'').trim(), zip:(S.trZip||'').trim(), city:(S.trCity||'').trim() };
  if(!S.trSlotSel){ S.trResult='Bitte einen freien Termin wählen.'; render(); return; }
  var missing=['gender','firstname','lastname','email','phone','dateOfBirth','street','houseNumber','zip','city'].filter(function(k){return !f[k];});
  if(missing.length){ S.trResult='Bitte alle Felder ausfüllen.'; render(); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)){ S.trResult='Bitte eine gültige E-Mail-Adresse angeben.'; render(); return; }
  S.trBusy=true; S.trResult=''; render();
  var data=Object.assign({}, f, { startDateTime:S.trSlotSel.start, trainerRequired:false, marketing:!!S.trMarketing, note:'Probetraining vom Team gebucht' });
  try{
    var r=await fetch('/api/trial/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    var res=await r.json().catch(function(){return {};});
    S.trBusy=false;
    if(res&&res.ok){ S.trDone=res.message||'Probetraining gebucht.'; S.trResult='';
      S.trFirst='';S.trLast='';S.trEmail='';S.trPhone='';S.trGender='';S.trDob='';S.trStreet='';S.trHouse='';S.trZip='';S.trCity='';S.trSlotSel=null; }
    else { S.trResult=(res&&res.message)||'Buchung fehlgeschlagen – bitte einen anderen Termin wählen.'; }
  }catch(e){ S.trBusy=false; S.trResult='Verbindung fehlgeschlagen.'; }
  render();
}

function asGrow(t){ try{ t.style.height='auto'; t.style.height=Math.min(140,t.scrollHeight)+'px'; }catch(e){} }
function assistScrollEnd(){ try{ var s=document.querySelector('#screenwrap .scrl')||document.querySelector('.scrl'); if(s) s.scrollTop=s.scrollHeight; }catch(e){} }
function wireAssist(node){
  var ti=node.querySelector('#asinput');
  if(ti){ ti.oninput=function(){ S.asInput=ti.value; asGrow(ti); }; ti.onkeydown=function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); assistSend(); } }; asGrow(ti); if(!S.asBusy) ti.focus(); }
  var sb=node.querySelector('[data-assend]'); if(sb) sb.onclick=function(){ assistSend(); };
  node.querySelectorAll('[data-aschip]').forEach(function(b){ b.onclick=function(){ assistSend(b.getAttribute('data-aschip')); }; });
  node.querySelectorAll('[data-asconfirm]').forEach(function(b){ b.onclick=function(){ assistConfirm(b.getAttribute('data-asconfirm')); }; });
  node.querySelectorAll('[data-ascancel]').forEach(function(b){ b.onclick=function(){ assistCancel(b.getAttribute('data-ascancel')); }; });
}
function assistSend(text){
  var t=String(text!=null?text:(S.asInput||'')).trim();
  if(!t || S.asBusy) return;
  S.asMsgs.push({role:'user',text:t});
  S.asInput=''; S.asBusy=true; render(); assistScrollEnd();
  var payload=S.asMsgs.filter(function(m){ return m.role==='user'||m.role==='assistant'; }).map(function(m){ return {role:m.role,content:m.text}; });
  tapi('/api/team/assistant',{method:'POST',body:{messages:payload}}).then(function(r){
    S.asBusy=false;
    if(!r || r.ok===false){ S.asMsgs.push({role:'assistant',text:(r&&(r.text||r.message))||'Der Assistent ist gerade nicht verfügbar.'}); render(); assistScrollEnd(); return; }
    if(r.kind==='confirm'){
      if(r.text) S.asMsgs.push({role:'assistant',text:r.text});
      var a=r.action||{};
      S.asMsgs.push({role:'confirm',id:'c'+(S.asCid=(S.asCid||0)+1),preview:a.preview||'',tool:a.tool,args:a.args||{}});
    } else {
      S.asMsgs.push({role:'assistant',text:r.text||'Alles klar.'});
    }
    render(); assistScrollEnd();
  }).catch(function(){ S.asBusy=false; S.asMsgs.push({role:'assistant',text:'Verbindung gerade nicht möglich.'}); render(); assistScrollEnd(); });
}
function assistConfirm(id){
  var card=(S.asMsgs||[]).find(function(m){ return m.role==='confirm'&&m.id===id; });
  if(!card || card.done || S.asBusy) return;
  S.asBusy=true; render();
  tapi('/api/team/assistant',{method:'POST',body:{confirm:{tool:card.tool,args:card.args}}}).then(function(r){
    S.asBusy=false; card.done=(r&&r.ok)?'ok':'err';
    S.asMsgs.push({role:'assistant',text:(r&&r.text)||'Erledigt.'});
    render(); assistScrollEnd();
  }).catch(function(){ S.asBusy=false; card.done='err'; S.asMsgs.push({role:'assistant',text:'Aktion fehlgeschlagen.'}); render(); assistScrollEnd(); });
}
function assistCancel(id){
  var card=(S.asMsgs||[]).find(function(m){ return m.role==='confirm'&&m.id===id; });
  if(!card || card.done) return;
  card.done='cancel';
  S.asMsgs.push({role:'assistant',text:'Okay, das lasse ich. Sag mir, wenn ich etwas anpassen soll.'});
  render(); assistScrollEnd();
}

  var titles={dash:'Übersicht',inbox:'Posteingang',members:'Mitglieder',newmembers:'Neue Mitglieder',appts:'Termine',trial:'Probetraining',help:'Hilfe-Artikel',stats:'Statistiken',msg:'Nachrichten',leads:'Leads',tester:'App-Tester',kassenbuch:'Kassenbuch',feedback:'App-Feedback',todo:'Aufgaben',schicht:'Schichtplan',assist:'Assistent',wb:'Rückholung',community:'Community'};
  var subs={dash:'Dein Studio auf einen Blick',inbox:'Alle Vorgänge & Anfragen',members:'Mitgliederverwaltung',newmembers:'Zuletzt beigetreten – automatisch aus Magicline',appts:'Anfragen & Buchungen',trial:'Schnell ein Probetraining buchen',help:'Wissensdatenbank verwalten',stats:'Auswertungen & Trends',msg:'Rundnachricht & Direktnachricht',leads:'Interessenten-Pipeline',tester:'Anmeldungen für den geschlossenen App-Test',kassenbuch:'Barkasse führen, prüfen & Monate abschließen',feedback:'Anonymes Kunden-Feedback aus der App',todo:'Interne Aufgaben fürs Team',schicht:'Dienstplan, Tausch & Verfügbarkeiten',assist:'Sag mir, was zu tun ist – ich bereite es vor, du bestätigst',wb:'Angebots-Rahmen für die KI-Rückholung',community:'Trainingspartner moderieren'};
  var content;
  if(S.screen==='inbox') content=inboxNode();
  else if(S.screen==='dash') content=dashNode();
  else if(S.screen==='members') content=membersNode();
  else if(S.screen==='appts') content=apptsNode();
  else if(S.screen==='trial') content=trialNode();
  else if(S.screen==='help') content=helpNode();
  else if(S.screen==='stats') content=statsNode();
  else if(S.screen==='msg') content=msgNode();
  else if(S.screen==='leads') content=leadsNode();
  else if(S.screen==='tester') content=testerNode();
  else if(S.screen==='kassenbuch') content=kassenbuchNode();
  else if(S.screen==='feedback') content=feedbackNode();
  else if(S.screen==='newmembers') content=newMembersNode();
  else if(S.screen==='todo') content=todoNode();
  else if(S.screen==='schicht') content=schichtNode();
  else if(S.screen==='assist') content=assistNode();
  else if(S.screen==='wb') content=wbNode();
  else if(S.screen==='community') content=communityNode();
  else content=placeholderNode(titles[S.screen]||'');
  renderShell(content, titles[S.screen]||'', subs[S.screen]||'');
}
// ── URL-Routing: die Adresszeile spiegelt Screen + offenes Mitglied wider ──
// Die Team-SPA liegt unter „/team". Screens werden zu /team/<slug>, ein offenes
// Profil zu /team/mitglieder/<interne-id>. So sind Ansichten teilbar/bookmarkbar
// und Reload/Zurück führen wieder dorthin. Greift nur, wenn die Seite wirklich
// unter /team ausgeliefert wird (Guard) – beim direkten Öffnen der Datei bleibt die URL unberührt.
var SCREEN2SLUG={ dash:'', inbox:'posteingang', members:'mitglieder', newmembers:'neue-mitglieder', appts:'termine', trial:'probetraining', help:'hilfe', stats:'statistiken', msg:'nachrichten', leads:'leads', tester:'tester', kassenbuch:'kassenbuch', feedback:'feedback', todo:'aufgaben', schicht:'schichtplan', assist:'assistent', wb:'rueckholung', community:'community' };
var SLUG2SCREEN={}; Object.keys(SCREEN2SLUG).forEach(function(k){ if(SCREEN2SLUG[k]) SLUG2SCREEN[SCREEN2SLUG[k]]=k; });
var urlRestoring=false;   // true während Boot/Popstate/Login-Restore -> replaceState statt pushState
function underTeam(){ try{ return /^\/team(\/|$)/.test(location.pathname||''); }catch(e){ return false; } }
function teamPath(){
  if(S.screen==='members' && S._profId && (S.profile||S.profileLoading)) return '/team/mitglieder/'+encodeURIComponent(S._profId);
  var slug=SCREEN2SLUG[S.screen]; if(slug===undefined) slug='';
  return '/team'+(slug?('/'+slug):'');
}
function syncUrl(push){
  if(!underTeam()) return;
  try{ var p=teamPath(); if(p===location.pathname) return; history[(push&&!urlRestoring)?'pushState':'replaceState']({t:1}, '', p); }catch(e){}
}
function parseTeamPath(){
  var seg=[]; try{ seg=String(location.pathname||'').replace(/^\/+|\/+$/g,'').split('/'); }catch(e){}
  if(seg[0]!=='team') return null;
  var a=(seg[1]||'').toLowerCase();
  if(!a) return { screen:'dash', id:null };
  if(a==='mitglieder') return { screen:'members', id: seg[2]?decodeURIComponent(seg[2]):null };
  return { screen: SLUG2SCREEN[a]||'dash', id:null };
}
// Aktuelle URL auswerten und die Ansicht herstellen (Boot + nach Login).
function enterRoute(){
  var r=parseTeamPath(); urlRestoring=true;
  try{
    if(r && r.screen==='members' && r.id){ S.screen='members'; openProfile(r.id); }
    else { goScreen((r&&r.screen)||S.screen); }
  } finally { urlRestoring=false; }
}
// Browser Zurück/Vor: Ansicht ohne neuen History-Eintrag mitziehen.
window.addEventListener('popstate', function(){
  if(!underTeam()) return;
  var r=parseTeamPath(); if(!r) return;
  urlRestoring=true;
  try{
    if(r.screen==='members' && r.id){ if(String(S._profId||'')!==String(r.id) || !(S.profile||S.profileLoading)){ S.screen='members'; openProfile(r.id); } else { render(); } }
    else { S.profile=null; goScreen(r.screen); }
  } finally { urlRestoring=false; }
});
function goScreen(k){
  if(!canSee(k)) k='dash';   // Angestellte werden aus Admin-Bereichen sanft umgeleitet
  if(k!=='inbox' && S.selMode){ S.selMode=false; S.selected={}; S.bulkMenu=''; }   // Auswahlmodus beim Verlassen des Postfachs beenden
  S.screen=k; S.navOpen=false; syncUrl(true);
  if(k==='dash'){ loadUtil(); loadChurn(); if(isAdmin()){ loadDues(); loadRetentionOffers(); } if(!S.convs.length && !S.loading) loadInbox(); }
  if(k==='members'){ S.profile=null; if(!S.membersLoaded){ loadMembers(); return; } }
  if(k==='appts' && !S.convs.length && !S.loading){ loadInbox(); return; }
  if(k==='trial'){ if(S.trSlots==null){ loadTrialSlots(); return; } }
  if(k==='help'){ S.helpView='list'; S.editor=null; if(!S.articlesLoaded){ loadArticles(); return; } }
  if(k==='stats'){ loadUtil(); loadStats(); return; }
  if(k==='msg'){ S.bcResult=null; }
  if(k==='leads'){ if(!S.leadsLoaded){ loadLeads(); return; } }
  if(k==='tester'){ if(!S.testersLoaded){ loadTesters(); return; } }
  if(k==='kassenbuch'){ if(!S.kbLoaded){ loadKassenbuch(); return; } }
  if(k==='feedback'){ if(!S.fbLoaded){ loadFeedback(); return; } }
  if(k==='newmembers'){ if(!S.newMembersLoaded){ loadNewMembers(); return; } }
  if(k==='todo'){ if(!S.todosLoaded){ loadTodos(); return; } }
  if(k==='schicht'){ if(!S.shLoaded){ loadShifts(); return; } }
  if(k==='wb'){ if(!S.wbLoaded){ loadWb(); return; } }
  if(k==='community'){ if(!S.commLoaded){ loadCommunity(); return; } }
  render();
}

// ---------- boot ----------
loadToken();
// Beim Start die Lader des Landing-Screens (Standard: Übersicht/dash) anstoßen –
// sonst bleibt z. B. die Auslastungs-Karte hängen, weil loadUtil() nie liefe.
if(S.token){ render(); loadMe(); loadEmployees(); enterRoute(); } else { render(); }
// Offenen Chat live nachladen (neue Nachrichten erscheinen automatisch).
setInterval(pollThread, 6000);
// Liste/Badges seltener aktualisieren (kein Voll-Render, wenn gerade getippt wird).
setInterval(function(){
  if(!(S.token && (S.screen==='inbox'||S.screen==='appts') && !S.busy && !(S.draft||'').trim())) return;
  // Nicht refreshen, während getippt/gesucht wird – der Voll-Render würde Fokus klauen
  // und Liste/Modal-Suche nach oben springen lassen.
  if((S.note||'').trim()) return;
  var ae=document.activeElement; if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName||'')) return;
  loadInbox();
}, 30000);
</script>
