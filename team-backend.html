<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fit-Inn Trier · Team-Backend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#e9eef0;color:#15171B}
  ::placeholder{color:#a9b1b6}
  input,select,button,textarea{font-family:inherit}
  button{cursor:pointer}
  textarea:focus,input:focus,select:focus{outline:none}
  .scrl::-webkit-scrollbar{width:9px;height:9px}
  .scrl::-webkit-scrollbar-thumb{background:#d6dee0;border-radius:8px}
  .navbtn:hover{background:rgba(255,255,255,.10)}
  .convrow:hover{background:#f5f8f8}
  .lrow:hover{background:#f5f8f8}
  .miniact:hover{background:#f1f6f7;border-color:#c4d6da}
  .qtile:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(4,33,40,.18)}
  .qtile{transition:transform .15s,box-shadow .15s}
  @keyframes fiSpin{to{transform:rotate(360deg)}}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #cfe0e3;border-top-color:#0a4958;display:inline-block;animation:fiSpin .8s linear infinite}
  @media (max-width:1100px){
    .ctx-panel{position:fixed;top:0;right:0;height:100dvh;width:330px;max-width:88vw;z-index:58;transform:translateX(100%);transition:transform .25s ease;box-shadow:-8px 0 60px rgba(0,0,0,.30);border-left:none}
    .ctx-panel.open{transform:none}
    .ctx-toggle{display:inline-flex!important}
  }
  @media (min-width:1101px){ .ctx-toggle,.ctx-overlay{display:none!important} }
  @media (max-width:860px){
    .mb-sidebar{position:fixed;top:0;left:0;height:100dvh;width:264px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 70px rgba(0,0,0,.45)}
    .mb-sidebar.open{transform:none}
    .mb-burger{display:inline-flex!important}
    .inbox-list{width:100%!important;border-right:none!important}
    .adm-inbox .inbox-thread{display:none!important}
    .adm-inbox.thread .inbox-list{display:none!important}
    .adm-inbox.thread .inbox-thread{display:flex!important}
    .mb-back{display:inline-flex!important}
    .prof-grid{grid-template-columns:1fr!important}
    main > header{padding:14px 16px!important}
  }
  @media (min-width:861px){ .mb-burger,.mb-overlay,.mb-back{display:none!important} }
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';
var TEAL='#0a4958', ORANGE='#E08C53';
var S={ token:null, screen:'inbox', convs:[], counts:{}, selKey:null, sel:null,
        filter:'open', search:'', loading:false, err:'', draft:'', note:'', replyChannel:'email',
        mobileThread:false, panelOpen:false, busy:false,
        members:[], membersLoaded:false, membersLoading:false,
        memberSearch:'', memberResults:null, memberSearching:false,
        reassignOpen:false, reassignSearch:'', reassignResults:null, reassignSearching:false, reassignBusy:false,
        profile:null, profileLoading:false, dupLoading:false, dupData:null,
        convProfile:null, convProfileLoading:false, util:null,
        articles:[], articlesLoaded:false, articlesLoading:false,
        helpView:'list', editor:null, helpSearch:'', helpCat:'all',
        stats:null, statsLoading:false };
var root=document.getElementById('root');
var stickBottom=true;   // Chat klebt am unteren Rand, solange der Nutzer nicht hochscrollt
var lastThreadScroll=0; // letzte Scroll-Position (über Voll-Renders hinweg erhalten)

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function rel(ts){ if(!ts) return ''; var d=Date.now()-Number(ts); var min=Math.floor(d/60000);
  if(min<1) return 'gerade eben'; if(min<60) return 'vor '+min+' Min.'; var h=Math.floor(min/60);
  if(h<24) return 'vor '+h+' Std.'; var day=Math.floor(h/24); if(day===1) return 'gestern'; if(day<7) return 'vor '+day+' Tagen';
  var dt=new Date(Number(ts)); return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function timeShort(ts){ if(!ts) return ''; var dt=new Date(Number(ts)); var today=new Date();
  var sameDay=dt.toDateString()===today.toDateString();
  return sameDay ? ('Heute, '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))
                 : dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+', '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

async function tapi(path, opts){
  opts=opts||{}; opts.headers=opts.headers||{};
  if(S.token) opts.headers['Authorization']='Bearer '+S.token;
  if(opts.body && typeof opts.body!=='string'){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(opts.body); }
  var r=await fetch(path, opts);
  if(r.status===401){ logout(); throw new Error('unauthorized'); }
  return r.json();
}

// ---------- meta ----------
var TYPE={ kuendigung:{l:'Kündigung',c:'#b53a2c',b:'#fbeae7'}, widerruf:{l:'Widerruf',c:'#C77A2E',b:'#fbf0e3'},
  adresse:{l:'Adressänderung',c:'#1d7a3e',b:'#e8f6ed'}, iban:{l:'Bankverbindung',c:'#2C5FB8',b:'#eaf0fb'},
  kontakt:{l:'Kontaktanfrage',c:TEAL,b:'#e7f1f3'}, termin:{l:'Termin',c:TEAL,b:'#e7f1f3'},
  pause:{l:'Beitragspause',c:'#C77A2E',b:'#fbf0e3'}, angebot:{l:'Angebot',c:ORANGE,b:'#fff3e8'},
  whatsapp:{l:'WhatsApp',c:'#1F9A4E',b:'#e8f6ed'}, allgemein:{l:'Anliegen',c:TEAL,b:'#e7f1f3'} };
function tm(t){ return TYPE[t]||TYPE.allgemein; }
var STAT={ neu:{l:'Neu',c:'#b53a2c',b:'#fbeae7',dot:'#e2685a'}, bearbeitung:{l:'In Bearbeitung',c:'#C77A2E',b:'#fbf0e3',dot:'#E08C53'},
  wartet:{l:'Wartet auf Mitglied',c:TEAL,b:'#e7f1f3',dot:'#2f7d8c'}, abgeschlossen:{l:'Abgeschlossen',c:'#1d7a3e',b:'#e7f6ec',dot:'#46c878'} };
function sm(s){ return STAT[s]||STAT.neu; }
var PRIO={ hoch:{l:'Hoch',c:'#b53a2c',b:'#fbeae7'}, mittel:{l:'Mittel',c:'#C77A2E',b:'#fbf0e3'}, niedrig:{l:'Niedrig',c:'#5a636a',b:'#eef1f2'} };
var CHAN={ portal:'Mitgliederbereich', whatsapp:'WhatsApp', email:'E-Mail', kontakt:'Kontaktformular' };
function chan(c){ return CHAN[c]||'Mitgliederbereich'; }
var ASSIGNEES=['Markus','Nina','Jonas'];   // anpassbar – echte Teamnamen später

// ---------- auth ----------
function loadToken(){ try{ S.token=localStorage.getItem('fi_team_token')||null; }catch(e){} }
function saveToken(t){ S.token=t; try{ t?localStorage.setItem('fi_team_token',t):localStorage.removeItem('fi_team_token'); }catch(e){} }
function logout(){ saveToken(null); S.convs=[]; S.sel=null; S.selKey=null; render(); }

async function doLogin(pw){
  S.err=''; S.busy=true; render();
  try{
    var r=await tapi('/api/team/login',{method:'POST',body:{password:pw}});
    if(r.ok && r.token){ saveToken(r.token); S.busy=false; await loadInbox(); return; }
    S.err=r.message||'Login fehlgeschlagen.'; S.busy=false; render();
  }catch(e){ S.err='Verbindungsfehler.'; S.busy=false; render(); }
}

// ---------- data ----------
async function loadInbox(){
  S.loading=true; render();
  try{
    var r=await tapi('/api/team/conversations');
    if(r.ok){ S.convs=r.conversations||[]; S.counts=r.counts||{}; }
    S.loading=false; render();
    if(S.screen==='inbox' && !S.selKey && S.convs.length && window.innerWidth>860){ openConv(S.convs[0].key); }
  }catch(e){ S.loading=false; render(); }
}
function findConv(key){ for(var i=0;i<S.convs.length;i++) if(S.convs[i].key===key) return S.convs[i]; return null; }
function splitKey(key){ var i=key.indexOf(':'); return [key.slice(0,i), key.slice(i+1)]; }

async function openConv(key){
  stickBottom=true;   // beim Öffnen immer ans Ende
  S.selKey=key; S.draft=''; S.note=''; S.mobileThread=true; S.panelOpen=false; S.convProfile=null; S.convProfileLoading=false; render();
  var p=splitKey(key);
  loadConvProfile(p[0], key);
  try{
    var r=await tapi('/api/team/conversation?m='+encodeURIComponent(p[0])+'&id='+encodeURIComponent(p[1]));
    if(r.ok){ S.sel=r.conversation; var c=findConv(key); if(c) c.teamUnread=false; S.replyChannel=(S.sel&&S.sel.channel==='whatsapp')?'whatsapp':'email'; }
    render();
  }catch(e){ render(); }
}
// Vollständiges Magicline-Profil des Mitglieds fürs Kontext-Panel laden (nicht bei
// Interessenten/Pseudo-IDs "wa…"). Per key gegen Races abgesichert.
function loadConvProfile(memberId, key){
  if(!memberId || /^wa/.test(String(memberId))){ S.convProfile=null; S.convProfileLoading=false; return; }
  S.convProfile=null; S.convProfileLoading=true;
  tapi('/api/team/members?id='+encodeURIComponent(memberId))
    .then(function(r){ if(S.selKey!==key) return; S.convProfile=(r&&r.ok)?r.profile:null; S.convProfileLoading=false; render(); })
    .catch(function(){ if(S.selKey!==key) return; S.convProfileLoading=false; render(); });
}

// Nachrichten-HTML des offenen Vorgangs (für Voll-Render + Live-Update).
function threadMessagesHTML(sel){
  return (sel.messages||[]).map(function(m){
    if(m.from==='system') return '<div style="display:flex;justify-content:center"><div style="display:inline-flex;align-items:center;gap:8px;background:#eef3f4;border:1px solid #e0e9ea;border-radius:100px;padding:6px 13px;max-width:90%"><span style="font-size:12px;font-weight:600;color:#5a636a">'+esc(m.text)+'</span><span style="font-size:11px;color:#a9b1b6;font-weight:600">· '+esc(timeShort(m.at))+'</span></div></div>';
    if(m.from==='member') return '<div style="display:flex;gap:11px;align-items:flex-start;max-width:80%"><div style="width:34px;height:34px;border-radius:50%;background:#dfe9eb;color:#0a4958;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+esc(sel.member.initials||'·')+'</div><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span style="font-size:12.5px;font-weight:800">'+esc(sel.member.name)+'</span><span style="font-size:11px;color:#a9b1b6;font-weight:600">'+esc(timeShort(m.at))+'</span></div><div style="background:#fff;border:1px solid #eaeff0;border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:14px;line-height:1.6;color:#2a3338;white-space:pre-wrap">'+esc(m.text)+'</div></div></div>';
    return '<div style="display:flex;gap:11px;align-items:flex-start;max-width:80%;margin-left:auto;flex-direction:row-reverse"><div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(150deg,#0e6072,#073e4b);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+esc((m.author||'Team').slice(0,2).toUpperCase())+'</div><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-direction:row-reverse"><span style="font-size:12.5px;font-weight:800">'+esc(m.author||'Team')+'</span><span style="font-size:11px;color:#a9b1b6;font-weight:600">'+esc(timeShort(m.at))+'</span></div><div style="background:#0a4958;color:#fff;border-radius:16px 4px 16px 16px;padding:11px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap">'+esc(m.text)+'</div></div></div>';
  }).join('');
}
function scrollThreadEnd(){ var c=document.getElementById('threadmsgs'); if(c) c.scrollTop=c.scrollHeight; }
// Nur die Nachrichten austauschen (stört Composer/Fokus nicht), Scroll-Position erhalten.
function updateThreadMessages(){
  var c=document.getElementById('threadmsgs'); if(!c||!S.sel) return;
  var prev=c.scrollTop;
  c.innerHTML=threadMessagesHTML(S.sel);
  c.scrollTop = stickBottom ? c.scrollHeight : prev;   // neue Nachrichten hängen unten an
}
// Offenen Vorgang live nachladen (neue Nachrichten erscheinen automatisch).
async function pollThread(){
  if(!(S.token && S.screen==='inbox' && S.sel && !S.busy)) return;
  var key=S.selKey, p=splitKey(key);
  try{
    var r=await tapi('/api/team/conversation?m='+encodeURIComponent(p[0])+'&id='+encodeURIComponent(p[1]));
    if(!(r.ok && r.conversation) || S.selKey!==key) return;
    var oldM=S.sel.messages||[], newM=r.conversation.messages||[];
    var oldLast=oldM[oldM.length-1]||{}, newLast=newM[newM.length-1]||{};
    var changed = newM.length!==oldM.length || newLast.at!==oldLast.at || newLast.text!==oldLast.text;
    S.sel=r.conversation;
    if(changed) updateThreadMessages();
  }catch(e){}
}

async function actOn(memberId, id, action, extra){
  var body=Object.assign({ m:memberId, id:id, action:action }, extra||{});
  try{ return await tapi('/api/team/conversation',{method:'POST',body:body}); }
  catch(e){ return { ok:false }; }
}
async function act(action, extra){
  if(!S.sel) return; S.busy=true; render();
  var r=await actOn(S.sel.memberId, S.sel.id, action, extra);
  if(r.ok && r.conversation){ S.sel=r.conversation; }
  else if(r.message){ alert(r.message); }
  S.busy=false;
  if(action==='reply'){
    S.draft='';
    if(r.ok){
      if(r.channelUsed===null) alert('Antwort gespeichert, konnte aber weder per WhatsApp noch E-Mail zugestellt werden – es fehlen Kontaktdaten.');
      else if(r.channelFallback) alert('Konnte nicht per '+((extra&&extra.channel==='whatsapp')?'WhatsApp':'E-Mail')+' zustellen – stattdessen per '+(r.channelUsed==='whatsapp'?'WhatsApp':'E-Mail')+' verschickt.');
    }
  }
  if(action==='note'){ S.note=''; }
  render();
  loadInbox();   // Liste/Badges aktualisieren
}

// ---------- members data ----------
async function loadMembers(){
  S.membersLoading=true; render();
  try{ var r=await tapi('/api/team/members'); if(r.ok){ S.members=r.members||[]; } S.membersLoaded=true; }
  catch(e){} S.membersLoading=false; render();
}
var _msTimer=null;
function onMemberSearch(v){
  S.memberSearch=v; clearTimeout(_msTimer); var q=(v||'').trim();
  if(!q){ S.memberResults=null; S.memberSearching=false; updateMemberRows(); return; }
  S.memberSearching=true; updateMemberRows();
  _msTimer=setTimeout(async function(){
    try{ var r=await tapi('/api/team/members?q='+encodeURIComponent(q)); if(S.memberSearch.trim()===q){ S.memberResults=r.ok?(r.results||[]):[]; } }
    catch(e){ S.memberResults=[]; }
    S.memberSearching=false; updateMemberRows();
  }, 350);
}
async function openProfile(id){
  S.profileLoading=true; S.profile=null; render();
  try{ var r=await tapi('/api/team/members?id='+encodeURIComponent(id)); if(r.ok) S.profile=r.profile; }
  catch(e){} S.profileLoading=false; render();
}
function backToMembers(){ S.profile=null; render(); }

// ---------- Dubletten-Prüfung ----------
async function loadDuplicates(){
  S.dupLoading=true; S.dupData=null; render();
  try{ var r=await tapi('/api/team/duplicates'); S.dupData=r&&r.ok?r:{groups:[]}; }
  catch(e){ S.dupData={groups:[]}; }
  S.dupLoading=false; render();
}
function dupPanelHTML(){
  if(S.dupLoading) return '<div style="padding:24px;text-align:center"><span class="spin"></span><div style="font-size:12.5px;color:#8a929a;font-weight:700;margin-top:8px">Prüfe Magicline auf Doppel-Datensätze …</div></div>';
  if(!S.dupData) return '';
  var g=S.dupData.groups||[];
  if(!g.length) return '<div style="padding:20px;text-align:center;color:#1d7a3e;font-size:13.5px;font-weight:700">Keine Dubletten gefunden ('+(S.dupData.emailsChecked||0)+' Mitglieder geprüft). 🎉</div>';
  return '<div style="padding:14px 18px 2px;font-size:12px;font-weight:800;color:#b53a2c">'+g.length+' mögliche Dublette(n)</div>'+g.map(function(grp){
    return '<div style="border-top:1px solid #f4f6f7;padding:12px 18px"><div style="font-size:12.5px;font-weight:800;color:#42454b;margin-bottom:8px">'+esc(grp.email)+' · '+grp.count+' Datensätze</div>'+
      grp.records.map(function(r){ return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0"><div style="width:30px;height:30px;border-radius:50%;background:#dfe9eb;color:#0a4958;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+esc(r.initials)+'</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">'+esc(r.name)+(r.customerNumber?' · '+esc(r.customerNumber):' · <span style="color:#C77A2E">ohne Mitgliedsnr.</span>')+'</div><div style="font-size:11.5px;color:#8a929a;font-weight:600">'+esc(r.dob||'—')+(r.phone?' · '+esc(r.phone):'')+' · ID '+esc(r.id||'?')+'</div></div></div>'; }).join('')+
      '</div>';
  }).join('')+'<div style="padding:12px 18px;font-size:11.5px;color:#a9b1b6;font-weight:600;border-top:1px solid #f4f6f7">Zusammenführen im Magicline-Backend.'+(S.dupData.capped?(' (Nur '+(S.dupData.emailsChecked||0)+' E-Mails geprüft.)'):'')+'</div>';
}

// ---------- reassign (Vorgang einem anderen Kunden zuordnen) ----------
function openReassign(){ S.reassignOpen=true; S.reassignSearch=''; S.reassignResults=null; S.reassignSearching=false; S.reassignBusy=false; render(); setTimeout(function(){ var i=document.getElementById('rasearch'); if(i) i.focus(); },30); }
function closeReassign(){ if(S.reassignBusy) return; S.reassignOpen=false; render(); }
function raRowsHTML(){
  if(S.reassignBusy) return '<div style="padding:30px;text-align:center"><span class="spin"></span><div style="font-size:12.5px;color:#8a929a;font-weight:700;margin-top:10px">Wird zugeordnet …</div></div>';
  if(S.reassignSearching) return '<div style="padding:30px;text-align:center"><span class="spin"></span></div>';
  if(S.reassignResults===null) return '<div style="padding:26px 22px;text-align:center;color:#a9b1b6;font-size:13px;font-weight:600">Tippe oben, um einen Kunden zu suchen.</div>';
  if(!S.reassignResults.length) return '<div style="padding:26px 22px;text-align:center;color:#8a929a;font-size:13.5px;font-weight:600">Keine Treffer in Magicline.</div>';
  return '<div style="padding:8px 18px 2px;font-size:11.5px;font-weight:700;color:#8a929a">'+S.reassignResults.length+' Treffer</div>'+S.reassignResults.map(function(m){
    return '<div class="lrow" data-ra="'+esc(m.id)+'" style="display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid #f4f6f7;cursor:pointer">'+
      '<div style="width:36px;height:36px;border-radius:50%;background:#dfe9eb;color:#0a4958;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+esc(m.initials||'·')+'</div>'+
      '<div style="min-width:0;flex:1"><div style="font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(m.name)+'</div>'+
        '<div style="font-size:12px;color:#8a929a;font-weight:600">'+esc(m.nr||'—')+(m.email?' · '+esc(m.email):'')+'</div></div>'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bcc6c8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg></div>';
  }).join('');
}
function updateRaRows(){
  var c=document.getElementById('rarows'); if(!c) return;
  c.innerHTML=raRowsHTML();
  c.querySelectorAll('[data-ra]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-ra'); var mm=(S.reassignResults||[]).find(function(x){ return String(x.id)===String(id); }); doReassign(id, mm||null); }; });
}
var _raTimer=null;
function onReassignSearch(v){
  S.reassignSearch=v; clearTimeout(_raTimer); var q=(v||'').trim();
  if(!q){ S.reassignResults=null; S.reassignSearching=false; updateRaRows(); return; }
  S.reassignSearching=true; updateRaRows();
  _raTimer=setTimeout(async function(){
    try{ var r=await tapi('/api/team/members?q='+encodeURIComponent(q)); if(S.reassignSearch.trim()===q){ S.reassignResults=r.ok?(r.results||[]):[]; } }
    catch(e){ S.reassignResults=[]; }
    S.reassignSearching=false; updateRaRows();
  }, 350);
}
async function doReassign(toId, snap){
  if(!S.sel || S.reassignBusy) return;
  S.reassignBusy=true; updateRaRows();
  var r=await actOn(S.sel.memberId, S.sel.id, 'reassign', { to:toId, snapshot: snap?{ name:snap.name, nr:snap.nr, initials:snap.initials, email:snap.email, phone:snap.phone }:null });
  S.reassignBusy=false;
  if(r && r.ok && r.conversation){
    S.sel=r.conversation; S.selKey=r.memberId+':'+r.id; S.reassignOpen=false;
    loadConvProfile(r.memberId, S.selKey);
    render(); loadInbox();
  } else { S.reassignBusy=false; alert((r&&r.message)||'Zuordnung fehlgeschlagen.'); updateRaRows(); }
}

// ---------- appointment quick actions (Termine) ----------
async function apptConfirm(m, id, first){
  var d=window.prompt('Bestätigter Termin (z. B. „Sa, 28.06. um 11:00 Uhr"):','');
  if(d==null || !d.trim()) return;

async function apptDecline(m, id, first){

  await loadInbox(); render();

function filtered(){
  var f=S.filter, term=(S.search||'').trim().toLowerCase();
  var list=S.convs.slice();
  if(f==='open') list=list.filter(function(c){ return c.teamStatus!=='abgeschlossen'; });
  else if(f==='neu') list=list.filter(function(c){ return c.teamStatus==='neu'; });
  else if(f==='done') list=list.filter(function(c){ return c.teamStatus==='abgeschlossen'; });
  if(term) list=list.filter(function(c){ return (c.member.name+' '+(c.member.nr||'')+' '+tm(c.type).l+' '+c.ref).toLowerCase().indexOf(term)>=0; });
  return list;
}

      return '<button class="miniact" data-assign="'+esc(k||'')+'" style="display:flex;align-items:center;gap:7px;padding:6px 11px;border:1.5px solid '+(a?TEAL:'#e4eaeb')+';background:'+(a?'#f4f8f8':'#fff')+';border-radius:100px"><span style="font-size:12.5px;font-weight:700;color:'+(a?'#15171B':'#6b7780')+'">'+esc(label)+'</span></button>';

      || '<div style="font-size:12.5px;color:#a9b1b6;font-weight:600;padding:2px">Noch keine Notizen.</div>';
    panel.innerHTML=
      '<div style="padding:18px 20px 14px;border-bottom:1px solid #f0f3f4;display:flex;align-items:center;gap:12px">'+
        '<div style="width:46px;height:46px;border-radius:50%;background:#dfe9eb;color:#0a4958;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+esc(sel2.member.initials||'·')+'</div>'+
        '<div style="min-width:0;flex:1"><div style="font-size:15px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:7px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(sel2.member.name)+'</span>'+((sel2.member&&sel2.member.lead)?'<span style="font-size:10px;font-weight:800;color:#C77A2E;background:#fbf0e3;border-radius:20px;padding:2px 8px;flex-shrink:0">INTERESSENT</span>':'')+'</div>'+
          '<div style="font-size:12px;color:#8a929a;font-weight:600">'+esc(sel2.member.nr||(sel2.member&&sel2.member.lead?'kein Mitglied':'—'))+(sel2.member.email?' · '+esc(sel2.member.email):'')+'</div></div></div>'+
      '<div style="padding:12px 20px 0"><button data-reassign="1" style="display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px;border:1.5px solid #e4eaeb;background:#fff;border-radius:11px;font-size:12.5px;font-weight:800;color:#42454b"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b7780" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l4 4-4 4"/><path d="M20 7H9a4 4 0 0 0-4 4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h11a4 4 0 0 0 4-4"/></svg>Zuordnung ändern</button></div>'+
      '<div style="padding:14px 20px 0"><div style="background:#f8fafb;border:1px solid #eef3f4;border-radius:12px;padding:12px 14px"><div style="font-size:11px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px">Mitgliedsdaten</div>'+convProfileHTML(sel2)+'</div></div>'+
      '<div style="padding:16px 20px;display:flex;flex-direction:column;gap:18px">'+
        '<div><div style="font-size:11px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px">Status</div><div style="display:flex;flex-direction:column;gap:6px">'+statusBtns+'</div></div>'+
        '<div><div style="font-size:11px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px">Priorität</div><div style="display:flex;gap:6px">'+prioBtns+'</div></div>'+
        '<div><div style="font-size:11px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px">Zugewiesen an</div><div style="display:flex;flex-wrap:wrap;gap:6px">'+assignBtns+'</div></div>'+
        '<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px"><div style="font-size:11px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.6px">Interne Notizen</div><span style="font-size:10.5px;font-weight:700;color:#C77A2E;background:#fbf0e3;border-radius:20px;padding:2px 8px">nur Team</span></div>'+
          '<div style="display:flex;flex-direction:column;gap:8px">'+notesHtml+'</div>'+
          '<div style="display:flex;align-items:flex-end;gap:7px;border:1.5px solid #e4eaeb;border-radius:11px;padding:6px 6px 6px 11px;margin-top:9px"><textarea id="note" rows="1" placeholder="Notiz hinzufügen …" style="flex:1;border:none;resize:none;font-size:13px;background:transparent;line-height:1.45;padding:4px 0;max-height:90px;min-height:20px">'+esc(S.note)+'</textarea><button id="addnote" style="border:none;border-radius:9px;background:'+((S.note||'').trim()?'#C77A2E':'#dab98a')+';color:#fff;font-weight:800;font-size:12.5px;padding:8px 11px;flex-shrink:0">+</button></div></div>'+

    if(S.reassignOpen){
      var ov=el('<div class="ra-modal" style="position:fixed;inset:0;background:rgba(0,18,22,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px"></div>');

        '<div style="padding:18px 20px 14px;border-bottom:1px solid #eef1f2"><div style="font-size:16px;font-weight:900;letter-spacing:-.3px">Vorgang neu zuordnen</div>'+
          '<div style="font-size:12.5px;color:#8a929a;font-weight:600;margin-top:3px">Aktuell zugeordnet: <b style="color:#5a636a">'+esc(sel2.member.name)+'</b>. Such den richtigen Kunden in Magicline.</div></div>'+
        '<div style="padding:14px 18px 8px;position:relative"><input id="rasearch" value="'+esc(S.reassignSearch)+'" placeholder="Name, Mitgliedsnummer oder E-Mail" autocomplete="off" style="width:100%;padding:12px 14px;border:1.5px solid #dce3e4;border-radius:12px;font-size:14.5px"></div>'+

      ov.appendChild(box);
      ov.onclick=function(e){ if(e.target===ov) closeReassign(); };
      node.appendChild(ov);
    }
  }

  // wire inbox after attach
  setTimeout(function(){ wireInbox(node); },0);
  return node;
}

function wireInbox(node){
  var is=node.querySelector('#isearch'); if(is) is.oninput=function(){ S.search=is.value; var c=node.querySelector('#convrows'); if(c){ c.innerHTML=rowsHTML(); wireRows(c); } };
  node.querySelectorAll('[data-filter]').forEach(function(b){ b.onclick=function(){ S.filter=b.getAttribute('data-filter'); render(); }; });
  wireRows(node);
  var back=node.querySelector('[data-back]'); if(back) back.onclick=function(){ S.mobileThread=false; render(); };
  var pt=node.querySelector('[data-panel]'); if(pt) pt.onclick=function(){ S.panelOpen=!S.panelOpen; render(); };
  var dr=node.querySelector('#draft'); if(dr){ dr.oninput=function(){ S.draft=dr.value; var sb=node.querySelector('#send'); if(sb) sb.style.background=(dr.value.trim()?TEAL:'#9fb4b8'); };
    dr.onkeydown=function(e){ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); sendReply(); } }; }
  var sd=node.querySelector('#send'); if(sd) sd.onclick=sendReply;
  node.querySelectorAll('[data-ch]').forEach(function(b){ b.onclick=function(){ S.replyChannel=b.getAttribute('data-ch'); render(); }; });
  var nt=node.querySelector('#note'); if(nt) nt.oninput=function(){ S.note=nt.value; };
  var an=node.querySelector('#addnote'); if(an) an.onclick=function(){ var v=(S.note||'').trim(); if(v) act('note',{text:v}); };
  node.querySelectorAll('[data-status]').forEach(function(b){ b.onclick=function(){ act('status',{value:b.getAttribute('data-status')}); }; });
  node.querySelectorAll('[data-prio]').forEach(function(b){ b.onclick=function(){ act('priority',{value:b.getAttribute('data-prio')}); }; });
  node.querySelectorAll('[data-assign]').forEach(function(b){ b.onclick=function(){ act('assignee',{value:b.getAttribute('data-assign')||null}); }; });
  var cc=node.querySelector('#closecase'); if(cc) cc.onclick=function(){ act(S.sel.teamStatus==='abgeschlossen'?'reopen':'close'); };
  var rb=node.querySelector('[data-reassign]'); if(rb) rb.onclick=openReassign;
  var op=node.querySelector('[data-openprof]'); if(op) op.onclick=function(){ var id=op.getAttribute('data-openprof'); if(id){ S.screen='members'; openProfile(id); } };
  var ras=node.querySelector('#rasearch'); if(ras){ ras.oninput=function(){ onReassignSearch(ras.value); }; }
  var rac=node.querySelector('#racancel'); if(rac) rac.onclick=closeReassign;
  if(S.reassignOpen) updateRaRows();
  // Chat ans Ende scrollen + „klebt unten"-Status pflegen
  var tmsg=node.querySelector('#threadmsgs');
  if(tmsg){
    tmsg.scrollTop = stickBottom ? tmsg.scrollHeight : lastThreadScroll;
    tmsg.onscroll=function(){ lastThreadScroll=tmsg.scrollTop; stickBottom = (tmsg.scrollHeight - tmsg.scrollTop - tmsg.clientHeight) < 80; };
  }
}
function sendReply(){ var v=(S.draft||'').trim(); if(v && !S.busy){ stickBottom=true; act('reply',{text:v, channel:S.replyChannel}); } }

        '<label style="display:block;font-size:12px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px">Kategorie</label>'+
        '<div style="display:flex;gap:7px;flex-wrap:wrap">'+catChips+'</div>'+
        '<label style="display:block;font-size:12px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px">Inhalt</label>'+
        '<textarea id="edbody" rows="14" placeholder="Schreibe den Hilfe-Artikel … Nummerierte Schritte (1. 2. 3.) werden im Mitgliederbereich automatisch formatiert." style="width:100%;padding:14px;border:1.5px solid #dce3e4;border-radius:12px;font-size:14.5px;line-height:1.6;background:#fbfcfc;resize:vertical">'+esc(e.body)+'</textarea>'+
        '<div style="display:flex;align-items:center;gap:8px;margin-top:14px"><span style="font-size:11px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.5px">Status</span><span style="font-size:12.5px;font-weight:800;color:'+st.c+';background:'+st.b+';border-radius:20px;padding:4px 11px">'+st.l+'</span></div>'+
        '<div style="margin-top:12px">'+perf+'</div>'+
        '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px">'+
          '<button data-hpublish="1" '+(S.busy?'disabled':'')+' style="flex:1;min-width:160px;padding:13px;border:none;border-radius:12px;background:'+TEAL+';color:#fff;font-size:14px;font-weight:800">Veröffentlichen</button>'+
          '<button data-hsavedraft="1" '+(S.busy?'disabled':'')+' style="padding:13px 16px;border:1.5px solid #dce3e4;background:#fff;color:#42454b;border-radius:12px;font-size:13.5px;font-weight:700">Als Entwurf speichern</button>'+
          '<button data-hdelete="1" style="padding:13px 16px;border:none;background:transparent;color:#b53a2c;border-radius:12px;font-size:13.5px;font-weight:700">Löschen</button>'+
        '</div></div></div>';
    setTimeout(function(){
      var t=node.querySelector('#edtitle'); if(t) t.oninput=function(){ S.editor.title=t.value; };
      var bd=node.querySelector('#edbody'); if(bd) bd.oninput=function(){ S.editor.body=bd.value; };
      node.querySelectorAll('[data-edcat]').forEach(function(b){ b.onclick=function(){ S.editor.cat=b.getAttribute('data-edcat'); render(); }; });
      var bk=node.querySelector('[data-hback]'); if(bk) bk.onclick=helpBack;
      var pb=node.querySelector('[data-hpublish]'); if(pb) pb.onclick=function(){ helpSave(true); };
      var sd=node.querySelector('[data-hsavedraft]'); if(sd) sd.onclick=function(){ helpSave(false); };
      var dl=node.querySelector('[data-hdelete]'); if(dl) dl.onclick=helpDelete;
    },0);
    return node;
  }

  // ----- List -----
  var node2=el('<div class="scrl" style="flex:1;min-height:0;overflow-y:auto;padding:22px 28px 36px"></div>');
  var pubC=S.articles.filter(function(a){return a.status==='veröffentlicht';}).length;
  var drftC=S.articles.filter(function(a){return a.status==='entwurf';}).length;
  var viewsC=S.articles.reduce(function(s,a){return s+(a.views||0);},0);
  var term=(S.helpSearch||'').trim().toLowerCase();
  var vis=S.articles.filter(function(a){ if(S.helpCat!=='all'&&a.cat!==S.helpCat) return false; if(term&&(a.title+' '+(a.body||'')).toLowerCase().indexOf(term)<0) return false; return true; });
  var cats=[['all','Alle']].concat(Object.keys(HCAT).map(function(k){return [k,HCAT[k].l];}));
  function rowsH(){
    if(S.articlesLoading && !S.articles.length) return '<div style="padding:34px;text-align:center"><span class="spin"></span></div>';
    if(!vis.length) return '<div style="padding:34px 22px;text-align:center;color:#8a929a;font-size:13.5px;font-weight:600">Keine Artikel.'+(S.articles.length?'':' Lege deinen ersten an. ✍️')+'</div>';
    return vis.map(function(a){ var c=hcat(a.cat),st=ASTAT[a.status]||ASTAT.entwurf;
      return '<div class="lrow" data-aedit="'+esc(a.id)+'" style="display:flex;align-items:center;gap:13px;padding:14px 22px;border-top:1px solid #f4f6f7;cursor:pointer">'+
        '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.title||'(ohne Titel)')+'</div><div style="font-size:11.5px;color:#a9b1b6;font-weight:600;margin-top:2px">Akt. '+esc(rel(a.updatedAt))+'</div></div>'+
        '<span style="font-size:11px;font-weight:800;color:'+c.c+';background:'+c.b+';border-radius:20px;padding:4px 10px;flex-shrink:0">'+c.l+'</span>'+
        '<span style="display:inline-flex;align-items:center;gap:5px;flex-shrink:0"><span style="width:8px;height:8px;border-radius:50%;background:'+st.dot+'"></span><span style="font-size:12px;font-weight:700;color:'+st.c+'">'+st.l+'</span></span>'+
        '<span style="font-size:12.5px;font-weight:700;color:#8a929a;min-width:56px;text-align:right;flex-shrink:0;display:inline-flex;align-items:center;justify-content:flex-end;gap:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a9b1b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>'+deNum(a.views)+'</span>'+
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c9d3d5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg></div>';
    }).join('');
  }
  node2.innerHTML='<div style="max-width:1000px">'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px">'+
      '<div style="background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:16px 18px"><div style="font-size:24px;font-weight:900">'+deNum(viewsC)+'</div><div style="font-size:12.5px;color:#6b7780;font-weight:600">Aufrufe gesamt</div></div>'+
      '<div style="background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:16px 18px"><div style="font-size:24px;font-weight:900;color:#1d7a3e">'+pubC+'</div><div style="font-size:12.5px;color:#6b7780;font-weight:600">Veröffentlicht</div></div>'+
      '<div style="background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:16px 18px"><div style="font-size:24px;font-weight:900;color:#8a929a">'+drftC+'</div><div style="font-size:12.5px;color:#6b7780;font-weight:600">Entwürfe</div></div>'+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px">'+
      '<div style="position:relative;flex:1;min-width:200px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a929a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:13px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="hsearch" value="'+esc(S.helpSearch)+'" placeholder="Artikel durchsuchen" style="width:100%;padding:11px 14px 11px 40px;border:1.5px solid #dce3e4;border-radius:12px;font-size:14px;background:#fff"></div>'+
      '<button data-hnew="1" style="display:inline-flex;align-items:center;gap:7px;border:none;border-radius:12px;background:'+TEAL+';color:#fff;font-size:14px;font-weight:800;padding:12px 18px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Neuer Artikel</button></div>'+
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">'+cats.map(function(c){ var a=S.helpCat===c[0]; return '<button data-hcat="'+c[0]+'" style="border:1.5px solid '+(a?TEAL:'#dce3e4')+';background:'+(a?TEAL:'#fff')+';color:'+(a?'#fff':'#42454b')+';border-radius:100px;font-size:12.5px;font-weight:700;padding:7px 14px">'+c[1]+'</button>'; }).join('')+'</div>'+
    '<div style="background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(4,33,40,.08);overflow:hidden"><div id="arows">'+rowsH()+'</div></div></div>';
  setTimeout(function(){
    var hs=node2.querySelector('#hsearch'); if(hs) hs.oninput=function(){ S.helpSearch=hs.value; var c=node2.querySelector('#arows'); if(c){ // recompute vis
        var t=(S.helpSearch||'').trim().toLowerCase(); vis=S.articles.filter(function(a){ if(S.helpCat!=='all'&&a.cat!==S.helpCat) return false; if(t&&(a.title+' '+(a.body||'')).toLowerCase().indexOf(t)<0) return false; return true; }); c.innerHTML=rowsH(); c.querySelectorAll('[data-aedit]').forEach(function(b){ b.onclick=function(){ helpEdit(b.getAttribute('data-aedit')); }; }); } };
    node2.querySelectorAll('[data-hcat]').forEach(function(b){ b.onclick=function(){ S.helpCat=b.getAttribute('data-hcat'); render(); }; });
    var nn=node2.querySelector('[data-hnew]'); if(nn) nn.onclick=helpNew;
    node2.querySelectorAll('[data-aedit]').forEach(function(b){ b.onclick=function(){ helpEdit(b.getAttribute('data-aedit')); }; });
  },0);
  return node2;
}

// ---------- Statistiken ----------
function statsNode(){
  var node=el('<div class="scrl" style="flex:1;min-height:0;overflow-y:auto;padding:24px 28px 40px"></div>');
  if(S.statsLoading && !S.stats){ node.innerHTML='<div style="padding:60px;text-align:center"><span class="spin"></span></div>'; return node; }
  var s=S.stats||{counts:{},vorgangBreakdown:[],checkinDays:[],topArticles:[],avgUtil:0,articlesPublished:0,articleViews:0};
  var c=s.counts||{};
  var kpis=[['Offene Vorgänge',c.open||0,TEAL],['Aktion erforderlich',c.neu||0,'#b53a2c'],['Ø Auslastung',(s.avgUtil||0)+' Pers.','#1d7a3e'],['Veröffentl. Artikel',s.articlesPublished||0,ORANGE]];
  if(S.util && S.util.percent!=null) kpis.splice(2,0,['Auslastung jetzt',S.util.percent+' %','#0e6072']);
  var vbTotal=(s.vorgangBreakdown||[]).reduce(function(a,b){return a+b.count;},0)||1;
  var vbHtml=(s.vorgangBreakdown||[]).map(function(v){ var t=tm(v.type); var pct=Math.round(v.count/vbTotal*100); return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:#42454b">'+esc(t.l)+'</span><span style="font-size:13px;font-weight:800">'+v.count+'</span></div><div style="height:8px;background:#f0f3f4;border-radius:6px;overflow:hidden"><div style="height:100%;border-radius:6px;background:'+t.c+';width:'+pct+'%"></div></div></div>'; }).join('') || '<div style="font-size:12.5px;color:#a9b1b6;font-weight:600">Noch keine Vorgänge.</div>';
  var maxC=Math.max.apply(null,(s.checkinDays||[]).map(function(d){return d.v;}).concat([1]));
  var ciHtml=(s.checkinDays||[]).map(function(d){ var h=Math.round(d.v/maxC*100); return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end"><div style="font-size:11.5px;font-weight:800;color:#0a4958">'+d.v+'</div><div style="width:100%;background:linear-gradient(180deg,#0e6072,#0a4958);border-radius:6px 6px 3px 3px;height:'+Math.max(h,3)+'%"></div><div style="font-size:11.5px;font-weight:700;color:#8a929a">'+esc(d.d)+'</div></div>'; }).join('');
  var topHtml=(s.topArticles||[]).filter(function(a){return a.title;}).map(function(a){ var cc=hcat(a.cat); return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #f4f6f7"><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.title)+'</div><div style="font-size:11.5px;font-weight:700;color:'+cc.c+';margin-top:1px">'+cc.l+'</div></div><div style="font-size:13.5px;font-weight:900;color:#0a4958">'+deNum(a.views)+'</div></div>'; }).join('') || '<div style="font-size:12.5px;color:#a9b1b6;font-weight:600;padding:8px 0">Noch keine Artikel-Aufrufe.</div>';
  node.innerHTML='<div style="max-width:1000px">'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px">'+
    kpis.map(function(k){ return '<div style="background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(4,33,40,.08);padding:18px 20px"><div style="font-size:12.5px;color:#6b7780;font-weight:700">'+k[0]+'</div><div style="font-size:26px;font-weight:900;margin-top:10px;letter-spacing:-1px;color:'+k[2]+'">'+(typeof k[1]==='number'?deNum(k[1]):esc(k[1]))+'</div></div>'; }).join('')+'</div>'+
    '<div class="prof-grid" style="display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:18px;align-items:start">'+
      '<div style="background:#fff;border-radius:20px;box-shadow:0 14px 38px rgba(4,33,40,.09);padding:22px 24px"><div style="font-size:15px;font-weight:900">Typische Auslastung nach Wochentag</div><div style="font-size:12.5px;color:#8a929a;font-weight:600;margin-top:2px">Spitze · Ø '+(s.avgUtil||0)+' Personen</div><div style="display:flex;align-items:flex-end;gap:9px;height:170px;margin-top:18px">'+(ciHtml||'<div style="margin:auto;color:#a9b1b6;font-size:13px;font-weight:600">Noch keine Auslastungsdaten.</div>')+'</div></div>'+
      '<div style="background:#fff;border-radius:20px;box-shadow:0 14px 38px rgba(4,33,40,.09);padding:22px 24px"><div style="font-size:15px;font-weight:900">Vorgänge nach Art</div><div style="font-size:12.5px;color:#8a929a;font-weight:600;margin-top:2px">Aktueller Posteingang</div><div style="margin-top:16px">'+vbHtml+'</div></div>'+
    '</div>'+
    '<div style="background:#fff;border-radius:20px;box-shadow:0 14px 38px rgba(4,33,40,.09);padding:20px 22px;margin-top:18px"><div style="font-size:15px;font-weight:900;margin-bottom:4px">Meistgelesene Artikel</div>'+topHtml+'</div>'+
  '</div>';
  return node;
}

function placeholderNode(title){
  var w=el('<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px"></div>');
  w.innerHTML='<div style="text-align:center;max-width:380px"><div style="font-size:18px;font-weight:900">'+esc(title)+'</div><div style="font-size:14px;color:#6b7780;font-weight:500;margin-top:8px;line-height:1.6">Dieser Bereich folgt als Nächstes. Der Posteingang (Empfang & Antworten) ist bereits voll funktionsfähig.</div></div>';
  return w;
}

// ---------- main render ----------
function render(){
  if(!S.token){ renderLogin(); return; }
  var titles={dash:'Übersicht',inbox:'Posteingang',members:'Mitglieder',appts:'Termine',help:'Hilfe-Artikel',stats:'Statistiken'};
  var subs={dash:'Dein Studio auf einen Blick',inbox:'Alle Vorgänge & Anfragen',members:'Mitgliederverwaltung',appts:'Anfragen & Buchungen',help:'Wissensdatenbank verwalten',stats:'Auswertungen & Trends'};
  var content;
  if(S.screen==='inbox') content=inboxNode();
  else if(S.screen==='dash') content=dashNode();
  else if(S.screen==='members') content=membersNode();
  else if(S.screen==='appts') content=apptsNode();
  else if(S.screen==='help') content=helpNode();
  else if(S.screen==='stats') content=statsNode();
  else content=placeholderNode(titles[S.screen]||'');
  renderShell(content, titles[S.screen]||'', subs[S.screen]||'');
}
function goScreen(k){
  S.screen=k; S.navOpen=false;
  if(k==='dash'){ loadUtil(); if(!S.convs.length && !S.loading) loadInbox(); }
  if(k==='members'){ S.profile=null; if(!S.membersLoaded){ loadMembers(); return; } }
  if(k==='appts' && !S.convs.length && !S.loading){ loadInbox(); return; }
  if(k==='help'){ S.helpView='list'; S.editor=null; if(!S.articlesLoaded){ loadArticles(); return; } }
  if(k==='stats'){ loadUtil(); loadStats(); return; }
  render();
}

// ---------- boot ----------
loadToken();
if(S.token){ render(); loadInbox(); } else { render(); }
// Offenen Chat live nachladen (neue Nachrichten erscheinen automatisch).
setInterval(pollThread, 6000);
// Liste/Badges seltener aktualisieren (kein Voll-Render, wenn gerade getippt wird).
setInterval(function(){ if(S.token && (S.screen==='inbox'||S.screen==='appts') && !S.busy && !(S.draft||'').trim()) loadInbox(); }, 30000);
</script>
