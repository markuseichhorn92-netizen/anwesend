  /* In der eigenen App (Capacitor): App-Feeling – kein Zoom, kein horizontales
     Wischen, keine sichtbare Scrollbar. Im Browser bleibt alles unverändert. */
  (function(){ try{
    var C=window.Capacitor;
    if(!(C && C.isNativePlatform && C.isNativePlatform())) return;
    document.documentElement.classList.add('is-native-app');
    var vp=document.querySelector('meta[name=viewport]');
    if(vp) vp.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover');
    var s=document.createElement('style');
    s.textContent='html,body{overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;}'
      +'::-webkit-scrollbar{width:0!important;height:0!important;display:none!important;}';
    document.head.appendChild(s);
    document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
  }catch(e){} })();
</script>

// ---------- helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function rel(ts){ if(!ts) return ''; var d=Date.now()-Number(ts); var min=Math.floor(d/60000);
  if(min<1) return 'gerade eben'; if(min<60) return 'vor '+min+' Min.'; var h=Math.floor(min/60);
  if(h<24) return 'vor '+h+' Std.'; var day=Math.floor(h/24); if(day===1) return 'gestern'; if(day<7) return 'vor '+day+' Tagen';
  var dt=new Date(Number(ts)); return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function timeShort(ts){ if(!ts) return ''; var dt=new Date(Number(ts)); var today=new Date();
  var sameDay=dt.toDateString()===today.toDateString();
  return sameDay ? ('Heute, '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))
                 : dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+', '+dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

async function tapi(path, opts){
  opts=opts||{}; opts.headers=opts.headers||{};
  if(S.token) opts.headers['Authorization']='Bearer '+S.token;
  if(opts.body && typeof opts.body!=='string'){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(opts.body); }
  var r=await fetch(path, opts);
  if(r.status===401){ logout(); throw new Error('unauthorized'); }
  return r.json();
}

// ---------- auth ----------
function loadToken(){ try{ S.token=localStorage.getItem('fi_team_token')||null; S.role=localStorage.getItem('fi_team_role')||null; S.meName=localStorage.getItem('fi_team_name')||null; }catch(e){} }
function saveToken(t){ S.token=t; try{ t?localStorage.setItem('fi_team_token',t):localStorage.removeItem('fi_team_token'); }catch(e){} }
function saveRole(r,name){ S.role=r||null; if(name!=null) S.meName=name; try{ r?localStorage.setItem('fi_team_role',r):localStorage.removeItem('fi_team_role'); (name!=null&&name)?localStorage.setItem('fi_team_name',name):(name===''?localStorage.removeItem('fi_team_name'):0); }catch(e){} }
function logout(){ saveToken(null); saveRole(null,''); S.convs=[]; S.sel=null; S.selKey=null; render(); }

// ── Rollen-Sichtbarkeit ──────────────────────────────────────────────
// Angestellte (Trainer-Login) sehen nur das Tagesgeschäft. Diese Bereiche
// bleiben dem Admin (Passwort-Login) vorbehalten. Die eigentliche Sperre
// sitzt serverseitig – das hier steuert nur, was in der Oberfläche erscheint.
var ADMIN_ONLY_SCREENS={ stats:1, msg:1, leads:1 };
function isAdmin(){ return S.role==='admin'; }
function canSee(k){ return !ADMIN_ONLY_SCREENS[k] || isAdmin(); }
function meInitials(){ var n=String(S.meName||'').trim(); if(!n) return 'FI'; var p=n.split(/\s+/).filter(Boolean); var i=((p[0]&&p[0][0])||'')+((p[1]&&p[1][0])||''); return (i||n.slice(0,2)||'FI').toUpperCase(); }
function meDisplayName(){ return String(S.meName||'').trim() || (isAdmin()?'Admin':'Studio-Team'); }
function roleLabel(){ return isAdmin()?'Admin':'Angestellte(r)'; }
// Identität der aktuellen Sitzung nach Reload holen (Rolle sicher bestimmen).
async function loadMe(){
  try{ var r=await tapi('/api/team/me'); if(r&&r.ok){ saveRole(r.role||'admin', r.name||''); if(!canSee(S.screen)) S.screen='dash'; render(); } }catch(e){}
}

async function doLogin(pw){
  S.err=''; S.busy=true; render();
  try{
    var r=await tapi('/api/team/login',{method:'POST',body:{password:pw}});
    if(r.ok && r.token){ saveToken(r.token); saveRole(r.role||'admin','Admin'); S.busy=false; loadEmployees(); await loadInbox(); return; }
    S.err=r.message||'Login fehlgeschlagen.'; S.busy=false; render();
  }catch(e){ S.err='Verbindungsfehler.'; S.busy=false; render(); }
}

// Trainer-Login Schritt 1: Code an die (in Magicline hinterlegte) E-Mail anfordern.
async function doStaffRequest(email, channel){
  S.liErr=''; S.liBusy=true; render();
  try{
    var r=await tapi('/api/team/login',{method:'POST',body:{action:'requestCode',email:email,channel:channel||'email'}});
    S.liBusy=false;
    if(r && r.ok && r.challenge){ S.liChallenge=r.challenge; S.liChannelUsed=r.channel||'email'; S.liCode=''; render(); return; }
    S.liErr=(r&&r.message)||'Code konnte nicht gesendet werden.'; render();
  }catch(e){ S.liBusy=false; S.liErr='Verbindungsfehler.'; render(); }
}
// Trainer-Login Schritt 2: Code prüfen -> eigene Trainer-Session + App laden.
async function doStaffVerify(){
  var code=String(S.liCode||'').trim();
  if(!code){ return; }
  S.liErr=''; S.liBusy=true; render();

async function pollThread(){

  var key=S.selKey, p=splitKey(key);
  try{
    var r=await tapi('/api/team/conversation?m='+encodeURIComponent(p[0])+'&id='+encodeURIComponent(p[1]));
    if(!(r.ok && r.conversation) || S.selKey!==key) return;
    var oldM=S.sel.messages||[], newM=r.conversation.messages||[];
    var oldLast=oldM[oldM.length-1]||{}, newLast=newM[newM.length-1]||{};

// Datum (yyyy-mm-dd) hübsch (dd.mm.yyyy). Leer/ungültig -> ''.
function docDate(s){ if(!s) return ''; var d=new Date(String(s).slice(0,10)+'T00:00:00Z'); if(isNaN(d)) return String(s); var p=function(n){ return (n<10?'0':'')+n; }; return p(d.getUTCDate())+'.'+p(d.getUTCMonth()+1)+'.'+d.getUTCFullYear(); }
// Dokument herunterladen: GET liefert Rohbytes (Blob) ODER {ok:true,url} ODER 404.
async function downloadDoc(memberId, docId, name){
  try{
    var opts={ headers:{} }; if(S.token) opts.headers['Authorization']='Bearer '+S.token;
    var r=await fetch('/api/team/documents?memberId='+encodeURIComponent(memberId)+'&docId='+encodeURIComponent(docId)+'&name='+encodeURIComponent(name||'dokument'), opts);
    if(r.status===401){ logout(); return; }
    var ctype=String(r.headers.get('content-type')||'');
    if(/json/i.test(ctype)){
      var j=null; try{ j=await r.json(); }catch(e){}
      if(j&&j.ok&&j.url){ window.open(j.url,'_blank','noopener'); return; }
      alert((j&&j.message)||'Dokument nicht verfügbar.'); return;
    }
    if(!r.ok){ alert('Dokument nicht verfügbar.'); return; }
    var blob=await r.blob();
    var u=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=u; a.download=name||'dokument'; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
  }catch(e){ alert('Download fehlgeschlagen.'); }
}
// Datei (aus <input type=file>) als base64 hochladen -> POST. Größencheck clientseitig (~8 MB).
function uploadDocFile(memberId, file){
  if(!file) return;
  if(file.size>8*1024*1024){ S.docUploadMsg='Datei zu groß (max. 8 MB).'; render(); return; }
  S.docUploadBusy=true; S.docUploadMsg=''; render();
  var reader=new FileReader();
  reader.onload=async function(){
    var res=String(reader.result||''); var bi=res.indexOf('base64,'); var b64=bi>=0?res.slice(bi+7):res;
    var r=null;
    try{ r=await tapi('/api/team/documents',{method:'POST',body:{ memberId:memberId, name:file.name, contentType:file.type||'application/octet-stream', base64:b64 }}); }catch(e){}
    S.docUploadBusy=false;
    if(r&&r.ok){ S.docUploadMsg=''; loadProfileDocs(memberId); }
    else { S.docUploadMsg=(r&&r.message)||'Der Upload hat nicht geklappt.'; render(); }
  };
  reader.onerror=function(){ S.docUploadBusy=false; S.docUploadMsg='Datei konnte nicht gelesen werden.'; render(); };
  reader.readAsDataURL(file);
}

// yyyy-mm-dd-Presets für den Zeitraum. ...Silent: nur State setzen (kein render), fürs Öffnen.

function ciDate(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10); return ci2(d.getDate())+'.'+ci2(d.getMonth()+1)+'.'+d.getFullYear(); }
function ciTime(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return ci2(d.getHours())+':'+ci2(d.getMinutes()); }

// Check-in im gewählten Zeitraum? (leere Grenze = offen)
function ciInRange(c){
  var t=c&&c.in?new Date(c.in).getTime():NaN; if(!isFinite(t)) return false;
  if(S.ciFrom){ var f=new Date(S.ciFrom+'T00:00:00').getTime(); if(isFinite(f)&&t<f) return false; }
  if(S.ciTo){ var e=new Date(S.ciTo+'T23:59:59').getTime(); if(isFinite(e)&&t>e) return false; }
  return true;
}

// Slot-Zeit-Helfer (deutsches Format).
function slDay(iso){ var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10); return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}); }
function slTime(iso){ var d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
// Slots nach Tag gruppieren (Reihenfolge erhalten). -> [{day, items:[{i, slot}]}]
function slGroup(slots){
  var groups=[], byDay={};
  (slots||[]).forEach(function(s,i){ var k=String(s.start).slice(0,10); if(!byDay[k]){ byDay[k]={day:k,label:slDay(s.start),items:[]}; groups.push(byDay[k]); } byDay[k].items.push({i:i, slot:s}); });
  return groups;
}

function wireAp(scope){
  if(!S.apOpen) return;
  var ov=scope.querySelector('[data-apoverlay]'); if(ov) ov.onclick=closeApptBook;
  var card=scope.querySelector('[data-apcard]'); if(card) card.onclick=function(e){ e.stopPropagation(); };
  var x=scope.querySelector('[data-apx]'); if(x) x.onclick=closeApptBook;
  var cc=scope.querySelector('[data-apcancel]'); if(cc) cc.onclick=closeApptBook;
  var ty=scope.querySelector('#aptype'); if(ty) ty.onchange=function(){ var o=ty.options[ty.selectedIndex]; if(ty.value) apChooseType(ty.value, o?o.textContent:''); else { S.apTypeId=''; S.apSlots=null; S.apSlotSel=null; render(); } };
  scope.querySelectorAll('[data-apslot]').forEach(function(b){ b.onclick=function(){ apPickSlot(parseInt(b.getAttribute('data-apslot'),10)); }; });
  var bk=scope.querySelector('[data-apbook]'); if(bk) bk.onclick=apDoBook;
}
// Studio-weite Wochenübersicht laden (best effort). Ist der Abruf nicht verfügbar
// (available:false), bleibt S.studioApptsAvailable false und die Karte erscheint gar nicht.
async function loadStudioAppts(){
  if(S.studioApptsLoaded) return; S.studioApptsLoaded=true;
  try{
    var now=new Date(); var from=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0);
    var to=new Date(from.getTime()+7*86400000);
    var r=await tapi('/api/team/appointments?from='+encodeURIComponent(from.toISOString())+'&to='+encodeURIComponent(to.toISOString()));
    if(r&&r.ok&&r.available){ S.studioApptsAvailable=true; S.studioAppts=r.appointments||[]; }
  }catch(e){}
  if(S.studioApptsAvailable && S.screen==='appts') render();
}

    body=
      '<label style="display:block;font-size:12px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px">Deine E-Mail (in Magicline hinterlegt)</label>'+
      '<input id="liemail" type="email" autocomplete="email" placeholder="name@fit-inn-trier.de" value="'+esc(S.liEmail||'')+'" style="width:100%;padding:13px 15px;border:1.5px solid #dce3e4;border-radius:12px;font-size:15px;background:#fbfcfc">'+
      (S.liErr?'<div style="margin-top:11px;font-size:13px;font-weight:700;color:#b53a2c;background:#fbeae7;border-radius:10px;padding:9px 12px">'+esc(S.liErr)+'</div>':'')+
      '<button id="lireq" style="margin-top:16px;width:100%;padding:13px;border:none;border-radius:12px;background:'+TEAL+';color:#fff;font-size:15px;font-weight:800">'+(S.liBusy?'Code wird gesendet …':'Code per E-Mail')+'</button>'+
      '<button id="lireqwa" style="margin-top:9px;width:100%;padding:12px;border:1.5px solid #1F9A4E;border-radius:12px;background:#e8f6ed;color:#1F9A4E;font-size:14px;font-weight:800;cursor:pointer">Code per WhatsApp</button>';
  } else {
    body=
      '<label style="display:block;font-size:12px;font-weight:800;color:#8a929a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px">Team-Passwort</label>'+

  }

      '<span style="font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#0e6072;background:#F6A964;border-radius:6px;padding:3px 8px">Team</span>'+

    var lc=card.querySelector('#licode'), lv=card.querySelector('#liverify'), lb=card.querySelector('#liback');
    lc.oninput=function(){ S.liCode=lc.value; var d=String(lc.value||'').replace(/\D/g,''); if(d.length===6 && !S.liBusy){ S.liCode=d; doStaffVerify(); } };
    lv.onclick=function(){ S.liCode=(lc.value||'').trim(); if(!S.liBusy) doStaffVerify(); };
    lc.onkeydown=function(e){ if(e.key==='Enter'){ S.liCode=(lc.value||'').trim(); if(!S.liBusy) doStaffVerify(); } };
    lb.onclick=function(){ S.liChallenge=''; S.liCode=''; S.liErr=''; render(); };

    var le=card.querySelector('#liemail'), lr=card.querySelector('#lireq'), lrw=card.querySelector('#lireqwa');

    le.oninput=function(){ S.liEmail=le.value; };

    le.onkeydown=function(e){ if(e.key==='Enter') subReq('email'); }; le.focus();
  } else {
    var pw=card.querySelector('#pw'), go=card.querySelector('#go');

    go.onclick=submit; pw.onkeydown=function(e){ if(e.key==='Enter') submit(); }; pw.focus();
  }
}

// ---------- render: inbox ----------
function filtered(){
  var f=S.filter, term=(S.search||'').trim().toLowerCase();
  var list=S.convs.slice();
  if(f==='open') list=list.filter(function(c){ return c.teamStatus!=='abgeschlossen'; });
  else if(f==='neu') list=list.filter(function(c){ return c.teamStatus==='neu'; });
  else if(f==='done') list=list.filter(function(c){ return c.teamStatus==='abgeschlossen'; });
  if(term) list=list.filter(function(c){ return (c.member.name+' '+(c.member.nr||'')+' '+tm(c.type).l+' '+c.ref).toLowerCase().indexOf(term)>=0; });
  return list;
}

  if(S.loading && !S.convs.length) return '<div style="padding:40px;text-align:center"><span class="spin"></span></div>';
  var rows=filtered();

// Eine Zeile „Label: Wert" fürs Mitgliedsdaten-Panel (leere Werte werden weggelassen).
function pinfoRow(label, val){
  if(val==null || val==='') return '';
  return '<div style="display:flex;gap:8px;padding:4px 0;font-size:12.5px;align-items:baseline"><span style="color:#8a929a;font-weight:600;min-width:96px;flex-shrink:0">'+esc(label)+'</span><span style="color:#2a3338;font-weight:700;flex:1;text-align:right;word-break:break-word">'+esc(val)+'</span></div>';
}
// Magicline-Daten des Mitglieds (Vertrag, Kontakt, Termine) für das Kontext-Panel.
function convProfileHTML(sel){
  if(sel.member && sel.member.lead) return '<div style="font-size:12.5px;color:#8a929a;font-weight:600">Interessent – noch kein Magicline-Profil.'+(sel.member.phone?'<br>Tel.: '+esc(sel.member.phone):'')+'</div>';
  if(S.convProfileLoading) return '<div style="padding:12px;text-align:center"><span class="spin"></span></div>';
  var p=S.convProfile;
  if(!p) return '<div style="font-size:12.5px;color:#a9b1b6;font-weight:600">Keine Magicline-Daten verfügbar.</div>';
  var ct=p.contract||{};
  var hasContract = !!(p.contract && (ct.rateName || ct.startDate || ct.active!=null));
  var statusLabel = !hasContract ? null : (ct.active===false ? (ct.reversed?'Widerrufen':'Ehemalig') : 'Aktiv');
  var rows = pinfoRow('Mitgliedsnr.',p.nr)
    + pinfoRow('Status',statusLabel)
    + pinfoRow('Tarif',ct.rateName)
    + pinfoRow('Mitglied seit',ct.startDate)
    + pinfoRow('Vertragsende',ct.endDate||(ct.active===false?null:'läuft'))
    + pinfoRow('Nächste Kündigung',ct.nextCancellationDate)
    + pinfoRow('Telefon',p.phone)
    + pinfoRow('E-Mail',p.email)
    + pinfoRow('Geburtstag',p.birthday)
    + pinfoRow('Adresse',p.address)
    + pinfoRow('IBAN',p.ibanMasked);
  var appts = (p.appointments&&p.appointments.length)
    ? '<div style="margin-top:9px;padding-top:9px;border-top:1px solid #eef3f4"><div style="font-size:10.5px;font-weight:800;color:#8a929a;letter-spacing:.5px;margin-bottom:5px">NÄCHSTE TERMINE</div>'+p.appointments.slice(0,3).map(function(a){ return '<div style="font-size:12px;color:#2a3338;font-weight:600;padding:2px 0">'+esc(a.title)+' · '+esc(fmtDT(a.start))+'</div>'; }).join('')+'</div>'
    : '';
  var prof = '<div style="margin-top:9px;padding-top:9px;border-top:1px solid #eef3f4"><button data-openprof="'+esc(p.id||'')+'" style="font-size:12px;font-weight:800;color:'+TEAL+';background:none;border:none;padding:0;cursor:pointer">Vollständiges Profil ›</button></div>';
  return (rows||'<div style="font-size:12.5px;color:#a9b1b6;font-weight:600">Keine Stammdaten.</div>') + appts + prof;
}

// ---------- Textbausteine (verwaltbare Schnellantworten) ----------
// Aktive Baustein-Liste: geladene Bausteine (auch bewusst leer) – sonst Fallback
// auf die eingebauten TEMPLATES (vor dem Laden bzw. bei Ladefehler).
function snipItems(){
  if(S.snippets) return S.snippets;
  return TEMPLATES.map(function(t){ return { id:null, text:t }; });
}
// Inhalt des aufklappbaren Vorlagen-Panels (data-tpl-Buttons + „verwalten").

    '<button data-managesnip="1" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:2px;border:1px dashed #cdd6d8;background:#f7fafb;color:#0a4958;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Bausteine verwalten</button>'+

// HTML des Verwalten-Dialogs (Liste mit Bearbeiten/Löschen + Neuanlage).

          '<textarea id="snipeditbox" rows="3" style="width:100%;border:1px solid #d6dee0;border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.5;resize:vertical;outline:none;box-sizing:border-box">'+esc(S.snipEdit.text)+'</textarea>'+
          '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:9px">'+
            '<button id="snipeditcancel" style="border:1.5px solid #d6dee0;background:#fff;border-radius:10px;font-size:12.5px;font-weight:800;padding:8px 14px;color:#6b7780;cursor:pointer">Abbrechen</button>'+
            '<button id="snipeditsave" '+(S.snippetsBusy?'disabled':'')+' style="border:none;background:'+TEAL+';color:#fff;border-radius:10px;font-size:12.5px;font-weight:800;padding:8px 16px;cursor:pointer;opacity:'+(S.snippetsBusy?'.6':'1')+'">Speichern</button>'+

          '<button data-snipdelete="'+esc(s.id)+'" style="border:1.5px solid #f0d9d4;background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:800;color:#b53a2c;cursor:pointer">Löschen</button>'+
        '</div></div>';

    '<div style="display:flex;justify-content:flex-end;margin-top:9px">'+
      '<button id="snipadd" '+(S.snippetsBusy?'disabled':'')+' style="border:none;background:'+ORANGE+';color:#fff;border-radius:11px;font-size:13px;font-weight:800;padding:9px 18px;cursor:pointer;opacity:'+(S.snippetsBusy?'.6':'1')+'">Hinzufügen</button>'+

// Bausteine vom Server laden; bei Fehler bleibt S.snippets=null -> TEMPLATES-Fallback.
async function loadSnippets(){
  if(S.snippetsLoading) return;
  S.snippetsLoading=true;
  try{ var r=await tapi('/api/team/snippets'); if(r && Array.isArray(r.snippets)) S.snippets=r.snippets; }
  catch(e){}
  S.snippetsLoaded=true; S.snippetsLoading=false; render();
}
// Mutation an den Server schicken; Antwort enthält immer die frische Liste.
async function snipMutate(body){
  S.snippetsBusy=true; render();
  var r=null;
  try{ r=await tapi('/api/team/snippets',{method:'POST',body:body}); }catch(e){}
  if(r && Array.isArray(r.snippets)) S.snippets=r.snippets;
  S.snippetsBusy=false; S.snippetsLoaded=true;
  if(r && r.ok===false && r.message) alert(r.message);
  return r;
}
async function addSnip(text){ var t=(text||'').trim(); if(!t) return; await snipMutate({action:'add', text:t}); S.snipNew=''; render(); }
async function updateSnip(id, text){ var t=(text||'').trim(); if(!t||!id) return; await snipMutate({action:'update', id:id, text:t}); S.snipEdit=null; render(); }
async function deleteSnip(id){ if(!id) return; if(!window.confirm('Diesen Baustein wirklich löschen?')) return; await snipMutate({action:'delete', id:id}); if(S.snipEdit && String(S.snipEdit.id)===String(id)) S.snipEdit=null; render(); }

function wireInbox(node){
  var is=node.querySelector('#isearch'); if(is) is.oninput=function(){ S.search=is.value; var c=node.querySelector('#convrows'); if(c){ c.innerHTML=rowsHTML(); wireRows(c); } };
  node.querySelectorAll('[data-filter]').forEach(function(b){ b.onclick=function(){ S.filter=b.getAttribute('data-filter'); render(); }; });
  wireRows(node);
  var back=node.querySelector('[data-back]'); if(back) back.onclick=function(){ S.mobileThread=false; render(); };
  var pt=node.querySelector('[data-panel]'); if(pt) pt.onclick=function(){ S.panelOpen=!S.panelOpen; render(); };
  var dr=node.querySelector('#draft'); if(dr){ dr.oninput=function(){ S.draft=dr.value; var sb=node.querySelector('#send'); if(sb) sb.style.background=(dr.value.trim()?TEAL:'#9fb4b8'); };
    dr.onkeydown=function(e){ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); sendReply(); } }; }
  var sd=node.querySelector('#send'); if(sd) sd.onclick=sendReply;
  node.querySelectorAll('[data-ch]').forEach(function(b){ b.onclick=function(){ S.replyChannel=b.getAttribute('data-ch'); render(); }; });
  var aid=node.querySelector('[data-aidraft]'); if(aid) aid.onclick=suggestReply;
  var qk=node.querySelector('[data-quick]'); if(qk) qk.onclick=function(){ S.quickOpen=!S.quickOpen; if(S.quickOpen && !S.snippetsLoaded) loadSnippets(); render(); };
  node.querySelectorAll('[data-tpl]').forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute('data-tpl'); var items=snipItems(); var tp=(items[i]&&items[i].text)||''; S.draft=(S.draft&&S.draft.trim())?(S.draft.replace(/\s+$/,'')+'\n\n'+tp):tp; S.quickOpen=false; render(); var d=root.querySelector('#draft'); if(d){ d.focus(); d.setSelectionRange(d.value.length,d.value.length); } }; });
  // Textbausteine verwalten (Dialog)
  var msb=node.querySelector('[data-managesnip]'); if(msb) msb.onclick=function(){ S.manageOpen=true; S.snipEdit=null; if(!S.snippetsLoaded) loadSnippets(); render(); };
  var scl=node.querySelector('[data-snipclose]'); if(scl) scl.onclick=function(){ S.manageOpen=false; S.snipEdit=null; render(); };
  var snn=node.querySelector('#snipnew'); if(snn) snn.oninput=function(){ S.snipNew=snn.value; };
  var sna=node.querySelector('#snipadd'); if(sna) sna.onclick=function(){ addSnip(S.snipNew); };
  node.querySelectorAll('[data-snipedit]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-snipedit'); var it=(S.snippets||[]).filter(function(s){ return String(s.id)===String(id); })[0]; S.snipEdit={id:id, text:it?it.text:''}; render(); }; });
  node.querySelectorAll('[data-snipdelete]').forEach(function(b){ b.onclick=function(){ deleteSnip(b.getAttribute('data-snipdelete')); }; });
  var seb=node.querySelector('#snipeditbox'); if(seb) seb.oninput=function(){ if(S.snipEdit) S.snipEdit.text=seb.value; };
  var ses=node.querySelector('#snipeditsave'); if(ses) ses.onclick=function(){ if(S.snipEdit) updateSnip(S.snipEdit.id, S.snipEdit.text); };
  var sec=node.querySelector('#snipeditcancel'); if(sec) sec.onclick=function(){ S.snipEdit=null; render(); };
  var nt=node.querySelector('#note'); if(nt) nt.oninput=function(){ S.note=nt.value; };
  var an=node.querySelector('#addnote'); if(an) an.onclick=function(){ var v=(S.note||'').trim(); if(v) act('note',{text:v}); };
  node.querySelectorAll('[data-status]').forEach(function(b){ b.onclick=function(){ act('status',{value:b.getAttribute('data-status')}); }; });
  node.querySelectorAll('[data-prio]').forEach(function(b){ b.onclick=function(){ act('priority',{value:b.getAttribute('data-prio')}); }; });
  node.querySelectorAll('[data-assignid]').forEach(function(b){ b.onclick=function(){ act('assign',{assigneeId:b.getAttribute('data-assignid')||null, assigneeName:b.getAttribute('data-assignname')||null}); }; });
  var cc=node.querySelector('#closecase'); if(cc) cc.onclick=function(){ act(S.sel.teamStatus==='abgeschlossen'?'reopen':'close'); };
  var rb=node.querySelector('[data-reassign]'); if(rb) rb.onclick=openReassign;
  var op=node.querySelector('[data-openprof]'); if(op) op.onclick=function(){ var id=op.getAttribute('data-openprof'); if(id){ S.screen='members'; openProfile(id); } };
  var ras=node.querySelector('#rasearch'); if(ras){ ras.oninput=function(){ onReassignSearch(ras.value); }; }
  var rac=node.querySelector('#racancel'); if(rac) rac.onclick=closeReassign;
  if(S.reassignOpen) updateRaRows();
  var mb=node.querySelector('[data-merge]'); if(mb) mb.onclick=openMerge;
  var mgs=node.querySelector('#mgsearch'); if(mgs){ mgs.oninput=function(){ onMergeSearch(mgs.value); }; }
  var mgc=node.querySelector('#mgcancel'); if(mgc) mgc.onclick=closeMerge;
  if(S.mergeOpen) updateMgRows();
  // Chat ans Ende scrollen + „klebt unten"-Status pflegen
  var tmsg=node.querySelector('#threadmsgs');
  if(tmsg){
    tmsg.scrollTop = stickBottom ? tmsg.scrollHeight : lastThreadScroll;
    tmsg.onscroll=function(){ lastThreadScroll=tmsg.scrollTop; stickBottom = (tmsg.scrollHeight - tmsg.scrollTop - tmsg.clientHeight) < 80; };
  }
}
function sendReply(){ var v=(S.draft||'').trim(); if(v && !S.busy){ stickBottom=true; act('reply',{text:v, channel:S.replyChannel}); } }

// KI-Antwortentwurf holen und ins Antwortfeld (#draft) setzen – gesendet wird nichts automatisch.
async function suggestReply(){
  if(!S.sel || S.aiBusy) return;
  var memberId=S.sel.memberId, id=S.sel.id;
  S.aiBusy=true; render();
  var r;
  try{ r=await tapi('/api/team/suggest-reply',{method:'POST',body:{memberId:memberId, id:id}}); }
  catch(e){ r={ok:false}; }
  S.aiBusy=false;
  if(r && r.ok && r.draft){
    // nur einfügen, wenn noch derselbe Vorgang offen ist
    if(S.sel && S.sel.memberId===memberId && String(S.sel.id)===String(id)){ S.draft=r.draft; S.quickOpen=false; }
  } else if(r && r.error==='no_ai'){
    S.aiUnavailable=true;
  } else {
    alert((r&&r.message)||'KI-Entwurf konnte nicht erstellt werden.');
  }
  render();
  var d=root.querySelector('#draft'); if(d && r && r.ok){ d.focus(); d.setSelectionRange(d.value.length,d.value.length); }
}

    var txt = c.teamStatus==='abgeschlossen' ? ('„'+t.l+"“ abgeschlossen")

async function saveMember(id){
  if(S.editBusy) return;
  var g=function(i){ var e=document.getElementById(i); return e?e.value.trim():''; };
  var body={ id:id, street:g('ed_street'), houseNumber:g('ed_house'), zipCode:g('ed_zip'), city:g('ed_city') };
  if(!body.street||!body.zipCode||!body.city){ S.editMsg='Bitte Straße, PLZ und Ort ausfüllen.'; render(); return; }
  S.editBusy=true; S.editMsg=''; render();
  try{
    var r=await tapi('/api/team/member-update',{method:'POST',body:body});
    S.editBusy=false;
    if(r&&r.ok){ S.editMember=false; openProfile(id); }
    else { S.editMsg=(r&&r.message)||'Konnte nicht gespeichert werden.'; render(); }
  }catch(e){ S.editBusy=false; S.editMsg='Verbindung fehlgeschlagen.'; render(); }
}
// DSGVO: Mitglied anonymisieren – zweistufige Bestätigung (Warn-Dialog + exakte
// Eingabe der Mitgliedsnummer), erst dann geht der Aufruf an Magicline.
async function anonymiseMember(p){
  if(!p || !p.id) return;
  if(!window.confirm('Mitglied „'+p.name+'“ wirklich anonymisieren?\n\nACHTUNG: Dieser Schritt ist unwiderruflich. Alle personenbezogenen Daten werden in Magicline anonymisiert und können nicht wiederhergestellt werden.')) return;
  var nr=p.nr!=null?String(p.nr):'';
  if(!nr){ alert('Keine Mitgliedsnummer vorhanden – Anonymisierung hier nicht möglich.'); return; }
  var typed=window.prompt('Zur Bestätigung bitte die Mitgliedsnummer exakt eintippen ('+nr+'):','');
  if(typed==null) return;
  if(typed.trim()!==nr){ alert('Die Eingabe stimmt nicht mit der Mitgliedsnummer überein – Vorgang abgebrochen.'); return; }
  try{
    var r=await tapi('/api/team/member-update',{method:'POST',body:{id:p.id, action:'anonymise'}});
    if(r&&r.ok){
      alert('Mitglied wurde anonymisiert.');
      S.profile=null; S.membersLoaded=false; S.screen='members'; loadMembers();
    } else {
      alert((r&&r.message)||'Anonymisierung fehlgeschlagen.');
    }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}

var BCSEG=[
  {k:'app',l:'App-Nutzer',d:'Alle mit App & Push-Freigabe'},

function updateBroadcastCount(){
  var c=document.getElementById('bccount'); if(!c) return;
  c.innerHTML = S.bcCountLoading
    ? '<span class="spin" style="width:15px;height:15px;border-width:2px"></span><span style="color:#8a929a;font-weight:700;font-size:13px">Empfänger werden ermittelt …</span>'
    : (S.bcCount==null
        ? '<span style="color:#8a929a;font-weight:700;font-size:13px">Empfängerzahl nicht verfügbar.</span>'
        : '<span style="font-size:22px;font-weight:900;color:#0a4958">'+esc(String(S.bcCount))+'</span><span style="color:#6b7780;font-weight:700;font-size:13px">Empfänger'+(S.bcCount>=500?' (max. 500)':'')+'</span>');
}
async function loadBroadcastCount(){
  var seg=S.bcSegment;
  S.bcCountLoading=true; S.bcCount=null; updateBroadcastCount();
  try{ var r=await tapi('/api/team/broadcast?segment='+encodeURIComponent(seg)); if(S.bcSegment===seg){ S.bcCount=(r&&r.ok)?r.count:null; } }
  catch(e){ if(S.bcSegment===seg) S.bcCount=null; }
  if(S.bcSegment===seg){ S.bcCountLoading=false; updateBroadcastCount(); }
}
function setBcSegment(k){ if(S.bcSegment===k) return; S.bcSegment=k; S.bcResult=null; render(); loadBroadcastCount(); }
async function doSendBroadcast(){
  if(S.bcBusy) return;
  var title=(S.bcTitle||'').trim(), body=(S.bcBody||'').trim();
  if(!title||!body){ alert('Bitte Titel und Text ausfüllen.'); return; }
  if(!S.bcPush && !S.bcEmail && !S.bcWa){ alert('Bitte mindestens einen Kanal (Push, E-Mail oder WhatsApp) wählen.'); return; }
  var seg=(BCSEG.find(function(s){ return s.k===S.bcSegment; })||{}).l||S.bcSegment;
  var n=(S.bcCount!=null)?S.bcCount:'?';
  if(!window.confirm('Rundnachricht an Segment „'+seg+'“ ('+n+' Empfänger) senden?')) return;
  S.bcBusy=true; S.bcResult=null; render();
  try{
    var r=await tapi('/api/team/broadcast',{method:'POST',body:{segment:S.bcSegment,title:title,body:body,channels:{push:!!S.bcPush,email:!!S.bcEmail,whatsapp:!!S.bcWa}}});
    S.bcBusy=false;
    if(r && r.ok){ S.bcResult=r; S.bcTitle=''; S.bcBody=''; }
    else { alert((r&&r.message)||'Rundnachricht konnte nicht gesendet werden.'); }
  }catch(e){ S.bcBusy=false; alert('Verbindung fehlgeschlagen.'); }
  render();
}

function replaceLead(lead){ for(var i=0;i<S.leads.length;i++){ if(S.leads[i].id===lead.id){ S.leads[i]=lead; return; } } S.leads.unshift(lead); }
async function leadSetStatus(id,status){
  if(S.leadBusy) return;
  S.leadBusy=id; render();
  try{
    var r=await tapi('/api/team/leads',{method:'POST',body:{id:id,action:'status',status:status}});
    if(r && r.ok && r.lead){ replaceLead(r.lead); }
    else { alert((r&&r.message)||'Status konnte nicht geändert werden.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
  S.leadBusy=''; render();
}
async function leadAssign(id,emp){
  if(S.leadBusy) return;
  S.leadBusy=id; render();
  var assignee=(emp && !emp.none) ? {id:(emp.id!=null?String(emp.id):null), name:emp.name} : null;
  try{
    var r=await tapi('/api/team/leads',{method:'POST',body:{id:id,action:'assign',assignee:assignee}});
    if(r && r.ok && r.lead){ replaceLead(r.lead); }
    else { alert((r&&r.message)||'Zuweisung fehlgeschlagen.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
  S.leadBusy=''; render();
}

function leadsNode(){

    return node;
  }
  var leads=S.leads||[];

      '<div style="font-size:12px;font-weight:700;color:#6b7780;margin-top:4px">'+esc(o.l)+'</div></div>';
  }).join('');
  var chipDefs=[{k:'all',l:'Alle',n:total}].concat(LEADORDER.map(function(k){ return {k:k,l:LEADSTAT[k].l,n:counts[k]}; }));
  var chips=chipDefs.map(function(c){ var a=S.leadFilter===c.k;
    return '<button data-lfilter="'+esc(c.k)+'" style="border:1.5px solid '+(a?TEAL:'#dce3e4')+';background:'+(a?'#e7f1f3':'#fff')+';color:'+(a?TEAL:'#6b7780')+';border-radius:100px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px">'+esc(c.l)+'<span style="font-size:11px;font-weight:800;color:'+(a?'#fff':'#8a929a')+';background:'+(a?TEAL:'#eef2f3')+';border-radius:20px;min-width:19px;height:18px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center">'+esc(String(c.n))+'</span></button>';

  var rows=list.length ? list.map(leadRowHTML).join('')
    : '<div style="background:#fff;border-radius:16px;padding:44px 20px;text-align:center;box-shadow:0 10px 26px rgba(4,33,40,.07)"><div style="font-size:15px;font-weight:900;color:#15171B">Keine Interessenten</div><div style="font-size:13px;color:#8a929a;font-weight:600;margin-top:6px;line-height:1.5">'+(total?'In diesem Status ist gerade niemand.':'Neue Anfragen (Probetraining, WhatsApp, Kontakt) erscheinen hier automatisch.')+'</div></div>';

  '</div>';
  setTimeout(function(){ wireLeads(node); },0);
  return node;

function wireLeads(node){
  node.querySelectorAll('[data-lfilter]').forEach(function(b){ b.onclick=function(){ setLeadFilter(b.getAttribute('data-lfilter')); }; });
  node.querySelectorAll('[data-lstatus]').forEach(function(b){ b.onclick=function(){ leadSetStatus(b.getAttribute('data-lid'), b.getAttribute('data-lstatus')); }; });
  node.querySelectorAll('[data-laid]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-laid'); leadAssign(b.getAttribute('data-lid'), id?{id:id,name:b.getAttribute('data-laname')}:{none:true}); }; });
}

// ---------- Aufgaben (interne To-do-Liste) ----------
function todoInitials(nm){ var p=String(nm||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '·'; return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }
function todoDueLabel(due){ var m=String(due||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?(m[3]+'.'+m[2]+'.'+m[1]):''; }
function todoDueState(due){
  var m=String(due||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return null;
  var d=new Date(m[1]+'-'+m[2]+'-'+m[3]+'T00:00:00'); var today=new Date(); today.setHours(0,0,0,0);
  var diff=Math.round((d-today)/86400000);
  return { label:todoDueLabel(due), overdue:diff<0, soon:diff>=0&&diff<=2, diff:diff };
}
async function loadTodos(){
  S.todosLoading=true; render();
  try{ var r=await tapi('/api/team/todos'); if(r && r.ok){ S.todos=r.todos||[]; } S.todosLoaded=true; }
  catch(e){}
  S.todosLoading=false; render();
}
function setTodoFilter(k){ if(S.todoFilter===k) return; S.todoFilter=k; render(); }
async function todoAdd(){
  if(S.todoAddBusy) return;
  var text=(S.todoText||'').trim();
  if(!text){ alert('Bitte einen Aufgabentext eingeben.'); return; }
  var assignee=null;
  if(S.todoAssignee && S.employees){ for(var i=0;i<S.employees.length;i++){ if(String(S.employees[i].id)===String(S.todoAssignee)){ assignee={id:String(S.employees[i].id),name:S.employees[i].name}; break; } } }
  S.todoAddBusy=true; render();
  try{
    var r=await tapi('/api/team/todos',{method:'POST',body:{action:'add',text:text,assignee:assignee,due:S.todoDue||null}});
    if(r && r.ok){ S.todos=r.todos||[]; S.todoText=''; S.todoAssignee=''; S.todoDue=''; }
    else { alert((r&&r.message)||'Aufgabe konnte nicht angelegt werden.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
  S.todoAddBusy=false; render();
}
async function todoToggle(id,done){
  if(S.todoBusy) return;
  S.todoBusy=id; render();
  try{
    var r=await tapi('/api/team/todos',{method:'POST',body:{action:'update',id:id,done:!!done}});
    if(r && r.ok){ S.todos=r.todos||[]; }
    else { alert((r&&r.message)||'Aufgabe konnte nicht aktualisiert werden.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
  S.todoBusy=''; render();
}
async function todoDelete(id){
  if(S.todoBusy) return;
  if(!confirm('Diese Aufgabe löschen?')) return;
  S.todoBusy=id; render();
  try{
    var r=await tapi('/api/team/todos',{method:'POST',body:{action:'delete',id:id}});
    if(r && r.ok){ S.todos=r.todos||[]; }
    else { alert((r&&r.message)||'Aufgabe konnte nicht gelöscht werden.'); }
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
  S.todoBusy=''; render();
}
function todoRowHTML(t){
  var busy=(S.todoBusy===t.id), done=!!t.done;
  var dueHtml='';
  if(t.due){
    var ds=done?null:todoDueState(t.due); var lab=todoDueLabel(t.due);
    var col='#6b7780', bg='#eef2f3';
    if(ds&&ds.overdue){ col='#b53a2c'; bg='#fbeae7'; }
    else if(ds&&ds.soon){ col='#C77A2E'; bg='#fbf0e3'; }
    dueHtml='<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:'+col+';background:'+bg+';border-radius:8px;padding:3px 9px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'+esc(lab)+((ds&&ds.overdue)?' · überfällig':'')+'</span>';
  }
  var who=assigneeName(t.assignee);
  var whoHtml=who?('<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#0a4958;background:#eef3f4;border-radius:8px;padding:3px 9px"><span style="width:16px;height:16px;border-radius:50%;background:#0a4958;color:#fff;font-size:8.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center">'+esc(todoInitials(who))+'</span>'+esc(who)+'</span>'):'';
  var meta=(dueHtml||whoHtml)?('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">'+dueHtml+whoHtml+'</div>'):'';
  var check=done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':'';
  var right=busy
    ? '<span class="spin" style="width:15px;height:15px;border-width:2px;flex-shrink:0;margin-top:3px"></span>'
    : '<button data-tdel="'+esc(t.id)+'" title="Löschen" aria-label="Löschen" style="flex-shrink:0;border:none;background:none;cursor:pointer;color:#c0c8cc;padding:4px;border-radius:8px;line-height:0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>';
  return '<div style="background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(4,33,40,.07);padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:13px'+(done?';opacity:.66':'')+'">'+
    '<button data-ttoggle="'+esc(t.id)+'" data-tdone="'+(done?'0':'1')+'"'+(busy?' disabled':'')+' aria-label="Erledigt umschalten" style="flex-shrink:0;margin-top:1px;width:24px;height:24px;border-radius:7px;border:2px solid '+(done?TEAL:'#c6d0d2')+';background:'+(done?TEAL:'#fff')+';cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">'+check+'</button>'+
    '<div style="min-width:0;flex:1">'+
      '<div style="font-size:14.5px;font-weight:700;line-height:1.4;word-break:break-word;'+(done?'text-decoration:line-through;color:#8a929a':'color:#15171B')+'">'+esc(t.text)+'</div>'+
      meta+
    '</div>'+
    right+
  '</div>';
}

  node.innerHTML='<div style="max-width:820px">'+form+tiles+'<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">'+chips+'</div>'+rows+'</div>';

  return node;
}
function wireTodos(node){
  var ti=node.querySelector('#todotext'); if(ti) ti.oninput=function(){ S.todoText=ti.value; };
  var ta=node.querySelector('#todoassignee'); if(ta) ta.onchange=function(){ S.todoAssignee=ta.value; };
  var td=node.querySelector('#tododue'); if(td) td.onchange=function(){ S.todoDue=td.value; };
  var ab=node.querySelector('[data-tadd]'); if(ab) ab.onclick=todoAdd;
  node.querySelectorAll('[data-tfilter]').forEach(function(b){ b.onclick=function(){ setTodoFilter(b.getAttribute('data-tfilter')); }; });
  node.querySelectorAll('[data-ttoggle]').forEach(function(b){ b.onclick=function(){ todoToggle(b.getAttribute('data-ttoggle'), b.getAttribute('data-tdone')==='1'); }; });
  node.querySelectorAll('[data-tdel]').forEach(function(b){ b.onclick=function(){ todoDelete(b.getAttribute('data-tdel')); }; });
}

  flaeche:{label:'Fläche',chipColor:'#176b37',chipBg:'#E7F6EC',accent:'#0e6072'},
  kurs:{label:'Kurs',chipColor:'#6b4fd8',chipBg:'#EFEBFB',accent:'#8E7BF0'} };
function shRole(r){ return SH_ROLES[r]||SH_ROLES.theke; }
var SH_DOW=['So','Mo','Di','Mi','Do','Fr','Sa'];
var SH_DOWFULL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function shPad(n){ return (n<10?'0':'')+n; }
function shParse(iso){ var m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return new Date(); return new Date(+m[1],+m[2]-1,+m[3]); }
function shISO(d){ return d.getFullYear()+'-'+shPad(d.getMonth()+1)+'-'+shPad(d.getDate()); }
function shToday(){ return shISO(new Date()); }
function shMonday(iso){ var d=shParse(iso||shToday()); d.setDate(d.getDate()-((d.getDay()+6)%7)); return shISO(d); }
function shAddDays(iso,n){ var d=shParse(iso); d.setDate(d.getDate()+n); return shISO(d); }
function shWeekDates(){ var out=[],mon=S.shWeek||shMonday(); for(var i=0;i<7;i++) out.push(shAddDays(mon,i)); return out; }
// ISO-Kalenderwoche (Donnerstags-Regel) fürs "KW n"-Label.
function shKW(iso){ var d=shParse(iso); var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  var firstThu=new Date(t.getFullYear(),0,4);
  firstThu.setDate(firstThu.getDate()+3-((firstThu.getDay()+6)%7));
  return 1+Math.round((t-firstThu)/604800000); }
function shDM(iso){ var d=shParse(iso); return shPad(d.getDate())+'.'+shPad(d.getMonth()+1)+'.'; }
function shStr(sh){ return SH_DOW[shParse(sh.date).getDay()]+' '+shDM(sh.date)+' · '+sh.start+'–'+sh.end+' '+shRole(sh.role).label; }
function shInitials(nm){ var p=String(nm||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }
function shFirstName(nm){ return String(nm||'').split(' ')[0]||''; }
function shMe(){ return (S.shData&&S.shData.me)||{employeeId:null,name:'Team',role:'admin',initials:'FI'}; }
function shFindShift(id){ var found=null; (((S.shData||{}).days)||[]).forEach(function(x){ (x.shifts||[]).forEach(function(sh){ if(String(sh.id)===String(id)) found=sh; }); }); return found; }
function shSunIcon(sz){ return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="#F6A964" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6l1.5 1.5M18 18l-1.5-1.5M6 18l1.5-1.5M18 6l-1.5 1.5"/></svg>'; }

// ---- Laden ----
async function loadShifts(){
  if(!S.shWeek) S.shWeek=shMonday(shToday());
  if(S.shLoading) return;
  S.shLoading=true; render();
  try{
    var r=await tapi('/api/team/shifts?week='+encodeURIComponent(S.shWeek));
    if(r && r.days){ S.shData=r; }
    S.shLoaded=true;
  }catch(e){}
  if(!S.shDay || shMonday(S.shDay)!==S.shWeek){ var t=shToday(); S.shDay=(shMonday(t)===S.shWeek)?t:S.shWeek; }
  S.shLoading=false; render();
}
async function loadShSwaps(){
  S.shSwapLoading=true; render();
  loadShThreads();
  try{ var r=await tapi('/api/team/swap?week='+encodeURIComponent(S.shWeek||shMonday())); if(r && r.incoming!==undefined){ S.shSwap=r; } }catch(e){}
  S.shSwapLoading=false; render();
}
async function loadShThreads(){
  try{ var r=await tapi('/api/team/tchat'); if(r && r.ok){ S.shThreads=r.threads||[]; S.shChatMe=r.me||S.shChatMe; render(); } }catch(e){}
}
async function loadShAvail(empId){

  }catch(e){}

}

// Mutation an /api/team/shifts; Server antwortet mit der frischen Woche.
async function shPost(body){
  body=body||{}; body.week=S.shWeek||shMonday();

    var r=await tapi('/api/team/shifts',{method:'POST',body:body});
    if(r && r.days){ S.shData=r; }

    return r;
  }catch(e){ alert('Verbindung fehlgeschlagen.'); return null; }
}

// KI-Planung: Phase 1 (~1,6 s Puls-Schritte) parallel zum echten plan-Call.
function shRunKi(){
  if(S.shKiOpen) return;
  S.shKiOpen=true; S.shKiPhase='think'; S.shKiResult=null; render();
  var minWait=new Promise(function(res){ setTimeout(res,1600); });
  var call=tapi('/api/team/shifts',{method:'POST',body:{action:'plan',week:S.shWeek||shMonday()}}).catch(function(){ return null; });
  Promise.all([call,minWait]).then(function(rr){
    if(!S.shKiOpen) return;
    var r=rr[0];
    S.shKiResult=(r&&r.ok)?r:{proposals:[],leftover:[],summary:'Der Vorschlag konnte nicht erstellt werden. Bitte später erneut versuchen.'};
    S.shKiPhase='result'; render();
  });
}
function shCloseKi(){ if(S.shKiBusy) return; S.shKiOpen=false; S.shKiPhase=''; S.shKiResult=null; render(); }
async function shAcceptKi(){
  var r=S.shKiResult;
  if(!r || !(r.proposals||[]).length){ shCloseKi(); return; }
  if(S.shKiBusy) return;
  S.shKiBusy=true; render();
  await shPost({action:'apply',assignments:r.proposals.map(function(p){ return {shiftId:p.shiftId, employee:p.employee}; })});
  S.shKiBusy=false; shCloseKi();
}

function shOpenEditor(sh,date){
  if(sh){ S.shEdId=sh.id; S.shEdDate=sh.date; S.shEdStart=sh.start; S.shEdEnd=sh.end; S.shEdRole=sh.role; S.shEdWho=sh.assignee?String(sh.assignee.id):''; S.shEdApplicants=sh.applicants||[]; }
  else { S.shEdId=null; S.shEdDate=date||S.shDay||S.shWeek||shMonday(); S.shEdStart='06:00'; S.shEdEnd='14:00'; S.shEdRole='theke'; S.shEdWho=''; S.shEdApplicants=[]; }
  S.shEdOpen=true; render();
}
function shCloseEditor(){ if(S.shEdBusy) return; S.shEdOpen=false; render(); }
function shEdAssignee(){
  if(!S.shEdWho) return null;
  if(S.employees){ for(var i=0;i<S.employees.length;i++){ var e=S.employees[i]; if(String(e.id)===String(S.shEdWho)) return {id:String(e.id),name:e.name,initials:shInitials(e.name)}; } }
  for(var j=0;j<(S.shEdApplicants||[]).length;j++){ var a=S.shEdApplicants[j]; if(String(a.id)===String(S.shEdWho)) return {id:String(a.id),name:a.name,initials:a.initials||shInitials(a.name)}; }

async function shSaveShift(){
  if(S.shEdBusy) return;

}

function schichtNode(){
  var node=el('<div class="scrl" style="flex:1;min-height:0;overflow-y:auto;padding:20px 16px 44px"></div>');
  if(!S.shWeek) S.shWeek=shMonday(shToday());

  if(S.shLoading && !S.shData) content='<div style="padding:60px;text-align:center"><span class="spin"></span></div>';
  else if(S.shTab==='offen') content=shOffenTabHTML();
  else if(S.shTab==='tausch') content=shTauschTabHTML();
  else if(S.shTab==='zeiten') content=shZeitenTabHTML();
  else content=shPlanTabHTML();
  node.innerHTML='<div style="max-width:520px;margin:0 auto">'+shHeaderHTML()+content+'</div>'+shKiHTML()+shEditorHTML()+shChatHTML();
  setTimeout(function(){ wireSchicht(node); },0);

function wireSchicht(node){
  node.querySelectorAll('[data-shtab]').forEach(function(b){ b.onclick=function(){ shSetTab(b.getAttribute('data-shtab')); }; });
  var pv=node.querySelector('[data-shprev]'); if(pv) pv.onclick=function(){ shShiftWeek(-7); };
  var nx=node.querySelector('[data-shnext]'); if(nx) nx.onclick=function(){ shShiftWeek(7); };
  node.querySelectorAll('[data-shview]').forEach(function(b){ b.onclick=function(){ S.shView=b.getAttribute('data-shview'); render(); }; });
  node.querySelectorAll('[data-shday]').forEach(function(b){ b.onclick=function(){ S.shDay=b.getAttribute('data-shday'); S.shView='tag'; render(); }; });
  var nw=node.querySelector('[data-shnew]'); if(nw) nw.onclick=function(){ shOpenEditor(null,S.shDay); };
  node.querySelectorAll('[data-shclaim]').forEach(function(b){ b.onclick=function(){ shClaim(b.getAttribute('data-shclaim')); }; });
  node.querySelectorAll('[data-shedit]').forEach(function(b){ b.onclick=function(){ shEditById(b.getAttribute('data-shedit')); }; });
  node.querySelectorAll('[data-shboard]').forEach(function(b){ b.onclick=function(){ shBoardToggle(b.getAttribute('data-shboard'),true); }; });
  node.querySelectorAll('[data-shunboard]').forEach(function(b){ b.onclick=function(){ shBoardToggle(b.getAttribute('data-shunboard'),false); }; });
  node.querySelectorAll('[data-shmsg]').forEach(function(b){ b.onclick=function(){ shMsgById(b.getAttribute('data-shmsg')); }; });
  var ki=node.querySelector('[data-shki]'); if(ki) ki.onclick=shRunKi;
  var fl=node.querySelector('[data-shfill]'); if(fl) fl.onclick=shFillFromHours;
  node.querySelectorAll('[data-shkiclose]').forEach(function(b){ b.onclick=shCloseKi; });
  var ka=node.querySelector('[data-shkiapply]'); if(ka) ka.onclick=shAcceptKi;
  node.querySelectorAll('[data-shswacc]').forEach(function(b){ b.onclick=function(){ shSwapAct(b.getAttribute('data-shswacc'),'accept'); }; });
  node.querySelectorAll('[data-shswdec]').forEach(function(b){ b.onclick=function(){ shSwapAct(b.getAttribute('data-shswdec'),'decline'); }; });
  node.querySelectorAll('[data-shswwd]').forEach(function(b){ b.onclick=function(){ shSwapAct(b.getAttribute('data-shswwd'),'withdraw'); }; });
  node.querySelectorAll('[data-shswreq]').forEach(function(b){ b.onclick=function(){ shSwapRequest(b.getAttribute('data-shswreq')); }; });
  node.querySelectorAll('[data-shtc]').forEach(function(b){ b.onclick=function(){ shOpenChat({id:b.getAttribute('data-shtc'),name:b.getAttribute('data-shtcname'),initials:b.getAttribute('data-shtcini')},''); }; });
  node.querySelectorAll('[data-shavemp]').forEach(function(b){ b.onclick=function(){ S.shAvailFor=b.getAttribute('data-shavemp'); S.shAvailSaved=false; loadShAvail(S.shAvailFor); }; });
  node.querySelectorAll('[data-shav]').forEach(function(b){ b.onclick=function(){ var p=b.getAttribute('data-shav').split(':'); shAvailPick(p[0],p[1]); }; });
  var sv=node.querySelector('[data-shavsave]'); if(sv) sv.onclick=shSaveAvail;
  // Editor
  var ec=node.querySelector('[data-shedclose]'); if(ec) ec.onclick=shCloseEditor;
  node.querySelectorAll('[data-shedday]').forEach(function(b){ b.onclick=function(){ S.shEdDate=b.getAttribute('data-shedday'); render(); }; });
  node.querySelectorAll('[data-shedrole]').forEach(function(b){ b.onclick=function(){ S.shEdRole=b.getAttribute('data-shedrole'); render(); }; });
  node.querySelectorAll('[data-shedwho]').forEach(function(b){ b.onclick=function(){ S.shEdWho=b.getAttribute('data-shedwho'); render(); }; });
  node.querySelectorAll('[data-shedapp]').forEach(function(b){ b.onclick=function(){ S.shEdWho=b.getAttribute('data-shedapp'); shSaveShift(); }; });
  var es=node.querySelector('#shedstart'); if(es) es.oninput=function(){ S.shEdStart=es.value; };
  var ee=node.querySelector('#shedend'); if(ee) ee.oninput=function(){ S.shEdEnd=ee.value; };
  var esv=node.querySelector('[data-shedsave]'); if(esv) esv.onclick=shSaveShift;
  var edl=node.querySelector('[data-sheddel]'); if(edl) edl.onclick=shDeleteShift;
  // Chat-Panel
  var cb=node.querySelector('[data-shtcback]'); if(cb) cb.onclick=shCloseChat;
  var ci=node.querySelector('#shtcinput');
  if(ci){
    ci.oninput=function(){ S.shChatInput=ci.value; var sb=node.querySelector('[data-shtcsend]'); if(sb) sb.style.background=(ci.value||'').trim()?'#0a4958':'#9fb4b9'; };
    ci.onkeydown=function(e){ if(e.key==='Enter') shSendChat(); };
  }
  var cs=node.querySelector('[data-shtcsend]'); if(cs) cs.onclick=function(){ shSendChat(); };
  node.querySelectorAll('[data-shtcq]').forEach(function(b){ b.onclick=function(){ shSendChat(b.getAttribute('data-shtcq')); }; });
  if(S.shChatOpen){ var cm=node.querySelector('#shtcmsgs'); if(cm) cm.scrollTop=cm.scrollHeight; }
}

// ---- Direktnachricht an ein Mitglied (Compose-Dialog aus dem Profil) ----
function openDirectMsg(id,name){
  S.dmMemberId=String(id); S.dmMemberName=name||''; S.dmTitle=''; S.dmBody='';
  S.dmPush=true; S.dmEmail=false; S.dmWa=false; S.dmBusy=false; S.dmResult=null; S.dmOpen=true;
  render(); setTimeout(function(){ var t=document.getElementById('dmbody'); if(t) t.focus(); },30);
}
function closeDirectMsg(){ if(S.dmBusy) return; S.dmOpen=false; S.dmResult=null; render(); }
async function doSendDirect(){
  if(S.dmBusy||!S.dmMemberId) return;
  var title=(S.dmTitle||'').trim(), body=(S.dmBody||'').trim();
  if(!body){ alert('Bitte eine Nachricht eingeben.'); return; }
  S.dmBusy=true; render();
  try{
    var r=await tapi('/api/team/message',{method:'POST',body:{memberId:S.dmMemberId,title:title,body:body,channels:{push:!!S.dmPush,email:!!S.dmEmail,whatsapp:!!S.dmWa}}});
    S.dmBusy=false;
    if(r && r.ok){ S.dmResult=r; }
    else { alert((r&&r.message)||'Nachricht konnte nicht zugestellt werden.'); }
  }catch(e){ S.dmBusy=false; alert('Verbindung fehlgeschlagen.'); }
  render();
}

// Vertragskarte inkl. Aktionen (kündigen / zurücknehmen / 14-Tage-Widerruf).
function vertragCard(p){
  var ct=p.contract||{};
  var statusTxt = ct.active===false ? (ct.reversed?'widerrufen':'beendet') : (ct.cancelled?'gekündigt':'aktiv');
  var rows=pRow('Tarif',ct.rateName)+pRow('Vertragsbeginn',ct.startDate)+pRow('Status',statusTxt)+pRow('Vertragsende',ct.endDate||(ct.cancelled?ct.cancellationDate:'läuft'))+pRow('Nächstmögl. Kündigung',ct.nextCancellationDate);
  var actions='';
  if(ct.contractId && isAdmin()){   // Kündigung/Widerruf nur für Admin
    var btns=[];
    if(ct.active===false){
      // beendet/widerrufen -> keine Aktion
    } else if(ct.cancelled){
      btns.push('<button data-cxwithdraw="1" style="display:inline-flex;align-items:center;gap:7px;border:1.5px solid #bcd7c4;border-radius:10px;background:#fff;color:#1d7a3e;font-weight:800;font-size:12.5px;padding:9px 13px;cursor:pointer">↩ Kündigung zurücknehmen</button>');
    } else {
      btns.push('<button data-cxopen="1" style="display:inline-flex;align-items:center;gap:7px;border:1.5px solid #e3b8b1;border-radius:10px;background:#fff;color:#b5402f;font-weight:800;font-size:12.5px;padding:9px 13px;cursor:pointer">Vertrag kündigen</button>');
      if(ct.withdrawalEligible) btns.push('<button data-cxrevoke="1" style="display:inline-flex;align-items:center;gap:7px;border:1.5px solid #d8c19a;border-radius:10px;background:#fff;color:#a5701f;font-weight:800;font-size:12.5px;padding:9px 13px;cursor:pointer">14-Tage-Widerruf'+(ct.withdrawalDaysLeft!=null?(' ('+ct.withdrawalDaysLeft+' T.)'):'')+'</button>');
    }
    if(btns.length) actions='<div style="margin-top:12px;padding-top:12px;border-top:1px solid #f0f3f4;display:flex;gap:9px;flex-wrap:wrap">'+btns.join('')+'</div>';
  }
  return profileCard('Vertrag', rows+actions);
}
function openCancel(p){
  var ct=p.contract||{};
  S.cxOpen=true; S.cxBusy=false; S.cxResult=null;
  S.cxDate=ct.nextCancellationDateISO||''; S.cxReason='';
  render();
  if(S.cxReasons==null) loadCancelReasons(p.id);
}
function closeCancel(p){ if(S.cxBusy) return; var had=!!S.cxResult; S.cxOpen=false; S.cxResult=null; if(had&&p&&p.id) openProfile(p.id); else render(); }
async function loadCancelReasons(id){
  S.cxReasonsLoading=true; render();
  try{ var r=await tapi('/api/team/cancel?id='+encodeURIComponent(id)); S.cxReasons=(r&&r.ok&&Array.isArray(r.reasons))?r.reasons:[]; }
  catch(e){ S.cxReasons=[]; }
  S.cxReasonsLoading=false; render();
}
async function doCancelSubmit(p){
  if(S.cxBusy) return;
  if(!S.cxReason){ alert('Bitte einen Kündigungsgrund wählen.'); return; }
  if(!S.cxDate){ alert('Bitte ein Kündigungsdatum wählen.'); return; }
  S.cxBusy=true; render();
  try{
    var r=await tapi('/api/team/cancel',{method:'POST',body:{ id:p.id, action:'cancel', date:S.cxDate, reasonId:S.cxReason }});
    S.cxBusy=false;
    if(r&&r.ok){ S.cxResult=r; }
    else { alert((r&&r.message)||'Kündigung fehlgeschlagen.'); }
  }catch(e){ S.cxBusy=false; alert('Verbindung fehlgeschlagen.'); }
  render();
}
async function doWithdrawCancel(p){
  if(!confirm('Kündigung von '+(p.name||'diesem Mitglied')+' wirklich zurücknehmen? Die Mitgliedschaft läuft dann normal weiter.')) return;
  try{
    var r=await tapi('/api/team/cancel',{method:'POST',body:{ id:p.id, action:'withdraw' }});
    if(r&&r.ok){ alert(r.message||'Kündigung zurückgenommen.'); openProfile(p.id); }
    else alert((r&&r.message)||'Rücknahme fehlgeschlagen.');
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}
async function doRevoke(p){
  if(!confirm('14-Tage-Widerruf für '+(p.name||'dieses Mitglied')+' eintragen? Der Vertrag wird vollständig rückabgewickelt (bereits gezahlte Beiträge werden erstattet). Das ist verbindlich.')) return;
  try{
    var r=await tapi('/api/team/cancel',{method:'POST',body:{ id:p.id, action:'revoke' }});
    if(r&&r.ok){ alert(r.message||'Widerruf eingetragen.'); openProfile(p.id); }
    else alert((r&&r.message)||'Widerruf fehlgeschlagen.');
  }catch(e){ alert('Verbindung fehlgeschlagen.'); }
}

var HCAT={ mitglied:{l:'Mitgliedschaft',c:'#2C5FB8',b:'#eaf0fb'}, training:{l:'Training',c:'#0F8378',b:'#e6f5f3'}, studio:{l:'Studio',c:'#1F9A4E',b:'#e8f6ed'}, abrechnung:{l:'Abrechnung',c:'#C77A2E',b:'#fbf0e3'} };

function hcat(k){ return HCAT[k]||HCAT.mitglied; }
function helpfulPct(a){ var y=a.helpfulYes||0,n=a.helpfulNo||0; return (y+n)>0?Math.round(y/(y+n)*100)+'%':'–'; }
function deNum(n){ return Number(n||0).toLocaleString('de-DE'); }
// Ø Reaktionszeit in Minuten -> lesbares Label ("18 Min.", "2,5 h") bzw. "—" wenn nicht berechenbar.
function rtLabel(min){ if(min==null||isNaN(min)) return '—'; var m=Number(min); if(m<60) return Math.round(m)+' Min.'; var h=m/60; return (h>=10?Math.round(h):Number(h.toFixed(1))).toLocaleString('de-DE')+' h'; }

// Nutzt den öffentlichen, bereits erprobten Website-Flow (/api/trial/slots + /api/trial/book).
function loadTrialSlots(){
  if(S.trSlotsLoading) return;
  S.trSlots=null; S.trSlotsLoading=true; S.trDone=''; S.trResult=''; S.trSlotSel=null; render();
  fetch('/api/trial/slots?days=28&trainer=0',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    S.trSlotsLoading=false;
    var slots=((d&&d.slots)||[]).filter(function(s){return s&&s.startDateTime;}).map(function(s){return {start:s.startDateTime};});
    slots.sort(function(a,b){return new Date(a.start)-new Date(b.start);});
    S.trSlots=slots; render();
  }).catch(function(){ S.trSlotsLoading=false; S.trSlots=[]; render(); });
}
function trPickSlot(i){ var s=(S.trSlots||[])[i]; if(s){ S.trSlotSel=s; render(); } }
async function trBook(){
  if(S.trBusy) return;
  var f={ firstname:(S.trFirst||'').trim(), lastname:(S.trLast||'').trim(), email:(S.trEmail||'').trim(),
    phone:(S.trPhone||'').trim(), gender:S.trGender||'', dateOfBirth:S.trDob||'',
    street:(S.trStreet||'').trim(), houseNumber:(S.trHouse||'').trim(), zip:(S.trZip||'').trim(), city:(S.trCity||'').trim() };
  if(!S.trSlotSel){ S.trResult='Bitte einen freien Termin wählen.'; render(); return; }
  var missing=['gender','firstname','lastname','email','phone','dateOfBirth','street','houseNumber','zip','city'].filter(function(k){return !f[k];});
  if(missing.length){ S.trResult='Bitte alle Felder ausfüllen.'; render(); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)){ S.trResult='Bitte eine gültige E-Mail-Adresse angeben.'; render(); return; }
  S.trBusy=true; S.trResult=''; render();
  var data=Object.assign({}, f, { startDateTime:S.trSlotSel.start, trainerRequired:false, marketing:!!S.trMarketing, note:'Probetraining vom Team gebucht' });
  try{
    var r=await fetch('/api/trial/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    var res=await r.json().catch(function(){return {};});
    S.trBusy=false;
    if(res&&res.ok){ S.trDone=res.message||'Probetraining gebucht.'; S.trResult='';
      S.trFirst='';S.trLast='';S.trEmail='';S.trPhone='';S.trGender='';S.trDob='';S.trStreet='';S.trHouse='';S.trZip='';S.trCity='';S.trSlotSel=null; }
    else { S.trResult=(res&&res.message)||'Buchung fehlgeschlagen – bitte einen anderen Termin wählen.'; }
  }catch(e){ S.trBusy=false; S.trResult='Verbindung fehlgeschlagen.'; }
  render();
}

  // Kontaktdaten
  inner+='<div style="background:#fff;border-radius:20px;box-shadow:0 14px 38px rgba(4,33,40,.09);padding:22px 24px;margin-bottom:16px">'+
    '<div style="font-size:15px;font-weight:900;letter-spacing:-.2px;margin-bottom:14px;color:#15171B">Interessent</div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
      '<label style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#6b7780">Anrede<select id="trgender" style="padding:11px 13px;border:1.5px solid #dce3e4;border-radius:11px;font-size:14px;background:#fbfcfc"><option value="">Bitte wählen</option><option value="MALE"'+(S.trGender==='MALE'?' selected':'')+'>Herr</option><option value="FEMALE"'+(S.trGender==='FEMALE'?' selected':'')+'>Frau</option><option value="UNISEX"'+(S.trGender==='UNISEX'?' selected':'')+'>Divers</option></select></label>'+
      trField('trdob','Geburtsdatum',S.trDob,'date')+
    '</div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">'+trField('trfirst','Vorname',S.trFirst)+trField('trlast','Nachname',S.trLast)+'</div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">'+trField('trmail','E-Mail',S.trEmail,'email')+trField('trphone','Telefon',S.trPhone,'tel')+'</div>'+
  '</div>';
  // Adresse
  inner+='<div style="background:#fff;border-radius:20px;box-shadow:0 14px 38px rgba(4,33,40,.09);padding:22px 24px;margin-bottom:16px">'+
    '<div style="font-size:15px;font-weight:900;letter-spacing:-.2px;margin-bottom:14px;color:#15171B">Adresse</div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap">'+trField('trstreet','Straße',S.trStreet)+
      '<label style="width:110px;display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#6b7780">Nr.<input id="trhouse" value="'+esc(S.trHouse)+'" style="padding:11px 13px;border:1.5px solid #dce3e4;border-radius:11px;font-size:14px;background:#fbfcfc"></label></div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">'+
      '<label style="width:130px;display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#6b7780">PLZ<input id="trzip" value="'+esc(S.trZip)+'" style="padding:11px 13px;border:1.5px solid #dce3e4;border-radius:11px;font-size:14px;background:#fbfcfc"></label>'+
      trField('trcity','Ort',S.trCity)+'</div>'+
  '</div>';
  // Termin
  inner+='<div style="background:#fff;border-radius:20px;box-shadow:0 14px 38px rgba(4,33,40,.09);padding:22px 24px">';
  inner+='<div style="font-size:15px;font-weight:900;letter-spacing:-.2px;margin-bottom:14px;color:#15171B">Freier Termin</div>';
  if(S.trSlotsLoading && S.trSlots==null){ inner+='<div style="padding:16px 0;text-align:center"><span class="spin"></span></div>'; }
  else {
    var slots=S.trSlots||[];
    if(!slots.length){ inner+='<div style="font-size:12.5px;color:#a9b1b6;font-weight:600;padding:4px 0">Keine freien Termine in den nächsten 4 Wochen.</div>'; }
    else {
      inner+='<div class="scrl" style="max-height:260px;overflow-y:auto;padding-right:4px">'+slGroup(slots).map(function(g){
        return '<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:800;color:#8a929a;margin-bottom:6px">'+esc(g.label)+'</div><div style="display:flex;flex-wrap:wrap;gap:7px">'+
          g.items.map(function(it){ var sel=(S.trSlotSel&&S.trSlotSel.start===it.slot.start); return '<button data-trslot="'+it.i+'" style="border:1.5px solid '+(sel?TEAL:'#d6dee0')+';background:'+(sel?TEAL:'#fff')+';color:'+(sel?'#fff':'#0a4958')+';border-radius:10px;font-size:12.5px;font-weight:800;padding:7px 11px;cursor:pointer">'+esc(slTime(it.slot.start))+' Uhr</button>'; }).join('')+
        '</div></div>';
      }).join('')+'</div>';
    }
  }
  var msg=S.trResult?'<div style="font-size:12.5px;font-weight:700;color:#b5402f;margin-top:12px">'+esc(S.trResult)+'</div>':'';
  inner+='<label style="display:flex;align-items:center;gap:9px;margin-top:14px;font-size:12.5px;font-weight:600;color:#6b7780;cursor:pointer"><input type="checkbox" id="trmarketing"'+(S.trMarketing?' checked':'')+' style="width:17px;height:17px;accent-color:#0a4958">Einwilligung Werbung (E-Mail/Telefon) liegt vor</label>';
  inner+='<div style="margin-top:16px;padding-top:16px;border-top:1px solid #f0f3f4">'+
    '<button data-trbook="1"'+(S.trBusy?' disabled':'')+' style="display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;background:'+TEAL+';color:#fff;font-weight:800;font-size:14px;padding:12px 20px;cursor:pointer">'+(S.trBusy?'<span class="spin" style="width:15px;height:15px;border-width:2px;border-top-color:#fff"></span>Bucht …':'Probetraining buchen')+'</button>'+msg+
  '</div>';
  inner+='</div></div>';
  node.innerHTML=inner;
  setTimeout(function(){
    var map={ trgender:'trGender', trdob:'trDob', trfirst:'trFirst', trlast:'trLast', trmail:'trEmail', trphone:'trPhone', trstreet:'trStreet', trhouse:'trHouse', trzip:'trZip', trcity:'trCity' };
    Object.keys(map).forEach(function(id){ var elm=node.querySelector('#'+id); if(elm){ var ev=(elm.tagName==='SELECT')?'onchange':'oninput'; elm[ev]=function(){ S[map[id]]=elm.value; }; } });
    var mk=node.querySelector('#trmarketing'); if(mk) mk.onchange=function(){ S.trMarketing=mk.checked; };
    node.querySelectorAll('[data-trslot]').forEach(function(b){ b.onclick=function(){ trPickSlot(parseInt(b.getAttribute('data-trslot'),10)); }; });
    var bk=node.querySelector('[data-trbook]'); if(bk) bk.onclick=trBook;
  },0);
  return node;
}

function placeholderNode(title){
  var w=el('<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px"></div>');
  w.innerHTML='<div style="text-align:center;max-width:380px"><div style="font-size:18px;font-weight:900">'+esc(title)+'</div><div style="font-size:14px;color:#6b7780;font-weight:500;margin-top:8px;line-height:1.6">Dieser Bereich folgt als Nächstes. Der Posteingang (Empfang & Antworten) ist bereits voll funktionsfähig.</div></div>';
  return w;
}

// ---------- main render ----------
function render(){
  if(!S.token){ renderLogin(); return; }
  if(!canSee(S.screen)) S.screen='dash';   // kein Admin-Bereich für Angestellte (Sicherheitsnetz)
  var titles={dash:'Übersicht',inbox:'Posteingang',members:'Mitglieder',appts:'Termine',trial:'Probetraining',help:'Hilfe-Artikel',stats:'Statistiken',msg:'Nachrichten',leads:'Leads',todo:'Aufgaben',schicht:'Schichtplan'};
  var subs={dash:'Dein Studio auf einen Blick',inbox:'Alle Vorgänge & Anfragen',members:'Mitgliederverwaltung',appts:'Anfragen & Buchungen',trial:'Schnell ein Probetraining buchen',help:'Wissensdatenbank verwalten',stats:'Auswertungen & Trends',msg:'Rundnachricht & Direktnachricht',leads:'Interessenten-Pipeline',todo:'Interne Aufgaben fürs Team',schicht:'Dienstplan, Tausch & Verfügbarkeiten'};
  var content;
  if(S.screen==='inbox') content=inboxNode();
  else if(S.screen==='dash') content=dashNode();
  else if(S.screen==='members') content=membersNode();
  else if(S.screen==='appts') content=apptsNode();
  else if(S.screen==='trial') content=trialNode();
  else if(S.screen==='help') content=helpNode();
  else if(S.screen==='stats') content=statsNode();
  else if(S.screen==='msg') content=msgNode();
  else if(S.screen==='leads') content=leadsNode();
  else if(S.screen==='todo') content=todoNode();
  else if(S.screen==='schicht') content=schichtNode();
  else content=placeholderNode(titles[S.screen]||'');
  renderShell(content, titles[S.screen]||'', subs[S.screen]||'');
}
function goScreen(k){
  if(!canSee(k)) k='dash';   // Angestellte werden aus Admin-Bereichen sanft umgeleitet
  S.screen=k; S.navOpen=false;
  if(k==='dash'){ loadUtil(); loadChurn(); if(isAdmin()) loadDues(); if(!S.convs.length && !S.loading) loadInbox(); }
  if(k==='members'){ S.profile=null; if(!S.membersLoaded){ loadMembers(); return; } }
  if(k==='appts' && !S.convs.length && !S.loading){ loadInbox(); return; }
  if(k==='trial'){ if(S.trSlots==null){ loadTrialSlots(); return; } }
  if(k==='help'){ S.helpView='list'; S.editor=null; if(!S.articlesLoaded){ loadArticles(); return; } }
  if(k==='stats'){ loadUtil(); loadStats(); return; }
  if(k==='msg'){ S.bcResult=null; }
  if(k==='leads'){ if(!S.leadsLoaded){ loadLeads(); return; } }
  if(k==='todo'){ if(!S.todosLoaded){ loadTodos(); return; } }
  if(k==='schicht'){ if(!S.shLoaded){ loadShifts(); return; } }
  render();
}

// ---------- boot ----------
loadToken();
if(S.token){ render(); loadMe(); loadEmployees(); loadInbox(); } else { render(); }
// Offenen Chat live nachladen (neue Nachrichten erscheinen automatisch).
setInterval(pollThread, 6000);
// Liste/Badges seltener aktualisieren (kein Voll-Render, wenn gerade getippt wird).
setInterval(function(){ if(S.token && (S.screen==='inbox'||S.screen==='appts') && !S.busy && !(S.draft||'').trim()) loadInbox(); }, 30000);
</script>
