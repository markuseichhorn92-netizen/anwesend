<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fit-Inn Trier · Live-Auslastung</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════
     Fit-Inn Live-Auslastung · self-contained Widget
     Zum Einbetten reicht der <style>-Block + das .fi-auslastung-Element
     (oder die ganze Datei per <iframe>). Markenfarben oben anpassen.
     ═══════════════════════════════════════════════════════════════════ */
  .fi-auslastung {
    /* — Theme — */
    --fi-card:   #14171c;
    --fi-card-2: #1b1f26;
    --fi-border: #272c34;
    --fi-text:   #f5f6f8;
    --fi-muted:  #9aa1ab;
    --fi-green:  #2fbf71;
    --fi-amber:  #f5a623;
    --fi-red:    #e5484d;
    --fi-radius: 20px;
    --fi-accent: var(--fi-green);

    box-sizing: border-box;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 28px 28px 22px;
    background:
      radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--fi-accent) 12%, transparent) 0%, transparent 60%),
      var(--fi-card);
    border: 1px solid var(--fi-border);
    border-radius: var(--fi-radius);
    color: var(--fi-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .fi-auslastung *, .fi-auslastung *::before, .fi-auslastung *::after { box-sizing: border-box; }

  .fi-au__top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .fi-au__live {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--fi-muted);
  }
  .fi-au__dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--fi-accent);
    animation: fi-pulse 2s infinite;
  }
  @keyframes fi-pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--fi-accent) 55%, transparent); }
    70%  { box-shadow: 0 0 0 9px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .fi-au__title { font-size: 13px; font-weight: 600; color: var(--fi-muted); }

  .fi-au__count { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  .fi-au__num {
    font-size: 64px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .fi-au__of { font-size: 16px; color: var(--fi-muted); font-weight: 600; }

  .fi-au__bar {
    position: relative; height: 12px; border-radius: 99px;
    background: var(--fi-card-2); overflow: hidden; margin-bottom: 18px;
    border: 1px solid var(--fi-border);
  }
  .fi-au__fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--fi-accent) 65%, #000), var(--fi-accent));
    transition: width .8s cubic-bezier(.22,1,.36,1), background .4s ease;
  }

  .fi-au__status { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; }
  .fi-au__badge { margin-top: 3px; flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: var(--fi-accent); }
  .fi-au__status-main { font-size: 17px; font-weight: 700; line-height: 1.2; }
  .fi-au__status-sub  { font-size: 13px; color: var(--fi-muted); margin-top: 2px; }

  .fi-au__foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 16px; border-top: 1px solid var(--fi-border);
    font-size: 12px; color: var(--fi-muted);
  }
  .fi-au__preview {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--fi-amber); border: 1px solid color-mix(in srgb, var(--fi-amber) 40%, transparent);
    padding: 2px 7px; border-radius: 99px;
  }

  /* Ampel-Farben je Status */
  .fi-auslastung[data-status="low"]    { --fi-accent: var(--fi-green); }
  .fi-auslastung[data-status="medium"] { --fi-accent: var(--fi-amber); }
  .fi-auslastung[data-status="high"]   { --fi-accent: var(--fi-red);   }
  .fi-auslastung[data-status="error"]  { --fi-accent: var(--fi-muted); }
  .fi-auslastung[data-status="error"] .fi-au__num { font-size: 30px; color: var(--fi-muted); }
  .fi-auslastung[data-status="error"] .fi-au__dot { animation: none; }

  /* Signage-Modus: Klasse fi-auslastung--signage ergänzen */
  .fi-auslastung--signage { max-width: 680px; padding: 48px; --fi-radius: 28px; }
  .fi-auslastung--signage .fi-au__num { font-size: 110px; }
  .fi-auslastung--signage .fi-au__status-main { font-size: 26px; }
  .fi-auslastung--signage .fi-au__status-sub  { font-size: 16px; }
  .fi-auslastung--signage .fi-au__bar { height: 18px; }

  /* — Typische Auslastung ("normal um diese Zeit") — */
  .fi-au__typical {
    display: flex; align-items: baseline; gap: 6px;
    margin: -6px 0 16px; font-size: 13px; color: var(--fi-muted);
  }
  .fi-au__typical-val { color: var(--fi-text); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* — Stoßzeiten-Tageskurve (interaktiv) — */
  .fi-au__chart-readout {
    min-height: 20px; font-size: 13px; color: var(--fi-muted); margin-bottom: 8px;
  }
  .fi-au__chart-readout b { color: var(--fi-text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .fi-au__chart {
    display: flex; align-items: flex-end; gap: 3px;
    height: 104px; margin-bottom: 8px;
    touch-action: pan-y;              /* vertikal scrollen erlaubt, horizontal scrubben */
  }
  .fi-au__bar2 {
    flex: 1 1 0; min-height: 4px; border-radius: 4px 4px 0 0;
    background: var(--fi-card-2); border: 1px solid var(--fi-border); border-bottom: none;
    cursor: pointer;
    transition: height .5s cubic-bezier(.22,1,.36,1), background .15s ease, filter .15s ease;
  }
  .fi-au__bar2:hover, .fi-au__bar2.is-active {
    background: color-mix(in srgb, var(--fi-accent) 35%, var(--fi-card-2));
    filter: brightness(1.25);
  }
  .fi-au__bar2.is-now {
    background: var(--fi-accent);
    border-color: color-mix(in srgb, var(--fi-accent) 60%, transparent);
  }
  .fi-au__chart-foot {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--fi-muted); margin: 0 0 16px;
  }
  .fi-auslastung--signage .fi-au__chart { height: 170px; }
  .fi-auslastung--signage .fi-au__chart-readout { font-size: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .fi-au__dot { animation: none; }
    .fi-au__fill { transition: none; }
    .fi-au__bar2 { transition: none; }
  }
</style>
</head>
<body style="margin:0;background:#0c0e12;padding:40px 16px;min-height:100vh;display:flex;align-items:center;justify-content:center;">

  <div class="fi-auslastung" id="fiAuslastung" data-status="low" role="group" aria-label="Aktuelle Studio-Auslastung">
    <div class="fi-au__top">
      <span class="fi-au__live"><span class="fi-au__dot"></span> Live</span>
      <span class="fi-au__title">Aktuelle Auslastung</span>
    </div>

    <div class="fi-au__count">
      <span class="fi-au__num" id="fiNum" aria-live="polite">–</span>
      <span class="fi-au__of">von <span id="fiMax">25</span> Personen</span>
    </div>

    <div class="fi-au__bar" role="img" aria-label="Auslastungsbalken">
      <div class="fi-au__fill" id="fiFill"></div>
    </div>

    <div class="fi-au__status">
      <span class="fi-au__badge"></span>
      <div>
        <div class="fi-au__status-main" id="fiStatusMain">Lädt …</div>
        <div class="fi-au__status-sub" id="fiStatusSub">Einen Moment</div>
      </div>
    </div>

    <div class="fi-au__typical" id="fiTypicalWrap" hidden>
      <span>Normal um diese Zeit:</span>
      <span class="fi-au__typical-val" id="fiTypical">–</span>
    </div>

    <div class="fi-au__chart-readout" id="fiChartReadout" hidden></div>
    <div class="fi-au__chart" id="fiChart" hidden role="group" aria-label="Typische Auslastung im Tagesverlauf – Balken antippen zeigt die Personenzahl"></div>
    <div class="fi-au__chart-foot" id="fiChartFoot" hidden>
      <span>6 Uhr</span><span>12 Uhr</span><span>18 Uhr</span><span>24 Uhr</span>
    </div>

    <div class="fi-au__foot">
      <span id="fiUpdated">Aktualisiere …</span>
      <span class="fi-au__preview" id="fiPreview" hidden>Vorschau</span>
    </div>
  </div>

<script>
(function () {
  // ═══ KONFIGURATION ═══════════════════════════════════════════════════
  var CONFIG = {
    // Wird das Widget von derselben Domain ausgeliefert (z.B. Vercel), reicht der
    // relative Pfad '/api/auslastung'. Für cross-origin-Einbettung die absolute
    // Proxy-URL eintragen, z.B. 'https://auslastung.fit-inn-trier.de/api/auslastung'.
    // Leer lassen = Vorschau-Modus (Demo-Daten, kein Netzwerk).
    endpoint: '/api/auslastung',
    // Endpunkt für die typische Auslastung ("Stoßzeiten"). Bei cross-origin-
    // Einbettung absolute URL eintragen, sonst relativ lassen.
    typicalEndpoint: '/api/typical',
    refreshMs: 45000,
    typicalRefreshMs: 600000,   // typischer Wert ändert sich langsam -> alle 10 min
    maxDemo: 25
  };

  var STATES = {
    low:    { main: 'Viel Platz',                sub: 'Perfekt zum Trainieren' },
    medium: { main: 'Gut besucht',               sub: 'Angenehme Auslastung' },
    high:   { main: 'Stark besucht',             sub: 'Etwas mehr los als sonst' },
    error:  { main: 'Momentan nicht verfügbar',  sub: 'Bitte später erneut versuchen' }
  };

  var el = {
    root:       document.getElementById('fiAuslastung'),
    num:        document.getElementById('fiNum'),
    max:        document.getElementById('fiMax'),
    fill:       document.getElementById('fiFill'),
    statusMain: document.getElementById('fiStatusMain'),
    statusSub:  document.getElementById('fiStatusSub'),
    updated:    document.getElementById('fiUpdated'),
    preview:    document.getElementById('fiPreview'),
    typicalWrap: document.getElementById('fiTypicalWrap'),
    typical:    document.getElementById('fiTypical'),
    chart:      document.getElementById('fiChart'),
    chartFoot:  document.getElementById('fiChartFoot'),
    chartReadout: document.getElementById('fiChartReadout')
  };

  var lastTs = null;
  var lastTypical = null;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function countUp(target) {
    if (reduce) { el.num.textContent = target; return; }
    var start = 0, dur = 700, t0 = performance.now();
    (function step(now) {
      var p = Math.min(1, (now - t0) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      el.num.textContent = Math.round(start + (target - start) * eased);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  function render(d) {
    var s = STATES[d.status] || STATES.error;
    el.root.setAttribute('data-status', d.status);
    el.max.textContent = d.max;
    el.statusMain.textContent = s.main;
    el.statusSub.textContent = s.sub;

    if (d.status === 'error') {
      el.num.textContent = '–';
      el.fill.style.width = '0%';
      return;
    }
    countUp(d.count);
    el.fill.style.width = (d.percent || 0) + '%';
    lastTs = Date.now();
    tick();
  }

  function tick() {
    if (!lastTs) return;
    var secs = Math.round((Date.now() - lastTs) / 1000);
    el.updated.textContent = secs < 5 ? 'Gerade aktualisiert' : 'Aktualisiert vor ' + secs + ' s';
  }

  function demo() {
    el.preview.hidden = false;
    var count = 5, max = CONFIG.maxDemo;
    render({ count: count, max: max, percent: Math.round(count / max * 100), status: 'low' });
  }

  function slotLabel(s) {
    var h = Math.floor(s / 2), m = (s % 2) ? '30' : '00';
    return (h < 10 ? '0' : '') + h + ':' + m;
  }

  // — Interaktion: Balken antippen/überfahren zeigt die Personenzahl —
  function chartInfo(bar) {
    if (!bar || !bar.getAttribute) return null;
    return { t: bar.getAttribute('data-t'), v: bar.getAttribute('data-v') };
  }
  function chartShow(info) {
    if (!info) { chartReset(); return; }
    el.chartReadout.hidden = false;
    el.chartReadout.innerHTML = info.t + ' Uhr · <b>' + (info.v === '' ? 'keine Daten' : '~' + info.v + ' Personen') + '</b>';
  }
  function chartReset() {
    el.chartReadout.hidden = false;
    el.chartReadout.textContent = 'Typischer Tagesverlauf – Balken antippen für Details';
  }
  function chartActive(bar) {
    var act = el.chart.querySelectorAll('.fi-au__bar2.is-active');
    for (var i = 0; i < act.length; i++) act[i].classList.remove('is-active');
    if (bar) bar.classList.add('is-active');
  }
  function chartWire() {
    if (el.chart.__wired) return;
    el.chart.__wired = true;
    function pick(e) {
      var b = (e.target && e.target.classList && e.target.classList.contains('fi-au__bar2')) ? e.target : null;
      if (b) { chartActive(b); chartShow(chartInfo(b)); }
    }
    el.chart.addEventListener('pointermove', pick);
    el.chart.addEventListener('pointerdown', pick);
    el.chart.addEventListener('pointerleave', function () { chartActive(null); chartReset(); });
  }

  function renderTypical(t) {
    lastTypical = t;
    if (!t || !t.available) { el.typicalWrap.hidden = true; el.chart.hidden = true; el.chartFoot.hidden = true; el.chartReadout.hidden = true; return; }

    var hasData = t.samples > 0 && t.typicalCount != null;
    el.typicalWrap.hidden = false;
    el.typical.textContent = hasData ? ('~' + t.typicalCount + ' Personen') : 'wird noch gesammelt …';

    // Tageskurve 06:00–24:00 (Slots 12..47)
    if (Array.isArray(t.day) && t.totalSamples > 0) {
      var startSlot = 12, endSlot = 48;
      // Balkenhöhe relativ zum Tagesmaximum (nicht zur Kapazität) -> Kurve füllt
      // den Chart und die Stoßzeiten sind klar erkennbar.
      var dayMax = 1;
      for (var k = startSlot; k < endSlot; k++) { if (t.day[k] != null && t.day[k] > dayMax) dayMax = t.day[k]; }
      var html = '';
      for (var s = startSlot; s < endSlot; s++) {
        var v = t.day[s];
        var h = (v == null) ? 0 : (v === 0 ? 4 : Math.max(12, Math.round(v / dayMax * 100)));
        var now = (s === t.slot) ? ' is-now' : '';
        var lbl = slotLabel(s);
        var vAttr = (v == null) ? '' : v;
        var aria = lbl + ' Uhr, ' + (v == null ? 'keine Daten' : ('etwa ' + v + ' Personen'));
        html += '<span class="fi-au__bar2' + now + '" style="height:' + h + '%"'
              + ' data-t="' + lbl + '" data-v="' + vAttr + '"'
              + ' title="' + lbl + ' Uhr · ' + (v == null ? 'keine Daten' : ('~' + v)) + '"'
              + ' aria-label="' + aria + '"></span>';
      }
      el.chart.innerHTML = html;
      el.chart.hidden = false;
      el.chartFoot.hidden = false;
      chartWire();
      chartReset();
    } else {
      el.chart.hidden = true;
      el.chartFoot.hidden = true;
      el.chartReadout.hidden = true;
    }
  }

  function loadTypical() {
    if (!CONFIG.typicalEndpoint) return;
    fetch(CONFIG.typicalEndpoint, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (t) { renderTypical(t); })
      .catch(function () { /* still: Widget zeigt weiter den Live-Wert */ });
  }

  function load() {
    fetch(CONFIG.endpoint, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { render(d); })
      .catch(function () { render({ status: 'error', max: CONFIG.maxDemo }); });
  }

  // Start
  if (!CONFIG.endpoint) {
    demo();
  } else {
    load();
    setInterval(load, CONFIG.refreshMs);
    loadTypical();
    setInterval(loadTypical, CONFIG.typicalRefreshMs);
  }
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
