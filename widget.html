<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Live-Auslastung</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:#063540; overflow:hidden;
    font-family:'Archivo', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.18;}}

  .screen{
    width:390px; height:812px; flex:none;
    background:linear-gradient(165deg,#0e6072 0%,#063540 100%);
    border-radius:36px; overflow:hidden; position:relative;
    padding:34px 28px 0; color:#fff;
    transform-origin:center center;
  }

  .row{display:flex; align-items:center;}

  /* Header */
  .live-badge{display:flex; align-items:center; gap:7px; background:rgba(4,33,40,.24); border-radius:20px; padding:7px 13px;}
  .live-dot{width:8px; height:8px; border-radius:50%; background:#5fe0c2; animation:blink 1.6s infinite;}
  .live-txt{font-weight:800; font-size:11px; letter-spacing:.16em;}
  .logo{height:26px; width:auto; display:block;}

  .eyebrow{text-align:center; font-weight:800; font-size:13px; letter-spacing:.22em; opacity:.75; margin-top:36px;}

  /* Ring (Conic-Gradient grün→orange→rot, füllt sich mit der Auslastung) */
  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .ring-wrap{position:relative; width:264px; height:264px; margin:18px auto 0;}
  .ring{
    width:264px; height:264px; border-radius:50%; --ang:0deg;
    background:
      conic-gradient(from -90deg, transparent 0deg, transparent var(--ang), #0a4655 var(--ang), #0a4655 360deg),
      conic-gradient(from -90deg, #2fbf71 0deg, #4cc06a 140deg, #f5a623 200deg, #f0843a 280deg, #e5484d 338deg, #d8333e 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 20px), #000 calc(100% - 20px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 20px), #000 calc(100% - 20px));
    transition: --ang .9s cubic-bezier(.22,1,.36,1);
  }
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .count{font-weight:900; font-size:104px; line-height:.82; letter-spacing:-.04em; color:#fff; text-shadow:0 4px 18px rgba(4,33,40,.22); font-variant-numeric:tabular-nums;}
  .cap-label{font-weight:700; font-size:16px; opacity:.82; margin-top:6px;}

  /* Load pill */
  .load-wrap{display:flex; justify-content:center; margin-top:22px;}
  .load-pill{display:inline-flex; align-items:center; gap:9px; background:rgba(4,33,40,.22); border-radius:24px; padding:11px 20px;}
  .load-dot{width:10px; height:10px; border-radius:50%; background:#fff;}
  .load-label{font-weight:900; font-size:16px; letter-spacing:.03em;}

  /* Drawer */
  .drawer{position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:28px 28px 0 0; padding:18px 22px 20px; color:#15171B; box-shadow:0 -10px 32px rgba(4,33,40,.18);}

  .hours-panel{display:none; border:1px solid #e6eef0; border-radius:16px; overflow:hidden; margin-bottom:14px;}
  .hrow{display:flex; align-items:center; justify-content:space-between; padding:10px 15px;}
  .hrow .d{font-size:13px;} .hrow .t{font-weight:600; font-size:12px;}

  .status-row{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none;}
  .status-dot{width:9px; height:9px; border-radius:50%; background:#1FD65F; flex:none;}
  .status-label{font-weight:800; font-size:14px;}
  .status-detail{font-weight:500; font-size:13px; color:#9aa0a8; margin-left:auto;}
  .chevron{display:inline-block; margin-left:10px; color:#b9c4c6; font-size:10px; transition:transform .2s; transform:rotate(0deg);}

  .divider{height:1px; background:#eaf0f1; margin:15px 0;}

  .reco{display:flex; align-items:center; gap:13px; background:linear-gradient(100deg,#E7F1F3,#D6E8EB); border:1px solid #C2DCE0; border-radius:15px; padding:13px 15px;}
  .reco-icon{width:40px; height:40px; border-radius:11px; background:#0a4958; display:flex; align-items:center; justify-content:center; flex:none; font-weight:900; font-size:19px; color:#fff;}
  .reco-eyebrow{font-weight:800; font-size:10px; letter-spacing:.13em; color:#0a4958;}
  .reco-window{font-weight:900; font-size:17px; color:#15171B; margin-top:2px; letter-spacing:-.01em;}
  .reco-note{font-weight:500; font-size:12px; color:#5d7a80; margin-top:1px;}

  .trend-head{display:flex; justify-content:space-between; align-items:baseline; margin:18px 0 10px;}
  .trend-head .l{font-weight:800; font-size:11px; letter-spacing:.12em; color:#9aa0a8;}
  .trend-head .r{font-weight:700; font-size:11px; color:#9aa0a8;}
  .trend-bars{display:flex; align-items:flex-end; gap:4px; height:46px; touch-action:pan-y;}
  .tbar{flex:1; border-radius:3px 3px 0 0; min-height:6px; cursor:pointer; transition:height .5s cubic-bezier(.22,1,.36,1), filter .12s;}
  .tbar:hover{filter:brightness(.93);}
  .trend-axis{display:flex; justify-content:space-between; margin-top:7px; font-weight:600; font-size:10px; color:#aab4b6;}
  .trend-caption{text-align:center; font-weight:500; font-size:11px; color:#a8adb5; margin-top:14px; min-height:14px;}

  .err{opacity:.6;}
</style>
</head>
<body>
  <div class="screen" id="screen">

    <!-- Header -->
    <div class="row" style="justify-content:space-between;">
      <img class="logo" src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier" />
      <div class="live-badge">
        <span class="live-dot"></span>
        <span class="live-txt">LIVE</span>
      </div>
    </div>

    <div class="eyebrow">AKTUELLE AUSLASTUNG</div>

    <!-- Ring -->
    <div class="ring-wrap">
      <div class="ring" id="ring"></div>
      <div class="ring-center">
        <div class="count" id="count">–</div>
        <div class="cap-label">von <span id="capacity">25</span> Plätzen</div>
      </div>
    </div>

    <!-- Load pill -->
    <div class="load-wrap">
      <div class="load-pill">
        <span class="load-dot" id="loadDot"></span>
        <span class="load-label" id="loadLabel">—</span>
      </div>
    </div>

    <!-- Drawer -->
    <div class="drawer">
      <div class="hours-panel" id="hoursPanel"></div>

      <div class="status-row" id="hoursToggle">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">—</span>
        <span class="status-detail" id="statusDetail"></span>
        <span class="chevron" id="chevron">▼</span>
      </div>

      <div class="divider"></div>

      <div class="reco">
        <div class="reco-icon">★</div>
        <div style="min-width:0;">
          <div class="reco-eyebrow">BESTE ZEIT HEUTE · <span id="bestDay">—</span></div>
          <div class="reco-window" id="bestWindow">—</div>
          <div class="reco-note" id="bestNote">—</div>
        </div>
      </div>

      <div id="trendSection">
        <div class="trend-head">
          <span class="l">VERLAUF HEUTE</span>
          <span class="r">8 – 22 Uhr</span>
        </div>
        <div class="trend-bars" id="trendBars" role="group" aria-label="Typischer Tagesverlauf – Balken antippen für Details"></div>
        <div class="trend-axis">
          <span>8</span><span>12</span><span style="color:#0a4958;">jetzt</span><span>22</span>
        </div>
        <div class="trend-caption" id="trendCaption">Verlauf aus den letzten Wochen</div>
      </div>
    </div>
  </div>

<script>
(function () {
  var CFG = {
    occEndpoint:     '/api/auslastung',
    typicalEndpoint: '/api/typical',
    occRefreshMs:     45000,
    typicalRefreshMs: 600000,
    capacity: 25,
    accent: '#0a4958'
  };

  // ── Öffnungszeiten je Wochentag (Mo=0 … So=6) als Minuten-Intervalle ──
  //    Bei Bedarf hier anpassen (gilt für Status "Geöffnet/Pause/Geschlossen").
  var names = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  var WD = '09:30 – 13:00 · 15:00 – 21:30';
  var timesText = [WD, WD, WD, WD, WD, '13:00 – 18:00', '09:00 – 15:00'];
  var ivWd = [[570, 780], [900, 1290]];                 // 09:30–13:00, 15:00–21:30
  var iv = [ivWd, ivWd, ivWd, ivWd, ivWd, [[780, 1080]], [[540, 900]]];

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function fmt(m){ return pad(Math.floor(m/60)) + ':' + pad(m%60); }

  // Aktuelle Zeit in Studio-Zeitzone (Europe/Berlin), egal wo der Betrachter ist
  function berlinNow(){
    var p = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Berlin', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(new Date());
    var g = function(t){ return (p.find(function(x){return x.type===t;}) || {}).value; };
    var map = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6 };
    var hour = parseInt(g('hour'),10), min = parseInt(g('minute'),10);
    return { di: map[g('weekday')], hour: hour, min: hour*60 + min };
  }

  var el = {
    screen:      document.getElementById('screen'),
    count:       document.getElementById('count'),
    capacity:    document.getElementById('capacity'),
    ring:        document.getElementById('ring'),
    loadDot:     document.getElementById('loadDot'),
    loadLabel:   document.getElementById('loadLabel'),
    hoursToggle: document.getElementById('hoursToggle'),
    hoursPanel:  document.getElementById('hoursPanel'),
    statusDot:   document.getElementById('statusDot'),
    statusLabel: document.getElementById('statusLabel'),
    statusDetail:document.getElementById('statusDetail'),
    chevron:     document.getElementById('chevron'),
    bestDay:     document.getElementById('bestDay'),
    bestWindow:  document.getElementById('bestWindow'),
    bestNote:    document.getElementById('bestNote'),
    trendSection:document.getElementById('trendSection'),
    trendBars:   document.getElementById('trendBars'),
    trendCaption:document.getElementById('trendCaption')
  };

  var state = { capacity: CFG.capacity, current: null, trend: null, isPause: false };

  // ── Auslastung (Ring + Zahl + Ampel) ──
  function levelColor(ratio){ return ratio < 0.5 ? '#2fbf71' : (ratio <= 0.8 ? '#f5a623' : '#e5484d'); }
  function renderOccupancy(){
    var cap = state.capacity || CFG.capacity;
    el.capacity.textContent = cap;
    var c = state.current;
    if (c == null) {
      el.count.textContent = '–';
      el.count.classList.add('err');
      el.ring.style.setProperty('--ang', '0deg');
      el.loadDot.style.background = '#9aa0a8';
      el.loadLabel.textContent = 'nicht verfügbar';
      return;
    }
    el.count.classList.remove('err');
    el.count.textContent = c;
    var ratio = Math.max(0, Math.min(1, c / cap));
    el.ring.style.setProperty('--ang', (ratio * 360).toFixed(1) + 'deg');
    el.loadDot.style.background = levelColor(ratio);
    var pct = Math.round(ratio * 100);
    var lt = ratio < 0.5 ? 'ENTSPANNT' : (ratio <= 0.8 ? 'GUT BESUCHT' : 'VOLL');
    el.loadLabel.textContent = lt + ' · ' + pct + '%';
  }
  function loadOccupancy(){
    fetch(CFG.occEndpoint, { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (d) { state.current = (typeof d.count === 'number') ? d.count : null; if (d.max) state.capacity = d.max; }
        else { state.current = null; }
        renderOccupancy();
      })
      .catch(function(){ state.current = null; renderOccupancy(); });
  }

  // ── Historie / Verlauf + Empfehlung ──
  function loadTypical(){
    fetch(CFG.typicalEndpoint, { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(t){
        if (!t || !t.available || !Array.isArray(t.day)) { state.trend = null; }
        else {
          var hours = [], mx = 1;
          for (var h = 8; h <= 21; h++) {
            var a = t.day[h*2], b = t.day[h*2+1], vals = [];
            if (a != null) vals.push(a); if (b != null) vals.push(b);
            var v = vals.length ? Math.round(vals.reduce(function(x,y){return x+y;},0) / vals.length) : 0;
            hours.push({ hour:h, count:v });
            if (v > mx) mx = v;
          }
          state.trend = { hours: hours, max: mx, day: t.day };
          computeReco(t.day);
        }
        updateStatus(true);
      })
      .catch(function(){});
  }

  function computeReco(day){
    var di = berlinNow().di;
    var intervals = iv[di], best = null;
    for (var k = 0; k < intervals.length; k++) {
      var s0 = Math.floor(intervals[k][0] / 30), s1 = Math.ceil(intervals[k][1] / 30);
      for (var s = s0; s + 3 <= s1; s++) {
        var sum = 0, cnt = 0;
        for (var j = 0; j < 3; j++) { var v = day[s+j]; if (v != null) { sum += v; cnt++; } }
        if (cnt > 0) { var avg = sum / cnt; if (best === null || avg < best.avg) best = { avg:avg, start:s*30, end:(s+3)*30 }; }
      }
    }
    el.bestDay.textContent = names[di];
    if (best) {
      el.bestWindow.textContent = fmt(best.start) + ' – ' + fmt(best.end) + ' Uhr';
      var sh = Math.floor(best.start / 60);
      el.bestNote.textContent = sh < 11 ? 'morgens am leersten'
        : (sh < 14 ? 'um die Mittagszeit am ruhigsten'
        : (sh < 17 ? 'am frühen Nachmittag am ruhigsten' : 'am Abend am ruhigsten'));
    } else {
      el.bestWindow.textContent = '—'; el.bestNote.textContent = '';
    }
  }

  // ── Status + Verlaufsbalken + Öffnungszeiten ──
  var lastHour = -1, lastPause = null, lastDi = -1;
  function updateStatus(force){
    var n = berlinNow(), di = n.di, cur = n.min;
    var today = iv[di], open = false, closeAt = null, nextStart = null, passed = false;
    for (var i = 0; i < today.length; i++) {
      if (cur >= today[i][0] && cur < today[i][1]) { open = true; closeAt = today[i][1]; }
      if (today[i][1] <= cur) passed = true;
      if (today[i][0] > cur && nextStart === null) nextStart = today[i][0];
    }
    var label, detail, color, isPause = false;
    if (open) { label = 'Geöffnet'; color = '#1FD65F'; detail = 'noch bis ' + fmt(closeAt) + ' Uhr'; }
    else if (nextStart !== null && passed) { label = 'Pause'; color = '#FF9F1A'; detail = 'öffnet wieder ' + fmt(nextStart) + ' Uhr'; isPause = true; }
    else if (nextStart !== null) { label = 'Geschlossen'; color = '#E0563B'; detail = 'öffnet ' + fmt(nextStart) + ' Uhr'; }
    else { var nd = (di + 1) % 7; label = 'Geschlossen'; color = '#E0563B'; detail = 'öffnet ' + names[nd] + ' ' + fmt(iv[nd][0][0]) + ' Uhr'; }
    el.statusLabel.textContent = label;
    el.statusDetail.textContent = detail;
    el.statusDot.style.background = color;
    state.isPause = isPause;

    if (force || di !== lastDi) { lastDi = di; renderHours(di); }
    if (force || n.hour !== lastHour || isPause !== lastPause) {
      lastHour = n.hour; lastPause = isPause;
      renderTrend(n);
    }
  }

  function renderTrend(n){
    if (state.isPause || !state.trend) { el.trendSection.style.display = 'none'; return; }
    el.trendSection.style.display = '';
    var hours = state.trend.hours, mx = state.trend.max, html = '';
    for (var b = 0; b < hours.length; b++) {
      var hh = hours[b];
      var ratio = mx > 0 ? hh.count / mx : 0;
      var px = Math.round(14 + ratio * 32);
      var isNow = hh.hour === n.hour;
      var bg = isNow ? CFG.accent : '#E7EEEF';
      var sh = isNow ? 'box-shadow:0 0 0 1px rgba(10,73,88,.3);' : '';
      html += '<div class="tbar" data-h="' + hh.hour + '" data-v="' + hh.count + '" title="' + hh.hour + ' Uhr · ~' + hh.count + ' Personen"'
            + ' style="height:' + px + 'px;background:' + bg + ';' + sh + '"></div>';
    }
    el.trendBars.innerHTML = html;
    trendWire();
    trendReset();
  }

  // Verlaufsbalken interaktiv (Tippen/Überfahren -> Caption zeigt Wert)
  function trendBarFromX(clientX){
    var rect = el.trendBars.getBoundingClientRect();
    if (!rect.width) return null;
    var frac = Math.min(0.9999, Math.max(0, (clientX - rect.left) / rect.width));
    var bars = el.trendBars.children;
    return bars[Math.floor(frac * bars.length)] || null;
  }
  function trendShow(bar){
    if (!bar) return;
    el.trendCaption.textContent = bar.getAttribute('data-h') + ' Uhr · ~' + bar.getAttribute('data-v') + ' Personen';
  }
  function trendReset(){ el.trendCaption.textContent = 'Verlauf aus den letzten Wochen'; }
  function trendWire(){
    if (el.trendBars.__wired) return;
    el.trendBars.__wired = true;
    el.trendBars.addEventListener('pointerdown', function(e){ trendShow(trendBarFromX(e.clientX)); });
    el.trendBars.addEventListener('pointermove', function(e){ if (e.pointerType === 'mouse' || e.buttons) trendShow(trendBarFromX(e.clientX)); });
    el.trendBars.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse') trendReset(); });
  }

  function renderHours(di){
    var rows = '';
    for (var d = 0; d < 7; d++) {
      var t = d === di;
      var rbg = t ? '#E7F1F3' : '#fff', rfg = t ? '#15171B' : '#42454b', rtc = t ? CFG.accent : '#9aa0a8', rw = t ? '800' : '600';
      var bt = d === 0 ? '0' : '1px solid #eef3f4';
      rows += '<div class="hrow" style="background:' + rbg + ';border-top:' + bt + ';">'
            + '<span class="d" style="font-weight:' + rw + ';color:' + rfg + ';">' + names[d] + (t ? ' · heute' : '') + '</span>'
            + '<span class="t" style="color:' + rtc + ';">' + timesText[d] + '</span></div>';
    }
    el.hoursPanel.innerHTML = rows;
  }

  // Dropup
  var hoursOpen = false;
  el.hoursToggle.addEventListener('click', function(){
    hoursOpen = !hoursOpen;
    el.hoursPanel.style.display = hoursOpen ? 'block' : 'none';
    el.chevron.style.transform = hoursOpen ? 'rotate(180deg)' : 'rotate(0deg)';
  });

  // Frame an Viewport anpassen (Handy randlos, Wand-Display skaliert hoch)
  function fitScreen(){
    var s = Math.min(window.innerWidth / 390, window.innerHeight / 812, 3);
    el.screen.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitScreen);

  // Start
  fitScreen();
  renderOccupancy();
  updateStatus(true);
  loadOccupancy();  setInterval(loadOccupancy, CFG.occRefreshMs);
  loadTypical();    setInterval(loadTypical, CFG.typicalRefreshMs);
  setInterval(function(){ updateStatus(false); }, 30000);
})();
</script>
</body>
</html>
