<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dein Probetraining · Fit-Inn Trier</title>
<style>
  :root{ --teal:#0a4958; --teal2:#0e6072; --ink:#15171B; --muted:#6b7780; --line:#e6ecee; --orange:#E08C53; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#eef2f3; color:var(--ink); line-height:1.5; min-height:100vh; }
  .wrap{ max-width:520px; margin:0 auto; padding:22px 16px calc(30px + env(safe-area-inset-bottom,0)); }
  .hero{ background:linear-gradient(165deg,var(--teal2),#063540); border-radius:22px; padding:26px 24px; color:#fff; box-shadow:0 18px 44px rgba(4,33,40,.18); position:relative; overflow:hidden; }
  .hero .glow{ position:absolute; width:220px; height:220px; right:-80px; top:-70px; border-radius:50%; background:radial-gradient(circle,rgba(246,169,100,.22),transparent 70%); }
  .badge{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--teal2); background:#F6A964; border-radius:6px; padding:3px 9px; }
  .check{ width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; margin:16px 0 12px; }
  h1{ font-size:23px; font-weight:900; letter-spacing:-.5px; margin:0; }
  .sub{ font-size:14px; color:#bcd9df; font-weight:600; margin-top:6px; }
  .card{ background:#fff; border-radius:18px; box-shadow:0 12px 32px rgba(4,33,40,.09); padding:18px 20px; margin-top:16px; }
  .card h2{ font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .row{ display:flex; align-items:center; gap:13px; padding:11px 0; border-top:1px solid var(--line); }
  .row:first-of-type{ border-top:none; padding-top:0; }
  .ic{ width:38px; height:38px; border-radius:11px; background:#eef5f6; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rlabel{ font-size:12px; color:var(--muted); font-weight:700; }
  .rval{ font-size:15px; font-weight:800; color:var(--ink); }
  .maps{ font-size:13px; font-weight:800; color:var(--teal); text-decoration:none; }
  ul.tips{ list-style:none; margin:0; padding:0; }
  ul.tips li{ display:flex; gap:11px; align-items:flex-start; padding:9px 0; font-size:14.5px; font-weight:600; color:#2c3238; }
  ul.tips li svg{ flex-shrink:0; margin-top:2px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:14px; border-radius:13px; font-size:15px; font-weight:800; border:none; cursor:pointer; text-decoration:none; }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-ghost{ background:#fff; color:var(--teal); border:1.5px solid #cfe0e4; margin-top:10px; }
  .contact{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--muted); font-weight:600; line-height:1.7; }
  .contact a{ color:var(--teal); font-weight:800; text-decoration:none; }
  .spin{ width:26px; height:26px; border:3px solid #d7e0e2; border-top-color:var(--teal); border-radius:50%; animation:sp .8s linear infinite; margin:30px auto; display:block; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .muted-note{ font-size:12px; color:#a9b1b6; font-weight:600; text-align:center; margin-top:14px; }
</style>
</head>
<body>
  <div class="wrap"><div id="app"><span class="spin"></span></div></div>
<script>
(function(){
  var app=document.getElementById('app');
  var ADDR='Auf Hirtenberg 8 · 54296 Trier';
  var MAPS='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Fit-Inn Trier, Auf Hirtenberg 8, 54296 Trier');
  var TEL='0651 308524', MAIL='info@fit-inn-trier.de';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tokenFromUrl(){ try{ return (new URLSearchParams(location.search)).get('t')||''; }catch(e){ return ''; } }

  function fmtDate(iso){ try{ return new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric',timeZone:'Europe/Berlin'}).format(new Date(iso)); }catch(e){ return ''; } }
  function fmtTime(iso){ try{ return new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}).format(new Date(iso)); }catch(e){ return ''; } }
  // .ics (60 Min) als Data-URI erzeugen -> „Zum Kalender hinzufügen".
  function icsHref(iso){
    try{
      var start=new Date(iso); if(isNaN(start.getTime())) return null;
      var end=new Date(start.getTime()+60*60000);
      function z(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; }
      function pad(n){ return (n<10?'0':'')+n; }
      var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fit-Inn Trier//Probetraining//DE','BEGIN:VEVENT',
        'UID:'+(tokenFromUrl()||'pt')+'@fit-inn-trier.de','DTSTAMP:'+z(new Date()),'DTSTART:'+z(start),'DTEND:'+z(end),
        'SUMMARY:Probetraining · Fit-Inn Trier','LOCATION:Auf Hirtenberg 8\\, 54296 Trier',
        'DESCRIPTION:Bitte 10 Minuten früher da sein. Bequeme Sportkleidung und saubere Hallenschuhe mitbringen.',
        'END:VEVENT','END:VCALENDAR'].join('\r\n');
      return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
    }catch(e){ return null; }
  }

  function tipIcon(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'; }
  function iconCal(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a4958" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'; }
  function iconClock(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a4958" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'; }
  function iconPin(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a4958" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>'; }

  function render(trial){
    var hasDate = trial && trial.startDateTime;
    var name = (trial && trial.firstname) ? (', '+trial.firstname) : '';
    var dateRow = hasDate ? (
      '<div class="row"><div class="ic">'+iconCal()+'</div><div><div class="rlabel">Termin</div><div class="rval">'+esc(fmtDate(trial.startDateTime))+'</div></div></div>'+
      '<div class="row"><div class="ic">'+iconClock()+'</div><div><div class="rlabel">Uhrzeit</div><div class="rval">'+esc(fmtTime(trial.startDateTime))+' Uhr</div></div></div>'
    ) : '';
    var ics = hasDate ? icsHref(trial.startDateTime) : null;

    app.innerHTML =
      '<div class="hero"><div class="glow"></div>'+
        '<span class="badge">Probetraining</span>'+
        '<div class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>'+
        '<h1>Alles klar'+esc(name)+'!</h1>'+
        '<div class="sub">Dein Probetraining ist gebucht. Wir freuen uns auf dich.</div>'+
      '</div>'+

      '<div class="card"><h2>Dein Termin</h2>'+
        (dateRow || '<div class="rval" style="font-weight:700;color:#6b7780">Deine Bestätigung mit dem Termin haben wir dir per E-Mail geschickt.</div>')+
        '<div class="row"><div class="ic">'+iconPin()+'</div><div><div class="rlabel">Adresse</div><div class="rval">'+esc(ADDR)+'</div>'+
          '<a class="maps" href="'+MAPS+'" target="_blank" rel="noopener">Route in Google Maps ›</a></div></div>'+
      '</div>'+

      (ics ? '<a class="btn btn-primary" style="margin-top:16px" href="'+ics+'" download="probetraining.ics">'+iconCalWhite()+'Zum Kalender hinzufügen</a>' : '')+

      '<div class="card"><h2>So läuft es ab</h2><ul class="tips">'+
        '<li>'+tipIcon()+'<span>Komm bitte <b>10 Minuten früher</b> – wir zeigen dir in Ruhe alles.</span></li>'+
        '<li>'+tipIcon()+'<span>Bring <b>bequeme Sportkleidung</b> und <b>saubere Hallenschuhe</b> mit.</span></li>'+
        '<li>'+tipIcon()+'<span>Getränke gibt es bei uns – ein Handtuch schadet nicht.</span></li>'+
        '<li>'+tipIcon()+'<span>Wir beantworten alle deine Fragen zu Training, Tarifen &amp; Ablauf.</span></li>'+
      '</ul></div>'+

      '<div class="contact">Du kannst nicht kommen oder hast eine Frage?<br>'+
        'Ruf uns an: <a href="tel:'+TEL.replace(/\s/g,'')+'">'+esc(TEL)+'</a> · '+
        'Mail: <a href="mailto:'+MAIL+'">'+esc(MAIL)+'</a></div>';
  }
  function iconCalWhite(){ return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'; }

  function renderFallback(){
    app.innerHTML =
      '<div class="hero"><div class="glow"></div>'+
        '<span class="badge">Probetraining</span>'+
        '<h1 style="margin-top:16px">Fit-Inn Trier</h1>'+
        '<div class="sub">Diesen Probetraining-Link konnten wir nicht finden – er ist evtl. abgelaufen.</div>'+
      '</div>'+
      '<div class="card"><h2>Wir sind für dich da</h2>'+
        '<div class="row"><div class="ic">'+iconPin()+'</div><div><div class="rlabel">Adresse</div><div class="rval">'+esc(ADDR)+'</div>'+
          '<a class="maps" href="'+MAPS+'" target="_blank" rel="noopener">Route in Google Maps ›</a></div></div>'+
      '</div>'+
      '<a class="btn btn-primary" style="margin-top:16px" href="/probetraining">Neues Probetraining buchen</a>'+
      '<div class="contact">Fragen? Ruf uns an: <a href="tel:'+TEL.replace(/\s/g,'')+'">'+esc(TEL)+'</a> · '+
        '<a href="mailto:'+MAIL+'">'+esc(MAIL)+'</a></div>';
  }

  var t=tokenFromUrl();
  if(!t){ renderFallback(); return; }
  fetch('/api/trial/info?t='+encodeURIComponent(t),{cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && d.ok && d.trial) render(d.trial); else renderFallback(); })
    .catch(function(){ renderFallback(); });
})();
</script>
</body>
</html>
