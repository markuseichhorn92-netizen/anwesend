<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dein Probetraining · Fit-Inn Trier</title>
<style>
  :root{ --teal:#0a4958; --teal2:#0e6072; --ink:#15171B; --muted:#6b7780; --line:#e6ecee; --orange:#E08C53; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#eef2f3; color:var(--ink); line-height:1.5; min-height:100vh; }
  .wrap{ max-width:520px; margin:0 auto; padding:22px 16px calc(30px + env(safe-area-inset-bottom,0)); }
  .hero{ background:linear-gradient(165deg,var(--teal2),#063540); border-radius:22px; padding:26px 24px; color:#fff; box-shadow:0 18px 44px rgba(4,33,40,.18); position:relative; overflow:hidden; }
  .hero .glow{ position:absolute; width:220px; height:220px; right:-80px; top:-70px; border-radius:50%; background:radial-gradient(circle,rgba(246,169,100,.22),transparent 70%); }
  .badge{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--teal2); background:#F6A964; border-radius:6px; padding:3px 9px; }
  .check{ width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; margin:16px 0 12px; }
  h1{ font-size:23px; font-weight:900; letter-spacing:-.5px; margin:0; }
  .sub{ font-size:14px; color:#bcd9df; font-weight:600; margin-top:6px; }
  .card{ background:#fff; border-radius:18px; box-shadow:0 12px 32px rgba(4,33,40,.09); padding:18px 20px; margin-top:16px; }
  .card h2{ font-size:12px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .row{ display:flex; align-items:center; gap:13px; padding:11px 0; border-top:1px solid var(--line); }
  .row:first-of-type{ border-top:none; padding-top:0; }
  .ic{ width:38px; height:38px; border-radius:11px; background:#eef5f6; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rlabel{ font-size:12px; color:var(--muted); font-weight:700; }
  .rval{ font-size:15px; font-weight:800; color:var(--ink); }
  .maps{ font-size:13px; font-weight:800; color:var(--teal); text-decoration:none; }
  ul.tips{ list-style:none; margin:0; padding:0; }
  ul.tips li{ display:flex; gap:11px; align-items:flex-start; padding:9px 0; font-size:14.5px; font-weight:600; color:#2c3238; }
  ul.tips li svg{ flex-shrink:0; margin-top:2px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:14px; border-radius:13px; font-size:15px; font-weight:800; border:none; cursor:pointer; text-decoration:none; }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-ghost{ background:#fff; color:var(--teal); border:1.5px solid #cfe0e4; margin-top:10px; }
  .contact{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--muted); font-weight:600; line-height:1.7; }
  .contact a{ color:var(--teal); font-weight:800; text-decoration:none; }
  .spin{ width:26px; height:26px; border:3px solid #d7e0e2; border-top-color:var(--teal); border-radius:50%; animation:sp .8s linear infinite; margin:30px auto; display:block; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .muted-note{ font-size:12px; color:#a9b1b6; font-weight:600; text-align:center; margin-top:14px; }
</style>
</head>
<body>
  <div class="wrap"><div id="app"><span class="spin"></span></div></div>
<script>
(function(){
  var app=document.getElementById('app');
  var ADDR='Auf Hirtenberg 8 · 54296 Trier';
  var MAPS='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Fit-Inn Trier, Auf Hirtenberg 8, 54296 Trier');
  var TEL='0651 603 443 42', MAIL='info@fit-inn-trier.de';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function tokenFromUrl(){ try{ return (new URLSearchParams(location.search)).get('t')||''; }catch(e){ return ''; } }

  function fmtDate(iso){ try{ return new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric',timeZone:'Europe/Berlin'}).format(new Date(iso)); }catch(e){ return ''; } }
  function fmtTime(iso){ try{ return new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}).format(new Date(iso)); }catch(e){ return ''; } }
  // .ics (60 Min) als Data-URI erzeugen -> „Zum Kalender hinzufügen".
  function icsHref(iso){
    try{
      var start=new Date(iso); if(isNaN(start.getTime())) return null;
      var end=new Date(start.getTime()+60*60000);
      function z(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'; }
      function pad(n){ return (n<10?'0':'')+n; }
      var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fit-Inn Trier//Probetraining//DE','BEGIN:VEVENT',
        'UID:'+(tokenFromUrl()||'pt')+'@fit-inn-trier.de','DTSTAMP:'+z(new Date()),'DTSTART:'+z(start),'DTEND:'+z(end),
        'SUMMARY:Probetraining · Fit-Inn Trier','LOCATION:Auf Hirtenberg 8\\, 54296 Trier',
        'DESCRIPTION:Bitte 10 Minuten früher da sein. Bequeme Sportkleidung und saubere Hallenschuhe mitbringen.',
        'END:VEVENT','END:VCALENDAR'].join('\r\n');
      return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
    }catch(e){ return null; }
  }

  function tipIcon(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'; }
  function iconCal(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a4958" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'; }
  function iconClock(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a4958" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'; }
  function iconPin(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a4958" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>'; }

  function render(trial){
    var hasDate = trial && trial.startDateTime;
    var name = (trial && trial.firstname) ? (', '+trial.firstname) : '';
    var dateRow = hasDate ? (
      '<div class="row"><div class="ic">'+iconCal()+'</div><div><div class="rlabel">Termin</div><div class="rval">'+esc(fmtDate(trial.startDateTime))+'</div></div></div>'+
      '<div class="row"><div class="ic">'+iconClock()+'</div><div><div class="rlabel">Uhrzeit</div><div class="rval">'+esc(fmtTime(trial.startDateTime))+' Uhr</div></div></div>'
    ) : '';
    var ics = hasDate ? icsHref(trial.startDateTime) : null;

    app.innerHTML =
      '<div class="hero"><div class="glow"></div>'+
        '<span class="badge">Probetraining</span>'+
        '<div class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>'+
        '<h1>Alles klar'+esc(name)+'!</h1>'+
        '<div class="sub">Dein Probetraining ist gebucht. Wir freuen uns auf dich.</div>'+
      '</div>'+

      '<div class="card"><h2>Dein Termin</h2>'+
        (dateRow || '<div class="rval" style="font-weight:700;color:#6b7780">Deine Bestätigung mit dem Termin haben wir dir per E-Mail geschickt.</div>')+
        '<div class="row"><div class="ic">'+iconPin()+'</div><div><div class="rlabel">Adresse</div><div class="rval">'+esc(ADDR)+'</div>'+
          '<a class="maps" href="'+MAPS+'" target="_blank" rel="noopener">Route in Google Maps ›</a></div></div>'+
      '</div>'+

      (ics ? '<a class="btn btn-primary" style="margin-top:16px" href="'+ics+'" download="probetraining.ics">'+iconCalWhite()+'Zum Kalender hinzufügen</a>' : '')+

      '<div class="card"><h2>So läuft es ab</h2><ul class="tips">'+
        '<li>'+tipIcon()+'<span>Komm bitte <b>10 Minuten früher</b> – wir zeigen dir in Ruhe alles.</span></li>'+
        '<li>'+tipIcon()+'<span>Bring <b>bequeme Sportkleidung</b> und <b>saubere Hallenschuhe</b> mit.</span></li>'+
        '<li>'+tipIcon()+'<span>Getränke gibt es bei uns – ein Handtuch schadet nicht.</span></li>'+
        '<li>'+tipIcon()+'<span>Wir beantworten alle deine Fragen zu Training, Tarifen &amp; Ablauf.</span></li>'+
      '</ul></div>'+

      '<div class="contact">Du kannst nicht kommen oder hast eine Frage?<br>'+
        'Ruf uns an: <a href="tel:'+TEL.replace(/\s/g,'')+'">'+esc(TEL)+'</a> · '+
        'Mail: <a href="mailto:'+MAIL+'">'+esc(MAIL)+'</a></div>';
  }
  function iconCalWhite(){ return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'; }

  function renderFallback(){
    app.innerHTML =
      '<div class="hero"><div class="glow"></div>'+
        '<span class="badge">Probetraining</span>'+
        '<h1 style="margin-top:16px">Fit-Inn Trier</h1>'+
        '<div class="sub">Diesen Probetraining-Link konnten wir nicht finden – er ist evtl. abgelaufen.</div>'+
      '</div>'+
      '<div class="card"><h2>Wir sind für dich da</h2>'+
        '<div class="row"><div class="ic">'+iconPin()+'</div><div><div class="rlabel">Adresse</div><div class="rval">'+esc(ADDR)+'</div>'+
          '<a class="maps" href="'+MAPS+'" target="_blank" rel="noopener">Route in Google Maps ›</a></div></div>'+
      '</div>'+
      '<a class="btn btn-primary" style="margin-top:16px" href="/probetraining">Neues Probetraining buchen</a>'+
      '<div class="contact">Fragen? Ruf uns an: <a href="tel:'+TEL.replace(/\s/g,'')+'">'+esc(TEL)+'</a> · '+
        '<a href="mailto:'+MAIL+'">'+esc(MAIL)+'</a></div>';
  }

  var t=tokenFromUrl();
  if(!t){ renderFallback(); return; }
  fetch('/api/trial/info?t='+encodeURIComponent(t),{cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && d.ok && d.trial) render(d.trial); else renderFallback(); })
    .catch(function(){ renderFallback(); });
})();
</script>
<script>/* Fit-Inn Chat-Launcher v3: eigener leichter Knopf im Hauptdokument, kein Iframe, erscheint sofort.
   NEU v3: Einmal pro Sitzung erscheint ueber dem Knopf eine Begruessungs-Sprechblase (Avatar "Lena", Tipp-Punkte ~0,8 s, dann Text),
   Feder-Animation von der Knopf-Ecke aus (nur transform/opacity). Text = Magicline-Teaser, wenn das Widget schon geladen ist
   (sonst Fallback; in sessionStorage gemerkt). X schliesst fuer die Sitzung, Tipp auf die Blase oeffnet den Chat.
   Statt der Pille in dieser Sitzung; die Pille "Fragen? Frag Lena" laeuft nur noch bei greet:false (max. 3x pro Besuch).
   Das Magicline-Widget (~1,9 MB) lädt erst bei Tipp/Hover oder im Leerlauf (~5 s nach Load); sein eigener Knopf und seine
   Begruessung bleiben unsichtbar. Fällt etwas aus, führt der Knopf zur Kontaktseite. Konfig optional über window.FILAUNCH. */
(function () {
  try {
    if (window.__fiLaunch) return; window.__fiLaunch = 1;
    var C = window.FILAUNCH || {};
    var SRC = C.src || 'https://fit-inn-trier.web.magicline.com/chatbot/widget/widget.js?uuid=a48084fc-8418-4bb1-b987-4bf4d852398f&studioId=1210005460&studioName=Fit-Inn%20Trier';
    var SID = 'ml-member-chatbot-widget-script', IID = 'ml-member-chatbot-widget-iframe', KEY = 'fiLaunchShown';
    var TEXT = C.text || 'Fragen? Frag Lena 👋', FAIL = C.fail || 'Chat nicht erreichbar – zum Kontakt';
    var CONTACT = C.contact || 'https://hilfe.fit-inn-trier.de/kontakt';
    var FIRST = C.first != null ? C.first : 1200, HOLD = C.hold != null ? C.hold : 4000;
    var GAP = C.gap != null ? C.gap : 25000, MAX = C.max != null ? C.max : 3, IDLE = C.idle != null ? C.idle : 5000;
    var GREET = C.greet !== false, GTEXT = C.greetText || 'Hallo, ich bin Lena, wie kann ich dir helfen?', GNAME = C.greetName || 'Lena';
    var GFIRST = C.greetFirst != null ? C.greetFirst : 1800, GTYPE = C.greetTyping != null ? C.greetTyping : 800, GHOLD = C.greetHold != null ? C.greetHold : 14000;
    var GKEY = 'fiGreetDone', TKEY = 'fiGreetText';
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var root = document.documentElement, wrap, ln, txt, timer, want = false, failed = false, asked = false, ready = false, expanded = false, gb = null, gtimer;

    function shown() { try { return +sessionStorage.getItem(KEY) || 0; } catch (e) { return 0; } }
    function bump() { try { sessionStorage.setItem(KEY, shown() + 1); } catch (e) { } }
    function doc() { try { var f = document.getElementById(IID); return f && (f.contentDocument || f.contentWindow.document); } catch (e) { return null; } }
    function isOpen() { var d = doc(); return !!(d && d.querySelector('[data-role="chatbot-container"]')); }
    function greeted() { try { return !!sessionStorage.getItem(GKEY); } catch (e) { return false; } }
    // Begruessungstext des Magicline-Widgets (Teaser im Iframe) lesen und fuer die Sitzung merken
    function teaser() {
      var d = doc(), el = d && d.querySelector('[data-role="chatbot-teaser-message"]'), t = el && el.textContent.replace(/\s+/g, ' ').trim();
      if (t && t.length < 200) { try { sessionStorage.setItem(TKEY, t); } catch (e) { } return t; }
      return '';
    }
    function greetText() { var s = ''; try { s = sessionStorage.getItem(TKEY) || ''; } catch (e) { } return C.greetText || teaser() || s || GTEXT; }

    // Eigener Knopf des Widgets bleibt unsichtbar (Iframe versteckt), solange der Chat zu ist
    var st = document.createElement('style');
    st.textContent =
      'html.fi-c #' + IID + '{visibility:hidden!important;pointer-events:none!important}' +
      '#fi-lw{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2147483000;filter:drop-shadow(0 4px 12px rgba(10,73,88,.38));' +
      'opacity:0;transform:scale(.6);transform-origin:100% 100%;pointer-events:none;transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.56,.5,1)}' +
      '#fi-lw.v{opacity:1;transform:none;pointer-events:auto}' +
      '#fi-lw.h{opacity:0;transform:scale(.8);pointer-events:none}' +
      '#fi-ln{position:relative;display:flex;align-items:center;box-sizing:border-box;height:62px;padding:0 62px 0 20px;border-radius:31px;color:#fff;text-decoration:none;' +
      'background:linear-gradient(135deg,#0A4958,#107E97);clip-path:inset(0 0 0 var(--o,9999px) round 31px);' +
      'transition:clip-path .7s cubic-bezier(.34,1.35,.5,1);-webkit-tap-highlight-color:transparent;cursor:pointer;outline:0}' +
      '#fi-ln.on{clip-path:inset(0 0 0 0 round 31px)}' +
      '#fi-ln:focus-visible{box-shadow:inset 0 0 0 3px #FFB54F}' +
      '#fi-ln .t{white-space:nowrap;font:600 16px/1 "Source Sans Pro",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;opacity:0;transform:translateX(10px);' +
      'transition:opacity .25s ease,transform .4s ease}' +
      '#fi-ln.on .t{opacity:1;transform:none;transition-delay:.2s}' +
      '#fi-ln .i{position:absolute;right:0;top:0;width:62px;height:62px;display:flex;align-items:center;justify-content:center}' +
      '#fi-ln .i svg{width:30px;height:30px;transition:opacity .2s ease}' +
      '#fi-ln .sp{position:absolute;opacity:0}' +
      '#fi-ln.ld .ch{opacity:0}#fi-ln.ld .sp{opacity:1;animation:fi-spin .8s linear infinite}' +
      '@keyframes fi-spin{to{transform:rotate(360deg)}}' +
      // Begruessungsblase: nur transform/opacity, Ursprung unten rechts (Knopf-Ecke)
      '#fi-gb{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:2147482999;box-sizing:border-box;max-width:min(300px,calc(100vw - 32px));pointer-events:none;' +
      'font:400 15px/1.35 "Source Sans Pro",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#10242b}' +
      '#fi-gb .bb{background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(10,73,88,.22),0 1px 4px rgba(10,73,88,.12);transform-origin:100% 100%}' +
      '#fi-gb .dt{position:absolute;right:0;bottom:0;display:flex;gap:5px;align-items:center;padding:14px 16px;opacity:0;transform:scale(.4) translateY(8px);' +
      'transition:opacity .2s ease,transform .45s cubic-bezier(.34,1.56,.5,1)}' +
      '#fi-gb .dt i{width:7px;height:7px;border-radius:50%;background:#107E97;opacity:.45;animation:fi-dot 1s ease-in-out infinite}' +
      '#fi-gb .dt i:nth-child(2){animation-delay:.15s}#fi-gb .dt i:nth-child(3){animation-delay:.3s}' +
      '@keyframes fi-dot{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-4px);opacity:1}}' +
      '#fi-gb.d .dt{opacity:1;transform:none}' +
      '#fi-gb.m .dt{opacity:0;transform:scale(.7);transition-duration:.15s}' +
      '#fi-gb .cd{position:relative;display:block;width:max-content;max-width:100%;box-sizing:border-box;margin-left:auto;padding:10px 14px 12px;cursor:pointer;outline:0;opacity:0;transform:scale(.6) translateY(10px);' +
      '-webkit-tap-highlight-color:transparent;transition:opacity .3s ease,transform .5s cubic-bezier(.34,1.56,.5,1)}' +
      '#fi-gb.m .cd{opacity:1;transform:none;pointer-events:auto}' +
      '#fi-gb.o .cd{opacity:0;transform:scale(.85) translateY(6px);pointer-events:none;transition:opacity .2s ease,transform .25s ease}' +
      '#fi-gb .cd:focus-visible{box-shadow:0 0 0 3px #FFB54F,0 8px 28px rgba(10,73,88,.22)}' +
      '#fi-gb .cd:after{content:"";position:absolute;right:22px;bottom:-5px;width:12px;height:12px;background:#fff;border-radius:0 0 3px 0;transform:rotate(45deg);z-index:-1}' +
      '#fi-gb .hd{display:flex;align-items:center;gap:7px;margin-bottom:4px;padding-right:18px;font-size:13px;font-weight:600;line-height:1;color:#0A4958}' +
      '#fi-gb .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#0A4958,#107E97);color:#fff;font-size:13px;font-weight:700;line-height:24px;text-align:center}' +
      '#fi-gb .tx{display:block;text-wrap:balance;opacity:0;transition:opacity .35s ease .12s}' +
      '#fi-gb.m .tx{opacity:1}' +
      '#fi-gb .xb{position:absolute;right:-6px;top:-10px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:#fff;color:#0A4958;font:400 18px/26px Arial,sans-serif;text-align:center;' +
      'box-shadow:0 1px 6px rgba(10,73,88,.28);cursor:pointer;opacity:0;transform:scale(.5);pointer-events:none;transition:opacity .25s ease .2s,transform .4s cubic-bezier(.34,1.56,.5,1) .2s;-webkit-tap-highlight-color:transparent}' +
      '#fi-gb .xb:before{content:"";position:absolute;inset:-9px}' +
      '#fi-gb.m .xb{opacity:1;transform:none;pointer-events:auto}#fi-gb.o .xb{opacity:0;transform:scale(.5);pointer-events:none;transition-delay:0s}' +
      '#fi-gb .xb:focus-visible{box-shadow:0 0 0 3px #FFB54F}' +
      '@media (prefers-reduced-motion:reduce){#fi-lw,#fi-ln,#fi-ln .t,#fi-gb .cd,#fi-gb .tx,#fi-gb .xb,#fi-gb .dt{transition:none!important}#fi-gb .dt i{animation:none}#fi-ln.ld .sp{animation-duration:1.6s}}';
    root.appendChild(st);
    root.classList.add('fi-c');

    wrap = document.createElement('div'); wrap.id = 'fi-lw';
    wrap.innerHTML =
      '<a id="fi-ln" href="' + CONTACT + '" role="button" aria-label="Chat öffnen: Fragen? Frag Lena">' +
      '<span class="t"></span><span class="i">' +
      '<svg class="ch" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6.2l-4.3 3.4c-.5.4-1.3 0-1.3-.7V18H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z" fill="#fff"/>' +
      '<circle cx="8.2" cy="11" r="1.4" fill="#0A4958"/><circle cx="12" cy="11" r="1.4" fill="#0A4958"/><circle cx="15.8" cy="11" r="1.4" fill="#0A4958"/></svg>' +
      '<svg class="sp" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.3)" stroke-width="3"/>' +
      '<path d="M12 3a9 9 0 0 1 9 9" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span></a>';
    root.appendChild(wrap);
    ln = wrap.firstChild; txt = ln.firstChild; txt.textContent = TEXT;
    measure();
    requestAnimationFrame(function () { wrap.classList.add('v'); });

    function measure() { ln.style.setProperty('--o', Math.max(0, ln.offsetWidth - 62) + 'px'); }
    function expand(label) { if (label) txt.textContent = label; measure(); expanded = true; ln.classList.add('on'); }
    function collapse() { expanded = false; ln.classList.remove('on'); }

    function cycle() {
      clearTimeout(timer);
      if (want || failed || isOpen() || shown() >= MAX) return;
      if (document.hidden) { timer = setTimeout(cycle, 3000); return; }
      bump(); expand();
      timer = setTimeout(function () { collapse(); timer = setTimeout(cycle, GAP); }, HOLD);
    }
    // Begruessung (v3): einmal pro Sitzung, nur wenn Chat zu, nichts ausgefallen. Statt der Pille.
    function greetClose() {
      clearTimeout(gtimer);
      var g = gb; if (!g) return; gb = null;
      g.classList.add('o');
      setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, reduce ? 0 : 400);
    }
    function greet() {
      if (gb || want || failed || isOpen() || greeted()) return;
      if (document.hidden) { gtimer = setTimeout(greet, 3000); return; }
      try { sessionStorage.setItem(GKEY, '1'); } catch (e) { }
      var name = GNAME, text = greetText();
      gb = document.createElement('div'); gb.id = 'fi-gb'; gb.setAttribute('role', 'status');
      gb.innerHTML =
        '<div class="bb dt" aria-hidden="true"><i></i><i></i><i></i></div>' +
        '<div class="bb cd" role="button" tabindex="0" aria-hidden="true"><div class="hd"><span class="av"></span><span class="nm"></span></div><span class="tx"></span></div>' +
        '<button type="button" class="xb" aria-label="Begrüßung schließen">×</button>';
      var g = gb, cd = g.querySelector('.cd'), xb = g.querySelector('.xb');
      g.querySelector('.av').textContent = name.charAt(0).toUpperCase();
      g.querySelector('.nm').textContent = name;
      g.querySelector('.tx').textContent = text;
      cd.setAttribute('aria-label', 'Chat öffnen: ' + text);
      root.appendChild(g);
      var show = function () {
        if (gb !== g) return;
        g.classList.add('m'); cd.removeAttribute('aria-hidden');
        if (GHOLD > 0) gtimer = setTimeout(greetClose, GHOLD);
      };
      if (reduce) show(); else {
        g.getBoundingClientRect(); g.classList.add('d');
        gtimer = setTimeout(show, GTYPE);
      }
      cd.addEventListener('click', function () { greetClose(); window.fiChatOpen && window.fiChatOpen(); });
      cd.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cd.click(); } });
      xb.addEventListener('click', function (e) { e.stopPropagation(); greetClose(); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Escape') greetClose(); });
      // Hover/Fokus haelt die Blase offen
      g.addEventListener('pointerenter', function () { clearTimeout(gtimer); });
      g.addEventListener('pointerleave', function () { if (gb === g && g.classList.contains('m') && GHOLD > 0) gtimer = setTimeout(greetClose, 4000); });
    }
    var pillOn = !GREET || C.pill === true;
    if (GREET && !greeted()) gtimer = setTimeout(greet, GFIRST);
    else if (!reduce && pillOn) timer = setTimeout(cycle, FIRST);

    // Widget nachladen (einmalig)
    function loadWidget() {
      if (asked) return; asked = true;
      if (!document.getElementById(SID)) {
        var s = document.createElement('script'); s.id = SID; s.src = SRC; s.async = true;
        s.onerror = function () { fail(); };
        document.head.appendChild(s);
      }
      var tries = 0, poll = setInterval(function () {
        var d = doc();
        if (d && d.querySelector('[data-role="chatbot-bubble"]')) {
          clearInterval(poll); ready = true; watch(d); remember(); if (want) openChat();
        } else if (++tries > 200) { clearInterval(poll); asked = false; if (want) fail(); }
      }, 100);
    }
    function remember() { var n = 0, iv = setInterval(function () { if (teaser() || ++n > 12) clearInterval(iv); }, 500); }
    function watch(d) {
      var sync = function () {
        var open = isOpen();
        root.classList.toggle('fi-c', !open);
        wrap.classList.toggle('h', open);
        if (open && expanded) collapse();
        if (open) greetClose();
      };
      try { new MutationObserver(sync).observe(d.body, { childList: true, subtree: true }); } catch (e) { setInterval(sync, 300); }
      sync();
    }
    function openChat() {
      var d = doc(), b = d && d.querySelector('[data-role="chatbot-bubble"]');
      if (!b) return;
      want = false; ln.classList.remove('ld');
      root.classList.remove('fi-c'); b.click();
    }
    function fail() {
      failed = true; want = false; ln.classList.remove('ld');
      root.classList.remove('fi-c');
      clearTimeout(timer); expand(FAIL);
    }

    // Leerlauf: 5 s nach Load, dann wenn der Browser frei ist
    function idleLoad() {
      setTimeout(function () {
        if (window.requestIdleCallback) requestIdleCallback(loadWidget, { timeout: 3000 }); else loadWidget();
      }, IDLE);
    }
    if (document.readyState === 'complete') idleLoad(); else window.addEventListener('load', idleLoad);

    ln.addEventListener('pointerenter', loadWidget);
    ln.addEventListener('touchstart', loadWidget, { passive: true });
    ln.addEventListener('focus', loadWidget);
    function go() {
      clearTimeout(timer); collapse(); greetClose();
      if (ready) { openChat(); return; }
      want = true; ln.classList.add('ld');
      loadWidget();
    }
    window.fiChatOpen = function () { if (!failed) go(); }; // z. B. fuer /chat-Seiten
    ln.addEventListener('click', function (e) {
      if (failed) return; // Fallback: normaler Link zur Kontaktseite
      e.preventDefault(); go();
    });
  } catch (e) { /* nichts kaputt machen */ }
})();</script>
