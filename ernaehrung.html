<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fit-Inn Trier · Ernährungscoach (Test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{
    --teal:#0a4958; --teal2:#0e6072; --teal3:#063540; --tealink:#127a8c;
    --bg:#eef2f3; --surface:#fff; --surface2:#f4f7f7;
    --text:#15171B; --text2:#42454b; --muted:#8a929a; --soft:#a3abb0;
    --border:#e6ecec; --orange:#E08C53; --orangeink:#b5631f; --orangebg:#FBEFE2;
    --green:#37b27a; --greenink:#176b37; --greenbg:#E7F6EC;
    --blue:#2C5FB8; --bluebg:#eaf0fb; --carb:#E0A44C; --fat:#8E7BF0;
  }
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text)}
  ::placeholder{color:#b3bbc0}
  input,select,textarea,button{font-family:inherit}
  button{cursor:pointer}
  input:focus,select:focus,textarea:focus{outline:none}
  a{color:inherit}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
  .body{flex:1;padding:0 18px 120px}
  .card{background:var(--surface);border-radius:20px;box-shadow:0 12px 34px rgba(4,33,40,.08);padding:18px}
  .hero{background:linear-gradient(160deg,#0e6072,#0a4958 55%,#063540);color:#fff;border-radius:0 0 26px 26px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 22px;margin:0 -18px 18px}
  .lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 7px}
  .inp{width:100%;padding:13px 14px;border:1.5px solid #dce3e4;border-radius:12px;font-size:15px;background:#fbfcfc;color:var(--text)}
  .btn{width:100%;border:none;border-radius:14px;background:var(--teal);color:#fff;font-weight:800;font-size:15.5px;padding:15px;box-shadow:0 12px 30px -8px rgba(10,73,88,.5)}
  .btn.orange{background:linear-gradient(135deg,#F6A964,#E07C3C);box-shadow:0 12px 30px -8px rgba(224,124,60,.5)}
  .btn.ghost{background:var(--surface);color:var(--teal);border:1.5px solid var(--border);box-shadow:none}
  .chip{border:1.5px solid #dce3e4;background:#fff;border-radius:100px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--text2)}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #cfe0e3;border-top-color:#0a4958;display:inline-block;animation:sp .8s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .bnav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:#fff;border-top:1px solid #e1e8ea;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
  .bnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:700}
  .fab{position:fixed;right:calc(50% - 240px + 18px);bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:3px solid #fff;background:linear-gradient(150deg,#0e6072,#063540);box-shadow:0 14px 30px -6px rgba(4,33,40,.5);display:flex;align-items:center;justify-content:center;z-index:45}
  @media(max-width:520px){.fab{right:18px}}
  .sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet .bd{position:absolute;inset:0;background:rgba(0,18,22,.45)}
  .sheet .pane{position:relative;width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .rowbtn{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;border:none;border-top:1px solid var(--border);background:#fff;text-align:left}
  .seg{display:flex;gap:7px;flex-wrap:wrap}
  .seg button{flex:1;min-width:70px;border:1.5px solid #dce3e4;background:#fff;border-radius:12px;padding:11px 8px;font-size:13.5px;font-weight:800;color:var(--text2)}
  .seg button.on{border-color:var(--teal);background:#eef5f6;color:var(--teal)}
  .testbadge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#0e6072;background:#F6A964;border-radius:6px;padding:3px 8px}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
'use strict';
var TEAL='#0a4958';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function svg(p,o){o=o||{};return '<svg width="'+(o.s||22)+'" height="'+(o.s||22)+'" viewBox="0 0 24 24" fill="none" stroke="'+(o.c||TEAL)+'" stroke-width="'+(o.w||1.9)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
function round(n){return Math.round(Number(n)||0);}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

// ── Icons ──
var IC={
  heute:'<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>',
  rezepte:'<path d="M4 4h16v16H4z"></path><path d="M8 4v16M8 9h4M8 13h4"></path>',
  plan:'<rect x="3" y="4" width="18" height="17" rx="2.5"></rect><path d="M16 2v4M8 2v4M3 10h18"></path>',
  erfassen:'<path d="M12 5v14M5 12h14"></path>',
  profil:'<circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-3.3 3.6-5.5 8-5.5s8 2.2 8 5.5"></path>',
  finn:'<path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4L12 3z"></path>',
  cam:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path><circle cx="12" cy="13" r="3.2"></circle>',
  barcode:'<path d="M3 5v14M7 5v14M11 5v14M14 5v14M18 5v14M21 5v14"></path>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>',
  search:'<circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>',
  water:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path>',
  cart:'<circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h3l2.4 12.4a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.3L22 7H6"></path>',
  chevron:'<path d="M9 18l6-6-6-6"></path>',
  back:'<path d="M15 18l-6-6 6-6"></path>',
  x:'<path d="M6 6l12 12M18 6L6 18"></path>',
  clock:'<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>',
  spark:'<path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4L12 3z"></path>'
};

// ── State (localStorage) ──
var DEFAULTS={
  ver:1, day:todayKey(),
  profile:{sex:'w', age:32, height:170, weight:69, target:66, goal:'abnehmen', activity:'leicht', diet:'normal'},
  water:0, waterGoal:8,
  log:[], saved:[], plan:{}, shopping:[]
};
var S=load();
function load(){
  try{ var v=JSON.parse(localStorage.getItem('fi_nutri_v1')); if(v&&v.ver===1){
    // Neuer Tag -> Tages-Log & Wasser zurücksetzen (Profil/Rezepte bleiben)
    if(v.day!==todayKey()){ v.day=todayKey(); v.log=[]; v.water=0; }
    for(var k in DEFAULTS) if(v[k]===undefined) v[k]=DEFAULTS[k];
    return v;
  }}catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ try{ localStorage.setItem('fi_nutri_v1', JSON.stringify(S)); }catch(e){} }
// UI-Only State (nicht persistiert)
var U={ tab:'heute', recipe:null, recipeBusy:false, recipeErr:'', createText:'', fridgeText:'', quick:null, finnOpen:false };

function setS(){ save(); render(); }

// ── Kalorienbedarf (Mifflin-St Jeor) ──
function targets(){
  var p=S.profile, kg=+p.weight||70, cm=+p.height||170, age=+p.age||30;
  var bmr=10*kg + 6.25*cm - 5*age + (p.sex==='m'?5:-161);
  var af={sitzend:1.2,leicht:1.375,aktiv:1.55,sehr:1.725}[p.activity]||1.375;
  var tdee=bmr*af;
  var kcal=tdee + (p.goal==='abnehmen'?-450:(p.goal==='muskelaufbau'?300:0));
  kcal=Math.max(1200, round(kcal/10)*10);
  var protein=round(kg*(p.goal==='muskelaufbau'?2.0:1.8));
  var fat=round(kg*0.9);
  var carbs=Math.max(0, round((kcal - protein*4 - fat*9)/4));
  return {kcal:kcal, protein:protein, carbs:carbs, fat:fat};
}
function eaten(){
  var t={kcal:0,protein:0,carbs:0,fat:0};
  (S.log||[]).forEach(function(e){ t.kcal+=+e.kcal||0; t.protein+=+e.protein||0; t.carbs+=+e.carbs||0; t.fat+=+e.fat||0; });
  return t;
}

// ── Schnell-Log-Vorlagen ──
var QUICK=[
  {name:'Apfel',kcal:95,protein:0,carbs:25,fat:0},
  {name:'Banane',kcal:105,protein:1,carbs:27,fat:0},
  {name:'Kaffee mit Milch',kcal:40,protein:2,carbs:4,fat:1},
  {name:'Proteinshake',kcal:170,protein:30,carbs:6,fat:3},
  {name:'Haferflocken (60g)',kcal:230,protein:8,carbs:40,fat:5},
  {name:'Vollkornbrot (Scheibe)',kcal:110,protein:4,carbs:20,fat:1}
];
var DEMO_RECIPES=[
  {title:'Protein-Bowl mit Quinoa',subtitle:'Sättigend & eiweißreich',minutes:20,portions:2,tags:['proteinreich'],nutrition:{kcal:520,protein:38,carbs:45,fat:16},ingredients:[{name:'Quinoa',qty:'80 g'},{name:'Hähnchenbrust',qty:'150 g'},{name:'Brokkoli',qty:'150 g'},{name:'Kirschtomaten',qty:'100 g'},{name:'Olivenöl',qty:'1 EL'}],steps:['Quinoa nach Packung garen.','Hähnchen würzen und anbraten.','Brokkoli bissfest garen.','Alles anrichten, mit Öl beträufeln.']},
  {title:'Overnight Oats mit Beeren',subtitle:'Frühstück zum Vorbereiten',minutes:5,portions:1,tags:['schnell'],nutrition:{kcal:340,protein:16,carbs:48,fat:9},ingredients:[{name:'Haferflocken',qty:'50 g'},{name:'Magerquark',qty:'100 g'},{name:'Milch',qty:'120 ml'},{name:'Beeren',qty:'80 g'}],steps:['Alles verrühren.','Über Nacht in den Kühlschrank.','Morgens mit Beeren toppen.']},
  {title:'Ofengemüse mit Feta',subtitle:'Vegetarisch & einfach',minutes:35,portions:2,tags:['vegetarisch'],nutrition:{kcal:410,protein:17,carbs:30,fat:24},ingredients:[{name:'Süßkartoffel',qty:'300 g'},{name:'Paprika',qty:'2 Stk'},{name:'Zucchini',qty:'1 Stk'},{name:'Feta',qty:'100 g'},{name:'Olivenöl',qty:'2 EL'}],steps:['Gemüse würfeln, mit Öl & Gewürzen mischen.','20–25 Min bei 200°C backen.','Feta darüber, kurz weiterbacken.']}
];

// ── Header ──
function header(title, sub, back){
  return '<div class="hero">'+
    (back?'<button data-act="back" style="width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-bottom:12px">'+svg(IC.back,{c:'#fff',w:2.2,s:20})+'</button>':
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="testbadge">Testversion</span><span style="font-size:12px;font-weight:700;color:#aed0d6">Fit-Inn Trier</span></div>')+
    '<div style="font-size:24px;font-weight:900;letter-spacing:-.4px">'+esc(title)+'</div>'+
    (sub?'<div style="font-size:13.5px;color:#aed0d6;font-weight:600;margin-top:2px">'+esc(sub)+'</div>':'')+
  '</div>';
}

// ── Screen: HEUTE ──
function ring(pct,center,sub){
  var r=52,c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return '<svg width="150" height="150" viewBox="0 0 130 130"><circle cx="65" cy="65" r="'+r+'" fill="none" stroke="#e9eff0" stroke-width="12"></circle>'+
    '<circle cx="65" cy="65" r="'+r+'" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 65 65)"></circle>'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e6072"></stop><stop offset="1" stop-color="#37b27a"></stop></linearGradient></defs>'+
    '<text x="65" y="61" text-anchor="middle" font-size="27" font-weight="900" fill="#15171B">'+center+'</text>'+
    '<text x="65" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#8a929a">'+sub+'</text></svg>';
}
function macroBar(label,val,goal,col){
  var pct=goal?Math.min(1,val/goal):0;
  return '<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:5px"><span style="color:var(--text2)">'+label+'</span><span style="color:var(--muted)">'+round(val)+' / '+goal+' g</span></div>'+
    '<div style="height:8px;border-radius:6px;background:#eef2f3;overflow:hidden"><div style="height:100%;width:'+round(pct*100)+'%;background:'+col+';border-radius:6px"></div></div></div>';
}
function scrHeute(){
  var t=targets(), e=eaten(), left=Math.max(0,t.kcal-round(e.kcal));
  var wg=[];
  for(var i=0;i<S.waterGoal;i++){ var on=i<S.water; wg.push('<button data-act="water" data-arg="'+i+'" style="border:none;background:none;padding:2px">'+svg(IC.water,{c:on?'#2C9BD6':'#cdd8da',w:2,s:22})+'</button>'); }
  var logHtml=(S.log||[]).length? S.log.map(function(x){
    return '<div style="display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border)"><div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:700">'+esc(x.name)+'</div><div style="font-size:12px;color:var(--muted);font-weight:600">'+round(x.kcal)+' kcal · E'+round(x.protein)+' K'+round(x.carbs)+' F'+round(x.fat)+'</div></div><button data-act="rmlog" data-arg="'+x.id+'" style="border:none;background:none;color:#c2ccce;padding:6px">'+svg(IC.x,{c:'#c2ccce',w:2.2,s:18})+'</button></div>';
  }).join(''):'<div style="padding:16px 0;color:var(--muted);font-size:13.5px;font-weight:600;text-align:center">Noch nichts protokolliert. Nutze „Schnell loggen" oder den Erfassen-Tab.</div>';
  return header('Ernährung heute','Dein Tagesziel im Blick')+
    '<div class="card" style="display:flex;align-items:center;gap:18px">'+
      '<div style="flex-shrink:0">'+ring(round(e.kcal)/t.kcal, left, 'kcal übrig')+'</div>'+
      '<div style="flex:1"><div style="font-size:13px;color:var(--muted);font-weight:700">Gegessen</div><div style="font-size:22px;font-weight:900">'+round(e.kcal)+' <span style="font-size:14px;color:var(--muted)">/ '+t.kcal+' kcal</span></div>'+
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">'+
          macroBar('Eiweiß',e.protein,t.protein,'#37b27a')+
          macroBar('Kohlenh.',e.carbs,t.carbs,'#E0A44C')+
          macroBar('Fett',e.fat,t.fat,'#8E7BF0')+
        '</div></div></div>'+
    '<div class="card" style="margin-top:14px;display:flex;align-items:center;gap:10px">'+
      '<div style="flex:1"><div style="font-size:14px;font-weight:800">Wasser</div><div style="font-size:12px;color:var(--muted);font-weight:600">'+S.water+' / '+S.waterGoal+' Gläser</div></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:1px;justify-content:flex-end;max-width:60%">'+wg.join('')+'</div></div>'+
    '<div style="font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:22px 2px 10px">Schnell loggen</div>'+
    '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">'+QUICK.map(function(q,i){return '<button class="chip" data-act="quickadd" data-arg="'+i+'" style="flex-shrink:0">+ '+esc(q.name)+'</button>';}).join('')+'</div>'+
    '<div class="card" style="margin-top:16px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span style="font-size:16px;font-weight:900">Heute gegessen</span><button data-act="tab" data-arg="erfassen" style="border:none;background:none;color:var(--tealink);font-weight:800;font-size:13px">+ Erfassen</button></div>'+logHtml+'</div>'+
    finnCard();
}
function finnCard(){
  return '<div data-act="finn" class="card" style="margin-top:16px;background:linear-gradient(150deg,#0e6072,#073e4b);color:#fff;display:flex;align-items:center;gap:13px;cursor:pointer">'+
    '<div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F6A964,#E07C3C);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+svg(IC.finn,{c:'#fff',w:2,s:22})+'</div>'+
    '<div style="flex:1"><div style="font-size:15px;font-weight:900">FINN · Ernährungscoach</div><div style="font-size:12.5px;color:#aed0d6;font-weight:600">Frag FINN, plane Rezepte, bleib im Ziel</div></div>'+
    svg(IC.chevron,{c:'#aed0d6',w:2.2,s:18})+'</div>';
}

// ── Screen: REZEPTE ──
function scrRezepte(){
  if(U.recipe) return recipeDetail(U.recipe);
  var saved=(S.saved||[]);
  return header('Rezepte','Erstellen, kochen, speichern')+
    '<div class="card"><div style="font-size:16px;font-weight:900;margin-bottom:3px">Rezept erstellen</div><div style="font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:12px">Sag FINN, worauf du Lust hast.</div>'+
      '<textarea class="inp" rows="2" placeholder="z. B. proteinreiches Frühstück, schnell, vegetarisch …" oninput="NUT.field(\'createText\',this.value)">'+esc(U.createText)+'</textarea>'+
      '<button class="btn orange" data-act="createRecipe" style="margin-top:11px">'+(U.recipeBusy&&U.recipeMode==='create'?'<span class="spin"></span> FINN kocht …':(svg(IC.spark,{c:'#fff',w:2,s:18})+' Rezept erstellen'))+'</button>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><div style="font-size:16px;font-weight:900;margin-bottom:3px">Aus dem Kühlschrank kochen</div><div style="font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:12px">Sag FINN, was da ist – er findet ein Rezept.</div>'+
      '<input class="inp" placeholder="z. B. Hähnchen, Reis, Brokkoli" value="'+esc(U.fridgeText)+'" oninput="NUT.field(\'fridgeText\',this.value)">'+
      '<button class="btn ghost" data-act="fridgeRecipe" style="margin-top:11px">'+(U.recipeBusy&&U.recipeMode==='fridge'?'<span class="spin"></span> Suche Rezept …':'Rezept finden')+'</button>'+
    '</div>'+
    (U.recipeErr?'<div style="margin-top:12px;background:#fbeae7;color:#b53a2c;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700">'+esc(U.recipeErr)+'</div>':'')+
    (saved.length?('<div style="font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:22px 2px 10px">Meine Rezepte</div>'+saved.map(function(r,i){return recipeRow(r,'saved:'+i);}).join('')):'')+
    '<div style="font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:22px 2px 10px">Passende Rezepte</div>'+
    DEMO_RECIPES.map(function(r,i){return recipeRow(r,'demo:'+i);}).join('');
}
function recipeRow(r,ref){
  var n=r.nutrition||{};
  return '<div data-act="openRecipe" data-arg="'+ref+'" class="card" style="display:flex;align-items:center;gap:13px;margin-bottom:11px;padding:12px;cursor:pointer">'+
    '<div style="width:60px;height:60px;border-radius:14px;background:linear-gradient(150deg,#0e6072,#073e4b);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+svg(IC.rezepte,{c:'#fff',w:1.7,s:24})+'</div>'+
    '<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.title)+'</div>'+
      '<div style="font-size:12px;color:var(--muted);font-weight:600;margin-top:2px">'+round(n.kcal)+' kcal · '+round(n.protein)+' g Eiweiß · '+(r.minutes||'?')+' Min</div></div>'+
    svg(IC.chevron,{c:'#c2ccce',w:2.2,s:18})+'</div>';
}
function statBox(big,lab,col){return '<div style="flex:1;background:var(--surface2);border-radius:14px;padding:12px;text-align:center"><div style="font-size:19px;font-weight:900;color:'+(col||'var(--text)')+'">'+big+'</div><div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:1px">'+lab+'</div></div>';}
function recipeDetail(r){
  var n=r.nutrition||{};
  return header(r.title, r.subtitle||'', true)+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+
      '<span class="chip" style="border:none;background:var(--orangebg);color:var(--orangeink)">'+svg(IC.clock,{c:'#b5631f',w:2,s:14})+' '+(r.minutes||'?')+' Min</span>'+
      '<span class="chip" style="border:none;background:var(--surface2)">'+(r.portions||1)+' Portionen</span>'+
      (r.tags||[]).map(function(t){return '<span class="chip" style="border:none;background:var(--greenbg);color:var(--greenink)">'+esc(t)+'</span>';}).join('')+
    '</div>'+
    '<div style="font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 2px 8px">Nährwerte pro Portion</div>'+
    '<div style="display:flex;gap:8px">'+statBox(round(n.kcal),'kcal')+statBox(round(n.protein)+' g','Eiweiß','#176b37')+statBox(round(n.carbs)+' g','Kohlenh.','#b5631f')+statBox(round(n.fat)+' g','Fett','#5B47C9')+'</div>'+
    '<div class="card" style="margin-top:16px"><div style="font-size:16px;font-weight:900;margin-bottom:10px">Zutaten</div>'+
      (r.ingredients||[]).map(function(z){return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:14px"><span style="font-weight:600;color:var(--text2)">'+esc(z.name)+'</span><span style="font-weight:800">'+esc(z.qty||'')+'</span></div>';}).join('')+'</div>'+
    '<div class="card" style="margin-top:14px"><div style="font-size:16px;font-weight:900;margin-bottom:10px">Zubereitung</div>'+
      (r.steps||[]).map(function(st,i){return '<div style="display:flex;gap:11px;padding:8px 0"><div style="width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(i+1)+'</div><div style="font-size:14px;line-height:1.5;color:var(--text2);font-weight:500">'+esc(st)+'</div></div>';}).join('')+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:16px">'+
      '<button class="btn ghost" data-act="saveRecipe" style="flex:1">'+((S.saved||[]).some(function(x){return x.title===r.title;})?'✓ Gespeichert':'Rezept speichern')+'</button>'+
      '<button class="btn" data-act="logRecipe" style="flex:1">Ins Tagesprotokoll</button>'+
    '</div>'+
    '<button class="btn ghost" data-act="planRecipe" style="margin-top:10px">In den Wochenplan</button>';
}

// ── Screen: PLAN ──
var DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
function scrPlan(){
  var plan=S.plan||{};
  var rows=DAYS.map(function(d){
    var p=plan[d]||{};
    var slot=function(k,lab){ var v=p[k]; return '<div style="flex:1"><div style="font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">'+lab+'</div><div style="font-size:13px;font-weight:700;margin-top:2px;color:'+(v?'var(--text)':'#c2ccce')+'">'+esc(v||'—')+'</div></div>'; };
    return '<div class="card" style="margin-bottom:10px;padding:14px"><div style="display:flex;align-items:center;gap:12px"><div style="width:36px;height:36px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--teal);flex-shrink:0">'+d+'</div>'+slot('mittag','Mittag')+slot('abend','Abend')+'</div></div>';
  }).join('');
  var sh=(S.shopping||[]);
  var shopHtml=sh.length? sh.map(function(it,i){return '<label style="display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--border)"><input type="checkbox" '+(it.done?'checked':'')+' onchange="NUT.toggleShop('+i+')" style="width:19px;height:19px;accent-color:#0a4958"><span style="flex:1;font-size:14.5px;font-weight:600;'+(it.done?'text-decoration:line-through;color:var(--muted)':'')+'">'+esc(it.name)+'</span></label>';}).join(''):'<div style="padding:16px 0;color:var(--muted);font-size:13.5px;font-weight:600;text-align:center">Noch keine Einkaufsliste.</div>';
  return header('Mein Plan','Wochenplan & Einkaufsliste')+
    '<button class="btn orange" data-act="autoPlan">'+(U.planBusy?'<span class="spin"></span> FINN plant …':(svg(IC.spark,{c:'#fff',w:2,s:18})+' Woche automatisch planen'))+'</button>'+
    '<div style="font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 2px 10px">Wochenplan</div>'+rows+
    '<div class="card" style="margin-top:14px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-size:16px;font-weight:900">'+svg(IC.cart,{c:TEAL,w:2,s:18})+' Einkaufsliste</span>'+(sh.length?'<button data-act="clearShop" style="border:none;background:none;color:var(--tealink);font-weight:800;font-size:12.5px">Erledigte entfernen</button>':'')+'</div>'+
      shopHtml+
      '<div style="display:flex;gap:8px;margin-top:12px"><input id="shopin" class="inp" placeholder="Zutat hinzufügen …" onkeydown="if(event.key===\'Enter\')NUT.addShop()"><button class="btn" data-act="addShop" style="width:auto;padding:13px 18px">+</button></div>'+
      '<button class="btn ghost" data-act="planToShop" style="margin-top:12px">Einkaufsliste aus Wochenplan erstellen</button></div>';
}

// ── Screen: ERFASSEN ──
function scrErfassen(){
  var soon=function(t,d,ic){return '<div data-act="soon" data-arg="'+esc(t)+'" class="card" style="display:flex;align-items:center;gap:13px;margin-bottom:11px;cursor:pointer"><div style="width:46px;height:46px;border-radius:13px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+svg(ic,{c:TEAL,w:1.9,s:22})+'</div><div style="flex:1"><div style="font-size:15px;font-weight:800">'+t+'</div><div style="font-size:12.5px;color:var(--muted);font-weight:600">'+d+'</div></div>'+svg(IC.chevron,{c:'#c2ccce',w:2.2,s:18})+'</div>';};
  return header('Essen erfassen','Wähle deine Methode')+
    '<div class="card" style="margin-bottom:16px"><div style="font-size:16px;font-weight:900;margin-bottom:3px">Schnell eintragen</div><div style="font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:12px">Name + Kalorien reichen. Makros optional.</div>'+
      '<input class="inp" id="q_name" placeholder="Was hast du gegessen?" style="margin-bottom:9px">'+
      '<div style="display:flex;gap:9px;margin-bottom:9px"><input class="inp" id="q_kcal" inputmode="numeric" placeholder="kcal"><input class="inp" id="q_p" inputmode="numeric" placeholder="Eiweiß g"></div>'+
      '<div style="display:flex;gap:9px;margin-bottom:12px"><input class="inp" id="q_c" inputmode="numeric" placeholder="Kohlenh. g"><input class="inp" id="q_f" inputmode="numeric" placeholder="Fett g"></div>'+
      '<button class="btn" data-act="quickLog">Ins Tagesprotokoll</button></div>'+
    soon('Foto vom Teller','FINN erkennt Zutaten & Portion automatisch',IC.cam)+
    soon('Barcode scannen','Verpackte Produkte – Nährwerte aus der Datenbank',IC.barcode)+
    soon('Sprechen','Sag einfach, was du gegessen hast',IC.mic)+
    soon('Suchen','Lebensmittel in der Datenbank finden',IC.search);
}

// ── Screen: PROFIL ──
function scrProfil(){
  var p=S.profile, t=targets();
  var seg=function(field,opts){ return '<div class="seg">'+opts.map(function(o){var on=p[field]===o[0];return '<button data-act="setp" data-arg="'+field+':'+o[0]+'" class="'+(on?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>'; };
  var num=function(field,lab,unit){ return '<div style="flex:1"><label class="lbl">'+lab+'</label><div style="position:relative"><input class="inp" inputmode="numeric" value="'+esc(p[field])+'" oninput="NUT.prof(\''+field+'\',this.value)">'+(unit?'<span style="position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:700">'+unit+'</span>':'')+'</div></div>'; };
  return header('Dein Profil','Für die Berechnung deines Ziels')+
    '<div class="card"><div style="font-size:16px;font-weight:900;margin-bottom:12px">Deine Körperdaten</div>'+
      '<label class="lbl">Geschlecht</label>'+seg('sex',[['w','Weiblich'],['m','Männlich']])+
      '<div style="display:flex;gap:10px;margin-top:14px">'+num('age','Alter')+num('height','Größe','cm')+'</div>'+
      '<div style="display:flex;gap:10px;margin-top:14px">'+num('weight','Gewicht','kg')+num('target','Zielgewicht','kg')+'</div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><div style="font-size:16px;font-weight:900;margin-bottom:12px">Was ist dein Ziel?</div>'+seg('goal',[['abnehmen','Abnehmen'],['halten','Halten'],['muskelaufbau','Muskelaufbau']])+
      '<div style="font-size:13px;font-weight:800;color:var(--muted);margin:16px 0 8px">Aktivität im Alltag</div>'+seg('activity',[['sitzend','Sitzend'],['leicht','Leicht'],['aktiv','Aktiv'],['sehr','Sehr aktiv']])+
      '<div style="font-size:13px;font-weight:800;color:var(--muted);margin:16px 0 8px">Ernährungsform</div>'+seg('diet',[['normal','Normal'],['vegetarisch','Vegetarisch'],['vegan','Vegan'],['fasten','Intervallfasten']])+
    '</div>'+
    '<div class="card" style="margin-top:14px;background:linear-gradient(150deg,#0e6072,#073e4b);color:#fff"><div style="font-size:13px;color:#aed0d6;font-weight:800;text-transform:uppercase;letter-spacing:.5px">Dein Tagesziel steht</div>'+
      '<div style="font-size:34px;font-weight:900;margin:4px 0 2px">'+t.kcal+' <span style="font-size:16px;color:#aed0d6">kcal / Tag</span></div>'+
      '<div style="display:flex;gap:10px;margin-top:12px">'+
        '<div style="flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:900">'+t.protein+' g</div><div style="font-size:10.5px;color:#aed0d6;font-weight:700">Eiweiß</div></div>'+
        '<div style="flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:900">'+t.carbs+' g</div><div style="font-size:10.5px;color:#aed0d6;font-weight:700">Kohlenh.</div></div>'+
        '<div style="flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:10px;text-align:center"><div style="font-size:16px;font-weight:900">'+t.fat+' g</div><div style="font-size:10.5px;color:#aed0d6;font-weight:700">Fett</div></div>'+
      '</div><div style="font-size:11.5px;color:#8fb9c1;font-weight:600;margin-top:10px">Berechnet auf Basis deiner Angaben — jederzeit anpassbar.</div></div>'+
    '<div class="card" style="margin-top:14px;display:flex;align-items:center;gap:13px"><div style="width:44px;height:44px;border-radius:50%;background:var(--orangebg);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+svg(IC.profil,{c:'#E08C53',w:1.9,s:22})+'</div><div style="flex:1"><div style="font-size:15px;font-weight:800">Persönliche Ernährungsberatung</div><div style="font-size:12.5px;color:var(--muted);font-weight:600">Lieber ein Mensch? Buche 1:1 im Studio.</div></div><button class="btn" data-act="soon" data-arg="Termin anfragen" style="width:auto;padding:11px 15px;font-size:13px">Anfragen</button></div>'+
    '<button class="btn ghost" data-act="reset" style="margin-top:16px;color:#b53a2c;border-color:#eddad6">Testdaten zurücksetzen</button>';
}

// ── FINN Sheet ──
function finnSheet(){
  return '<div class="sheet"><div class="bd" data-act="closeFinn"></div><div class="pane">'+
    '<div style="background:linear-gradient(150deg,#0e6072,#073e4b);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px"><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F6A964,#E07C3C);display:flex;align-items:center;justify-content:center">'+svg(IC.finn,{c:'#fff',w:2,s:20})+'</div><div style="flex:1"><div style="font-size:16px;font-weight:900">FINN · Ernährungscoach</div><div style="font-size:12px;color:#aed0d6;font-weight:600">Rezeptidee gefällig?</div></div><button data-act="closeFinn" style="border:none;background:rgba(255,255,255,.15);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center">'+svg(IC.x,{c:'#fff',w:2.2,s:18})+'</button></div>'+
    '<div style="padding:20px"><div style="font-size:14.5px;color:var(--text2);line-height:1.6;font-weight:500;margin-bottom:14px">Sag mir, worauf du Lust hast oder was im Kühlschrank ist — ich koche dir ein passendes Rezept zu deinem Tagesziel.</div>'+
      '<textarea class="inp" rows="3" placeholder="z. B. schnelles Abendessen mit viel Eiweiß" oninput="NUT.field(\'createText\',this.value)">'+esc(U.createText)+'</textarea>'+
      '<button class="btn orange" data-act="finnCreate" style="margin-top:12px">'+(U.recipeBusy?'<span class="spin"></span> FINN kocht …':'Rezept von FINN')+'</button>'+
    '</div></div></div>';
}

// ── Bottom Nav ──
function bnav(){
  var items=[['heute','Heute',IC.heute],['rezepte','Rezepte',IC.rezepte],['plan','Plan',IC.plan],['erfassen','Erfassen',IC.erfassen],['profil','Profil',IC.profil]];
  return '<nav class="bnav">'+items.map(function(it){var on=U.tab===it[0];return '<button data-act="tab" data-arg="'+it[0]+'" style="color:'+(on?'#0a4958':'#9aa6aa')+';font-weight:'+(on?'800':'700')+'">'+svg(it[2],{c:on?'#0a4958':'#9aa6aa',w:on?2:1.8,s:23})+'<span>'+it[1]+'</span></button>';}).join('')+'</nav>';
}

// ── Render ──
function render(){
  var html='';
  if(U.tab==='heute') html=scrHeute();
  else if(U.tab==='rezepte') html=scrRezepte();
  else if(U.tab==='plan') html=scrPlan();
  else if(U.tab==='erfassen') html=scrErfassen();
  else if(U.tab==='profil') html=scrProfil();
  $('app').innerHTML='<div class="body">'+html+'</div>'+bnav()+
    (U.tab==='heute'?'<button class="fab" data-act="finn">'+svg(IC.finn,{c:'#fff',w:2,s:24})+'</button>':'')+
    (U.finnOpen?finnSheet():'');
}

// ── Recipe generation ──
function genRecipe(mode){
  var text=(mode==='fridge'?U.fridgeText:U.createText).trim();
  if(!text){ U.recipeErr=(mode==='fridge'?'Sag mir kurz, welche Zutaten da sind.':'Sag mir kurz, worauf du Lust hast.'); render(); return; }
  var t=targets();
  U.recipeBusy=true; U.recipeMode=mode; U.recipeErr=''; render();
  fetch('/api/nutrition/recipe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode,text:text,goal:S.profile.goal,kcal:Math.round(t.kcal/3),portions:2})})
    .then(function(r){return r.json();}).then(function(d){
      U.recipeBusy=false;
      if(d&&d.ok&&d.recipe){ U.recipe=d.recipe; U.tab='rezepte'; U.finnOpen=false; render(); window.scrollTo(0,0); }
      else { U.recipeErr='Konnte gerade kein Rezept erstellen. Versuch es nochmal.'; render(); }
    }).catch(function(){ U.recipeBusy=false; U.recipeErr='Netzwerkfehler – bitte erneut versuchen.'; render(); });
}
function autoPlan(){
  U.planBusy=true; render();
  // Grundgerüst: einfacher Plan aus Demo-Rezepten (später FINN-Wochenplanung).
  setTimeout(function(){
    var pool=DEMO_RECIPES.concat(S.saved||[]);
    var plan={};
    DAYS.forEach(function(d,i){ plan[d]={mittag:(pool[i%pool.length]||{}).title||'—', abend:(pool[(i+1)%pool.length]||{}).title||'—'}; });
    S.plan=plan; U.planBusy=false; setS();
  },500);
}

// ── Actions ──
var NUT={
  field:function(f,v){ U[f]=v; },
  prof:function(f,v){ S.profile[f]=(f==='sex'||f==='goal'||f==='activity'||f==='diet')?v:(v.replace(/[^\d.]/g,'')||0); save(); if(f==='age'||f==='height'||f==='weight'){ clearTimeout(NUT._t); NUT._t=setTimeout(render,400);} },
  toggleShop:function(i){ if(S.shopping[i]){ S.shopping[i].done=!S.shopping[i].done; setS(); } },
  addShop:function(){ var el=$('shopin'); if(el&&el.value.trim()){ S.shopping.push({name:el.value.trim(),done:false}); el.value=''; setS(); } },
  quickLog:function(){ var n=($('q_name')||{}).value; if(!n||!n.trim()){alert('Bitte einen Namen eingeben.');return;} S.log.push({id:'l'+Date.now(),name:n.trim(),kcal:+($('q_kcal')||{}).value||0,protein:+($('q_p')||{}).value||0,carbs:+($('q_c')||{}).value||0,fat:+($('q_f')||{}).value||0}); U.tab='heute'; setS(); window.scrollTo(0,0); }
};
window.NUT=NUT;

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.getAttribute('data-act'), arg=el.getAttribute('data-arg');
  if(act==='tab'){ U.tab=arg; U.recipe=null; render(); window.scrollTo(0,0); }
  else if(act==='back'){ U.recipe=null; render(); window.scrollTo(0,0); }
  else if(act==='water'){ var i=+arg; S.water=(i+1===S.water)?i:i+1; setS(); }
  else if(act==='quickadd'){ var q=QUICK[+arg]; S.log.push({id:'l'+Date.now(),name:q.name,kcal:q.kcal,protein:q.protein,carbs:q.carbs,fat:q.fat}); setS(); }
  else if(act==='rmlog'){ S.log=S.log.filter(function(x){return x.id!==arg;}); setS(); }
  else if(act==='createRecipe'||act==='finnCreate'){ genRecipe('create'); }
  else if(act==='fridgeRecipe'){ genRecipe('fridge'); }
  else if(act==='openRecipe'){ var p=arg.split(':'); U.recipe=(p[0]==='demo'?DEMO_RECIPES:S.saved)[+p[1]]; render(); window.scrollTo(0,0); }
  else if(act==='saveRecipe'){ if(U.recipe&&!(S.saved||[]).some(function(x){return x.title===U.recipe.title;})){ S.saved.unshift(U.recipe); setS(); } }
  else if(act==='logRecipe'){ var r=U.recipe,n=r.nutrition||{}; S.log.push({id:'l'+Date.now(),name:r.title,kcal:n.kcal,protein:n.protein,carbs:n.carbs,fat:n.fat}); U.tab='heute'; U.recipe=null; setS(); window.scrollTo(0,0); }
  else if(act==='planRecipe'){ var d=DAYS[new Date().getDay()===0?6:new Date().getDay()-1]; S.plan[d]=S.plan[d]||{}; S.plan[d].abend=U.recipe.title; U.tab='plan'; U.recipe=null; setS(); window.scrollTo(0,0); }
  else if(act==='autoPlan'){ autoPlan(); }
  else if(act==='addShop'){ NUT.addShop(); }
  else if(act==='clearShop'){ S.shopping=S.shopping.filter(function(x){return !x.done;}); setS(); }
  else if(act==='planToShop'){ var items={}; Object.keys(S.plan||{}).forEach(function(k){var pp=S.plan[k];['mittag','abend'].forEach(function(m){ if(pp[m]&&pp[m]!=='—'){ var rec=DEMO_RECIPES.concat(S.saved||[]).find(function(x){return x.title===pp[m];}); if(rec)(rec.ingredients||[]).forEach(function(z){items[z.name]=true;});}});}); Object.keys(items).forEach(function(nm){ if(!S.shopping.some(function(x){return x.name===nm;})) S.shopping.push({name:nm,done:false}); }); setS(); }
  else if(act==='quickLog'){ NUT.quickLog(); }
  else if(act==='setp'){ var kv=arg.split(':'); S.profile[kv[0]]=kv[1]; setS(); }
  else if(act==='reset'){ if(confirm('Alle Testdaten zurücksetzen?')){ S=JSON.parse(JSON.stringify(DEFAULTS)); save(); render(); } }
  else if(act==='finn'){ U.finnOpen=true; render(); }
  else if(act==='closeFinn'){ U.finnOpen=false; render(); }
  else if(act==='soon'){ alert((arg||'Diese Funktion')+' folgt in einer der nächsten Ausbaustufen. 🙂'); }
});

render();
</script>
</body>
</html>
