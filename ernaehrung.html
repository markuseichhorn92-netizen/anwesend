<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f7a4a">
<title>Fit-Inn Trier · Ernährungscoach (Test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    /* Grün-Palette laut Design-Vorgabe */
    --g:#0f7a4a; --g2:#12a06a; --g3:#22a866; --gdark:#0a5a37;
    --teal:#0a4958; --teal2:#0e2529;
    --bg:#eef2f3; --surface:#fff; --surface2:#f4f7f7;
    --text:#15171B; --text2:#2c3338; --muted:#6b7780; --soft:#8a929a; --soft2:#9aa6aa;
    --tintG:#e9f6ee; --tintG2:#f4faf6; --tintG3:#c5ecd7; --tintGw:#d4f0e2;
    --pE:#E07A5F; --pEbg:#FBEFE8; --pEink:#c5654f;
    --pC:#EBA23B; --pCbg:#FBF2E1; --pCink:#b0801f;
    --pF:#A97BD6; --pFbg:#F1ECFA; --pFink:#8b5fc0;
    --orange:#EBA23B; --orangeink:#b5631f;
    --water:#37A9E0; --waterink:#2d84b8; --waterbg:#EAF4FB;
  }
  html,body{margin:0;padding:0;background:#dfe6e7;font-family:'Archivo',system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  #app{position:relative;max-width:460px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
  button{font-family:inherit}
  input{font-family:inherit}
  .tapc{transition:transform .12s ease, opacity .12s ease}
  .tapc:active{transform:scale(.96);opacity:.9}
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:96px}
  .hsnap{scrollbar-width:none}
  .hsnap::-webkit-scrollbar{display:none}
  .scroll::-webkit-scrollbar{width:0}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes ovFade{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{transform:translateY(30px)}to{transform:none}}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes scanLine{from{top:38px}to{bottom:38px;top:auto}}
  @keyframes micRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
  .fadein{animation:cardIn .3s ease}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
(function(){
  var LS = 'fitinn_nutri_v1';
  var finnMark = '<svg viewBox="0 0 44 44" width="100%" height="100%"><defs><radialGradient id="fg" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#3fd0e0"/><stop offset="55%" stop-color="#1aa6c4"/><stop offset="100%" stop-color="#0a4958"/></radialGradient></defs><rect width="44" height="44" fill="url(#fg)"/><path d="M22 11l2.4 6.1 6.1 2.4-6.1 2.4L22 28l-2.4-6.1-6.1-2.4 6.1-2.4z" fill="#fff"/><circle cx="30.5" cy="14" r="1.9" fill="#ffe08a"/></svg>';

  // ---------- default profile ----------
  var defaults = { onboarded:false, goal:'abnehmen', sex:'w', height:168, weight:68, age:31, activity:'moderat', diet:'omnivor' };

  var S = {
    screen:'heute', obStep:0,
    captureMethod:'cam', captureTarget:'Frühstück',
    scanning:false, scanKind:'photo', scanResultOpen:false,
    recording:false, transcript:'', searchQ:'',
    extraKcal:0, extraP:0, extraC:0, extraF:0,
    water:5, waterGoal:10,
    chat:[{from:'finn', text:'Hey Lena! 🥗 Ich bin FINN, dein Ernährungscoach. Frag mich alles rund um Essen, Makros oder Rezepte — oder erzähl mir einfach, was du heute gegessen hast.'}],
    chatInput:'', chatLoading:false,
    planTab:'woche', planGenerated:false, mealPlan:{}, shopping:[],
    remindersOpen:false, reminders:{water:true, meals:true, weigh:false},
    advisorOpen:false, advisorBooked:false,
    checkinDismissed:false,
    fasting:true, fastStart: Date.now() - 11.5*3600*1000, fastPlan:'16:8', now:Date.now(),
    toast:null
  };
  // merge persisted profile
  try{ var raw=localStorage.getItem(LS); if(raw){ var d=JSON.parse(raw); ['onboarded','goal','sex','height','weight','age','activity','diet'].forEach(function(k){ if(d[k]!=null) S[k]=d[k]; }); } }catch(e){}
  Object.keys(defaults).forEach(function(k){ if(S[k]==null) S[k]=defaults[k]; });

  function persist(){ try{ var o={}; ['onboarded','goal','sex','height','weight','age','activity','diet'].forEach(function(k){o[k]=S[k];}); localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} }
  function set(patch){ Object.assign(S, patch); render(); }

  // ---------- targets (Mifflin-St Jeor) ----------
  function targets(){
    var bmr = 10*S.weight + 6.25*S.height - 5*S.age + (S.sex==='m'?5:-161);
    var factor = ({kaum:1.35, moderat:1.55, aktiv:1.75})[S.activity] || 1.55;
    var kcal = bmr*factor + (({abnehmen:-450, halten:0, aufbau:300})[S.goal] || 0);
    kcal = Math.round(kcal/10)*10;
    var protein = Math.round((S.goal==='aufbau'?2.0:1.8)*S.weight);
    var fat = Math.round(0.9*S.weight);
    var carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9)/4));
    var water = Math.round(S.weight*0.035*10)/10;
    return {kcal:kcal, protein:protein, carbs:carbs, fat:fat, water:water};
  }
  function eaten(){ return { k:1180+S.extraKcal, p:108+S.extraP, c:142+S.extraC, f:38+S.extraF }; }
  function pct(c,g){ return Math.min(100, Math.round(c/g*100)); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function comma(n){ return String(n).replace('.',','); }

  // ---------- toast ----------
  var toastT=null;
  function toast(msg){ S.toast=msg; render(); clearTimeout(toastT); toastT=setTimeout(function(){ S.toast=null; render(); },2200); }

  // ---------- fasting timer ----------
  function fastMs(){ var win = ({'16:8':16,'18:6':18,'14:10':14})[S.fastPlan]*3600*1000; var elapsed = S.fasting && S.fastStart ? (S.now - S.fastStart) : 0; return { win:win, elapsed:elapsed, remain:Math.max(0, win-elapsed) }; }
  function fmtHMS(ms){ var s=Math.floor(ms/1000); var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60; return h+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
  setInterval(function(){ if(S.fasting){ S.now=Date.now(); if(S.screen==='heute' && S.onboarded) render(); } },1000);

  // ---------- databases ----------
  function foodDb(){ return [
    {emoji:'🍗', name:'Hähnchenbrust', per:'100 g', kcal:165, p:31, c:0, f:4, bg:'#FBEFE8'},
    {emoji:'🥚', name:'Ei, gekocht', per:'1 Stück', kcal:78, p:6, c:1, f:5, bg:'#FBF2E1'},
    {emoji:'🧀', name:'Magerquark', per:'250 g', kcal:170, p:33, c:10, f:1, bg:'#EAF4FB'},
    {emoji:'🍚', name:'Reis, gekocht', per:'150 g', kcal:195, p:4, c:42, f:1, bg:'#E9F6EE'},
    {emoji:'🥑', name:'Avocado', per:'½ Stück', kcal:160, p:2, c:9, f:15, bg:'#E9F6EE'},
    {emoji:'🍌', name:'Banane', per:'1 Stück', kcal:105, p:1, c:27, f:0, bg:'#FBF2E1'},
    {emoji:'🥜', name:'Mandeln', per:'30 g', kcal:174, p:6, c:6, f:15, bg:'#FBEFE8'},
    {emoji:'🥛', name:'Skyr Vanille', per:'150 g', kcal:98, p:15, c:8, f:0, bg:'#EAF4FB'}
  ]; }
  function favDb(){ return [
    {emoji:'🥤', name:'Protein-Shake', kcal:180, p:30, c:8, f:2, bg:'#FBEFE8'},
    {emoji:'🧀', name:'Quark + Beeren', kcal:190, p:34, c:12, f:1, bg:'#EAF4FB'},
    {emoji:'🍳', name:'Rührei & Spinat', kcal:260, p:20, c:3, f:19, bg:'#FBF2E1'},
    {emoji:'🥪', name:'VK-Sandwich', kcal:340, p:22, c:38, f:10, bg:'#E9F6EE'}
  ]; }
  function recipeDb(){ return [
    {id:'r1', cat:'protein', title:'Hähnchen-Quinoa-Bowl', kcal:610, min:25, ingredients:[{name:'Hähnchenbrust',amount:'150 g'},{name:'Quinoa',amount:'80 g'},{name:'Brokkoli',amount:'150 g'}]},
    {id:'r2', cat:'fruehstueck', title:'Overnight Oats mit Beeren', kcal:420, min:5, ingredients:[{name:'Haferflocken',amount:'60 g'},{name:'Magerquark',amount:'150 g'},{name:'Beeren',amount:'100 g'}]},
    {id:'r3', cat:'vegan', title:'Kichererbsen-Curry', kcal:540, min:30, ingredients:[{name:'Kichererbsen',amount:'150 g'},{name:'Reis',amount:'80 g'},{name:'Kokosmilch',amount:'100 ml'}]},
    {id:'r4', cat:'lowcarb', title:'Zoodles mit Lachs', kcal:480, min:20, ingredients:[{name:'Zucchini',amount:'250 g'},{name:'Lachsfilet',amount:'150 g'},{name:'Feta',amount:'40 g'}]}
  ]; }

  function currentScanItems(){
    if(S.scanKind==='barcode') return [{emoji:'🥛', name:'Skyr Vanille (Arla)', portion:'1 Becher (150 g)', kcal:98, p:15, c:8, f:0, bg:'#EAF4FB'}];
    if(S.scanKind==='voice') return [
      {emoji:'🍝', name:'Spaghetti Bolognese', portion:'1 Teller (350 g)', kcal:520, p:24, c:62, f:18, bg:'#FBEFE8'},
      {emoji:'🧃', name:'Orangensaft', portion:'1 Glas (250 ml)', kcal:112, p:2, c:26, f:0, bg:'#FBF2E1'}
    ];
    return [
      {emoji:'🍗', name:'Hähnchenbrust, gegrillt', portion:'ca. 150 g', kcal:248, p:46, c:0, f:6, bg:'#FBEFE8'},
      {emoji:'🍚', name:'Reis & Gemüse', portion:'ca. 200 g', kcal:230, p:6, c:44, f:3, bg:'#E9F6EE'},
      {emoji:'🥗', name:'Blattsalat mit Öl', portion:'1 Portion', kcal:90, p:2, c:5, f:7, bg:'#F1ECFA'}
    ];
  }

  // ==================================================================
  // ACTIONS
  // ==================================================================
  var ACT = {
    go:function(s){ S.screen=s; var sc=document.querySelector('.scroll'); if(sc) sc.scrollTop=0; render(); },
    // onboarding
    obNext:function(){
      if(S.obStep>=4){ S.onboarded=true; S.obStep=0; persist(); render(); toast('Willkommen bei deinem Ernährungscoach!'); }
      else set({obStep:S.obStep+1});
    },
    pickGoal:function(k){ set({goal:k}); },
    pickSex:function(k){ set({sex:k}); },
    pickAct:function(k){ set({activity:k}); },
    pickDiet:function(k){ set({diet:k}); },
    hMinus:function(){ set({height:Math.max(140,S.height-1)}); },
    hPlus:function(){ set({height:Math.min(210,S.height+1)}); },
    aMinus:function(){ set({age:Math.max(14,S.age-1)}); },
    aPlus:function(){ set({age:Math.min(90,S.age+1)}); },
    wMinus:function(){ set({weight:Math.max(40,S.weight-1)}); },
    wPlus:function(){ set({weight:Math.min(160,S.weight+1)}); },
    replayOnboarding:function(){ set({onboarded:false, obStep:0, screen:'heute'}); },
    // dashboard
    dismissCheckin:function(){ set({checkinDismissed:true}); },
    tapWater:function(i){ i=+i; var next=(i+1===S.water)?i:i+1; set({water:Math.max(0,Math.min(S.waterGoal,next))}); },
    logFav:function(i){ var f=favDb()[+i]; set({extraKcal:S.extraKcal+f.kcal, extraP:S.extraP+f.p, extraC:S.extraC+f.c, extraF:S.extraF+f.f}); toast(f.name+' geloggt · '+f.kcal+' kcal'); },
    setFastPlan:function(p){ set({fastPlan:p}); },
    toggleFast:function(){
      if(S.fasting){ set({fasting:false, fastStart:null}); toast('Fastenfenster beendet — guten Appetit!'); }
      else { set({fasting:true, fastStart:Date.now(), now:Date.now()}); toast('Fasten gestartet · '+S.fastPlan); }
    },
    // capture
    openCapture:function(target){ S.captureTarget=target||S.captureTarget; set({screen:'erfassen', captureMethod:'cam', scanning:false, recording:false, transcript:'', searchQ:''}); },
    closeCapture:function(){ ACT.go('heute'); },
    pickCam:function(){ set({captureMethod:'cam', transcript:'', recording:false}); },
    pickVoice:function(){ set({captureMethod:'voice', transcript:'', recording:false}); },
    pickSearch:function(){ set({captureMethod:'search', transcript:'', recording:false}); },
    pickBarcode:function(){ set({captureMethod:'barcode', transcript:'', recording:false}); },
    doScan:function(){ if(S.scanning) return; set({scanning:true}); setTimeout(function(){ set({scanning:false, scanResultOpen:true, scanKind:'photo'}); },1900); },
    doBarcode:function(){ if(S.scanning) return; set({scanning:true}); setTimeout(function(){ set({scanning:false, scanResultOpen:true, scanKind:'barcode'}); },1500); },
    toggleRec:function(){
      if(S.recording){ set({recording:false, transcript:'Ein Teller Spaghetti Bolognese und ein Glas Orangensaft'}); setTimeout(function(){ set({scanResultOpen:true, scanKind:'voice'}); },700); }
      else { set({recording:true, transcript:''}); setTimeout(function(){ if(S.recording) ACT.toggleRec(); },2600); }
    },
    addFood:function(i){ var f=foodDb()[+i]; set({extraKcal:S.extraKcal+f.kcal, extraP:S.extraP+f.p, extraC:S.extraC+f.c, extraF:S.extraF+f.f, screen:'heute'}); toast(f.name+' protokolliert · '+f.kcal+' kcal'); },
    closeScanResult:function(){ set({scanResultOpen:false}); },
    confirmScan:function(){ var items=currentScanItems(); var sum=items.reduce(function(a,b){return {k:a.k+b.kcal,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f};},{k:0,p:0,c:0,f:0}); set({scanResultOpen:false, extraKcal:S.extraKcal+sum.k, extraP:S.extraP+sum.p, extraC:S.extraC+sum.c, extraF:S.extraF+sum.f, screen:'heute', transcript:''}); toast(items.length+' Einträge protokolliert · '+sum.k+' kcal'); },
    // plan
    setPlanTab:function(t){ set({planTab:t}); },
    generateWeek:function(){ var days=['Mo','Di','Mi','Do','Fr','Sa','So']; var ids=recipeDb().map(function(r){return r.id;}); var plan={}; days.forEach(function(d,i){ plan[d]={f:'r2', m:ids[i%ids.length], a:ids[(i+2)%ids.length]}; }); set({mealPlan:plan, planGenerated:true, shopping:[]}); toast('Wochenplan von FINN erstellt 🗓️'); },
    buildShopping:function(){ var db=recipeDb(), plan=S.mealPlan, map={}; Object.keys(plan).forEach(function(k){ var day=plan[k]; ['f','m','a'].forEach(function(s){ var r=db.find(function(x){return x.id===day[s];}); if(r) r.ingredients.forEach(function(ing){ if(!map[ing.name]) map[ing.name]={name:ing.name, amount:ing.amount, checked:false}; }); }); }); var list=Object.keys(map).map(function(k){return map[k];}); set({shopping:list, planTab:'einkauf'}); toast(list.length+' Zutaten in die Einkaufsliste'); },
    toggleShop:function(i){ i=+i; var s=S.shopping.slice(); s[i]=Object.assign({}, s[i], {checked:!s[i].checked}); set({shopping:s}); },
    clearChecked:function(){ set({shopping:S.shopping.filter(function(x){return !x.checked;})}); },
    // sheets
    openReminders:function(){ set({remindersOpen:true}); },
    closeReminders:function(){ set({remindersOpen:false}); },
    toggleReminder:function(k){ var r=Object.assign({},S.reminders); r[k]=!r[k]; set({reminders:r}); },
    openAdvisor:function(){ set({advisorOpen:true}); },
    closeAdvisor:function(){ set({advisorOpen:false}); },
    bookAdvisor:function(){ set({advisorOpen:false, advisorBooked:true}); toast('Termin angefragt — das Team meldet sich 📩'); },
    // chat
    sendChatText:function(text){ sendChat(text); },
    sendChat:function(){ sendChat(S.chatInput); },
    noop:function(){}
  };

  function sendChat(text){
    text = String(text||'').trim();
    if(!text || S.chatLoading) return;
    S.chat.push({from:'user', text:text});
    S.chatInput=''; S.chatLoading=true; render();
    var t=targets(), e=eaten();
    var history = S.chat.slice(-8).map(function(m){ return {role:m.from==='user'?'user':'finn', text:m.text}; });
    fetch('/api/nutrition/coach', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
      question:text, history:history,
      profile:{ goal:({abnehmen:'Abnehmen',halten:'Gewicht halten',aufbau:'Muskelaufbau'})[S.goal], kcal:t.kcal, protein:t.protein, eaten:e.k }
    })}).then(function(r){return r.json();}).then(function(j){
      S.chatLoading=false;
      S.chat.push({from:'finn', text:(j&&j.answer)||'Da komme ich gerade nicht weiter — frag mich gleich nochmal. 🙂'});
      render(); scrollChat();
    }).catch(function(){
      S.chatLoading=false;
      S.chat.push({from:'finn', text:'Ich bin gerade offline — versuch es gleich nochmal. 🙂'});
      render(); scrollChat();
    });
    scrollChat();
  }
  function scrollChat(){ setTimeout(function(){ var el=document.querySelector('.chatscroll'); if(el) el.scrollTop=el.scrollHeight; },30); }

  // ==================================================================
  // ICONS
  // ==================================================================
  var IC = {
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
    chat:'<path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.6 8.6 0 0 1-4-1L3 20l1-5a8.4 8.4 0 0 1-1-4A8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/>',
    home:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    cal:'<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/>',
    chart:'<path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    water:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
    chevR:'<path d="M9 18l6-6-6-6"/>',
    chevL:'<path d="M15 18l-6-6 6-6"/>',
    x:'<path d="M18 6L6 18M6 6l12 12"/>',
    cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
    barcode:'<path d="M3 5v14M7 5v14M11 5v14M14 5v14M18 5v14M21 5v14"/>',
    send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
    check:'<path d="M20 6L9 17l-5-5"/>',
    cart:'<circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/><path d="M2 3h3l2.5 13h11l2-9H6"/>',
    spark:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
    dumbbell:'<path d="M6.5 6.5l11 11M4 9l-1.5-1.5M20 15l1.5 1.5M9 4l-1.5-1.5M15 20l1.5 1.5M3 12l3-3 6 6-3 3zM21 12l-3 3-6-6 3-3z"/>',
    idea:'<path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zM9 21h6"/>',
    book:'<path d="M6 4h9a2 2 0 0 1 2 2v14l-3-2-3 2-3-2V6a2 2 0 0 1 2-2z"/>'
  };
  function svg(path, o){ o=o||{}; return '<svg width="'+(o.w||20)+'" height="'+(o.h||o.w||20)+'" viewBox="0 0 24 24" fill="none" stroke="'+(o.s||'#fff')+'" stroke-width="'+(o.sw||1.9)+'" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'; }

  // ==================================================================
  // STATUS BAR
  // ==================================================================
  function statusBar(light){
    var c = light ? '#fff' : '#15171B';
    return '<div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:'+c+';flex-shrink:0">'+
      '<span style="font-size:15px;font-weight:700;letter-spacing:.3px">9:41</span>'+
      '<div style="display:flex;align-items:center;gap:7px">'+
        '<svg width="18" height="12" viewBox="0 0 18 13" fill="currentColor"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="8" rx="1"/><rect x="10" y="2.5" width="3" height="10.5" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg>'+
        '<svg width="17" height="12" viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 5.5C5 1.5 12 1.5 16 5.5M3.5 8C6 5.5 11 5.5 13.5 8M6 10.5c1.4-1.3 3.6-1.3 5 0" stroke-linecap="round"/></svg>'+
        '<svg width="25" height="12" viewBox="0 0 25 13" fill="none"><rect x="1" y="1" width="20" height="11" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.5" y="2.5" width="15" height="8" rx="1.6" fill="currentColor"/><rect x="22.5" y="4" width="1.8" height="5" rx="1" fill="currentColor" opacity=".5"/></svg>'+
      '</div></div>';
  }

  // ==================================================================
  // ONBOARDING
  // ==================================================================
  function renderOnboarding(){

    var light = (S.screen==='heute'||S.screen==='plan'||S.screen==='verlauf'||S.screen==='erfassen');
    var body='';
    if(S.screen==='heute') body=renderHeute();
    else if(S.screen==='erfassen') body=renderErfassen();
    else if(S.screen==='coach') body=renderCoach();
    else if(S.screen==='plan') body=renderPlan();
    else if(S.screen==='verlauf') body=renderVerlauf();

    var showNav = S.screen!=='coach' && S.screen!=='erfassen';
    var sbBg = (S.screen==='heute'||S.screen==='plan'||S.screen==='verlauf') ? '#12a06a' : (S.screen==='erfassen'?'#0a4958':'#fff');
    app.innerHTML =
      '<div style="background:'+sbBg+';flex-shrink:0">'+statusBar(light)+'</div>'+
      body+
      (showNav?renderNav():'')+
      renderSheets()+
      renderToast();
    wire();
    if(S.screen==='coach') scrollChat();
  }

  // ==================================================================
  // WIRING (event delegation)
  // ==================================================================
  function wire(){
    var app=document.getElementById('app');
    app.onclick=function(ev){
      var el=ev.target.closest('[data-act]');
      if(el){ ev.preventDefault(); var act=el.getAttribute('data-act'); var arg=el.getAttribute('data-arg'); if(ACT[act]) { ACT[act](arg); } }
    };
    var ci=document.getElementById('chatInput');
    if(ci){ ci.oninput=function(){ S.chatInput=ci.value; }; ci.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); sendChat(ci.value); } }; }
    var fs=document.getElementById('foodSearch');
    if(fs){ fs.oninput=function(){ var v=fs.value; S.searchQ=v; render(); var el=document.getElementById('foodSearch'); if(el){ el.focus(); el.setSelectionRange(v.length,v.length); } }; }
  }

  render();
})();
</script>
</body>
</html>
