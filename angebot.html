<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dein Angebot · Fit-Inn Trier</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#eef2f3;color:#15171B;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px))}
  .wrap{width:100%;max-width:460px}
  .brand{display:flex;align-items:center;gap:11px;justify-content:center;margin:6px 0 18px}
  .brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,#0e6072,#063540);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px}
  .brand .n{font-size:15px;font-weight:900;letter-spacing:-.2px;color:#0a4958}
  .card{background:#fff;border-radius:22px;box-shadow:0 18px 44px rgba(4,33,40,.12);padding:26px 22px;margin-bottom:14px}
  h1{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:0 0 6px}
  .sub{font-size:14px;color:#6b7780;font-weight:600;line-height:1.5;margin:0}
  .offer{background:linear-gradient(150deg,#0e6072,#063540);color:#fff;border-radius:18px;padding:20px;margin:20px 0}
  .offer .lbl{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#9fd6c4}
  .offer .sum{font-size:18px;font-weight:900;line-height:1.35;margin-top:6px}
  .items{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
  .items li{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;font-weight:700;line-height:1.4}
  .items li svg{flex-shrink:0;margin-top:1px}
  .valid{font-size:12.5px;color:#8a929a;font-weight:600;text-align:center;margin:2px 0 0}
  .btn{display:block;width:100%;border:none;border-radius:15px;padding:16px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
  .btn-primary{background:#1d9a4e;color:#fff;box-shadow:0 12px 26px -6px rgba(29,154,78,.5)}
  .btn-ghost{background:transparent;color:#8a929a;font-weight:700;font-size:14px;padding:12px;margin-top:4px}
  .legal{font-size:11.5px;color:#8a929a;font-weight:600;line-height:1.5;text-align:center;margin-top:14px}
  .foot{font-size:12px;color:#9aa6aa;font-weight:600;text-align:center;line-height:1.6;margin-top:6px}
  .msg{text-align:center;padding:14px 6px}
  .msg .em{font-size:40px}
  .msg h2{font-size:19px;font-weight:900;margin:12px 0 6px}
  .msg p{font-size:14px;color:#6b7780;font-weight:600;line-height:1.5;margin:0}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid #cfe0e3;border-top-color:#0a4958;display:inline-block;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">FI</div><div class="n">Fit-Inn Trier</div></div>
  <div class="card" id="card">
    <div class="msg"><span class="spin"></span></div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var card=$('card'), foot=$('foot');
  var token=''; try{ token=new URL(location.href).searchParams.get('token')||''; }catch(e){}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var check='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7fe3a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function studioFoot(st){ if(!st) return; foot.innerHTML=esc(st.name)+' · '+esc(st.addr)+'<br>'+esc(st.tel)+' · '+esc(st.mail); }

  function itemsHtml(d){
    var li=[];
    if(d.discountPct) li.push(d.discountPct+'% Rabatt'+(d.discountWeeks?(' für '+d.discountWeeks+' Wochen'):''));
    if(d.freeWeeks) li.push(d.freeWeeks+' Wochen gratis Training');
    if(d.waiveActivation) li.push('Aktivierungsgebühr (39 €) erlassen');
    if(d.pauseWeeks) li.push('Beitragspause bis zu '+d.pauseWeeks+' Wochen');
    return li.map(function(t){ return '<li>'+check+'<span>'+esc(t)+'</span></li>'; }).join('');
  }

  function renderOffer(o){
    var name=(o.memberName||'').split(' ')[0];
    var vu=o.validUntil?new Date(o.validUntil):null;
    var vtxt=vu?('Gültig bis '+vu.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'})):'';
    card.innerHTML=
      '<h1>Schön, dass du da bist'+(name?', '+esc(name):'')+'! 👋</h1>'+
      '<p class="sub">Wir würden dich gern im Fit-Inn Trier halten – und haben dir dafür ein persönliches Angebot geschnürt.</p>'+
      '<div class="offer"><div class="lbl">Dein Angebot</div><div class="sum">'+esc(o.summary||'Persönliches Angebot')+'</div><ul class="items">'+itemsHtml(o.details||{})+'</ul></div>'+
      (vtxt?'<p class="valid">'+esc(vtxt)+'</p>':'')+
      '<button class="btn btn-primary" id="accept" style="margin-top:16px">Angebot verbindlich annehmen</button>'+
      '<button class="btn btn-ghost" id="decline">Kein Interesse, danke</button>'+
      '<p class="legal">Mit „Angebot verbindlich annehmen" nimmst du dieses Angebot an. Zur Nachweisbarkeit speichern wir Datum, Uhrzeit und deine IP-Adresse. Die Umsetzung im Vertrag bestätigen wir dir anschließend.</p>';
    $('accept').onclick=function(){ decide('accept'); };
    $('decline').onclick=function(){ if(confirm('Möchtest du das Angebot wirklich ablehnen?')) decide('decline'); };
  }

  function state(emoji,title,text){
    card.innerHTML='<div class="msg"><span class="em">'+emoji+'</span><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p></div>';
  }

  function decide(action){
    card.innerHTML='<div class="msg"><span class="spin"></span></div>';
    fetch('/api/offer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token,action:action})})
      .then(function(r){return r.json();}).then(function(d){
        if(action==='accept' && d && (d.ok||d.status==='accepted')) state('🎉','Angenommen!','Super – wir freuen uns, dass du bleibst! Unser Team setzt dein Angebot in Kürze um und meldet sich bei dir. Bis bald im Studio!');
        else if(action==='decline') state('👍','Alles klar','Danke für deine Rückmeldung. Du bist uns jederzeit willkommen – melde dich gern, wenn wir doch etwas für dich tun können.');
        else state('⚠️','Das hat nicht geklappt','Bitte versuch es später noch einmal oder melde dich direkt bei uns.');
      }).catch(function(){ state('⚠️','Verbindungsproblem','Bitte versuch es gleich noch einmal.'); });
  }

  if(!token){ state('🔒','Kein gültiger Link','Dieser Angebots-Link ist unvollständig. Bitte nutze den Link aus deiner Nachricht.'); return; }
  fetch('/api/offer?token='+encodeURIComponent(token)).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){ state('🔍','Angebot nicht gefunden','Dieser Angebots-Link ist ungültig oder wurde zurückgezogen.'); return; }
    var o=d.offer; studioFoot(o.studio);
    if(o.status==='accepted'){ state('✅','Bereits angenommen','Du hast dieses Angebot schon angenommen – wir kümmern uns darum. Danke, dass du bleibst!'); return; }
    if(o.status==='declined'){ state('👍','Bereits abgelehnt','Dieses Angebot wurde bereits abgelehnt. Melde dich gern, wenn wir doch etwas für dich tun können.'); return; }
    if(o.expired){ state('⏳','Angebot abgelaufen','Dieses Angebot ist leider nicht mehr gültig. Sprich uns an – wir finden bestimmt eine Lösung.'); return; }
    renderOffer(o);
  }).catch(function(){ state('⚠️','Verbindungsproblem','Die Seite konnte nicht geladen werden. Bitte versuch es gleich noch einmal.'); });
})();
</script>
</body>
</html>
