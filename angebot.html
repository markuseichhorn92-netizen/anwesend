<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dein Angebot · Fit-Inn Trier</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#eef2f3;color:#15171B;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px))}
  .wrap{width:100%;max-width:460px}
  .brand{display:flex;align-items:center;gap:11px;justify-content:center;margin:6px 0 18px}
  .brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,#0e6072,#063540);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px}
  .brand .n{font-size:15px;font-weight:900;letter-spacing:-.2px;color:#0a4958}
  .card{background:#fff;border-radius:22px;box-shadow:0 18px 44px rgba(4,33,40,.12);padding:26px 22px;margin-bottom:14px}
  h1{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:0 0 6px}
  .sub{font-size:14px;color:#6b7780;font-weight:600;line-height:1.5;margin:0}
  .offer{background:linear-gradient(150deg,#0e6072,#063540);color:#fff;border-radius:18px;padding:20px;margin:20px 0}
  .offer .lbl{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#9fd6c4}
  .offer .sum{font-size:18px;font-weight:900;line-height:1.35;margin-top:6px}
  .items{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
  .items li{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;font-weight:700;line-height:1.4}
  .items li svg{flex-shrink:0;margin-top:1px}
  .valid{font-size:12.5px;color:#8a929a;font-weight:600;text-align:center;margin:2px 0 0}
  .btn{display:block;width:100%;border:none;border-radius:15px;padding:16px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
  .btn-primary{background:#1d9a4e;color:#fff;box-shadow:0 12px 26px -6px rgba(29,154,78,.5)}
  .btn-ghost{background:transparent;color:#8a929a;font-weight:700;font-size:14px;padding:12px;margin-top:4px}
  .legal{font-size:11.5px;color:#8a929a;font-weight:600;line-height:1.5;text-align:center;margin-top:14px}
  .foot{font-size:12px;color:#9aa6aa;font-weight:600;text-align:center;line-height:1.6;margin-top:6px}
  .msg{text-align:center;padding:14px 6px}
  .msg .em{font-size:40px}
  .msg h2{font-size:19px;font-weight:900;margin:12px 0 6px}
  .msg p{font-size:14px;color:#6b7780;font-weight:600;line-height:1.5;margin:0}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid #cfe0e3;border-top-color:#0a4958;display:inline-block;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">FI</div><div class="n">Fit-Inn Trier</div></div>
  <div class="card" id="card">
    <div class="msg"><span class="spin"></span></div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var card=$('card'), foot=$('foot');
  var token=''; try{ token=new URL(location.href).searchParams.get('token')||''; }catch(e){}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var check='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7fe3a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function studioFoot(st){ if(!st) return; foot.innerHTML=esc(st.name)+' · '+esc(st.addr)+'<br>'+esc(st.tel)+' · '+esc(st.mail); }

  function itemsHtml(d){
    var li=[];
    if(d.discountPct) li.push(d.discountPct+'% Rabatt'+(d.discountWeeks?(' für '+d.discountWeeks+' Wochen'):''));
    if(d.freeWeeks) li.push(d.freeWeeks+' Wochen gratis Training');
    if(d.waiveActivation) li.push('Aktivierungsgebühr (39 €) erlassen');
    if(d.pauseWeeks) li.push('Beitragspause bis zu '+d.pauseWeeks+' Wochen');
    return li.map(function(t){ return '<li>'+check+'<span>'+esc(t)+'</span></li>'; }).join('');
  }

  function renderOffer(o){
    var name=(o.memberName||'').split(' ')[0];
    var vu=o.validUntil?new Date(o.validUntil):null;
    var vtxt=vu?('Gültig bis '+vu.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'})):'';
    card.innerHTML=
      '<h1>Schön, dass du da bist'+(name?', '+esc(name):'')+'! 👋</h1>'+
      '<p class="sub">Wir würden dich gern im Fit-Inn Trier halten – und haben dir dafür ein persönliches Angebot geschnürt.</p>'+
      '<div class="offer"><div class="lbl">Dein Angebot</div><div class="sum">'+esc(o.summary||'Persönliches Angebot')+'</div><ul class="items">'+itemsHtml(o.details||{})+'</ul></div>'+
      (vtxt?'<p class="valid">'+esc(vtxt)+'</p>':'')+
      '<button class="btn btn-primary" id="accept" style="margin-top:16px">Angebot verbindlich annehmen</button>'+
      '<button class="btn btn-ghost" id="decline">Kein Interesse, danke</button>'+
      '<p class="legal">Mit „Angebot verbindlich annehmen" nimmst du dieses Angebot an. Zur Nachweisbarkeit speichern wir Datum, Uhrzeit und deine IP-Adresse. Die Umsetzung im Vertrag bestätigen wir dir anschließend.</p>';
    $('accept').onclick=function(){ decide('accept'); };
    $('decline').onclick=function(){ if(confirm('Möchtest du das Angebot wirklich ablehnen?')) decide('decline'); };
  }

  function state(emoji,title,text){
    card.innerHTML='<div class="msg"><span class="em">'+emoji+'</span><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p></div>';
  }

  function decide(action){
    card.innerHTML='<div class="msg"><span class="spin"></span></div>';
    fetch('/api/offer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:token,action:action})})
      .then(function(r){return r.json();}).then(function(d){
        if(action==='accept' && d && (d.ok||d.status==='accepted')) state('🎉','Angenommen!','Super – wir freuen uns, dass du bleibst! Unser Team setzt dein Angebot in Kürze um und meldet sich bei dir. Bis bald im Studio!');
        else if(action==='decline') state('👍','Alles klar','Danke für deine Rückmeldung. Du bist uns jederzeit willkommen – melde dich gern, wenn wir doch etwas für dich tun können.');
        else state('⚠️','Das hat nicht geklappt','Bitte versuch es später noch einmal oder melde dich direkt bei uns.');
      }).catch(function(){ state('⚠️','Verbindungsproblem','Bitte versuch es gleich noch einmal.'); });
  }

  if(!token){ state('🔒','Kein gültiger Link','Dieser Angebots-Link ist unvollständig. Bitte nutze den Link aus deiner Nachricht.'); return; }
  fetch('/api/offer?token='+encodeURIComponent(token)).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){ state('🔍','Angebot nicht gefunden','Dieser Angebots-Link ist ungültig oder wurde zurückgezogen.'); return; }
    var o=d.offer; studioFoot(o.studio);
    if(o.status==='accepted'){ state('✅','Bereits angenommen','Du hast dieses Angebot schon angenommen – wir kümmern uns darum. Danke, dass du bleibst!'); return; }
    if(o.status==='declined'){ state('👍','Bereits abgelehnt','Dieses Angebot wurde bereits abgelehnt. Melde dich gern, wenn wir doch etwas für dich tun können.'); return; }
    if(o.expired){ state('⏳','Angebot abgelaufen','Dieses Angebot ist leider nicht mehr gültig. Sprich uns an – wir finden bestimmt eine Lösung.'); return; }
    renderOffer(o);
  }).catch(function(){ state('⚠️','Verbindungsproblem','Die Seite konnte nicht geladen werden. Bitte versuch es gleich noch einmal.'); });
})();
</script>
<script>/* Fit-Inn Chat-Launcher v2: eigener leichter Knopf im Hauptdokument, kein Iframe, erscheint sofort.
   Nach ca. 1,2 s fährt er zur Pille "Fragen? Frag Lena" auf (clip-path/opacity/transform), hält ~4 s, fährt zu (max. 3x pro Besuch).
   Das Magicline-Widget (~1,9 MB) lädt erst bei Tipp/Hover oder im Leerlauf (~5 s nach Load); sein eigener Knopf bleibt unsichtbar.
   Fällt etwas aus, führt der Knopf zur Kontaktseite. Konfig optional über window.FILAUNCH. */
(function () {
  try {
    if (window.__fiLaunch) return; window.__fiLaunch = 1;
    var C = window.FILAUNCH || {};
    var SRC = C.src || 'https://fit-inn-trier.web.magicline.com/chatbot/widget/widget.js?uuid=a48084fc-8418-4bb1-b987-4bf4d852398f&studioId=1210005460&studioName=Fit-Inn%20Trier';
    var SID = 'ml-member-chatbot-widget-script', IID = 'ml-member-chatbot-widget-iframe', KEY = 'fiLaunchShown';
    var TEXT = C.text || 'Fragen? Frag Lena 👋', FAIL = C.fail || 'Chat nicht erreichbar – zum Kontakt';
    var CONTACT = C.contact || 'https://hilfe.fit-inn-trier.de/kontakt';
    var FIRST = C.first != null ? C.first : 1200, HOLD = C.hold != null ? C.hold : 4000;
    var GAP = C.gap != null ? C.gap : 25000, MAX = C.max != null ? C.max : 3, IDLE = C.idle != null ? C.idle : 5000;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var root = document.documentElement, wrap, ln, txt, timer, want = false, failed = false, asked = false, ready = false, expanded = false;

    function shown() { try { return +sessionStorage.getItem(KEY) || 0; } catch (e) { return 0; } }
    function bump() { try { sessionStorage.setItem(KEY, shown() + 1); } catch (e) { } }
    function doc() { try { var f = document.getElementById(IID); return f && (f.contentDocument || f.contentWindow.document); } catch (e) { return null; } }
    function isOpen() { var d = doc(); return !!(d && d.querySelector('[data-role="chatbot-container"]')); }

    // Eigener Knopf des Widgets bleibt unsichtbar (Iframe versteckt), solange der Chat zu ist
    var st = document.createElement('style');
    st.textContent =
      'html.fi-c #' + IID + '{visibility:hidden!important;pointer-events:none!important}' +
      '#fi-lw{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2147483000;filter:drop-shadow(0 4px 12px rgba(10,73,88,.38));' +
      'opacity:0;transform:scale(.6);transform-origin:100% 100%;pointer-events:none;transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.56,.5,1)}' +
      '#fi-lw.v{opacity:1;transform:none;pointer-events:auto}' +
      '#fi-lw.h{opacity:0;transform:scale(.8);pointer-events:none}' +
      '#fi-ln{position:relative;display:flex;align-items:center;box-sizing:border-box;height:62px;padding:0 62px 0 20px;border-radius:31px;color:#fff;text-decoration:none;' +
      'background:linear-gradient(135deg,#0A4958,#107E97);clip-path:inset(0 0 0 var(--o,9999px) round 31px);' +
      'transition:clip-path .7s cubic-bezier(.34,1.35,.5,1);-webkit-tap-highlight-color:transparent;cursor:pointer;outline:0}' +
      '#fi-ln.on{clip-path:inset(0 0 0 0 round 31px)}' +
      '#fi-ln:focus-visible{box-shadow:inset 0 0 0 3px #FFB54F}' +
      '#fi-ln .t{white-space:nowrap;font:600 16px/1 "Source Sans Pro",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;opacity:0;transform:translateX(10px);' +
      'transition:opacity .25s ease,transform .4s ease}' +
      '#fi-ln.on .t{opacity:1;transform:none;transition-delay:.2s}' +
      '#fi-ln .i{position:absolute;right:0;top:0;width:62px;height:62px;display:flex;align-items:center;justify-content:center}' +
      '#fi-ln .i svg{width:30px;height:30px;transition:opacity .2s ease}' +
      '#fi-ln .sp{position:absolute;opacity:0}' +
      '#fi-ln.ld .ch{opacity:0}#fi-ln.ld .sp{opacity:1;animation:fi-spin .8s linear infinite}' +
      '@keyframes fi-spin{to{transform:rotate(360deg)}}' +
      '@media (prefers-reduced-motion:reduce){#fi-lw,#fi-ln,#fi-ln .t{transition:none}#fi-ln.ld .sp{animation-duration:1.6s}}';
    root.appendChild(st);
    root.classList.add('fi-c');

    wrap = document.createElement('div'); wrap.id = 'fi-lw';
    wrap.innerHTML =
      '<a id="fi-ln" href="' + CONTACT + '" role="button" aria-label="Chat öffnen: Fragen? Frag Lena">' +
      '<span class="t"></span><span class="i">' +
      '<svg class="ch" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6.2l-4.3 3.4c-.5.4-1.3 0-1.3-.7V18H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z" fill="#fff"/>' +
      '<circle cx="8.2" cy="11" r="1.4" fill="#0A4958"/><circle cx="12" cy="11" r="1.4" fill="#0A4958"/><circle cx="15.8" cy="11" r="1.4" fill="#0A4958"/></svg>' +
      '<svg class="sp" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.3)" stroke-width="3"/>' +
      '<path d="M12 3a9 9 0 0 1 9 9" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span></a>';
    root.appendChild(wrap);
    ln = wrap.firstChild; txt = ln.firstChild; txt.textContent = TEXT;
    measure();
    requestAnimationFrame(function () { wrap.classList.add('v'); });

    function measure() { ln.style.setProperty('--o', Math.max(0, Math.ceil(ln.getBoundingClientRect().width) - 62) + 'px'); }
    function expand(label) { if (label) txt.textContent = label; measure(); expanded = true; ln.classList.add('on'); }
    function collapse() { expanded = false; ln.classList.remove('on'); }

    function cycle() {
      clearTimeout(timer);
      if (want || failed || isOpen() || shown() >= MAX) return;
      if (document.hidden) { timer = setTimeout(cycle, 3000); return; }
      bump(); expand();
      timer = setTimeout(function () { collapse(); timer = setTimeout(cycle, GAP); }, HOLD);
    }
    if (!reduce) timer = setTimeout(cycle, FIRST);

    // Widget nachladen (einmalig)
    function loadWidget() {
      if (asked) return; asked = true;
      if (!document.getElementById(SID)) {
        var s = document.createElement('script'); s.id = SID; s.src = SRC; s.async = true;
        s.onerror = function () { fail(); };
        document.head.appendChild(s);
      }
      var tries = 0, poll = setInterval(function () {
        var d = doc();
        if (d && d.querySelector('[data-role="chatbot-bubble"]')) {
          clearInterval(poll); ready = true; watch(d); if (want) openChat();
        } else if (++tries > 200) { clearInterval(poll); asked = false; if (want) fail(); }
      }, 100);
    }
    function watch(d) {
      var sync = function () {
        var open = isOpen();
        root.classList.toggle('fi-c', !open);
        wrap.classList.toggle('h', open);
        if (open && expanded) collapse();
      };
      try { new MutationObserver(sync).observe(d.body, { childList: true, subtree: true }); } catch (e) { setInterval(sync, 300); }
      sync();
    }
    function openChat() {
      var d = doc(), b = d && d.querySelector('[data-role="chatbot-bubble"]');
      if (!b) return;
      want = false; ln.classList.remove('ld');
      root.classList.remove('fi-c'); b.click();
    }
    function fail() {
      failed = true; want = false; ln.classList.remove('ld');
      root.classList.remove('fi-c');
      clearTimeout(timer); expand(FAIL);
    }

    // Leerlauf: 5 s nach Load, dann wenn der Browser frei ist
    function idleLoad() {
      setTimeout(function () {
        if (window.requestIdleCallback) requestIdleCallback(loadWidget, { timeout: 3000 }); else loadWidget();
      }, IDLE);
    }
    if (document.readyState === 'complete') idleLoad(); else window.addEventListener('load', idleLoad);

    ln.addEventListener('pointerenter', loadWidget);
    ln.addEventListener('touchstart', loadWidget, { passive: true });
    ln.addEventListener('focus', loadWidget);
    function go() {
      clearTimeout(timer); collapse();
      if (ready) { openChat(); return; }
      want = true; ln.classList.add('ld');
      loadWidget();
    }
    window.fiChatOpen = function () { if (!failed) go(); }; // z. B. fuer /chat-Seiten
    ln.addEventListener('click', function (e) {
      if (failed) return; // Fallback: normaler Link zur Kontaktseite
      e.preventDefault(); go();
    });
  } catch (e) { /* nichts kaputt machen */ }
})();</script>
</body>
</html>
