<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Mitgliederbereich</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://www.google.com/recaptcha/api.js?onload=onRcLoad&render=explicit" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#15171B;
    background:linear-gradient(165deg,#0e6072 0%,#063540 100%);min-height:100dvh}
  ::placeholder{color:#a9b1b6}
  input,select,textarea,button{font-family:inherit}
  @keyframes fiUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .shell{width:100%;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .brandbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px}
  .logout{background:rgba(255,255,255,.12);border:none;color:#cfe3e7;font-weight:600;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer}
  .body{flex:1;padding:4px 16px 40px;animation:fiUp .25s ease}
  .card{background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(4,33,40,.30);padding:24px 22px}
  .h1w{font-size:23px;font-weight:900;color:#fff;letter-spacing:-.4px}
  .lbl{font-size:13px;font-weight:600;color:#42454b;margin-bottom:6px;display:block}
  .inp{width:100%;padding:13px 14px;border:1.5px solid #d6dee0;border-radius:11px;font-size:15px;color:#15171B;outline:none;background:#fff}
  .inp:focus{border-color:#0a4958;box-shadow:0 0 0 3px rgba(10,73,88,.12)}
  .btn{width:100%;padding:15px;border:none;border-radius:13px;background:#0a4958;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .btn:hover{background:#0c5566}.btn:disabled{background:#9fb9bf;cursor:not-allowed}
  .btn2{width:100%;padding:14px;border:none;border-radius:13px;background:#eef3f4;color:#0a4958;font-weight:700;font-size:15px;cursor:pointer}
  .btnDanger{width:100%;padding:14px;border:1.5px solid #e3b8b1;border-radius:13px;background:#fff;color:#b53a2c;font-weight:700;font-size:15px;cursor:pointer}
  .btnDanger:hover{background:#FCEBEA}
  .back{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.13);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .back:hover{background:rgba(255,255,255,.22)}
  .hd{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
  .row2{display:grid;gap:12px}
  .ok{display:flex;align-items:flex-start;gap:9px;background:#E7F6EC;border-radius:14px;padding:13px 15px}
  .ok span{font-size:13px;color:#1d7a3e;font-weight:600;line-height:1.4}
  .err{display:flex;align-items:flex-start;gap:8px;background:#FCEBEA;border-radius:12px;padding:12px 14px}
  .err span{font-size:13px;color:#b53a2c;font-weight:600;line-height:1.4}
  .muted{font-size:12px;color:#8a929a}
  .tile{background:#fff;border-radius:20px;box-shadow:0 12px 34px rgba(4,33,40,.20);padding:17px 16px 18px;cursor:pointer;min-height:128px;min-width:0;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s;border:none;text-align:left;overflow-wrap:break-word;word-break:break-word}
  .tile:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(4,33,40,.28)}
  .ic{width:42px;height:42px;border-radius:12px;background:#eef3f4;display:flex;align-items:center;justify-content:center;margin-bottom:auto}
  .seg{height:5px;flex:1;border-radius:3px}
  a{color:inherit}
  .legalfoot{padding:14px 16px 28px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
  .legalfoot a{color:#bfd7dc;font-size:12px;font-weight:600;text-decoration:none}
  .legalfoot a:hover{color:#fff;text-decoration:underline}
  .legalfoot span{color:#5e8088;font-size:12px}
  /* ---------- responsive layout ---------- */
  .sidebar,.topbar{display:none}
  .maincol{display:flex;flex-direction:column;flex:1;min-width:0}
  .narrow{width:100%}
  .gTiles{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .gCols2{display:flex;flex-direction:column;gap:16px}
  .gCats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(min-width:1000px){
    body{background:linear-gradient(170deg,#0e6072 0%,#063540 100%)}
    .shell{max-width:none;margin:0;flex-direction:row;align-items:stretch}
    .app-in .brandbar{display:none}
    .app-in .sidebar{display:flex;flex-direction:column;width:266px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:24px 16px;background:linear-gradient(170deg,#0c5a6b 0%,#062f39 100%);border-right:1px solid rgba(255,255,255,.08)}
    .app-in .topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 38px}
    .app-in .hd{display:none}
    .app-in .body{max-width:1180px;width:100%;margin:0 auto;padding:24px 38px 46px}
    .app-in .legalfoot{padding:8px 38px 30px;justify-content:flex-start}
    .gTiles{grid-template-columns:repeat(3,1fr);gap:18px}
    .gCols2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
    .gCats{grid-template-columns:repeat(4,1fr);gap:16px}
    .narrow{max-width:780px;margin:0 auto}
    .app-guest .maincol{align-items:center;justify-content:center}
    .app-guest .body{max-width:440px;width:100%}
    .sidebtn{display:flex;align-items:center;gap:13px;padding:12px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;background:transparent;color:#bcd7dc;width:100%;text-align:left}
    .sidebtn:hover{background:rgba(255,255,255,.08)}
    .sidebtn.active{background:rgba(255,255,255,.16);color:#fff}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="maincol">
    <div class="brandbar">
      <div id="brandLogo" style="display:flex;align-items:center;cursor:pointer"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier" style="height:26px;width:auto;display:block"></div>
      <button class="logout" id="logoutBtn" style="display:none">Abmelden</button>
    </div>
    <div class="topbar" id="topbar"></div>
    <div class="body" id="app"></div>
    <div class="legalfoot">
      <a href="https://www.fit-inn-trier.de/impressum-fit-inn-trier" target="_blank" rel="noopener">Impressum</a><span>·</span>
      <a href="https://www.fit-inn-trier.de/datenschutz-fit-inn-trier" target="_blank" rel="noopener">Datenschutz</a><span>·</span>
      <a href="https://www.fit-inn-trier.de/agbs-fit-inn-trier" target="_blank" rel="noopener">AGB</a><span>·</span>
      <a href="https://www.fit-inn-trier.de/kundigungsbedingungen-fit-inn-trier" target="_blank" rel="noopener">Widerruf</a>
    </div>
  </div>
  <div id="rcContainer"></div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var TEAL='#0a4958';

  // ---- SVG icons ----
  function svg(p,o){ o=o||{}; return '<svg width="'+(o.s||22)+'" height="'+(o.s||22)+'" viewBox="0 0 24 24" fill="none" stroke="'+(o.c||TEAL)+'" stroke-width="'+(o.w||1.85)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
  var IC={
    user:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path><path d="M4 21c0-3.3 3.6-6 8-6s8 2.7 8 6"></path>',
    doc:'<path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path>',
    cal:'<rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path>',
    gift:'<rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M3 12h18M12 8v13"></path><path d="M12 8C12 8 10 2.5 7.6 4.2 5.9 5.4 8.4 8 12 8zM12 8c0 0 2-5.5 4.4-3.8C18.1 5.4 15.6 8 12 8z"></path>',
    list:'<path d="M3 6h13M3 12h13M3 18h9"></path><path d="M17.5 15l2 2 3.2-3.2"></path>',
    help:'<circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.8.3-1.4 1-1.4 1.9v.3"></path><path d="M12 17h.01"></path>',
    back:'<path d="M15 18l-6-6 6-6"></path>',
    check:'<path d="M20 6L9 17l-5-5"></path>',
    lock:'<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
    warn:'<path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>',
    share:'<circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path>',
    dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path>',
    search:'<circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>'
  };

  // ---- reCAPTCHA (für direkte Kündigung über die Connect API) ----
  var RC_SITEKEY='6Ld5qKcgAAAAAMoywArOgIrC0lQ7NpYUTsF92PIC';
  var rcId=null, rcResolve=null;
  window.onRcLoad=function(){ try{ rcId=grecaptcha.render('rcContainer',{sitekey:RC_SITEKEY,size:'invisible',callback:function(t){ var r=rcResolve; rcResolve=null; if(r) r(t); }}); }catch(e){} };
  function rcToken(){ return new Promise(function(resolve){ if(typeof grecaptcha==='undefined'||rcId===null){ resolve(null); return; } rcResolve=resolve; try{ grecaptcha.reset(rcId); grecaptcha.execute(rcId); }catch(e){ rcResolve=null; resolve(null); } setTimeout(function(){ if(rcResolve){ rcResolve=null; resolve(null); } },20000); }); }

  // ---- state ----
  var TOKEN = localStorage.getItem('fi_member_token') || sessionStorage.getItem('fi_member_token') || null;
  var DATA = { profile:null, contract:null, checkins:null, appts:null };
  var S = { screen: TOKEN?'home':'login',
    msg:'', // generic success on data screen
    cancelStep:0, cancelReason:'', pauseWeeks:6, offerDone:'', withdrawConfirm:false, withdrawDone:false, cancelDone:false, busy:false,
    pauseStep:0, pauseReason:'', pauseReasonText:'', pauseFrom:'', pausePhoto:'', pausePhotoName:'', pauseDone:false,
    ccBusy:false, ccMsg:'',
    apptTab:'book', bookType:'', apptMsg:'',
    helpView:'list', helpArticle:0, helpCat:'', helpQ:'',
    copied:false, dlMsg:false, dlMsg2:'', emailing:false,
    ciRange:'all', ciFrom:'', ciTo:'',
    liEmail:'', liPlz:'', remember:(localStorage.getItem('fi_remember')==='1'),
    dpOpen:false, dpYear:1995, dpMonth:0, dpSel:null,
    loginErr:'' };
  window.__setLi=function(f,v){ if(f==='email')S.liEmail=v; else if(f==='plz')S.liPlz=v; };
  window.__dpYear=function(v){ S.dpYear=+v; render(); };
  window.__ciDate=function(which,v){ if(which==='from')S.ciFrom=v; else S.ciTo=v; render(); };
  window.__pauseNote=function(v){ S.pauseReasonText=v; };
  window.__pauseFrom=function(v){ S.pauseFrom=v; render(); };
  window.__pausePhoto=function(input){
    var f=input&&input.files&&input.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(e){
      var src=e.target.result;
      var img=new Image();
      img.onload=function(){ try{
        var max=1500, w=img.naturalWidth||1, h=img.naturalHeight||1, sc=Math.min(1,max/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
        var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; cv.getContext('2d').drawImage(img,0,0,cw,ch);
        S.pausePhoto=cv.toDataURL('image/jpeg',0.82);
      }catch(err){ S.pausePhoto=src; } S.pausePhotoName=f.name||'attest.jpg'; render(); };
      img.onerror=function(){ S.pausePhoto=src; S.pausePhotoName=f.name||'attest'; render(); };
      img.src=src;
    };
    rd.readAsDataURL(f);
  };
  function isoToday(){ var d=new Date(); var p=function(n){return(n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

  function setS(p){ Object.assign(S,p); render(); window.scrollTo(0,0); }
  function setQuiet(p){ Object.assign(S,p); render(); }

  // ---- helpers ----
  function fmtIban(v){ var s=(v||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,34); return s.replace(/(.{4})/g,'$1 ').trim(); }
  function deDate(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return iso.slice(0,10); var p=function(n){return(n<10?'0':'')+n;}; var wd=['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]; return wd+', '+p(d.getDate())+'.'+p(d.getMonth()+1)+'.'; }
  function deTime(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; var p=function(n){return(n<10?'0':'')+n;}; return p(d.getHours())+':'+p(d.getMinutes()); }
  function monthName(d){ return ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][d.getMonth()]+' '+d.getFullYear(); }
  function dur(a,b){ if(!a||!b) return ''; var ms=new Date(b)-new Date(a); if(isNaN(ms)||ms<=0) return ''; var min=Math.round(ms/60000); var h=Math.floor(min/60); var m=min%60; return h?(h+'h '+(m<10?'0':'')+m+'m'):(m+'m'); }
  function deDateFull(iso){ if(!iso) return '—'; var s=String(iso).slice(0,10); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m) return m[3]+'.'+m[2]+'.'+m[1]; var d=new Date(iso); if(isNaN(d)) return s; var p=function(n){return(n<10?'0':'')+n;}; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
  function todayStr(){ var d=new Date(); var p=function(n){return(n<10?'0':'')+n;}; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
  // Logo als dataURL vorladen (für PDF)
  var LOGO_DATAURL=null, LOGO_RATIO=3.6;
  (function(){ try{ var img=new Image(); img.onload=function(){ try{
    var nw=img.naturalWidth||320, nh=img.naturalHeight||90;
    // WICHTIG: herunterskalieren! Das Original ist 2917px breit – in voller
    // Auflösung bläht jsPDF das PDF auf ~5–7 MB auf und der E-Mail-Upload
    // überschreitet das Body-Limit (Versand schlägt fehl). 900px reichen für Druck.
    var maxW=900, sc=Math.min(1,maxW/nw), cw=Math.round(nw*sc), ch=Math.round(nh*sc);
    var c=document.createElement('canvas'); c.width=cw; c.height=ch; c.getContext('2d').drawImage(img,0,0,cw,ch);
    LOGO_DATAURL=c.toDataURL('image/png'); LOGO_RATIO=nw/nh;
  }catch(e){} }; img.src='/assets/fitinn-logo-white.png'; }catch(e){} })();

  function headers(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }
  function api(path, opt){ opt=opt||{}; opt.headers=Object.assign(headers(), opt.headers||{}); opt.cache='no-store';
    return fetch(path,opt).then(function(r){ if(r.status===401){ logout(); throw new Error('unauthorized'); } return r.json(); }); }

  function logout(){ TOKEN=null; sessionStorage.removeItem('fi_member_token'); localStorage.removeItem('fi_member_token'); DATA={profile:null,contract:null,checkins:null,appts:null}; S.screen='login'; render(); }
  // ---- modern date picker ----
  function pad2(n){ return (n<10?'0':'')+n; }
  var MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  function dpCal(){
    var y=S.dpYear, m=S.dpMonth;
    var off=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
    var heads=['Mo','Di','Mi','Do','Fr','Sa','So'].map(function(d){return '<div style="text-align:center;font-size:11px;font-weight:700;color:#8a929a;padding-bottom:4px">'+d+'</div>';}).join('');
    var btns=[];
    for(var i=0;i<42;i++){ var dn=i-off+1, inM=dn>=1&&dn<=dim;
      var sel=S.dpSel&&inM&&S.dpSel.getFullYear()===y&&S.dpSel.getMonth()===m&&S.dpSel.getDate()===dn;
      btns.push('<button '+(inM?('data-act="dpPick" data-arg="'+dn+'"'):'')+' style="height:34px;border:none;border-radius:9px;background:'+(sel?TEAL:'transparent')+';color:'+(sel?'#fff':(inM?'#15171B':'transparent'))+';font-weight:'+(sel?'800':'600')+';font-size:13px;cursor:'+(inM?'pointer':'default')+'">'+(inM?dn:'')+'</button>'); }
    var weeks='';for(var w=0;w<6;w++){ weeks+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px">'+btns.slice(w*7,w*7+7).join('')+'</div>'; }
    var yrs='';for(var yy=2012;yy>=1930;yy--){ yrs+='<option value="'+yy+'"'+(yy===y?' selected':'')+'>'+yy+'</option>'; }
    var navBtn=function(act,ch){ return '<button data-act="'+act+'" style="width:34px;height:34px;border-radius:9px;border:none;background:#eef3f4;color:'+TEAL+';font-size:18px;font-weight:800;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">'+ch+'</button>'; };
    return '<div data-act="dpClose" style="position:fixed;inset:0;z-index:40"></div>'+
      '<div style="position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:50;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(4,33,40,.30);border:1px solid #eef1f2;padding:14px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'+navBtn('dpPrev','‹')+'<div style="flex:1;text-align:center;font-size:15px;font-weight:800">'+MN[m]+'</div>'+
      '<select onchange="window.__dpYear(this.value)" style="padding:8px 6px;border:1.5px solid #d6dee0;border-radius:9px;font-size:14px;font-weight:700;color:'+TEAL+';background:#fff;outline:none;cursor:pointer">'+yrs+'</select>'+navBtn('dpNext','›')+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">'+heads+'</div>'+weeks+'</div>';
  }
  $('logoutBtn').addEventListener('click', logout);
  $('brandLogo').addEventListener('click', function(){ if(TOKEN) nav('home'); });

  function nav(s){ S.screen=s;
    if(s==='help') S.helpView='list';
    if(s==='contract'){ S.cancelStep=0; S.pauseStep=0; S.pauseDone=false; S.offerDone=''; }
    if(s==='checkins'&&!DATA.checkins) loadCheckins();
    if(s==='appt'&&!DATA.appts) loadAppts();
    setS({}); }

  // ---- data loading ----
  function loadMe(){
    return api('/api/member/me').then(function(d){ DATA.profile=d.profile||null; DATA.contract=d.contract||null; });
  }
  function loadCheckins(){ api('/api/member/checkins').then(function(d){ DATA.checkins=d.checkins||[]; render(); }).catch(function(){ DATA.checkins=[]; render(); }); }
  function loadAppts(){ api('/api/member/appointments').then(function(d){ DATA.appts=d.appointments||[]; render(); }).catch(function(){ DATA.appts=[]; render(); }); }

  // ========================= SCREENS =========================
  function backHd(title, target){ return '<div class="hd"><button class="back" data-act="nav" data-arg="'+(target||'home')+'">'+svg(IC.back,{c:'#fff',w:2,s:20})+'</button><div class="h1w">'+esc(title)+'</div></div>'; }

  function scrLogin(){
    var e = S.loginErr ? '<div class="err" style="margin-top:14px">'+svg(IC.warn,{c:'#b53a2c',w:2,s:17})+'<span>'+esc(S.loginErr)+'</span></div>' : '';
    return ''+
    '<div style="text-align:center;padding:18px 6px 26px"><div style="font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.05">Willkommen<br>zurück</div></div>'+
    '<div class="card">'+
      '<div style="font-size:21px;font-weight:800;letter-spacing:-.4px">Mitglieder-Login</div>'+
      '<div style="font-size:14px;color:#6b7780;margin-top:5px;line-height:1.45">Zur Bestätigung deiner Identität – keine Passwörter.</div>'+

    '<div style="display:flex;gap:10px;margin-top:20px"><button class="btn2" data-act="copyRef" style="flex:1;padding:14px;font-size:14px">'+(S.copied?'Kopiert ✓':'Link kopieren')+'</button><button class="btn" data-act="shareRef" style="flex:1;padding:14px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px">'+svg(IC.share,{c:'#fff',w:2,s:17})+'Einladung teilen</button></div></div>'+
    '<div style="display:flex;gap:12px;margin-top:14px">'+reward('Für dich','4 Wochen','beitragsfrei')+reward('Für deinen Freund','2 Wochen','gratis trainieren')+'</div>'+
    '<div style="background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(4,33,40,.18);padding:18px 20px;margin-top:14px"><div style="font-size:12px;font-weight:700;color:#8a929a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Das bekommt dein Freund</div><div style="font-size:14px;color:#42454b;line-height:1.55;background:#f4f7f7;border-radius:12px;padding:14px 16px;word-break:break-word">Hey! Trainier doch mal mit mir im Fit-Inn Trier 💪 Mit meinem Code <b style="color:'+TEAL+'">'+esc(code)+'</b> bekommst du <b style="color:'+TEAL+'">2 Wochen gratis</b>. Hier geht\'s los: '+esc(link)+'</div></div>'+
    '<div class="card" style="margin-top:14px"><div style="font-size:17px;font-weight:800;margin-bottom:16px">So funktioniert\'s</div><div style="display:flex;flex-direction:column;gap:16px">'+
    steps.map(function(r){return '<div style="display:flex;gap:14px;align-items:flex-start"><div style="width:30px;height:30px;border-radius:50%;background:'+TEAL+';color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+r[0]+'</div><div><div style="font-size:15px;font-weight:700">'+r[1]+'</div><div style="font-size:13px;color:#6b7780;line-height:1.4;margin-top:2px">'+r[2]+'</div></div></div>';}).join('')+'</div></div>';
  }

  // ---- Check-in Zeitraum-Filter ----
  function fmtD(d){ var p=function(n){return(n<10?'0':'')+n;}; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
  function ciBounds(){
    var now=new Date(); var r=S.ciRange||'all'; var from=null,to=null;
    if(r==='1m'){from=new Date(now);from.setMonth(from.getMonth()-1);}
    else if(r==='3m'){from=new Date(now);from.setMonth(from.getMonth()-3);}
    else if(r==='6m'){from=new Date(now);from.setMonth(from.getMonth()-6);}
    else if(r==='12m'){from=new Date(now);from.setFullYear(from.getFullYear()-1);}
    else if(r==='lastyear'){var y=now.getFullYear()-1;from=new Date(y,0,1,0,0,0);to=new Date(y,11,31,23,59,59);}
    else if(r==='custom'){ if(S.ciFrom)from=new Date(S.ciFrom+'T00:00:00'); if(S.ciTo)to=new Date(S.ciTo+'T23:59:59'); }
    return {from:from,to:to};
  }
  function ciFilter(list){ var b=ciBounds(); return (list||[]).filter(function(c){ var d=new Date(c.in); if(isNaN(d))return false; if(b.from&&d<b.from)return false; if(b.to&&d>b.to)return false; return true; }); }
  function ciCurrent(){ return ciFilter(DATA.checkins||[]); }
  function ciRangeLabel(){ var b=ciBounds(); if(!b.from&&!b.to) return 'Gesamter Verlauf'; var f=b.from?fmtD(b.from):'Beginn'; var t=b.to?fmtD(b.to):fmtD(new Date()); return f+' – '+t; }
  function ciSelector(){
    var opts=[['all','Alle'],['1m','1 Monat'],['3m','3 Monate'],['6m','6 Monate'],['12m','12 Monate'],['lastyear','Letztes Jahr'],['custom','Zeitraum']];
    var cur=S.ciRange||'all';
    var chips=opts.map(function(o){ var on=cur===o[0]; return '<button data-act="ciRange" data-arg="'+o[0]+'" style="flex-shrink:0;padding:9px 14px;border-radius:11px;border:1.5px solid '+(on?TEAL:'#dfe7e8')+';background:'+(on?TEAL:'#fff')+';color:'+(on?'#fff':'#42454b')+';font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap">'+o[1]+'</button>'; }).join('');
    var custom = cur==='custom' ? '<div style="display:flex;gap:10px;margin-bottom:12px"><div style="flex:1"><label class="lbl">Von</label><input type="date" value="'+esc(S.ciFrom||'')+'" onchange="window.__ciDate(\'from\',this.value)" class="inp"></div><div style="flex:1"><label class="lbl">Bis</label><input type="date" value="'+esc(S.ciTo||'')+'" onchange="window.__ciDate(\'to\',this.value)" class="inp"></div></div>' : '';
    return '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch">'+chips+'</div>'+custom;
  }

  function scrCheckins(){
    var all=DATA.checkins;
    var head=backHd('Check-in-Verlauf');
    if(all===null) return head+'<div class="card" style="text-align:center;color:#8a929a;font-size:14px">Lade Verlauf …</div>';
    if(!all.length) return head+'<div class="card" style="text-align:center"><div style="font-size:16px;font-weight:800">Noch keine Besuche</div><div style="font-size:13px;color:#6b7780;margin-top:6px;line-height:1.5">Sobald du eincheckst, erscheinen deine Besuche hier.</div></div>';
    var sel=ciSelector();
    var list=ciFilter(all);
    if(!list.length) return head+sel+'<div class="card" style="text-align:center"><div style="font-size:15px;font-weight:800">Keine Besuche im gewählten Zeitraum</div><div style="font-size:13px;color:#6b7780;margin-top:6px">Wähle oben einen anderen Zeitraum.</div></div>';
    // stats
    var now=new Date(); var thisMonth=list.filter(function(c){var d=new Date(c.in);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).length;
    var durs=list.map(function(c){return (c.out&&c.in)?(new Date(c.out)-new Date(c.in)):0;}).filter(function(x){return x>0;});
    var avg=durs.length?Math.round(durs.reduce(function(a,b){return a+b;},0)/durs.length/60000):0;
    var avgL=avg?(Math.floor(avg/60)+':'+(String(avg%60).padStart(2,'0'))):'–';
    // group by month
    var groups={}, order=[];
    list.slice().sort(function(a,b){return new Date(b.in)-new Date(a.in);}).forEach(function(c){ var d=new Date(c.in); var key=monthName(d); if(!groups[key]){groups[key]=[];order.push(key);} groups[key].push(c); });
    var stats='<div style="display:flex;gap:12px;margin-bottom:14px"><div style="flex:1;background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(4,33,40,.18);padding:18px 16px"><div style="font-size:30px;font-weight:900;color:'+TEAL+'">'+list.length+'</div><div style="font-size:12px;color:#6b7780;font-weight:600;margin-top:2px">Besuche im Zeitraum</div></div><div style="flex:1;background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(4,33,40,.18);padding:18px 16px"><div style="font-size:30px;font-weight:900;color:'+TEAL+'">'+avgL+'</div><div style="font-size:12px;color:#6b7780;font-weight:600;margin-top:2px">Ø Dauer</div></div></div>';
    var dl='<button class="btn2" data-act="emailPdf" style="display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:8px">'+svg('<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path>',{w:2,s:18})+(S.emailing?'Wird gesendet …':'Anwesenheitsbestätigung per E-Mail')+'</button>'+
      (S.dlMsg2?'<div style="font-size:13px;color:#0a4958;font-weight:600;text-align:center;margin-bottom:10px">'+esc(S.dlMsg2)+'</div>':'');
    var months=order.map(function(key){ return '<div><div style="font-size:13px;font-weight:700;color:#bfd7dc;text-transform:uppercase;letter-spacing:.5px;margin:0 2px 10px">'+esc(key)+'</div><div style="background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(4,33,40,.18);overflow:hidden">'+
      groups[key].map(function(v){return '<div style="display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid #f0f3f4"><div style="width:9px;height:9px;border-radius:50%;background:'+TEAL+';flex-shrink:0"></div><div style="flex:1;font-size:15px;font-weight:700">'+deDate(v.in)+'</div><div style="font-size:13px;color:#6b7780">'+deTime(v.in)+' Uhr</div><div style="font-size:13px;font-weight:700;color:'+TEAL+';min-width:54px;text-align:right">'+(dur(v.in,v.out)||'')+'</div></div>';}).join('')+'</div></div>'; }).join('');
    return head+sel+stats+dl+'<div class="gCols2" style="margin-top:8px">'+months+'</div>';
  }

  var HELP_CATS=[['Mitgliedschaft',7,IC.user],['Training',6,'<path d="M6.5 6.5l11 11M3 10l4-4M21 14l-4 4M5 13l-2 2 4 4 2-2M19 11l2-2-4-4-2 2"></path>'],['Studio',2,'<path d="M3 21V7l9-4 9 4v14M9 21v-6h6v6"></path>']];
  var HELP_ARTICLES=[{"t":"Wie kann ich meine Daten aktualisieren?","cat":"Mitgliedschaft","prev":"Ja, du kannst deine persönlichen Daten jederzeit selbst in der TechnoGym App aktualisieren.","body":"Ja, du kannst deine persönlichen Daten jederzeit selbst in der TechnoGym App aktualisieren.\n\nSchritt-für-Schritt Anleitung\n\n1. Öffne die TechnoGym App und navigiere zum Reiter Fit-Inn Trier\n2. Scrolle ganz nach unten in dieser Sektion\n3. Tippe auf \"Selfservice\" um zum Bearbeitungsbereich zu gelangen\n4. Aktualisiere deine Daten – Folgende Informationen kannst du ändern:\n    - Persönliche Daten\n    - Adresse\n    - IBAN (für Lastschrift)\n    - Weitere Kontaktinformationen\n5. Speichere deine Änderungen\n\nWas wird benötigt?\n\nDu benötigst lediglich Zugriff auf dein Mitgliedskonto in der TechnoGym App. Alle Änderungen werden sofort gespeichert.\n\nHast du Fragen?\n\nFalls du Probleme bei der Aktualisierung deiner Daten hast oder weitere Unterstützung brauchst, kontaktier uns gerne. Wir helfen dir gerne weiter."},{"t":"Newsletter abbestellen: Wichtige Hinweise zum Account","cat":"Mitgliedschaft","prev":"Du möchtest dich von unserem Newsletter abmelden? Da uns Transparenz wichtig ist, möchten wir…","body":"Du möchtest dich von unserem Newsletter abmelden? Da uns Transparenz wichtig ist, möchten wir dich über die technischen Besonderheiten und die daraus resultierenden Folgen für dein Training informieren.\n\nNewsletter-Abmeldung und Account-Löschung\n\nAktuell ist es aus technischen Gründen leider nicht möglich, ausschließlich den Newsletter-Versand zu deaktivieren. Eine Abmeldung vom Newsletter ist untrennbar mit der Löschung deines gesamten digitalen TechnoGym Benutzerkontos verknüpft.\n\nDas bedeutet: Wenn du keine E-Mails mehr von uns erhalten möchtest, müssen wir deinen Account vollständig aus unserem System entfernen. Bitte beachte, dass dieser Schritt weitreichende Auswirkungen auf dein Training bei uns vor Ort hat.\n\nFolgen der Account-Löschung\n\nDa dein Account die Schnittstelle zu unseren smarten Trainingsgeräten ist, hat die Löschung folgende Effekte:\n\nKein Zugang zu Geräten: Da unsere Biocircuit- und Biostrength-Geräte eine Anmeldung erfordern, kannst du diese nach der Löschung nicht mehr nutzen.\n\nVerlust des Fortschritts: Dein gesamter dokumentierter Trainingsfortschritt, deine Einstellungen und Analysen innerhalb der Technogym-Umgebung werden unwiderruflich gelöscht.\n\nKeine Informationen mehr: Du erhältst keine Benachrichtigungen mehr über wichtige Studio-Änderungen, Sonderöffnungszeiten oder exklusive Angebote.\n\nWas du jetzt tun kannst\n\nBevor du dich für eine Löschung entscheidest, überlege bitte, ob dir die digitalen Funktionen für dein Training wichtig sind. Wenn du die Löschung dennoch durchführen möchtest, kontaktiere uns bitte direkt.\n\nSende uns dazu einfach eine kurze Nachricht mit deinem Namen und deinem Anliegen. Wir kümmern uns dann um die notwendigen Schritte.\n\nBei Fragen\n\nSolltest du unsicher sein, welche Auswirkungen die Löschung auf dein spezifisches Training hat, sprich uns gerne direkt im Studio an oder schreibe uns eine E-Mail an info@fit-inn-trier.de. Unser Team hilft dir gerne weiter, eine Lösung zu finden."},{"t":"Stoffwechselanalyse mit uvida: So optimierst du dein Training & deine Ernährung","cat":"Training","prev":"Entdecke deinen Stoffwechsel: Die uvida Stoffwechselanalyse im Fit Inn","body":"Entdecke deinen Stoffwechsel: Die uvida Stoffwechselanalyse im Fit Inn\n\nMöchtest du wissen, wie dein Körper wirklich arbeitet? In Kooperation mit unserem Partner uvida bieten wir dir eine professionelle Atemgasanalyse an, die Licht ins Dunkel deines Stoffwechsels bringt. Egal ob du abnehmen, Muskeln aufbauen oder deine Ausdauer verbessern möchtest – die Ergebnisse sind der Schlüssel zu deinem Erfolg.\n\nWas ist eine Stoffwechselanalyse? Über eine einfache Atemmaske wird während einer kurzen Ruhephase oder Belastung deine Atemluft analysiert. Das System von uvida misst präzise, wie viel Sauerstoff dein Körper aufnimmt und wie viel Kohlendioxid er abgibt\n\nWas wird gemessen?\n\nDie Analyse liefert dir detaillierte Werte über deinen Körper, die mit herkömmlichen Waagen nicht messbar sind:\n\n- Individueller kcal-Bedarf: Erfahre deinen exakten Grundumsatz.\n- Fettstoffwechselaktivität: Wie effizient verbrennt dein Körper Fett?\n- VO2max & Regeneration: Bestimme dein Fitnesslevel und deine Erholungsfähigkeit.\n- Fettverbrennungspuls: Trainiere in der optimalen Herzfrequenzzone.\n\nUnsere Pakete & Preise\n\nWähle das Paket, das am besten zu deinen Zielen passt:\n\n1. Basic Paket – Ideal für einen schnellen Check-up deiner Werte. Sämtliche Stoffwechselanalysewerte, ausführliche Ergebnisbesprechung. Preis: 19 € (für Mitglieder) | 49 € (für Nicht-Mitglieder)\n\n2. Complete+ Paket – Das Rundum-sorglos-Paket für maximale Erfolge: alle Werte der Basic-Analyse & Ergebnisbesprechung, zusätzliches Beratungsgespräch & gemeinsame Zielsetzung, digitale Ernährungsplanung (3 Monate Betreuung), Ausdauertrainingsplanung (3 Monate Betreuung), inklusive einer erneuten Analyse zum Vorher-Nachher-Vergleich. Preis: 29 € (für Mitglieder) | 99 € (für Nicht-Mitglieder)\n\nWichtig vor dem Termin: Um verfälschte Ergebnisse zu vermeiden, solltest du mindestens 2-3 Stunden vor der Analyse keine großen Mahlzeiten zu dir nehmen und auf Koffein verzichten."},{"t":"Öffnungszeiten","cat":"Studio","prev":"Unsere Öffnungszeiten","body":"Unsere Öffnungszeiten\n\nMontag 09:30 - 13:00 | 15:00 - 21:30\nDienstag 09:30 - 13:00 | 15:00 - 21:30\nMittwoch 09:30 - 13:00 | 15:00 - 21:30\nDonnerstag 09:30 - 13:00 | 15:00 - 21:30\nFreitag 09:30 - 13:00 | 15:00 - 21:30\nSamstag 13:00 - 18:00\nSonntag 09:00 - 15:00"},{"t":"Stoffwechselanalyse / Coaching","cat":"Training","prev":"Stark, dass du dein Stoffwechsel-Coaching bei uns gebucht hast! Damit alles reibungslos läuft,…","body":"Stark, dass du dein Stoffwechsel-Coaching bei uns gebucht hast! Damit alles reibungslos läuft, findest du hier die wichtigsten Infos.\n\nVorbereitung (sehr wichtig!)\n\n- Mindestens 2 Stunden vor dem Termin nichts essen\n- Keine süßen Getränke (Säfte, Softdrinks, Energy-Drinks, Kaffee/Tee mit Zucker)\n- Wasser ist erlaubt – trink gern ausreichend!\n- Komm ausgeruht und vermeide intensives Training direkt davor\n\nOrt\n\nFit-Inn Trier, Auf Hirtenberg 8, 54296 Trier\n\nWichtig\n\nDamit wir deine Analyse durchführen können, musst du dich in der uVida App registrieren!\n\nMehr Infos\n\nAlle Details zum Ablauf & Nutzen findest du unter: fit-inn-trier.de/stoffwechsel-coaching"},{"t":"Technogym App – Dein smarter Begleiter im Fit-Inn Trier","cat":"Training","prev":"Die Technogym App ist mehr als nur eine Trainings-App – sie ist dein digitaler Coach, dein…","body":"Die Technogym App ist mehr als nur eine Trainings-App – sie ist dein digitaler Coach, dein Motivator und dein persönliches Fitness-Tagebuch in einem! Egal ob im Studio oder zuhause – mit der App bist du immer auf dem neuesten Stand und kannst dein Training gezielt und effizient gestalten.\n\nCoach – Dein digitaler Trainingsbegleiter\n\nQR-Code Anmeldung: Oben rechts in der App findest du den QR-Code Scanner. Damit kannst du dich direkt an unseren Geräten anmelden – schnell, kontaktlos und smart!\n\nDein Trainingsplan: Unter \"Coach\" findest du deinen individuellen Trainingsplan. Hier kannst du deinen Plan einsehen, Übungen starten, Fortschritte dokumentieren und den Plan bei Bedarf anpassen.\n\nAktuelles Training im Blick: Hier siehst du dein momentan laufendes Training. Mit einem Klick siehst du, welche Übungen du bereits abgeschlossen hast.\n\nIm Fokus: Spannende Gesundheitsartikel rund um Ernährung, Training, Motivation & Lifestyle – direkt in der App.\n\nFeedback & Support: Du brauchst Hilfe oder möchtest Feedback geben? Direkt in der App kannst du uns schreiben. Wir sind für dich da!"},{"t":"Probetraining im Fit-Inn Trier","cat":"Mitgliedschaft","prev":"Du möchtest unser familiäres Fitnessstudio Fit-Inn Trier unverbindlich kennenlernen? Ein…","body":"Du möchtest unser familiäres Fitnessstudio Fit-Inn Trier unverbindlich kennenlernen? Ein Probetraining ist der perfekte Einstieg, um unsere moderne Ausstattung und die persönliche Atmosphäre vor Ort zu erleben.\n\nDer Weg zu deinem ersten Training\n\nDamit wir uns Zeit für dich nehmen können, ist eine vorherige Anmeldung wichtig. Im Buchungsprozess hast du die Wahl zwischen zwei Optionen: Entscheide dich für ein Training mit professioneller Begleitung, bei dem dich unsere qualifizierten Trainer in die Geräte einweisen und einen ersten individuellen Trainingsplan erstellen (ab 16 Jahren). Alternativ kannst du dich für ein eigenständiges Probetraining ohne Trainer entscheiden (ab 18 Jahren).\n\nDeine Checkliste: Was in die Sporttasche gehört\n\n- Sportbekleidung: Bequeme Kleidung, in der du dich gut bewegen kannst.\n- Sportschuhe: Saubere Hallenschuhe, die ausschließlich im Studio getragen werden.\n- Handtuch: Ein großes Handtuch zur Unterlage an den Geräten (Pflicht aus Hygienegründen).\n- Getränk: Nimm dir etwas Wasser oder ein Sportgetränk mit, um hydriert zu bleiben.\n\nWas dich beim Probetraining erwartet\n\nSobald du im Studio „Auf Hirtenberg 8\" ankommst, empfängt dich unser Team herzlich. Wir zeigen dir unsere modernen Räumlichkeiten, die Umkleiden und unsere verschiedenen Trainingszonen. Während des Trainings kannst du unsere innovativen Technogym-Geräte, den Biocircuit oder unseren großzügigen Freihantelbereich testen.\n\nBei Fragen erreichst du uns während unserer Öffnungszeiten im Studio oder per E-Mail unter info@fit-inn-trier.de."},{"t":"Cardio Entertainment","cat":"Training","prev":"Willkommen im Fit-Inn Trier, deinem familiären Fitnessstudio. Unsere hochmodernen…","body":"Willkommen im Fit-Inn Trier, deinem familiären Fitnessstudio. Unsere hochmodernen Cardio-Geräte von TechnoGym sind mit der digitalen Benutzeroberfläche Technogym Live ausgestattet, die dir vielfältige Trainingsmöglichkeiten bietet.\n\nTechnogym Sessions – Dein virtuelles Training\n\nWähle aus einer Vielzahl von Technogym Sessions, die speziell auf deine persönlichen Ziele zugeschnitten sind. Ein virtueller Trainer führt dich durch individuelle Trainingseinheiten, gibt dir Anweisungen und schlägt dir passende Intensitätslevel vor.\n\nRoutinen – Vielfältige Bewegungsabläufe\n\nUnsere Routinen bestehen aus einer Reihe von Bewegungsabläufen, bei denen die Intensität automatisch vom Gerät angepasst wird. Du erhältst Schritt-für-Schritt-Anleitungen per Video oder als Pop-up-Nachricht.\n\nOutdoor-Umgebungen\n\nLass dich während deines Workouts von atemberaubenden natürlichen und urbanen Landschaften verzaubern und trainiere in verschiedenen virtuellen Outdoor-Umgebungen.\n\nEntertainment während des Trainings\n\nUnsere Geräte bieten die Möglichkeit, während des Workouts deine Lieblingsserien oder TV-Programme auf dem HD-Bildschirm zu schauen, Playlists abzuspielen oder im Internet zu surfen."},{"t":"Hausordnung des Fit-Inn Trier","cat":"Studio","prev":"1. Anerkennung der Hausordnung","body":"1. Anerkennung der Hausordnung\n\nMit dem Betreten des Fit-Inn Trier wird diese Hausordnung ausdrücklich anerkannt. Ein Verstoß kann zum Ausschluss von der Nutzung des Studios führen. Die Verpflichtung zur Zahlung der vereinbarten Beiträge bleibt bestehen.\n\n2. Haftung\n\nDas Fit-Inn Trier übernimmt keine Haftung für Diebstahl sowie Sach-, Personen- und Vermögensschäden jeglicher Art. Jeder Aufenthalt erfolgt auf eigene Gefahr.\n\n3. Eltern haften für ihre Kinder\n\nKinder dürfen sich nicht unbeaufsichtigt im Studio aufhalten oder mit Trainingsgeräten in Kontakt kommen.\n\n4. Verhaltensregeln\n\nRespektiere andere Mitglieder und unser Team. Halte die Privatsphäre in den Umkleiden ein. Vermeide störendes Verhalten.\n\n5. Umkleiden und Verwahrung\n\nVerwahre deine persönlichen Gegenstände in den vorgesehenen Schließfächern. Für Verluste übernimmt das Studio keine Haftung.\n\n6. Sauberkeit\n\nHinterlasse alle Bereiche sauber und ordentlich. Im Nassbereich bitten wir um das Tragen von Badeschuhen.\n\n7. Sportbekleidung\n\nTrage geeignete Sportbekleidung und saubere Sportschuhe. Ein Handtuch ist bei der Nutzung der Geräte Pflicht.\n\n8. Mobiltelefone und Kameras\n\nTelefonieren im Trainingsbereich ist nicht gestattet. Filmen und Fotografieren sind zum Schutz der Privatsphäre streng verboten.\n\n9. Rauchen und Substanzen\n\nIm gesamten Studio herrscht Rauchverbot. Der Besitz oder Konsum illegaler Substanzen ist verboten.\n\n10. Änderungen der Hausordnung\n\nDas Fit-Inn Trier behält sich das Recht vor, die Hausordnung jederzeit zu ändern."},{"t":"Kurse","cat":"Training","prev":"Im Fit-Inn Trier setzen wir auf ein individuelles und effektives Training – und das bedeutet…","body":"Im Fit-Inn Trier setzen wir auf ein individuelles und effektives Training – und das bedeutet für uns: keine festen Kurse, sondern 100 % Flexibilität und persönliche Betreuung!\n\nWarum verzichten wir auf Gruppenkurse?\n\nViele Fitnessstudios bieten Gruppenkurse an – doch oft sind diese nicht optimal auf die individuellen Ziele und Bedürfnisse der Teilnehmer abgestimmt. Unser Ansatz ist anders:\n\n- Individuelle Betreuung statt Massenabfertigung: Wir unterstützen dich persönlich, optimieren deine Technik und behalten deine Fortschritte im Blick.\n- Flexibilität statt Zeitdruck: Feste Kurszeiten passen nicht in jeden Alltag. Bei uns trainierst du, wann es dir passt.\n- Nachhaltiger Erfolg: Wir helfen dir, ein maßgeschneidertes Trainingsprogramm zu erstellen, das wirklich zu deinen Zielen passt.\n\nUnser Konzept: Dein individuelles Training!\n\n- Persönliche Trainingspläne – maßgeschneidert auf deine Ziele\n- 1:1 Betreuung durch erfahrene Trainer\n- Trainingsfreiheit – du bestimmst Tempo, Intensität und Zeiten\n\nBei uns bist du keine Nummer in einem überfüllten Kurs, sondern ein wertgeschätztes Mitglied unserer Trainingsfamilie."},{"t":"Mitgliedschaft pausieren","cat":"Mitgliedschaft","prev":"In bestimmten Situationen kann es vorkommen, dass du deine Mitgliedschaft pausieren möchtest –…","body":"In bestimmten Situationen kann es vorkommen, dass du deine Mitgliedschaft pausieren möchtest – sei es aufgrund von Krankheit, Operationen, Reha-Terminen oder anderen Gründen.\n\nWelche Gründe gibt es für eine Pausierung?\n\nDie häufigsten Gründe sind Krankheit, Operationen oder Reha-Termine. Aber auch andere Gründe können eine Pausierung notwendig machen.\n\nWas benötige ich für eine Pausierung?\n\nUm deine Mitgliedschaft zu pausieren, benötigst du einen Nachweis von deinem behandelnden Arzt. Darin muss erkennbar sein, aus welchem Grund und in welchem Zeitraum die Pausierung erfolgen soll.\n\nWie lange kann ich pausieren?\n\nIn der Regel ist eine Pausierung für einen Zeitraum von bis zu sechs Wochen möglich. Sollte eine längere Pausierung notwendig sein, bitten wir dich, dies persönlich mit uns zu besprechen.\n\nWie pausiere ich?\n\nLass uns den ärztlichen Nachweis zukommen – persönlich im Studio, per E-Mail oder per Post. Wir bearbeiten die Pausierung, sobald uns der Nachweis vorliegt.\n\nWas passiert während der Pausierung?\n\nDeine Mitgliedschaft ruht: Du zahlst keine Beiträge und kannst nicht trainieren. Nach Ende der Pausierung wird deine Mitgliedschaft automatisch wieder aktiviert. Eine vorzeitige Beendigung der Pause ist auf Wunsch jederzeit möglich – kontaktiere uns einfach."},{"t":"Kündigungsbedingungen","cat":"Mitgliedschaft","prev":"Im Fit-Inn Trier legen wir großen Wert auf Transparenz und Fairness. Unsere…","body":"Im Fit-Inn Trier legen wir großen Wert auf Transparenz und Fairness. Unsere Kündigungsbedingungen sind klar und einfach gestaltet.\n\nVerträge, die vor dem 1. März 2022 abgeschlossen wurden\n\nDie Kündigungsfrist beträgt gemäß den damaligen Vertragsbedingungen in der Regel drei Monate zum Ende der vereinbarten Laufzeit. Erfolgt keine fristgerechte Kündigung, verlängert sich der Vertrag automatisch um weitere zwölf Monate. Die Kündigung muss in Textform erfolgen.\n\nVerträge, die nach dem 1. März 2022 abgeschlossen wurden\n\nHier gilt eine Kündigungsfrist von vier Wochen zum Ende der vereinbarten Laufzeit. Erfolgt keine fristgerechte Kündigung, verlängert sich der Vertrag auf unbestimmte Zeit und kann dann jederzeit mit einer Frist von einem Monat gekündigt werden.\n\nWichtiger Hinweis\n\nMaßgeblich ist immer das, was individuell in deinem Vertrag vereinbart wurde. Wir empfehlen dir, deinen persönlichen Vertrag sowie die geltenden AGB sorgfältig zu prüfen."},{"t":"Was tun, wenn ein Mitglied verstorben ist?","cat":"Mitgliedschaft","prev":"Der Verlust eines geliebten Menschen ist immer eine schwere Zeit. Wir möchten Ihnen in dieser…","body":"Der Verlust eines geliebten Menschen ist immer eine schwere Zeit. Wir möchten Ihnen in dieser Situation zur Seite stehen und helfen, die notwendigen Schritte zu unternehmen.\n\nBenachrichtigung\n\nBitte informieren Sie uns über den Verlust – über das Kontaktformular auf unserer Website oder per E-Mail an info@fit-inn-trier.de. Geben Sie dabei den Namen des verstorbenen Mitglieds an und fügen Sie eine Kopie des Totenscheins bei.\n\nKündigung des Vertrags\n\nWir kündigen den Vertrag des verstorbenen Mitglieds. Bitte teilen Sie uns dies in Ihrer Benachrichtigung mit.\n\nRückerstattung von Beiträgen\n\nWurden bereits Beiträge für kommende Monate gezahlt, erstatten wir diese selbstverständlich zurück. Bitte geben Sie uns hierfür Ihre Bankverbindung an.\n\nUnser herzliches Beileid gilt Ihnen und Ihrer Familie.\n\nIn tiefer Trauer, das Team von Fit-Inn Trier"},{"t":"Vertrag kündigen","cat":"Mitgliedschaft","prev":"Wenn du deinen Vertrag bei Fit-Inn Trier kündigen möchtest, gibt es verschiedene Möglichkeiten.","body":"Wenn du deinen Vertrag bei Fit-Inn Trier kündigen möchtest, gibt es verschiedene Möglichkeiten.\n\nPer Post\n\nSende einen Brief an: Fit-Inn Trier, Auf Hirtenberg 8, 54296 Trier. Bitte gib deinen Namen, deine Mitgliedsnummer (sofern bekannt) und das gewünschte Kündigungsdatum an. Wir empfehlen den Versand per Einschreiben.\n\nPer E-Mail\n\nSende eine E-Mail an info@fit-inn-trier.de mit Namen, Mitgliedsnummer und Kündigungsdatum.\n\nOnline\n\nAm einfachsten kündigst du direkt hier im Mitgliederbereich unter „Vertrag & Kündigung\" – dort siehst du dein nächstmögliches Kündigungsdatum und wirst Schritt für Schritt geführt. Alternativ über das Formular auf fit-inn-trier.de/vertrag-kuendigen.\n\nWir bestätigen den Erhalt und das Ende der Laufzeit deines Vertrags. Eine Kündigung ist immer zum Ende der vereinbarten Laufzeit möglich."},{"t":"Biostrength Trainingsgeräte","cat":"Training","prev":"Unsere Biostrength-Geräte im Fit-Inn Trier bieten dir eine Vielzahl fortschrittlicher…","body":"Unsere Biostrength-Geräte im Fit-Inn Trier bieten dir eine Vielzahl fortschrittlicher Trainingsprogramme, die speziell entwickelt wurden, um deine Fitnessziele effektiv zu erreichen.\n\nStandardprogramme\n\n- Hypertrophie (Muskelaufbau): Förderung des Muskelwachstums durch Erhöhung der Last in der exzentrischen Phase.\n- Power (Explosivkraft): Steigerung der explosiven Kraft durch trägheitsfreien Widerstand.\n- Strong (Kraftsteigerung): Erhöhung der maximalen Kraftleistung durch viskösen Widerstand.\n- Tone (Muskelstraffung): Verbesserung der Muskeldefinition durch elastischen Widerstand.\n\nBenutzerdefinierte Programme (für Fortgeschrittene)\n\n- Pyramide: Gewicht nach jedem Satz steigern, Wiederholungen reduzieren.\n- Drop Set: Mit hohem Gewicht starten und schrittweise reduzieren.\n- Tone Express: Kompaktes Programm zur Verbesserung des Muskeltonus.\n- Super Slow: Übungen sehr langsam ausführen für maximale Beanspruchung.\n- Contrast: Sätze mit hohem und niedrigem Widerstand kombinieren.\n- Rest Pause: Satz bis zur Erschöpfung, kurze Pause, weitere Wiederholungen.\n\nUnsere Biostrength-Geräte nutzen Künstliche Intelligenz, um dein Training kontinuierlich zu überwachen und anzupassen – effizient und sicher."}];

      fetch('/api/member/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,dob:dob,plz:plz,remember:remember})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(x){ if(x.ok&&x.j.token){ TOKEN=x.j.token; if(remember){ localStorage.setItem('fi_member_token',TOKEN); localStorage.setItem('fi_remember','1'); sessionStorage.removeItem('fi_member_token'); } else { sessionStorage.setItem('fi_member_token',TOKEN); localStorage.removeItem('fi_member_token'); localStorage.removeItem('fi_remember'); } return loadMe().then(function(){ loadAppts(); S.busy=false; nav('home'); }); } S.busy=false; setS({loginErr: x.j.error==='rate_limited'?'Zu viele Versuche. Bitte später erneut.':'Daten nicht gefunden. Bitte E-Mail, Geburtsdatum und PLZ prüfen.'}); })
        .catch(function(){ S.busy=false; setS({loginErr:'Es ist ein Fehler aufgetreten.'}); });
    },
    toggleRemember:function(){ S.remember=!S.remember; if(!S.remember) localStorage.removeItem('fi_remember'); setQuiet({}); },
    dpOpen:function(){ if(!S.dpOpen && S.dpSel){ S.dpYear=S.dpSel.getFullYear(); S.dpMonth=S.dpSel.getMonth(); } setS({dpOpen:!S.dpOpen}); },
    dpClose:function(){ setS({dpOpen:false}); },
    dpPrev:function(){ var m=S.dpMonth-1,y=S.dpYear; if(m<0){m=11;y--;} setS({dpMonth:m,dpYear:y}); },
    dpNext:function(){ var m=S.dpMonth+1,y=S.dpYear; if(m>11){m=0;y++;} setS({dpMonth:m,dpYear:y}); },
    dpPick:function(a){ setS({dpSel:new Date(S.dpYear,S.dpMonth,+a),dpOpen:false}); },
    saveAddr:function(){ var data={street:val('d_street'),houseNumber:val('d_house'),zipCode:val('d_zip'),city:val('d_city'),validFrom:val('d_addr_from')};
      api('/api/member/update',{method:'POST',body:JSON.stringify({type:'address',data:data})}).then(function(d){ setS({msg:d.message||(d.ok?'Übermittelt.':'Keine Änderung erkannt.')}); }).catch(function(){}); },
    saveIban:function(){ var iban=val('d_iban'); if(!iban){ setS({msg:'Bitte neue IBAN eingeben.'}); return; }
      var data={accountHolder:val('d_holder'),iban:iban,bankName:val('d_bank'),bic:val('d_bic'),validFrom:val('d_iban_from')};
      api('/api/member/update',{method:'POST',body:JSON.stringify({type:'payment',data:data})}).then(function(d){ setS({msg:d.message||'Übermittelt.'}); }).catch(function(){}); },
    logout:function(){ logout(); },
    // contract
    contractCopy:function(){ if(S.ccBusy) return; setQuiet({ccBusy:true,ccMsg:''});
      api('/api/member/contract-copy',{method:'POST',body:JSON.stringify({})}).then(function(d){ setS({ccBusy:false,ccMsg:d.message||(d.ok?'Gesendet.':'Versand fehlgeschlagen.')}); }).catch(function(){ setS({ccBusy:false,ccMsg:'Versand fehlgeschlagen.'}); }); },
    startCancel:function(){ setS({cancelStep:1,cancelReason:'',cancelDone:false,offerDone:'',pauseStep:0,pauseDone:false}); },
    pickReason:function(a){ setS({cancelReason:a}); },
    cancelNext:function(){ if(S.cancelStep<5) setS({cancelStep:S.cancelStep+1}); },
    cancelBack:function(){ if(S.cancelStep>1) setS({cancelStep:S.cancelStep-1}); else setS({cancelStep:0}); },
    abortCancel:function(){ setS({cancelStep:0}); },
    reasonCta:function(a){ if(a==='rabatt') doOffer('discount10'); else if(a==='pause') startPause(); else setS({cancelStep:4}); },
    takeRabatt:function(){ doOffer('discount10'); },
    openPause:function(){ startPause(); },
    pauseInc:function(){ setS({pauseWeeks:Math.min(25,S.pauseWeeks+1)}); },
    pauseDec:function(){ setS({pauseWeeks:Math.max(1,S.pauseWeeks-1)}); },
    pauseReason:function(a){ setS({pauseReason:a}); },
    pauseNext:function(){ if(S.pauseStep===1 && !S.pauseReason) return; if(S.pauseStep<4) setS({pauseStep:S.pauseStep+1}); },
    pauseBack:function(){ if(S.pauseStep>1) setS({pauseStep:S.pauseStep-1}); else setS({pauseStep:0}); },
    pausePhotoRemove:function(){ setS({pausePhoto:'',pausePhotoName:''}); },
    closePauseDone:function(){ setS({pauseDone:false}); },
    confirmPauseSubmit:function(){ setQuiet({busy:true});
      var payload={ reason:S.pauseReason||'—', reasonText:S.pauseReasonText||'', from:(S.pauseFrom||isoToday()), weeks:S.pauseWeeks, photo:S.pausePhoto||'' };
      api('/api/member/pause',{method:'POST',body:JSON.stringify(payload)})
        .then(function(d){ setS({busy:false,pauseStep:0,pauseDone:true,pausePhoto:'',pausePhotoName:'',pauseReason:'',pauseReasonText:''}); })
        .catch(function(){ setS({busy:false,pauseStep:0,pauseDone:true,pausePhoto:'',pausePhotoName:''}); }); },
    submitCancel:function(){
      var date=val('c_date'); setQuiet({busy:true});
      rcToken().then(function(tok){
        return api('/api/member/cancel',{method:'POST',body:JSON.stringify({action:'cancel',reason:S.cancelReason||'—',date:date,recaptchaToken:tok})});
      })
        .then(function(){ S.busy=false; S.cancelStep=0; S.cancelDone=true; return loadMe(); })
        .then(function(){ render(); window.scrollTo(0,0); })
        .catch(function(){ setS({busy:false,cancelStep:0,cancelDone:true}); });
    },
    askWithdraw:function(){ setS({withdrawConfirm:true}); },
    cancelWithdraw:function(){ setS({withdrawConfirm:false}); },
    confirmWithdraw:function(){ setQuiet({busy:true});
      api('/api/member/cancel',{method:'POST',body:JSON.stringify({action:'withdraw'})}).then(function(){ setS({busy:false,withdrawConfirm:false,withdrawDone:true}); }).catch(function(){ setS({busy:false,withdrawConfirm:false,withdrawDone:true}); }); },
    closeOffer:function(){ setS({offerDone:'',cancelStep:0}); },
    // appointments
    openMyAppts:function(){ S.screen='appt'; S.apptTab='mine'; S.apptMsg=''; loadAppts(); setS({}); },
    apptTab:function(a){ setS({apptTab:a,apptMsg:''}); if(a==='mine') loadAppts(); },
    bookType:function(a){ setS({bookType:a}); },
    reqAppt:function(){ var pref=val('a_pref'); var t=(APPT_TYPES.filter(function(x){return x[0]===S.bookType;})[0]||[])[1]||''; setQuiet({busy:true});
      api('/api/member/appointment',{method:'POST',body:JSON.stringify({type:t,preferred:pref})}).then(function(d){ setS({busy:false,apptMsg:d.message||'Dein Terminwunsch ist eingegangen.',bookType:''}); }).catch(function(){ setS({busy:false,apptMsg:'Dein Terminwunsch ist eingegangen.'}); }); },
    // referral
    copyRef:function(){ var code=(DATA.profile||{}).referralCode||''; var link=window.location.origin+'/mitglied-werden?ref='+encodeURIComponent(code); copyText(link); setS({copied:true}); setTimeout(function(){ S.copied=false; render(); },1800); },
    shareRef:function(){ var code=(DATA.profile||{}).referralCode||''; var link=window.location.origin+'/mitglied-werden?ref='+encodeURIComponent(code); var txt='Trainier mit mir im Fit-Inn Trier! 💪 Werde Mitglied mit meinem Code '+code+': '+link; if(navigator.share){ navigator.share({title:'Fit-Inn Trier',text:txt,url:link}).catch(function(){}); } else { copyText(txt); setS({copied:true}); setTimeout(function(){ S.copied=false; render(); },1800); } },
    // checkins
    ciRange:function(a){ S.ciRange=a||'all'; S.dlMsg2=''; setS({}); },
    emailPdf:function(){ emailPdf(); },
    cancelAppt:function(a){ if(!a) return; var id=a;
      // Sofort aus der Liste entfernen (optimistisch), danach frisch laden
      if(Array.isArray(DATA.appts)) DATA.appts=DATA.appts.filter(function(x){return String(x.id)!==String(id);});
      setQuiet({});
      api('/api/member/appointment-cancel',{method:'POST',body:JSON.stringify({bookingId:id})})
        .then(function(d){ DATA.appts=null; loadAppts(); })
        .catch(function(){ DATA.appts=null; loadAppts(); }); },
    // help
    openArticle:function(a){ setS({helpView:'article',helpArticle:+a}); },
    helpList:function(){ setS({helpView:'list'}); },
    helpCat:function(a){ S.helpCat=(S.helpCat===a?'':a); setS({}); }
  };
  function startPause(){ S.cancelStep=0; S.pauseDone=false; S.pauseStep=1; S.pauseReason=''; S.pauseReasonText=''; S.pausePhoto=''; S.pausePhotoName=''; S.pauseFrom=isoToday(); if(!S.pauseWeeks)S.pauseWeeks=6; setS({}); }
  function doOffer(offer){ setQuiet({busy:true});
    var extra = offer==='pause' ? (S.pauseWeeks+' Wochen Pause') : '';
    api('/api/member/cancel',{method:'POST',body:JSON.stringify({action:'offer_accepted',offer:offer,reason:(S.cancelReason||'—')+(extra?(' · '+extra):'')})})
      .then(function(){ setS({busy:false,offerDone:offer,pauseStep:0,cancelStep:0}); }).catch(function(){ setS({busy:false,offerDone:offer,pauseStep:0,cancelStep:0}); }); }
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function(){}); }
  function downloadCsv(){ var list=ciCurrent(); var rows=[['Datum','Uhrzeit','Dauer','Studio']].concat(list.map(function(c){return [c.in?c.in.slice(0,10):'',deTime(c.in),dur(c.in,c.out),c.studio||''];}));
    var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
    var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='checkin-verlauf.csv'; document.body.appendChild(a); a.click(); a.remove(); }
  function logoTxt(doc,M){ doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('FIT-INN TRIER',M,17); }
  function buildPdfDoc(){
    var ns=window.jspdf; if(!ns||!ns.jsPDF){ return null; }
    var p=DATA.profile||{}; var list=ciCurrent().slice().sort(function(a,b){return new Date(b.in)-new Date(a.in);});
    var doc=new ns.jsPDF({unit:'mm',format:'a4'}); var W=210, M=14;
    doc.setFillColor(10,73,88); doc.rect(0,0,W,26,'F');
    var lh=11, lw=lh*(LOGO_RATIO||3.6); if(lw>72) lw=72;
    if(LOGO_DATAURL){ try{ doc.addImage(LOGO_DATAURL,'PNG',M,8,lw,lh); }catch(e){ logoTxt(doc,M); } } else logoTxt(doc,M);
    doc.setTextColor(21,23,27); doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('Anwesenheitsbestätigung',M,40);
    var y=50; doc.setFontSize(11);
    [['Name',p.lastName],['Vorname',p.firstName],['Mitgliedsnummer',p.customerNumber],['Geburtsdatum',deDateFull(p.dateOfBirth)],['Zeitraum',ciRangeLabel()]].forEach(function(r){ doc.setFont('helvetica','bold'); doc.setTextColor(60,66,72); doc.text(r[0]+':',M,y); doc.setFont('helvetica','normal'); doc.setTextColor(21,23,27); doc.text(String(r[1]||'—'),62,y); y+=7; });
    y+=3; doc.setFont('helvetica','normal'); doc.setTextColor(60,66,72); doc.setFontSize(10.5);
    var intro='Hiermit bestätigt das Fit-Inn Trier, dass das oben genannte Mitglied an den folgenden Terminen im Studio anwesend war:';
    var lines=doc.splitTextToSize(intro,W-2*M); doc.text(lines,M,y); y+=lines.length*5.5+6;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(21,23,27);
    doc.text('Datum',M,y); doc.text('Uhrzeit',74,y); doc.text('Dauer',104,y); doc.text('Studio',132,y);
    y+=2; doc.setDrawColor(210); doc.line(M,y,W-M,y); y+=5;
    doc.setFont('helvetica','normal'); doc.setTextColor(60,66,72);
    if(!list.length){ doc.text('Keine Besuche vorhanden.',M,y); y+=6; }
    list.forEach(function(c){ if(y>284){ doc.addPage(); y=20; } doc.text(deDateFull(c.in),M,y); doc.text(deTime(c.in)+' Uhr',74,y); doc.text(dur(c.in,c.out)||'-',104,y); doc.text(String(c.studio||'').slice(0,28),132,y); y+=6; });
    y+=8; if(y>290){ doc.addPage(); y=20; } doc.setFontSize(8.5); doc.setTextColor(150); doc.text('Ausgestellt am '+todayStr()+'  ·  Fit-Inn Trier  ·  Auf Hirtenberg 8  ·  54296 Trier  ·  '+list.length+' Besuche',M,Math.min(y,293));
    return doc;
  }
  function downloadPdf(){ var d=buildPdfDoc(); if(d) d.save('anwesenheitsbestaetigung.pdf'); else downloadCsv(); }
  function emailPdf(){
    var d=buildPdfDoc(); if(!d){ setS({dlMsg2:'PDF-Bibliothek lädt noch – bitte kurz erneut.'}); return; }
    var b64=d.output('datauristring'); var ix=b64.indexOf('base64,'); if(ix>=0) b64=b64.slice(ix+7);
    if(b64.length>6000000){ setS({dlMsg2:'Das PDF ist für den Versand zu groß – bitte wähle oben einen kürzeren Zeitraum.'}); return; }
    setQuiet({emailing:true, dlMsg2:''});
    api('/api/member/checkin-pdf',{method:'POST',body:JSON.stringify({pdf:b64})})
      .then(function(r){ setS({emailing:false, dlMsg2:(r.message||(r.ok?'Gesendet.':'Versand fehlgeschlagen.'))}); })
      .catch(function(){ setS({emailing:false, dlMsg2:'Versand fehlgeschlagen.'}); });
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var act=el.getAttribute('data-act'); var arg=el.getAttribute('data-arg');
    if(ACT[act]){ e.preventDefault(); ACT[act](arg); }
  });

  // ---- boot ----
  if(TOKEN){ loadMe().then(function(){ loadAppts(); render(); }).catch(function(){ logout(); }); }
  else render();
})();
</script>
