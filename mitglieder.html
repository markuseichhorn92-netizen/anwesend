<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Mitgliederbereich</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;}
  body{margin:0; min-height:100dvh; background:linear-gradient(165deg,#0e6072 0%,#063540 100%);
    font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased;
    color:#15171B; display:flex; align-items:flex-start; justify-content:center; padding:max(env(safe-area-inset-top,0px),24px) 16px 40px;}
  .card{width:100%; max-width:440px; background:#fff; border-radius:22px; box-shadow:0 18px 50px rgba(4,33,40,.30); padding:24px 22px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .brand img{height:24px;}
  h1{font-size:20px; font-weight:900; margin:10px 0 2px;}
  .sub{color:#6b7780; font-size:13px; margin:0 0 18px;}
  label{display:block; font-size:12px; font-weight:700; color:#42454b; margin:12px 0 5px; letter-spacing:.02em;}
  input{width:100%; padding:12px 13px; border:1px solid #d6dee0; border-radius:11px; font-size:15px; font-family:inherit; color:#15171B; background:#fff;}
  input:focus{outline:none; border-color:#0a4958; box-shadow:0 0 0 3px rgba(10,73,88,.12);}
  input[readonly]{background:#f3f6f6; color:#6b7780;}
  button{width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px; background:#0a4958; color:#fff; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;}
  button:hover{background:#0c5566;} button:disabled{opacity:.55; cursor:default;}
  button.secondary{background:#eef3f4; color:#0a4958;}
  .row2{display:flex; gap:10px;} .row2 > div{flex:1;}
  .msg{margin-top:14px; font-size:13px; padding:10px 12px; border-radius:10px; display:none;}
  .msg.ok{display:block; background:#E7F6EC; color:#1d7a3e;}
  .msg.err{display:block; background:#FCEBEA; color:#b53a2c;}
  .sec{margin-top:24px; padding-top:20px; border-top:1px solid #eaf0f1;}
  .sec h2{font-size:14px; font-weight:800; margin:0 0 4px;}
  .hint{font-size:12px; color:#8a929a; margin:2px 0 10px;}
  .hello{font-size:15px; color:#0a4958; font-weight:700; margin-bottom:2px;}
  .iban-cur{font-size:14px; color:#42454b; background:#f3f6f6; border:1px solid #e6eef0; border-radius:10px; padding:10px 12px; font-variant-numeric:tabular-nums;}
  .foot{margin-top:22px; text-align:center;}
  .link{background:none; color:#8a929a; font-weight:600; font-size:13px; width:auto; padding:6px; margin:0;}
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier" style="filter:invert(1) brightness(.3);"></div>

    <!-- Login -->
    <div id="loginView">
      <h1>Mitglieder-Login</h1>
      <p class="sub">Zur Bestätigung deiner Identität – keine Passwörter.</p>
      <form id="loginForm" autocomplete="on">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" type="email" required autocomplete="email" placeholder="name@beispiel.de" />
        <label for="dob">Geburtsdatum</label>
        <input id="dob" type="date" required />
        <label for="plz">Postleitzahl</label>
        <input id="plz" type="text" inputmode="numeric" required maxlength="5" placeholder="54290" />
        <button id="loginBtn" type="submit">Anmelden</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- Mitgliederbereich -->
    <div id="memberView" class="hidden">
      <h1>Mein Bereich</h1>
      <div class="hello" id="hello">—</div>
      <p class="sub" id="who">—</p>

      <div class="sec">
        <h2>Adresse</h2>
        <p class="hint">Anschrift aktualisieren.</p>
        <div class="row2">
          <div><label for="street">Straße</label><input id="street" type="text"></div>
          <div style="flex:0 0 90px"><label for="houseNumber">Nr.</label><input id="houseNumber" type="text"></div>
        </div>
        <div class="row2">
          <div style="flex:0 0 120px"><label for="zipCode">PLZ</label><input id="zipCode" type="text" maxlength="5"></div>
          <div><label for="city">Ort</label><input id="city" type="text"></div>
        </div>
        <button id="saveAddr" type="button">Adresse speichern</button>
        <div id="addrMsg" class="msg"></div>
      </div>

      <div class="sec">
        <h2>Bankverbindung (IBAN)</h2>
        <p class="hint">Aktuelle IBAN: <span id="ibanCur">—</span></p>
        <label for="accountHolder">Kontoinhaber</label>
        <input id="accountHolder" type="text" placeholder="Vor- und Nachname">
        <label for="iban">Neue IBAN</label>
        <input id="iban" type="text" placeholder="DE.." autocomplete="off">
        <div class="row2">
          <div><label for="bankName">Bank</label><input id="bankName" type="text"></div>
          <div style="flex:0 0 140px"><label for="bic">BIC</label><input id="bic" type="text" autocomplete="off"></div>
        </div>
        <button id="savePay" type="button">IBAN speichern</button>
        <div id="payMsg" class="msg"></div>
      </div>

      <div class="foot"><button class="link" id="logout" type="button">Abmelden</button></div>
    </div>
  </div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var TOKEN = sessionStorage.getItem('fi_member_token') || null;

  function show(view){ $('loginView').classList.toggle('hidden', view!=='login'); $('memberView').classList.toggle('hidden', view!=='member'); }
  function msg(el, ok, text){ el.className = 'msg ' + (ok?'ok':'err'); el.textContent = text; }
  function hide(el){ el.className='msg'; el.textContent=''; }

  function headers(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }

  function loadMe(){
    return fetch('/api/member/me', { headers: headers(), cache:'no-store' })
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        var p = d.profile || {};
        $('hello').textContent = 'Hallo ' + (p.firstName||'') + '!';
        $('who').textContent = (p.customerNumber? 'Mitgliedsnr. '+p.customerNumber+' · ':'') + (p.email||'');
        $('street').value = p.street||''; $('houseNumber').value = p.houseNumber||'';
        $('zipCode').value = p.zipCode||''; $('city').value = p.city||'';
        $('accountHolder').value = (p.firstName||'') + ' ' + (p.lastName||'');
        $('ibanCur').textContent = p.ibanMasked || 'nicht hinterlegt';
        show('member');
      });
  }

  // Login
  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault(); hide($('loginMsg'));
    var btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Prüfe …';
    fetch('/api/member/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email:$('email').value, dob:$('dob').value, plz:$('plz').value }) })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){
        if (x.ok && x.j.token){ TOKEN = x.j.token; sessionStorage.setItem('fi_member_token', TOKEN); return loadMe(); }
        msg($('loginMsg'), false, x.j.error==='rate_limited' ? 'Zu viele Versuche. Bitte später erneut.' : 'Daten nicht gefunden. Bitte E-Mail, Geburtsdatum und PLZ prüfen.');
      })
      .catch(function(){ msg($('loginMsg'), false, 'Es ist ein Fehler aufgetreten.'); })
      .finally(function(){ btn.disabled=false; btn.textContent='Anmelden'; });
  });

  function save(type, data, el, btn){
    hide(el); btn.disabled = true;
    fetch('/api/member/update', { method:'POST', headers: headers(), body: JSON.stringify({ type:type, data:data }) })
      .then(function(r){ if(r.status===401){ logout(); throw 0; } return r.json(); })
      .then(function(d){ msg(el, d.ok, d.ok ? 'Gespeichert ✓' : (d.message || 'Konnte nicht gespeichert werden.')); })
      .catch(function(){ if(TOKEN) msg(el, false, 'Fehler beim Speichern.'); })
      .finally(function(){ btn.disabled=false; });
  }

  $('saveAddr').addEventListener('click', function(){
    save('address', { street:$('street').value, houseNumber:$('houseNumber').value, zipCode:$('zipCode').value, city:$('city').value }, $('addrMsg'), $('saveAddr'));
  });
  $('savePay').addEventListener('click', function(){
    if(!$('iban').value.trim()){ msg($('payMsg'), false, 'Bitte neue IBAN eingeben.'); return; }
    save('payment', { accountHolder:$('accountHolder').value, iban:$('iban').value, bankName:$('bankName').value, bic:$('bic').value }, $('payMsg'), $('savePay'));
  });

  function logout(){ TOKEN=null; sessionStorage.removeItem('fi_member_token'); show('login'); }
  $('logout').addEventListener('click', logout);

  // Start: vorhandene Sitzung?
  if (TOKEN) { loadMe().catch(function(){ logout(); }); } else { show('login'); }
})();
</script>
</body>
</html>
