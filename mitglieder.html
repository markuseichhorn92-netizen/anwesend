<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Mitgliederbereich</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://www.google.com/recaptcha/api.js?onload=onRcLoad&render=explicit" async defer></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#15171B;
    background:linear-gradient(165deg,#0e6072 0%,#063540 100%);min-height:100dvh}
  ::placeholder{color:#a9b1b6}
  input,select,textarea,button{font-family:inherit}
  @keyframes fiUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .shell{width:100%;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .brandbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px}
  .logout{background:rgba(255,255,255,.12);border:none;color:#cfe3e7;font-weight:600;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer}
  .body{flex:1;padding:4px 16px 40px;animation:fiUp .25s ease}
  .card{background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(4,33,40,.30);padding:24px 22px}
  .h1w{font-size:23px;font-weight:900;color:#fff;letter-spacing:-.4px}
  .lbl{font-size:13px;font-weight:600;color:#42454b;margin-bottom:6px;display:block}
  .inp{width:100%;padding:13px 14px;border:1.5px solid #d6dee0;border-radius:11px;font-size:15px;color:#15171B;outline:none;background:#fff}
  .inp:focus{border-color:#0a4958;box-shadow:0 0 0 3px rgba(10,73,88,.12)}
  .btn{width:100%;padding:15px;border:none;border-radius:13px;background:#0a4958;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .btn:hover{background:#0c5566}.btn:disabled{background:#9fb9bf;cursor:not-allowed}
  .btn2{width:100%;padding:14px;border:none;border-radius:13px;background:#eef3f4;color:#0a4958;font-weight:700;font-size:15px;cursor:pointer}
  .btnDanger{width:100%;padding:14px;border:1.5px solid #e3b8b1;border-radius:13px;background:#fff;color:#b53a2c;font-weight:700;font-size:15px;cursor:pointer}
  .btnDanger:hover{background:#FCEBEA}
  .back{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.13);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .back:hover{background:rgba(255,255,255,.22)}
  .hd{display:flex;align-items:center;gap:12px;padding:6px 2px 16px}
  .row2{display:grid;gap:12px}
  .ok{display:flex;align-items:flex-start;gap:9px;background:#E7F6EC;border-radius:14px;padding:13px 15px}
  .ok span{font-size:13px;color:#1d7a3e;font-weight:600;line-height:1.4}
  .err{display:flex;align-items:flex-start;gap:8px;background:#FCEBEA;border-radius:12px;padding:12px 14px}
  .err span{font-size:13px;color:#b53a2c;font-weight:600;line-height:1.4}
  .muted{font-size:12px;color:#8a929a}
  .tile{background:#fff;border-radius:20px;box-shadow:0 12px 34px rgba(4,33,40,.20);padding:17px 16px 18px;cursor:pointer;min-height:128px;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s;border:none;text-align:left}
  .tile:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(4,33,40,.28)}
  .ic{width:42px;height:42px;border-radius:12px;background:#eef3f4;display:flex;align-items:center;justify-content:center;margin-bottom:auto}
  .seg{height:5px;flex:1;border-radius:3px}
  a{color:inherit}
</style>
</head>
<body>
<div class="shell">
  <div class="brandbar">
    <div id="brandLogo" style="display:flex;align-items:center;cursor:pointer"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier" style="height:26px;width:auto;display:block"></div>
    <button class="logout" id="logoutBtn" style="display:none">Abmelden</button>
  </div>
  <div class="body" id="app"></div>
  <div id="rcContainer"></div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var TEAL='#0a4958';

  // ---- SVG icons ----
  function svg(p,o){ o=o||{}; return '<svg width="'+(o.s||22)+'" height="'+(o.s||22)+'" viewBox="0 0 24 24" fill="none" stroke="'+(o.c||TEAL)+'" stroke-width="'+(o.w||1.85)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
  var IC={
    user:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path><path d="M4 21c0-3.3 3.6-6 8-6s8 2.7 8 6"></path>',
    doc:'<path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path>',
    cal:'<rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path>',
    gift:'<rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M3 12h18M12 8v13"></path><path d="M12 8C12 8 10 2.5 7.6 4.2 5.9 5.4 8.4 8 12 8zM12 8c0 0 2-5.5 4.4-3.8C18.1 5.4 15.6 8 12 8z"></path>',
    list:'<path d="M3 6h13M3 12h13M3 18h9"></path><path d="M17.5 15l2 2 3.2-3.2"></path>',
    help:'<circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.8.3-1.4 1-1.4 1.9v.3"></path><path d="M12 17h.01"></path>',
    back:'<path d="M15 18l-6-6 6-6"></path>',
    check:'<path d="M20 6L9 17l-5-5"></path>',
    lock:'<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
    warn:'<path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>',
    share:'<circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path>',
    dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path>',
    search:'<circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>'
  };

  // ---- reCAPTCHA (für direkte Kündigung über die Connect API) ----
  var RC_SITEKEY='6Ld5qKcgAAAAAMoywArOgIrC0lQ7NpYUTsF92PIC';
  var rcId=null, rcResolve=null;
  window.onRcLoad=function(){ try{ rcId=grecaptcha.render('rcContainer',{sitekey:RC_SITEKEY,size:'invisible',callback:function(t){ var r=rcResolve; rcResolve=null; if(r) r(t); }}); }catch(e){} };
  function rcToken(){ return new Promise(function(resolve){ if(typeof grecaptcha==='undefined'||rcId===null){ resolve(null); return; } rcResolve=resolve; try{ grecaptcha.reset(rcId); grecaptcha.execute(rcId); }catch(e){ rcResolve=null; resolve(null); } setTimeout(function(){ if(rcResolve){ rcResolve=null; resolve(null); } },20000); }); }

  // ---- state ----
  var TOKEN = localStorage.getItem('fi_member_token') || sessionStorage.getItem('fi_member_token') || null;
  var DATA = { profile:null, contract:null, checkins:null, appts:null };
  var S = { screen: TOKEN?'home':'login',
    msg:'', // generic success on data screen
    cancelStep:0, cancelReason:'', pauseAsk:false, pauseWeeks:8, offerDone:'', withdrawConfirm:false, withdrawDone:false, cancelDone:false, busy:false,
    apptTab:'book', bookType:'', apptMsg:'',
    helpView:'list', helpArticle:0,
    copied:false, dlMsg:false,
    liEmail:'', liPlz:'', remember:(localStorage.getItem('fi_remember')==='1'),
    dpOpen:false, dpYear:1995, dpMonth:0, dpSel:null,
    loginErr:'' };
  window.__setLi=function(f,v){ if(f==='email')S.liEmail=v; else if(f==='plz')S.liPlz=v; };
  window.__dpYear=function(v){ S.dpYear=+v; render(); };

  function setS(p){ Object.assign(S,p); render(); window.scrollTo(0,0); }
  function setQuiet(p){ Object.assign(S,p); render(); }

  // ---- helpers ----
  function fmtIban(v){ var s=(v||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase().slice(0,34); return s.replace(/(.{4})/g,'$1 ').trim(); }
  function deDate(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return iso.slice(0,10); var p=function(n){return(n<10?'0':'')+n;}; var wd=['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]; return wd+', '+p(d.getDate())+'.'+p(d.getMonth()+1)+'.'; }
  function deTime(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; var p=function(n){return(n<10?'0':'')+n;}; return p(d.getHours())+':'+p(d.getMinutes()); }
  function monthName(d){ return ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][d.getMonth()]+' '+d.getFullYear(); }
  function dur(a,b){ if(!a||!b) return ''; var ms=new Date(b)-new Date(a); if(isNaN(ms)||ms<=0) return ''; var min=Math.round(ms/60000); var h=Math.floor(min/60); var m=min%60; return h?(h+'h '+(m<10?'0':'')+m+'m'):(m+'m'); }

  function headers(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN }; }
  function api(path, opt){ opt=opt||{}; opt.headers=Object.assign(headers(), opt.headers||{}); opt.cache='no-store';
    return fetch(path,opt).then(function(r){ if(r.status===401){ logout(); throw new Error('unauthorized'); } return r.json(); }); }

  function logout(){ TOKEN=null; sessionStorage.removeItem('fi_member_token'); localStorage.removeItem('fi_member_token'); DATA={profile:null,contract:null,checkins:null,appts:null}; S.screen='login'; render(); }
  // ---- modern date picker ----
  function pad2(n){ return (n<10?'0':'')+n; }
  var MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  function dpCal(){
    var y=S.dpYear, m=S.dpMonth;
    var off=(new Date(y,m,1).getDay()+6)%7, dim=new Date(y,m+1,0).getDate();
    var heads=['Mo','Di','Mi','Do','Fr','Sa','So'].map(function(d){return '<div style="text-align:center;font-size:11px;font-weight:700;color:#8a929a;padding-bottom:4px">'+d+'</div>';}).join('');
    var btns=[];
    for(var i=0;i<42;i++){ var dn=i-off+1, inM=dn>=1&&dn<=dim;
      var sel=S.dpSel&&inM&&S.dpSel.getFullYear()===y&&S.dpSel.getMonth()===m&&S.dpSel.getDate()===dn;
      btns.push('<button '+(inM?('data-act="dpPick" data-arg="'+dn+'"'):'')+' style="height:34px;border:none;border-radius:9px;background:'+(sel?TEAL:'transparent')+';color:'+(sel?'#fff':(inM?'#15171B':'transparent'))+';font-weight:'+(sel?'800':'600')+';font-size:13px;cursor:'+(inM?'pointer':'default')+'">'+(inM?dn:'')+'</button>'); }
    var weeks='';for(var w=0;w<6;w++){ weeks+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px">'+btns.slice(w*7,w*7+7).join('')+'</div>'; }
    var yrs='';for(var yy=2012;yy>=1930;yy--){ yrs+='<option value="'+yy+'"'+(yy===y?' selected':'')+'>'+yy+'</option>'; }
    var navBtn=function(act,ch){ return '<button data-act="'+act+'" style="width:34px;height:34px;border-radius:9px;border:none;background:#eef3f4;color:'+TEAL+';font-size:18px;font-weight:800;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">'+ch+'</button>'; };
    return '<div data-act="dpClose" style="position:fixed;inset:0;z-index:40"></div>'+
      '<div style="position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:50;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(4,33,40,.30);border:1px solid #eef1f2;padding:14px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'+navBtn('dpPrev','‹')+'<div style="flex:1;text-align:center;font-size:15px;font-weight:800">'+MN[m]+'</div>'+
      '<select onchange="window.__dpYear(this.value)" style="padding:8px 6px;border:1.5px solid #d6dee0;border-radius:9px;font-size:14px;font-weight:700;color:'+TEAL+';background:#fff;outline:none;cursor:pointer">'+yrs+'</select>'+navBtn('dpNext','›')+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">'+heads+'</div>'+weeks+'</div>';
  }
  $('logoutBtn').addEventListener('click', logout);
  $('brandLogo').addEventListener('click', function(){ if(TOKEN) nav('home'); });

  function nav(s){ S.screen=s; if(s==='checkins'&&!DATA.checkins) loadCheckins(); if(s==='appt'&&!DATA.appts) loadAppts(); setS({}); }

  // ---- data loading ----
  function loadMe(){
    return api('/api/member/me').then(function(d){ DATA.profile=d.profile||null; DATA.contract=d.contract||null; });
  }
  function loadCheckins(){ api('/api/member/checkins').then(function(d){ DATA.checkins=d.checkins||[]; render(); }).catch(function(){ DATA.checkins=[]; render(); }); }
  function loadAppts(){ api('/api/member/appointments').then(function(d){ DATA.appts=d.appointments||[]; render(); }).catch(function(){ DATA.appts=[]; render(); }); }

  // ========================= SCREENS =========================
  function backHd(title, target){ return '<div class="hd"><button class="back" data-act="nav" data-arg="'+(target||'home')+'">'+svg(IC.back,{c:'#fff',w:2,s:20})+'</button><div class="h1w">'+esc(title)+'</div></div>'; }

  function scrLogin(){
    var e = S.loginErr ? '<div class="err" style="margin-top:14px">'+svg(IC.warn,{c:'#b53a2c',w:2,s:17})+'<span>'+esc(S.loginErr)+'</span></div>' : '';
    return ''+
    '<div style="text-align:center;padding:18px 6px 26px"><div style="font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.05">Willkommen<br>zurück</div></div>'+
    '<div class="card">'+
      '<div style="font-size:21px;font-weight:800;letter-spacing:-.4px">Mitglieder-Login</div>'+
      '<div style="font-size:14px;color:#6b7780;margin-top:5px;line-height:1.45">Zur Bestätigung deiner Identität – keine Passwörter.</div>'+
      '<div style="margin-top:20px"><label class="lbl">E-Mail-Adresse</label><input id="li_email" type="email" autocomplete="email" placeholder="du@beispiel.de" class="inp" value="'+esc(S.liEmail)+'" oninput="window.__setLi(\'email\',this.value)"></div>'+
      '<div style="margin-top:14px;position:relative"><label class="lbl">Geburtsdatum</label>'+
        '<div data-act="dpOpen" style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;border:1.5px solid '+(S.dpOpen?TEAL:'#d6dee0')+';border-radius:11px;font-size:15px;cursor:pointer;background:#fff"><span style="color:'+(S.dpSel?'#15171B':'#a9b1b6')+';font-weight:500">'+(S.dpSel?(pad2(S.dpSel.getDate())+'.'+pad2(S.dpSel.getMonth()+1)+'.'+S.dpSel.getFullYear()):'TT.MM.JJJJ')+'</span>'+svg('<rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path>',{c:'#6b7780',w:1.9,s:19})+'</div>'+
        (S.dpOpen?dpCal():'')+'</div>'+
      '<div style="margin-top:14px"><label class="lbl">Postleitzahl</label><input id="li_plz" type="text" inputmode="numeric" maxlength="5" placeholder="54290" class="inp" value="'+esc(S.liPlz)+'" oninput="window.__setLi(\'plz\',this.value)"></div>'+
      '<label style="display:flex;align-items:center;gap:10px;margin-top:18px;cursor:pointer"><input type="checkbox" data-act="toggleRemember" '+(S.remember?'checked':'')+' style="width:18px;height:18px;accent-color:'+TEAL+';cursor:pointer"><span style="font-size:14px;color:#42454b;font-weight:600">Angemeldet bleiben</span></label>'+
      '<button class="btn" id="li_btn" data-act="login" style="margin-top:18px">'+(S.busy?'Prüfe …':'Anmelden')+'</button>'+
      e+
      '<div style="display:flex;align-items:center;gap:8px;margin-top:18px;padding:11px 13px;background:#f4f7f7;border-radius:11px">'+svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>',{w:1.9,s:17})+'<span style="font-size:12px;color:#6b7780;line-height:1.4">Deine Daten werden verschlüsselt übertragen und nur zur Identitätsprüfung genutzt.</span></div>'+
    '</div>'+
    '<div style="text-align:center;margin-top:20px"><span style="color:#bfd7dc;font-size:13px">Noch kein Mitglied? </span><a href="/mitglied-werden" style="color:#fff;font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px">Jetzt online beitreten</a></div>';
  }

  function scrHome(){
    var p=DATA.profile||{}; var name=p.firstName||'';
    var nextAppt = (DATA.appts||[]).slice().filter(function(a){return new Date(a.start)>=new Date();}).sort(function(a,b){return new Date(a.start)-new Date(b.start);})[0];
    var status = nextAppt ? (''+
      '<div style="background:linear-gradient(135deg,#E7F1F3,#D6E8EB);border:1px solid #C2DCE0;border-radius:22px;padding:18px 20px;display:flex;align-items:center;gap:14px">'+
        '<div style="width:46px;height:46px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+svg(IC.cal,{w:1.9})+'</div>'+
        '<div style="flex:1"><div style="font-size:12px;font-weight:700;color:'+TEAL+';text-transform:uppercase;letter-spacing:.5px">Nächster Termin</div>'+
        '<div style="font-size:15px;font-weight:700;margin-top:2px">'+esc(nextAppt.title)+' · '+deDate(nextAppt.start)+' · '+deTime(nextAppt.start)+'</div></div>'+
      '</div>') : '';
    var tiles=[
      ['data','Meine Daten','Adresse & Bankverbindung verwalten',IC.user],
      ['contract','Vertrag & Kündigung','Vertrag einsehen, kündigen, zurücknehmen',IC.doc],
      ['appt','Termine','Einführungstraining & Co. buchen',IC.cal],
      ['referral','Freunde werben','Code teilen & Prämie sichern',IC.gift],
      ['checkins','Check-in-Verlauf','Deine Besuche ansehen & herunterladen',IC.list],
      ['help','Hilfe','Antworten & Anleitungen',IC.help]
    ].map(function(t){ return '<button class="tile" data-act="nav" data-arg="'+t[0]+'"><div class="ic">'+svg(t[3])+'</div><div style="font-size:15px;font-weight:800;margin-top:12px;letter-spacing:-.2px">'+t[1]+'</div><div style="font-size:12px;color:#6b7780;margin-top:3px;line-height:1.35">'+t[2]+'</div></button>'; }).join('');
    return ''+
      '<div style="padding:6px 4px 16px"><div style="font-size:28px;font-weight:900;color:#fff;letter-spacing:-.6px">Hallo '+esc(name||'')+'!</div>'+
      '<div style="font-size:14px;color:#bfd7dc;margin-top:3px;font-weight:500">'+(p.customerNumber?('Mitgliedsnr. '+esc(p.customerNumber)):'')+'</div></div>'+
      status+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:'+(status?'14px':'0')+'">'+tiles+'</div>';
  }

  function scrData(){
    var p=DATA.profile||{};
    var m = S.msg ? '<div class="ok" style="margin-bottom:14px">'+svg(IC.check,{c:'#1d7a3e',w:2.1,s:18})+'<span>'+esc(S.msg)+'</span></div>' : '';
    return backHd('Meine Daten')+m+
    '<div class="card" style="margin-bottom:16px">'+
      '<div style="font-size:17px;font-weight:800">Adresse</div>'+
      '<div class="row2" style="grid-template-columns:2fr 1fr;margin-top:16px"><div><label class="lbl">Straße</label><input id="d_street" class="inp" value="'+esc(p.street||'')+'"></div><div><label class="lbl">Nr.</label><input id="d_house" class="inp" value="'+esc(p.houseNumber||'')+'"></div></div>'+
      '<div class="row2" style="grid-template-columns:1fr 2fr;margin-top:12px"><div><label class="lbl">PLZ</label><input id="d_zip" class="inp" value="'+esc(p.zipCode||'')+'"></div><div><label class="lbl">Ort</label><input id="d_city" class="inp" value="'+esc(p.city||'')+'"></div></div>'+
      '<button class="btn" data-act="saveAddr" style="margin-top:18px">Adressänderung beantragen</button>'+
    '</div>'+
    '<div class="card">'+
      '<div style="font-size:17px;font-weight:800">Bankverbindung</div>'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f4f7f7;border-radius:13px;padding:13px 15px;margin-top:14px"><div><div style="font-size:12px;color:#8a929a;font-weight:600">Aktuelle IBAN</div><div style="font-size:16px;font-weight:700;letter-spacing:1px;margin-top:2px">'+esc(p.ibanMasked||'nicht hinterlegt')+'</div></div>'+svg(IC.lock,{c:'#8a929a',w:1.9,s:20})+'</div>'+
      '<div style="margin-top:16px"><label class="lbl">Kontoinhaber:in</label><input id="d_holder" class="inp" value="'+esc(((p.firstName||'')+' '+(p.lastName||'')).trim())+'"></div>'+

    // appointments
    apptTab:function(a){ setS({apptTab:a,apptMsg:''}); if(a==='mine'&&!DATA.appts) loadAppts(); },
    bookType:function(a){ setS({bookType:a}); },
    reqAppt:function(){ var pref=val('a_pref'); var t=(APPT_TYPES.filter(function(x){return x[0]===S.bookType;})[0]||[])[1]||''; setQuiet({busy:true});
      api('/api/member/appointment',{method:'POST',body:JSON.stringify({type:t,preferred:pref})}).then(function(d){ setS({busy:false,apptMsg:d.message||'Dein Terminwunsch ist eingegangen.',bookType:''}); }).catch(function(){ setS({busy:false,apptMsg:'Dein Terminwunsch ist eingegangen.'}); }); },
    // referral
    copyRef:function(){ var code=(DATA.profile||{}).referralCode||''; var link=window.location.origin+'/mitglied-werden?ref='+encodeURIComponent(code); copyText(link); setS({copied:true}); setTimeout(function(){ S.copied=false; render(); },1800); },
    shareRef:function(){ var code=(DATA.profile||{}).referralCode||''; var link=window.location.origin+'/mitglied-werden?ref='+encodeURIComponent(code); var txt='Trainier mit mir im Fit-Inn Trier! 💪 Werde Mitglied mit meinem Code '+code+': '+link; if(navigator.share){ navigator.share({title:'Fit-Inn Trier',text:txt,url:link}).catch(function(){}); } else { copyText(txt); setS({copied:true}); setTimeout(function(){ S.copied=false; render(); },1800); } },
    // checkins
    download:function(){ downloadCsv(); setS({dlMsg:true}); setTimeout(function(){ S.dlMsg=false; render(); },2400); },
    // help
    openArticle:function(a){ setS({helpView:'article',helpArticle:+a}); },
    helpList:function(){ setS({helpView:'list'}); }
  };
  function doOffer(offer){ setQuiet({busy:true});
    var extra = offer==='pause' ? (S.pauseWeeks+' Wochen Pause') : '';
    api('/api/member/cancel',{method:'POST',body:JSON.stringify({action:'offer_accepted',offer:offer,reason:(S.cancelReason||'—')+(extra?(' · '+extra):'')})})
      .then(function(){ setS({busy:false,offerDone:offer,pauseAsk:false,cancelStep:0}); }).catch(function(){ setS({busy:false,offerDone:offer,pauseAsk:false,cancelStep:0}); }); }
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function(){}); }
  function downloadCsv(){ var list=DATA.checkins||[]; var rows=[['Datum','Uhrzeit','Dauer','Studio']].concat(list.map(function(c){return [c.in?c.in.slice(0,10):'',deTime(c.in),dur(c.in,c.out),c.studio||''];}));
    var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
    var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='checkin-verlauf.csv'; document.body.appendChild(a); a.click(); a.remove(); }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var act=el.getAttribute('data-act'); var arg=el.getAttribute('data-arg');
    if(ACT[act]){ e.preventDefault(); ACT[act](arg); }
  });

  // ---- boot ----
  if(TOKEN){ loadMe().then(function(){ loadAppts(); render(); }).catch(function(){ logout(); }); }
  else render();
})();
</script>
</body>
</html>
