<style>

<script>
/* Theme früh setzen (vor dem ersten Paint), damit kein Hell-Aufblitzen entsteht.
   Auswahl: 'system' (Standard, folgt der Geräteeinstellung) | 'light' | 'dark'. */
(function(){
  try{
    var pref=localStorage.getItem('fi_theme')||'system';
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    function effective(){ return (pref==='dark'||(pref==='system'&&mq.matches))?'dark':'light'; }
    function apply(){ document.documentElement.setAttribute('data-theme', effective()); }
    window.__themePref=function(){ return pref; };
    window.__themeEffective=effective;
    window.__setTheme=function(p){ pref=(p==='light'||p==='dark')?p:'system'; try{localStorage.setItem('fi_theme',pref);}catch(e){} apply(); };
    try{ mq.addEventListener('change', function(){ if(pref==='system') apply(); }); }
    catch(e){ try{ mq.addListener(function(){ if(pref==='system') apply(); }); }catch(_){} }
    apply();
  }catch(e){}
})();
</script>

  // 1-Sekunden-Ticker: aktualisiert den Timer live (ohne Voll-Render); checkt nach 1,5 h automatisch aus.
  setInterval(function(){ if(!S.checkedInAt) return; var t=Date.parse(S.checkedInAt); if(isNaN(t)) return; if((Date.now()-t)>CI_MAX){ autoCheckout(); return; } var el=document.getElementById('ci_timer'); if(el) el.textContent=fmtDur(Date.now()-t); },1000);
  // Gleicht den lokalen Status mit Magicline ab: erkennt auch Check-in/out per
  // Band vor Ort (offener Besuch = checkInDateTime ohne checkOutDateTime).
  function ciSyncFromHistory(){
    var list=DATA.checkins; if(!Array.isArray(list)||!list.length) return;
    var latest=null; list.forEach(function(c){ if(c.in && (!latest||c.in>latest.in)) latest=c; });
    if(!latest) return; var t=Date.parse(latest.in); if(isNaN(t)) return;
    var openRecent = !latest.out && (Date.now()-t)<CI_MAX && (Date.now()-t)>=-120000;
    if(openRecent){
      if(window.__ciMuteIn && Date.now()<window.__ciMuteIn) return; // direkt nach App-Auschecken nicht sofort wieder einchecken
      if(!S.checkedInAt || Math.abs(Date.parse(S.checkedInAt)-t)>60000){
        var wasIn=!!S.checkedInAt; ciSetIn(latest.in);
        if(!wasIn){ S.ciPopup='in'; S.ciName=(DATA.profile&&DATA.profile.firstName)||''; ciAutoClose(); }
      }
    } else if(S.checkedInAt){
      var fromT=Date.parse(S.checkedInAt); ciClear();
      S.ciPopup='out'; S.ciDur=durText(Date.now()-(isNaN(fromT)?Date.now():fromT)); ciAutoClose();

  // ── „Vormerken" (geplante Trainingszeit heute) ──
  // Öffnungszeiten Mo=0…So=6 (Fallback identisch zur Auslastungs-Anzeige)
  var PLAN_IV=(function(){ var wd=[[570,780],[900,1290]]; return [wd,wd,wd,wd,wd,[[780,1080]],[[540,900]]]; })();
  function berlinNowParts(){
    var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    var g=function(t){return (p.find(function(x){return x.type===t;})||{}).value;};
    var map={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
    var hour=parseInt(g('hour'),10);
    return {wd:map[g('weekday')], hour:hour, min:hour*60+parseInt(g('minute'),10)};
  }
  // Freie 30-Min-Slots für „heute + offset Tage" (0 = heute ab jetzt, 1 = morgen ganztags)
  function openSlotsForDay(offset){
    var n=berlinNowParts(), wd=(n.wd+(offset||0))%7, ivs=PLAN_IV[wd]||[], slots=[];
    var minStart=offset>0 ? -1 : Math.ceil(n.min/30)*30;   // morgen: alle Slots; heute: ab jetzt
    ivs.forEach(function(intv){
      for(var m=intv[0]; m<=intv[1]-30; m+=30){ if(m>=minStart && slots.indexOf(m)<0) slots.push(m); }
    });
    slots.sort(function(a,b){return a-b;});
    return slots;
  }
  function openSlotsToday(){ return openSlotsForDay(0); }
  function fmtMin(m){ return (m<600?'0':'')+Math.floor(m/60)+':'+(m%60<10?'0':'')+(m%60); }
  // Heutiges Datum (Berlin) als YYYY-MM-DD – für den Tagesvergleich der Vormerkung
  function berlinToday(){ try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }catch(e){ return ''; } }
  function planIsTomorrow(plan){ var t=berlinToday(); return !!(plan&&plan.date&&t&&plan.date>t); }
  // Vormerkung noch aktiv? Künftiger Tag immer; heute bis Slot-Ende (+30 Min)
  function planActive(plan){
    if(!plan||plan.slot==null) return false;
    var t=berlinToday();
    if(plan.date&&t){ if(plan.date>t) return true; if(plan.date<t) return false; }
    return berlinNowParts().min < plan.slot+30;
  }

    return {k:'frei',col:'#5fe0a0'};

  function auslastungChart(){
    var t=DATA.typical; if(!t||!Array.isArray(t.day)) return '';
    var day=t.day, max=t.max||0;
    var curSlot=(typeof t.slot==='number')?t.slot:-1, curHour=curSlot>=0?Math.floor(curSlot/2):-1;
    var startH=7, endH=22, bars=[], peakH=startH, peakV=0;
    for(var h=startH;h<=endH;h++){ var a=day[h*2], b=day[h*2+1]; var v=Math.max(a==null?0:a, b==null?0:b); if(v>peakV){peakV=v;peakH=h;} bars.push({h:h,v:v}); }
    var maxV=Math.max(max||0, peakV, 1);
    var barsHtml=bars.map(function(bar){
      var pct=Math.max(4, Math.round(bar.v/maxV*100));
      var ratio=bar.v/(max||maxV);
      var col= ratio>=.8?'#e2685a':(ratio>=.5?'#E08C53':'#37b27a');

  function statCards(){

    var vCard=statCard('Vertrag', IC.doc, vVal, vSub, 'data-act="nav" data-arg="contract"');
    var na=(DATA.appts||[]).slice().filter(function(a){return new Date(a.start)>=new Date();}).sort(function(a,b){return new Date(a.start)-new Date(b.start);})[0];
    var tVal=na?(deDate(na.start)+' · '+deTime(na.start)+' Uhr'):'Kein Termin';

    var tCard=statCard('Nächster Termin', IC.cal, tVal, tSub, na?'data-act="openMyAppts"':'data-act="nav" data-arg="appt"');
    var now=new Date();
    var mn=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][now.getMonth()];
    var ci=Array.isArray(DATA.checkins)?DATA.checkins:[];
    var month=ci.filter(function(x){var d=new Date(x.in);return !isNaN(d)&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
    var durs=month.map(function(x){return (x.out&&x.in)?(new Date(x.out)-new Date(x.in)):0;}).filter(function(x){return x>0;});
    var avg=durs.length?Math.round(durs.reduce(function(a,b){return a+b;},0)/durs.length/60000):0;

    var bVal=month.length+' '+(month.length===1?'Besuch':'Besuche');

  var _qrLib=null;
  function loadQrLib(){
    if(window.qrcode) return Promise.resolve();

      var s=document.createElement('script'); s.src='/assets/qrcode.min.js?v=1'; s.async=true;
      s.onload=function(){ resolve(); }; s.onerror=function(){ _qrLib=null; reject(new Error('qr_load')); };
      document.head.appendChild(s);
    });
    return _qrLib;
  }

  // ── Fortschritt & Vitalität (aus echten Check-in-Daten abgeleitet) ──
  var VITAL_TIERS=[['Starter',0],['Aktiv',500],['Vital',1500],['Stark',3500],['Champion',7000],['Legende',12000]];
  function mondayKey(dt){ var x=new Date(dt); if(isNaN(x.getTime())) return null; x.setHours(0,0,0,0); var day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate()); }
  function vitalsData(){
    var ci=Array.isArray(DATA.checkins)?DATA.checkins:[];
    var done=ci.filter(function(x){ return x&&x.in; });
    var visits=done.length;
    var points=visits*50;
    var ti=0; for(var i=0;i<VITAL_TIERS.length;i++){ if(points>=VITAL_TIERS[i][1]) ti=i; }
    var cur=VITAL_TIERS[ti], nxt=VITAL_TIERS[ti+1]||null;
    var toNext=nxt?(nxt[1]-points):0;
    var deg=nxt?Math.max(8,Math.min(360,Math.round((points-cur[1])/(nxt[1]-cur[1])*360))):360;
    // Wochen-Streak (zusammenhängende Wochen mit mind. 1 Besuch)
    var wk={}; done.forEach(function(x){ var k=mondayKey(x.in); if(k) wk[k]=1; });
    var cursor=new Date(); cursor.setHours(0,0,0,0); var d0=(cursor.getDay()+6)%7; cursor.setDate(cursor.getDate()-d0);
    var keyOf=function(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
    if(!wk[keyOf(cursor)]) cursor.setDate(cursor.getDate()-7);   // laufende Woche noch ohne Besuch -> ab letzter zählen
    var streak=0; while(wk[keyOf(cursor)]){ streak++; cursor.setDate(cursor.getDate()-7); }
    // Wochenziel (Besuche in der laufenden Woche)
    var mon=new Date(); mon.setHours(0,0,0,0); var d1=(mon.getDay()+6)%7; mon.setDate(mon.getDate()-d1);
    var weekVisits=done.filter(function(x){ return new Date(x.in)>=mon; }).length;
    // Fitness-Alter: echtes Alter minus Trainings-Bonus
    var dob=DATA.profile&&DATA.profile.dateOfBirth; var age=dob?Math.floor((Date.now()-Date.parse(dob))/(365.25*864e5)):null;
    var recent=done.filter(function(x){ return Date.parse(x.in)>=(Date.now()-56*864e5); }).length;
    var bonus=Math.min(12,Math.round((recent/8)*2));
    var fitAge=(age!=null&&age>0&&age<120)?Math.max(16,age-bonus):null;
    return {visits:visits,points:points,rankName:cur[0],nextRank:nxt?nxt[0]:null,toNext:toNext,deg:deg,streak:streak,weekVisits:weekVisits,goal:3,fitAge:fitAge,maxed:!nxt};
  }

  // ---- Check-in Zeitraum-Filter ----
  function fmtD(d){ var p=function(n){return(n<10?'0':'')+n;}; return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear(); }
  function ciBounds(){
    var now=new Date(); var r=S.ciRange||'all'; var from=null,to=null;
    if(r==='1m'){from=new Date(now);from.setMonth(from.getMonth()-1);}
    else if(r==='3m'){from=new Date(now);from.setMonth(from.getMonth()-3);}
    else if(r==='6m'){from=new Date(now);from.setMonth(from.getMonth()-6);}
    else if(r==='12m'){from=new Date(now);from.setFullYear(from.getFullYear()-1);}
    else if(r==='lastyear'){var y=now.getFullYear()-1;from=new Date(y,0,1,0,0,0);to=new Date(y,11,31,23,59,59);}
    else if(r==='custom'){ if(S.ciFrom)from=new Date(S.ciFrom+'T00:00:00'); if(S.ciTo)to=new Date(S.ciTo+'T23:59:59'); }
    return {from:from,to:to};
  }
  function ciFilter(list){ var b=ciBounds(); return (list||[]).filter(function(c){ var d=new Date(c.in); if(isNaN(d))return false; if(b.from&&d<b.from)return false; if(b.to&&d>b.to)return false; return true; }); }
  function ciCurrent(){ return ciFilter(DATA.checkins||[]); }
  function ciRangeLabel(){ var b=ciBounds(); if(!b.from&&!b.to) return 'Gesamter Verlauf'; var f=b.from?fmtD(b.from):'Beginn'; var t=b.to?fmtD(b.to):fmtD(new Date()); return f+' – '+t; }
  function ciSelector(){
    var opts=[['all','Alle'],['1m','1 Monat'],['3m','3 Monate'],['6m','6 Monate'],['12m','12 Monate'],['lastyear','Letztes Jahr'],['custom','Zeitraum']];
    var cur=S.ciRange||'all';

      groups[key].map(function(v){return '<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--surface-2)"><div style="width:9px;height:9px;border-radius:50%;background:'+TEALBG+';flex-shrink:0"></div><div style="flex:1;font-size:14px;font-weight:700;color:var(--text)">'+deDate(v.in)+'</div><div style="font-size:12.5px;color:var(--text-muted);font-weight:600">'+deTime(v.in)+' Uhr</div><div style="font-size:13px;font-weight:800;color:'+TEAL+';min-width:54px;text-align:right">'+(dur(v.in,v.out)||'')+'</div></div>';}).join('')+'</div>'; }).join('');
    return head+sel+stats+dl+'<div class="gCols2" style="margin-top:8px">'+months+'</div>';
  }

  var HELP_ARTICLES=[{"t":"Wie kann ich meine Daten aktualisieren?","cat":"Mitgliedschaft","prev":"Ja, du kannst deine persönlichen Daten jederzeit selbst in der TechnoGym App aktualisieren.","body":"Ja, du kannst deine persönlichen Daten jederzeit selbst in der TechnoGym App aktualisieren.\n\nSchritt-für-Schritt Anleitung\n\n1. Öffne die TechnoGym App und navigiere zum Reiter Fit-Inn Trier\n2. Scrolle ganz nach unten in dieser Sektion\n3. Tippe auf \"Selfservice\" um zum Bearbeitungsbereich zu gelangen\n4. Aktualisiere deine Daten – Folgende Informationen kannst du ändern:\n    - Persönliche Daten\n    - Adresse\n    - IBAN (für Lastschrift)\n    - Weitere Kontaktinformationen\n5. Speichere deine Änderungen\n\nWas wird benötigt?\n\nDu benötigst lediglich Zugriff auf dein Mitgliedskonto in der TechnoGym App. Alle Änderungen werden sofort gespeichert.\n\nHast du Fragen?\n\nFalls du Probleme bei der Aktualisierung deiner Daten hast oder weitere Unterstützung brauchst, kontaktier uns gerne. Wir helfen dir gerne weiter."},{"t":"Newsletter abbestellen: Wichtige Hinweise zum Account","cat":"Mitgliedschaft","prev":"Du möchtest dich von unserem Newsletter abmelden? Da uns Transparenz wichtig ist, möchten wir…","body":"Du möchtest dich von unserem Newsletter abmelden? Da uns Transparenz wichtig ist, möchten wir dich über die technischen Besonderheiten und die daraus resultierenden Folgen für dein Training informieren.\n\nNewsletter-Abmeldung und Account-Löschung\n\nAktuell ist es aus technischen Gründen leider nicht möglich, ausschließlich den Newsletter-Versand zu deaktivieren. Eine Abmeldung vom Newsletter ist untrennbar mit der Löschung deines gesamten digitalen TechnoGym Benutzerkontos verknüpft.\n\nDas bedeutet: Wenn du keine E-Mails mehr von uns erhalten möchtest, müssen wir deinen Account vollständig aus unserem System entfernen. Bitte beachte, dass dieser Schritt weitreichende Auswirkungen auf dein Training bei uns vor Ort hat.\n\nFolgen der Account-Löschung\n\nDa dein Account die Schnittstelle zu unseren smarten Trainingsgeräten ist, hat die Löschung folgende Effekte:\n\nKein Zugang zu Geräten: Da unsere Biocircuit- und Biostrength-Geräte eine Anmeldung erfordern, kannst du diese nach der Löschung nicht mehr nutzen.\n\nVerlust des Fortschritts: Dein gesamter dokumentierter Trainingsfortschritt, deine Einstellungen und Analysen innerhalb der Technogym-Umgebung werden unwiderruflich gelöscht.\n\nKeine Informationen mehr: Du erhältst keine Benachrichtigungen mehr über wichtige Studio-Änderungen, Sonderöffnungszeiten oder exklusive Angebote.\n\nWas du jetzt tun kannst\n\nBevor du dich für eine Löschung entscheidest, überlege bitte, ob dir die digitalen Funktionen für dein Training wichtig sind. Wenn du die Löschung dennoch durchführen möchtest, kontaktiere uns bitte direkt.\n\nSende uns dazu einfach eine kurze Nachricht mit deinem Namen und deinem Anliegen. Wir kümmern uns dann um die notwendigen Schritte.\n\nBei Fragen\n\nSolltest du unsicher sein, welche Auswirkungen die Löschung auf dein spezifisches Training hat, sprich uns gerne direkt im Studio an oder schreibe uns eine E-Mail an info@fit-inn-trier.de. Unser Team hilft dir gerne weiter, eine Lösung zu finden."},{"t":"Stoffwechselanalyse mit uvida: So optimierst du dein Training & deine Ernährung","cat":"Training","prev":"Entdecke deinen Stoffwechsel: Die uvida Stoffwechselanalyse im Fit Inn","body":"Entdecke deinen Stoffwechsel: Die uvida Stoffwechselanalyse im Fit Inn\n\nMöchtest du wissen, wie dein Körper wirklich arbeitet? In Kooperation mit unserem Partner uvida bieten wir dir eine professionelle Atemgasanalyse an, die Licht ins Dunkel deines Stoffwechsels bringt. Egal ob du abnehmen, Muskeln aufbauen oder deine Ausdauer verbessern möchtest – die Ergebnisse sind der Schlüssel zu deinem Erfolg.\n\nWas ist eine Stoffwechselanalyse? Über eine einfache Atemmaske wird während einer kurzen Ruhephase oder Belastung deine Atemluft analysiert. Das System von uvida misst präzise, wie viel Sauerstoff dein Körper aufnimmt und wie viel Kohlendioxid er abgibt\n\nWas wird gemessen?\n\nDie Analyse liefert dir detaillierte Werte über deinen Körper, die mit herkömmlichen Waagen nicht messbar sind:\n\n- Individueller kcal-Bedarf: Erfahre deinen exakten Grundumsatz.\n- Fettstoffwechselaktivität: Wie effizient verbrennt dein Körper Fett?\n- VO2max & Regeneration: Bestimme dein Fitnesslevel und deine Erholungsfähigkeit.\n- Fettverbrennungspuls: Trainiere in der optimalen Herzfrequenzzone.\n\nUnsere Pakete & Preise\n\nWähle das Paket, das am besten zu deinen Zielen passt:\n\n1. Basic Paket – Ideal für einen schnellen Check-up deiner Werte. Sämtliche Stoffwechselanalysewerte, ausführliche Ergebnisbesprechung. Preis: 19 € (für Mitglieder) | 49 € (für Nicht-Mitglieder)\n\n2. Complete+ Paket – Das Rundum-sorglos-Paket für maximale Erfolge: alle Werte der Basic-Analyse & Ergebnisbesprechung, zusätzliches Beratungsgespräch & gemeinsame Zielsetzung, digitale Ernährungsplanung (3 Monate Betreuung), Ausdauertrainingsplanung (3 Monate Betreuung), inklusive einer erneuten Analyse zum Vorher-Nachher-Vergleich. Preis: 29 € (für Mitglieder) | 99 € (für Nicht-Mitglieder)\n\nWichtig vor dem Termin: Um verfälschte Ergebnisse zu vermeiden, solltest du mindestens 2-3 Stunden vor der Analyse keine großen Mahlzeiten zu dir nehmen und auf Koffein verzichten."},{"t":"Öffnungszeiten","cat":"Studio","prev":"Unsere Öffnungszeiten","body":"Unsere Öffnungszeiten\n\nMontag 09:30 - 13:00 | 15:00 - 21:30\nDienstag 09:30 - 13:00 | 15:00 - 21:30\nMittwoch 09:30 - 13:00 | 15:00 - 21:30\nDonnerstag 09:30 - 13:00 | 15:00 - 21:30\nFreitag 09:30 - 13:00 | 15:00 - 21:30\nSamstag 13:00 - 18:00\nSonntag 09:00 - 15:00"},{"t":"Stoffwechselanalyse / Coaching","cat":"Training","prev":"Stark, dass du dein Stoffwechsel-Coaching bei uns gebucht hast! Damit alles reibungslos läuft,…","body":"Stark, dass du dein Stoffwechsel-Coaching bei uns gebucht hast! Damit alles reibungslos läuft, findest du hier die wichtigsten Infos.\n\nVorbereitung (sehr wichtig!)\n\n- Mindestens 2 Stunden vor dem Termin nichts essen\n- Keine süßen Getränke (Säfte, Softdrinks, Energy-Drinks, Kaffee/Tee mit Zucker)\n- Wasser ist erlaubt – trink gern ausreichend!\n- Komm ausgeruht und vermeide intensives Training direkt davor\n\nOrt\n\nFit-Inn Trier, Auf Hirtenberg 8, 54296 Trier\n\nWichtig\n\nDamit wir deine Analyse durchführen können, musst du dich in der uVida App registrieren!\n\nMehr Infos\n\nAlle Details zum Ablauf & Nutzen findest du unter: fit-inn-trier.de/stoffwechsel-coaching"},{"t":"Technogym App – Dein smarter Begleiter im Fit-Inn Trier","cat":"Training","prev":"Die Technogym App ist mehr als nur eine Trainings-App – sie ist dein digitaler Coach, dein…","body":"Die Technogym App ist mehr als nur eine Trainings-App – sie ist dein digitaler Coach, dein Motivator und dein persönliches Fitness-Tagebuch in einem! Egal ob im Studio oder zuhause – mit der App bist du immer auf dem neuesten Stand und kannst dein Training gezielt und effizient gestalten.\n\nCoach – Dein digitaler Trainingsbegleiter\n\nQR-Code Anmeldung: Oben rechts in der App findest du den QR-Code Scanner. Damit kannst du dich direkt an unseren Geräten anmelden – schnell, kontaktlos und smart!\n\nDein Trainingsplan: Unter \"Coach\" findest du deinen individuellen Trainingsplan. Hier kannst du deinen Plan einsehen, Übungen starten, Fortschritte dokumentieren und den Plan bei Bedarf anpassen.\n\nAktuelles Training im Blick: Hier siehst du dein momentan laufendes Training. Mit einem Klick siehst du, welche Übungen du bereits abgeschlossen hast.\n\nIm Fokus: Spannende Gesundheitsartikel rund um Ernährung, Training, Motivation & Lifestyle – direkt in der App.\n\nFeedback & Support: Du brauchst Hilfe oder möchtest Feedback geben? Direkt in der App kannst du uns schreiben. Wir sind für dich da!"},{"t":"Probetraining im Fit-Inn Trier","cat":"Mitgliedschaft","prev":"Du möchtest unser familiäres Fitnessstudio Fit-Inn Trier unverbindlich kennenlernen? Ein…","body":"Du möchtest unser familiäres Fitnessstudio Fit-Inn Trier unverbindlich kennenlernen? Ein Probetraining ist der perfekte Einstieg, um unsere moderne Ausstattung und die persönliche Atmosphäre vor Ort zu erleben.\n\nDer Weg zu deinem ersten Training\n\nDamit wir uns Zeit für dich nehmen können, ist eine vorherige Anmeldung wichtig. Im Buchungsprozess hast du die Wahl zwischen zwei Optionen: Entscheide dich für ein Training mit professioneller Begleitung, bei dem dich unsere qualifizierten Trainer in die Geräte einweisen und einen ersten individuellen Trainingsplan erstellen (ab 16 Jahren). Alternativ kannst du dich für ein eigenständiges Probetraining ohne Trainer entscheiden (ab 18 Jahren).\n\nDeine Checkliste: Was in die Sporttasche gehört\n\n- Sportbekleidung: Bequeme Kleidung, in der du dich gut bewegen kannst.\n- Sportschuhe: Saubere Hallenschuhe, die ausschließlich im Studio getragen werden.\n- Handtuch: Ein großes Handtuch zur Unterlage an den Geräten (Pflicht aus Hygienegründen).\n- Getränk: Nimm dir etwas Wasser oder ein Sportgetränk mit, um hydriert zu bleiben.\n\nWas dich beim Probetraining erwartet\n\nSobald du im Studio „Auf Hirtenberg 8\" ankommst, empfängt dich unser Team herzlich. Wir zeigen dir unsere modernen Räumlichkeiten, die Umkleiden und unsere verschiedenen Trainingszonen. Während des Trainings kannst du unsere innovativen Technogym-Geräte, den Biocircuit oder unseren großzügigen Freihantelbereich testen.\n\nBei Fragen erreichst du uns während unserer Öffnungszeiten im Studio oder per E-Mail unter info@fit-inn-trier.de."},{"t":"Cardio Entertainment","cat":"Training","prev":"Willkommen im Fit-Inn Trier, deinem familiären Fitnessstudio. Unsere hochmodernen…","body":"Willkommen im Fit-Inn Trier, deinem familiären Fitnessstudio. Unsere hochmodernen Cardio-Geräte von TechnoGym sind mit der digitalen Benutzeroberfläche Technogym Live ausgestattet, die dir vielfältige Trainingsmöglichkeiten bietet.\n\nTechnogym Sessions – Dein virtuelles Training\n\nWähle aus einer Vielzahl von Technogym Sessions, die speziell auf deine persönlichen Ziele zugeschnitten sind. Ein virtueller Trainer führt dich durch individuelle Trainingseinheiten, gibt dir Anweisungen und schlägt dir passende Intensitätslevel vor.\n\nRoutinen – Vielfältige Bewegungsabläufe\n\nUnsere Routinen bestehen aus einer Reihe von Bewegungsabläufen, bei denen die Intensität automatisch vom Gerät angepasst wird. Du erhältst Schritt-für-Schritt-Anleitungen per Video oder als Pop-up-Nachricht.\n\nOutdoor-Umgebungen\n\nLass dich während deines Workouts von atemberaubenden natürlichen und urbanen Landschaften verzaubern und trainiere in verschiedenen virtuellen Outdoor-Umgebungen.\n\nEntertainment während des Trainings\n\nUnsere Geräte bieten die Möglichkeit, während des Workouts deine Lieblingsserien oder TV-Programme auf dem HD-Bildschirm zu schauen, Playlists abzuspielen oder im Internet zu surfen."},{"t":"Hausordnung des Fit-Inn Trier","cat":"Studio","prev":"1. Anerkennung der Hausordnung","body":"1. Anerkennung der Hausordnung\n\nMit dem Betreten des Fit-Inn Trier wird diese Hausordnung ausdrücklich anerkannt. Ein Verstoß kann zum Ausschluss von der Nutzung des Studios führen. Die Verpflichtung zur Zahlung der vereinbarten Beiträge bleibt bestehen.\n\n2. Haftung\n\nDas Fit-Inn Trier übernimmt keine Haftung für Diebstahl sowie Sach-, Personen- und Vermögensschäden jeglicher Art. Jeder Aufenthalt erfolgt auf eigene Gefahr.\n\n3. Eltern haften für ihre Kinder\n\nKinder dürfen sich nicht unbeaufsichtigt im Studio aufhalten oder mit Trainingsgeräten in Kontakt kommen.\n\n4. Verhaltensregeln\n\nRespektiere andere Mitglieder und unser Team. Halte die Privatsphäre in den Umkleiden ein. Vermeide störendes Verhalten.\n\n5. Umkleiden und Verwahrung\n\nVerwahre deine persönlichen Gegenstände in den vorgesehenen Schließfächern. Für Verluste übernimmt das Studio keine Haftung.\n\n6. Sauberkeit\n\nHinterlasse alle Bereiche sauber und ordentlich. Im Nassbereich bitten wir um das Tragen von Badeschuhen.\n\n7. Sportbekleidung\n\nTrage geeignete Sportbekleidung und saubere Sportschuhe. Ein Handtuch ist bei der Nutzung der Geräte Pflicht.\n\n8. Mobiltelefone und Kameras\n\nTelefonieren im Trainingsbereich ist nicht gestattet. Filmen und Fotografieren sind zum Schutz der Privatsphäre streng verboten.\n\n9. Rauchen und Substanzen\n\nIm gesamten Studio herrscht Rauchverbot. Der Besitz oder Konsum illegaler Substanzen ist verboten.\n\n10. Änderungen der Hausordnung\n\nDas Fit-Inn Trier behält sich das Recht vor, die Hausordnung jederzeit zu ändern."},{"t":"Kurse","cat":"Training","prev":"Im Fit-Inn Trier setzen wir auf ein individuelles und effektives Training – und das bedeutet…","body":"Im Fit-Inn Trier setzen wir auf ein individuelles und effektives Training – und das bedeutet für uns: keine festen Kurse, sondern 100 % Flexibilität und persönliche Betreuung!\n\nWarum verzichten wir auf Gruppenkurse?\n\nViele Fitnessstudios bieten Gruppenkurse an – doch oft sind diese nicht optimal auf die individuellen Ziele und Bedürfnisse der Teilnehmer abgestimmt. Unser Ansatz ist anders:\n\n- Individuelle Betreuung statt Massenabfertigung: Wir unterstützen dich persönlich, optimieren deine Technik und behalten deine Fortschritte im Blick.\n- Flexibilität statt Zeitdruck: Feste Kurszeiten passen nicht in jeden Alltag. Bei uns trainierst du, wann es dir passt.\n- Nachhaltiger Erfolg: Wir helfen dir, ein maßgeschneidertes Trainingsprogramm zu erstellen, das wirklich zu deinen Zielen passt.\n\nUnser Konzept: Dein individuelles Training!\n\n- Persönliche Trainingspläne – maßgeschneidert auf deine Ziele\n- 1:1 Betreuung durch erfahrene Trainer\n- Trainingsfreiheit – du bestimmst Tempo, Intensität und Zeiten\n\nBei uns bist du keine Nummer in einem überfüllten Kurs, sondern ein wertgeschätztes Mitglied unserer Trainingsfamilie."},{"t":"Mitgliedschaft pausieren","cat":"Mitgliedschaft","prev":"In bestimmten Situationen kann es vorkommen, dass du deine Mitgliedschaft pausieren möchtest –…","body":"In bestimmten Situationen kann es vorkommen, dass du deine Mitgliedschaft pausieren möchtest – sei es aufgrund von Krankheit, Operationen, Reha-Terminen oder anderen Gründen.\n\nWelche Gründe gibt es für eine Pausierung?\n\nDie häufigsten Gründe sind Krankheit, Operationen oder Reha-Termine. Aber auch andere Gründe können eine Pausierung notwendig machen.\n\nWas benötige ich für eine Pausierung?\n\nUm deine Mitgliedschaft zu pausieren, benötigst du einen Nachweis von deinem behandelnden Arzt. Darin muss erkennbar sein, aus welchem Grund und in welchem Zeitraum die Pausierung erfolgen soll.\n\nWie lange kann ich pausieren?\n\nIn der Regel ist eine Pausierung für einen Zeitraum von bis zu sechs Wochen möglich. Sollte eine längere Pausierung notwendig sein, bitten wir dich, dies persönlich mit uns zu besprechen.\n\nWie pausiere ich?\n\nLass uns den ärztlichen Nachweis zukommen – persönlich im Studio, per E-Mail oder per Post. Wir bearbeiten die Pausierung, sobald uns der Nachweis vorliegt.\n\nWas passiert während der Pausierung?\n\nDeine Mitgliedschaft ruht: Du zahlst keine Beiträge und kannst nicht trainieren. Nach Ende der Pausierung wird deine Mitgliedschaft automatisch wieder aktiviert. Eine vorzeitige Beendigung der Pause ist auf Wunsch jederzeit möglich – kontaktiere uns einfach."},{"t":"Kündigungsbedingungen","cat":"Mitgliedschaft","prev":"Im Fit-Inn Trier legen wir großen Wert auf Transparenz und Fairness. Unsere…","body":"Im Fit-Inn Trier legen wir großen Wert auf Transparenz und Fairness. Unsere Kündigungsbedingungen sind klar und einfach gestaltet.\n\nVerträge, die vor dem 1. März 2022 abgeschlossen wurden\n\nDie Kündigungsfrist beträgt gemäß den damaligen Vertragsbedingungen in der Regel drei Monate zum Ende der vereinbarten Laufzeit. Erfolgt keine fristgerechte Kündigung, verlängert sich der Vertrag automatisch um weitere zwölf Monate. Die Kündigung muss in Textform erfolgen.\n\nVerträge, die nach dem 1. März 2022 abgeschlossen wurden\n\nHier gilt eine Kündigungsfrist von vier Wochen zum Ende der vereinbarten Laufzeit. Erfolgt keine fristgerechte Kündigung, verlängert sich der Vertrag auf unbestimmte Zeit und kann dann jederzeit mit einer Frist von einem Monat gekündigt werden.\n\nWichtiger Hinweis\n\nMaßgeblich ist immer das, was individuell in deinem Vertrag vereinbart wurde. Wir empfehlen dir, deinen persönlichen Vertrag sowie die geltenden AGB sorgfältig zu prüfen."},{"t":"Was tun, wenn ein Mitglied verstorben ist?","cat":"Mitgliedschaft","prev":"Der Verlust eines geliebten Menschen ist immer eine schwere Zeit. Wir möchten Ihnen in dieser…","body":"Der Verlust eines geliebten Menschen ist immer eine schwere Zeit. Wir möchten Ihnen in dieser Situation zur Seite stehen und helfen, die notwendigen Schritte zu unternehmen.\n\nBenachrichtigung\n\nBitte informieren Sie uns über den Verlust – über das Kontaktformular auf unserer Website oder per E-Mail an info@fit-inn-trier.de. Geben Sie dabei den Namen des verstorbenen Mitglieds an und fügen Sie eine Kopie des Totenscheins bei.\n\nKündigung des Vertrags\n\nWir kündigen den Vertrag des verstorbenen Mitglieds. Bitte teilen Sie uns dies in Ihrer Benachrichtigung mit.\n\nRückerstattung von Beiträgen\n\nWurden bereits Beiträge für kommende Monate gezahlt, erstatten wir diese selbstverständlich zurück. Bitte geben Sie uns hierfür Ihre Bankverbindung an.\n\nUnser herzliches Beileid gilt Ihnen und Ihrer Familie.\n\nIn tiefer Trauer, das Team von Fit-Inn Trier"},{"t":"Vertrag kündigen","cat":"Mitgliedschaft","prev":"Wenn du deinen Vertrag bei Fit-Inn Trier kündigen möchtest, gibt es verschiedene Möglichkeiten.","body":"Wenn du deinen Vertrag bei Fit-Inn Trier kündigen möchtest, gibt es verschiedene Möglichkeiten.\n\nPer Post\n\nSende einen Brief an: Fit-Inn Trier, Auf Hirtenberg 8, 54296 Trier. Bitte gib deinen Namen, deine Mitgliedsnummer (sofern bekannt) und das gewünschte Kündigungsdatum an. Wir empfehlen den Versand per Einschreiben.\n\nPer E-Mail\n\nSende eine E-Mail an info@fit-inn-trier.de mit Namen, Mitgliedsnummer und Kündigungsdatum.\n\nOnline\n\nAm einfachsten kündigst du direkt hier im Mitgliederbereich unter „Vertrag & Kündigung\" – dort siehst du dein nächstmögliches Kündigungsdatum und wirst Schritt für Schritt geführt. Alternativ über das Formular auf fit-inn-trier.de/vertrag-kuendigen.\n\nWir bestätigen den Erhalt und das Ende der Laufzeit deines Vertrags. Eine Kündigung ist immer zum Ende der vereinbarten Laufzeit möglich."},{"t":"Biostrength Trainingsgeräte","cat":"Training","prev":"Unsere Biostrength-Geräte im Fit-Inn Trier bieten dir eine Vielzahl fortschrittlicher…","body":"Unsere Biostrength-Geräte im Fit-Inn Trier bieten dir eine Vielzahl fortschrittlicher Trainingsprogramme, die speziell entwickelt wurden, um deine Fitnessziele effektiv zu erreichen.\n\nStandardprogramme\n\n- Hypertrophie (Muskelaufbau): Förderung des Muskelwachstums durch Erhöhung der Last in der exzentrischen Phase.\n- Power (Explosivkraft): Steigerung der explosiven Kraft durch trägheitsfreien Widerstand.\n- Strong (Kraftsteigerung): Erhöhung der maximalen Kraftleistung durch viskösen Widerstand.\n- Tone (Muskelstraffung): Verbesserung der Muskeldefinition durch elastischen Widerstand.\n\nBenutzerdefinierte Programme (für Fortgeschrittene)\n\n- Pyramide: Gewicht nach jedem Satz steigern, Wiederholungen reduzieren.\n- Drop Set: Mit hohem Gewicht starten und schrittweise reduzieren.\n- Tone Express: Kompaktes Programm zur Verbesserung des Muskeltonus.\n- Super Slow: Übungen sehr langsam ausführen für maximale Beanspruchung.\n- Contrast: Sätze mit hohem und niedrigem Widerstand kombinieren.\n- Rest Pause: Satz bis zur Erschöpfung, kurze Pause, weitere Wiederholungen.\n\nUnsere Biostrength-Geräte nutzen Künstliche Intelligenz, um dein Training kontinuierlich zu überwachen und anzupassen – effizient und sicher."},{"t":"Tarife & Preise","cat":"Abrechnung","prev":"Drei Tarife – Flex, Basic und Premium. Je länger die Laufzeit, desto günstiger dein Wochenbeitrag.","body":"Bei uns trainierst du zu fairen, transparenten Konditionen. Du hast die Wahl zwischen drei Tarifen – je länger die Laufzeit, desto günstiger dein Wochenbeitrag.\n\nUnsere Tarife\n\n- Flex (4 Wochen Laufzeit): 15 € pro Woche\n- Basic (52 Wochen Laufzeit): 12 € pro Woche\n- Premium (104 Wochen Laufzeit): 9 € pro Woche – unser beliebtester Tarif\n\nStudentenrabatt\n\nMit gültigem Nachweis sparst du in jedem Tarif 3 € pro Woche (Flex 12 €, Basic 9 €, Premium 6 € pro Woche).\n\nWas ist immer inklusive?\n\n- Komplette Nutzung des Clubs\n- Cardio Entertainment\n- Mineralgetränke\n- Trainingspläne\n- TechnoGym App\n- WLAN\n- Gesundheits-Check-up\n\nGebühren & Abrechnung\n\nEinmalig fällt eine Aktivierungsgebühr von 39 € an. Für Rückkehrer entfällt diese – als ehemaliges Mitglied sparst du die Aktivierungsgebühr beim Wiedereinstieg. Die Beiträge werden alle zwei Wochen per SEPA-Lastschrift eingezogen. Alle Preise verstehen sich inklusive der gesetzlichen Mehrwertsteuer.\n\nLaufzeit & Kündigung\n\nDie Kündigungsfrist beträgt 4 Wochen zum Ende der vereinbarten Laufzeit. Deinen Vertrag schließt du bequem online ab und verwaltest ihn jederzeit hier im Mitgliederbereich."},{"t":"Mitglied werden & Anmeldung","cat":"Mitgliedschaft","prev":"In wenigen Minuten online Mitglied werden – ganz ohne Papierkram.","body":"Du möchtest bei uns durchstarten? Deine Mitgliedschaft schließt du in wenigen Minuten bequem online ab – ganz ohne Papierkram.\n\nSo wirst du Mitglied\n\n1. Optional vorab ein kostenloses Probetraining buchen und uns kennenlernen.\n2. Wunschtarif wählen (Flex, Basic oder Premium).\n3. Persönliche Daten und Bankverbindung (IBAN für das SEPA-Lastschriftmandat) angeben.\n4. Fertig – du erhältst alle Unterlagen per E-Mail und kannst sofort loslegen.\n\nWas du brauchst\n\nDeine persönlichen Daten und eine gültige IBAN. Den Vertrag bestätigst du digital.\n\nMindestalter\n\nEine Mitgliedschaft ist ab 16 Jahren möglich. Minderjährige benötigen das Einverständnis bzw. die Unterschrift der Erziehungsberechtigten.\n\nWiderrufsrecht\n\nSchließt du deinen Vertrag online ab, hast du ein gesetzliches Widerrufsrecht von 14 Tagen. Den Widerruf kannst du direkt hier im Mitgliederbereich unter „Vertragsverwaltung\" mit wenigen Klicks erklären."},{"t":"Beitragszahlung & SEPA-Lastschrift","cat":"Abrechnung","prev":"Deine Beiträge ziehen wir alle zwei Wochen per SEPA-Lastschrift ein.","body":"Deine Beiträge ziehen wir bequem und automatisch per SEPA-Lastschrift ein.\n\nWie wird abgebucht?\n\nDie Beiträge werden alle zwei Wochen (14-tägig) von dem von dir hinterlegten Konto eingezogen. Alle Beträge enthalten die gesetzliche Mehrwertsteuer.\n\nBankverbindung ändern\n\nDeine IBAN kannst du jederzeit selbst hier im Mitgliederbereich unter „Meine Daten\" aktualisieren. Die Änderung wird zeitnah für den nächsten Einzug übernommen.\n\nGeplatzte Lastschrift\n\nKann eine Lastschrift nicht eingezogen werden (z. B. mangels Deckung oder bei falscher bzw. abgelaufener Bankverbindung), fällt eine Rücklastschriftgebühr an, und wir melden uns bei dir, um die Sache schnell zu klären. Bitte halte deine Bankdaten daher immer aktuell, um zusätzliche Kosten zu vermeiden.\n\nFragen zur Abrechnung?\n\nMeld dich einfach über das Kontaktformular oder unter info@fit-inn-trier.de – wir helfen dir gerne weiter."},{"t":"Geschenkgutscheine","cat":"Mitgliedschaft","prev":"Verschenke Fitness – Geschenkgutscheine fürs Fit-Inn Trier gibt es bei uns im Studio.","body":"Du möchtest jemandem Fitness und Gesundheit schenken? Mit einem Geschenkgutschein fürs Fit-Inn Trier liegst du immer richtig.\n\nWo bekomme ich einen Gutschein?\n\nGeschenkgutscheine erhältst du direkt bei uns im Studio. Sprich uns einfach an der Theke an oder kontaktiere uns vorab telefonisch unter 0651 308524 oder per E-Mail an info@fit-inn-trier.de.\n\nWofür kann der Gutschein genutzt werden?\n\nGerne beraten wir dich persönlich, welche Möglichkeiten es gibt – vom Probetraining bis zu unseren Coaching-Angeboten."},{"t":"Unsere Trainingsbereiche & Geräte","cat":"Training","prev":"Über 100 Geräte auf modernster Technik – von Cardio über Freihantel bis Biocircuit.","body":"Bei uns trainierst du auf über 100 hochmodernen Geräten der Top-Marken TechnoGym, LifeFitness und Hammer Strength – plus InBody-Körperanalyse.\n\nUnsere Bereiche\n\n- Cardio mit Technogym Live: Laufbänder, Bikes & Co. mit virtuellem Coach, Outdoor-Welten und Entertainment auf dem Bildschirm.\n- Freihantel & Power: zwei Freihantelzonen, Plate-Loaded-Geräte und moderner Kabelzug für effektives Krafttraining.\n- Biostrength: KI-gestützte Kraftgeräte für bis zu 30 % mehr Resultate in kürzerer Zeit.\n- Biocircuit: automatisiertes Zirkeltraining, das dich Schritt für Schritt von Gerät zu Gerät führt.\n\nIndividuell statt Massenabfertigung\n\nFeste Gruppenkurse gibt es bei uns bewusst nicht – stattdessen setzen wir auf individuelle Trainingspläne und persönliche Betreuung, damit du flexibel und effektiv trainierst. Deinen Plan steuerst du komfortabel über die TechnoGym App.\n\nNoch nicht sicher, wie die Geräte funktionieren? Unser Team weist dich gerne ein."},{"t":"Personal Training","cat":"Training","prev":"Noch gezielter ans Ziel – mit individueller 1:1-Betreuung.","body":"Du möchtest noch gezielter und schneller ans Ziel? Mit unserem Personal Training bekommst du individuelle 1:1-Betreuung, die genau auf dich, deinen Trainingsstand und deine Ziele abgestimmt ist.\n\nWas dich erwartet\n\n- Persönliche Betreuung durch erfahrene Trainer\n- Maßgeschneiderter Trainingsplan und Technik-Optimierung\n- Mehr Motivation und Verbindlichkeit\n\nInteresse?\n\nSprich uns einfach im Studio an oder kontaktiere uns – wir informieren dich gerne über Ablauf und Konditionen und finden gemeinsam das passende Paket für dich."},{"t":"Zutritt ins Studio & Trainingszeiten","cat":"Studio","prev":"So kommst du rein – und wann du trainieren kannst.","body":"Hier erfährst du, wie du ins Studio kommst und wann Training möglich ist.\n\nZutritt\n\nDen Zutritt erhältst du aktuell über deinen persönlichen Chip bzw. Transponder. Ein zusätzlicher Zutritt per QR-Code über die TechnoGym App ist in Vorbereitung.\n\nWann kann ich trainieren?\n\nTrainieren kannst du während unserer Öffnungszeiten:\n\nMontag 09:30 - 13:00 | 15:00 - 21:30\nDienstag 09:30 - 13:00 | 15:00 - 21:30\nMittwoch 09:30 - 13:00 | 15:00 - 21:30\nDonnerstag 09:30 - 13:00 | 15:00 - 21:30\nFreitag 09:30 - 13:00 | 15:00 - 21:30\nSamstag 13:00 - 18:00\nSonntag 09:00 - 15:00\n\nBitte beachte: Mo–Fr ist von 13:00 bis 15:00 Uhr geschlossen. Ein personalfreies Training außerhalb der Öffnungszeiten ist derzeit nicht möglich – während der gesamten Öffnungszeiten ist unser Team für dich da.\n\nDie aktuelle Studio-Auslastung in Echtzeit siehst du jederzeit online, damit du die ruhigsten Zeiten für dein Training findest."},{"t":"Ausstattung & Services vor Ort","cat":"Studio","prev":"Duschen, Schließfächer, kostenlose Parkplätze, WLAN & Mineralgetränke – alles da.","body":"Damit du dich bei uns rundum wohlfühlst, ist vor Ort alles dabei, was du fürs Training brauchst.\n\nUmkleiden & Hygiene\n\nSaubere Umkleiden und Duschen stehen dir kostenlos zur Verfügung. Für deine Wertsachen gibt es abschließbare Schließfächer – ein Schloss wird gestellt, du musst also kein eigenes mitbringen. Denk bitte an dein Handtuch (Pflicht an den Geräten) und saubere Hallenschuhe.\n\nVerpflegung\n\nKostenlose Mineralgetränke sind in deiner Mitgliedschaft inklusive – so bleibst du während des Workouts hydriert.\n\nWLAN\n\nKostenloses WLAN steht dir im gesamten Studio offen zur Verfügung.\n\nParken\n\nKostenlose Parkplätze findest du direkt am Studio – so startest du entspannt ins Training.\n\nWas wir nicht haben\n\nEinen Sauna-/Wellnessbereich und ein Solarium bieten wir aktuell nicht an. Hunde dürfen aus Hygienegründen leider nicht mit ins Studio.\n\nNoch Fragen? Wir helfen dir gerne – über das Kontaktformular, telefonisch unter 0651 308524 oder per E-Mail an info@fit-inn-trier.de."}];

  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function readMin(body){ var w=String(body||'').trim().split(/\s+/).length; return Math.max(1,Math.round(w/180))+' Min. Lesezeit'; }
  function parseBody(body){
    return String(body||'').split(/\n{2,}/).map(function(b,i){
      var lines=b.split('\n');
      var allNum=lines.length>=1&&lines.every(function(l){return /^\s*\d+[.)]\s+/.test(l);});
      var allBul=lines.length>=1&&lines.every(function(l){return /^\s*[-•]\s+/.test(l);});
      if(i===0) return {type:'lead',text:b};
      if(allNum) return {type:'steps',items:lines.map(function(l){return l.replace(/^\s*\d+[.)]\s+/,'');})};
      if(allBul) return {type:'bullets',items:lines.map(function(l){return l.replace(/^\s*[-•]\s+/,'');})};
      if(lines.length===1 && b.length<=52) return {type:'h',text:b};
      return {type:'p',text:b};
    });
  }

    if(S.helpCat&&S.helpCat!=='all') return arr.filter(function(o){return o.a.cat===S.helpCat;});
    if(S.helpShowAll) return arr;
    var pop=arr.filter(function(o){return HELP_POPULAR.indexOf(o.a.t)>=0;});

    helpContactSend:function(){ var email=val('ct_email'); var msg=val('ct_msg'); var topic=''; var sel=$('ct_topic'); if(sel) topic=sel.value||'';
      if(!msg){ setS({ctErr:'Bitte beschreibe kurz dein Anliegen.'}); return; }
      setQuiet({ctBusy:true,ctErr:''});
      api('/api/member/contact',{method:'POST',body:JSON.stringify({action:'send',question:S.aiAsked||'',message:msg,email:email,answer:S.aiAnswer||'',topic:topic})})
        .then(function(d){ if(d&&d.ok){ setS({ctBusy:false,ctSent:true,ctMsgServer:d.message||''}); } else { setS({ctBusy:false,ctErr:(d&&d.message)||'Übermittlung fehlgeschlagen – bitte später erneut.'}); } })
        .catch(function(){ setS({ctBusy:false,ctErr:'Es ist ein Fehler aufgetreten. Bitte später erneut.'}); }); },
    // postfach
    pfFilter:function(a){ setQuiet({pfFilter:a}); },
    pfOpen:function(a){ var arr=DATA.inbox||[]; for(var k=0;k<arr.length;k++){ if(String(arr[k].id)===String(a)){ arr[k].unread=false; break; } }
      setS({pfSel:a,pfThread:true,pfErr:'',pfDraft:''});
      api('/api/member/inbox?id='+encodeURIComponent(a)).catch(function(){}); },
    pfBack:function(){ setS({pfThread:false}); },
    pfReply:function(a){ var t=(val('pf_reply')||'').trim(); if(!t){ setS({pfErr:'Bitte gib eine Nachricht ein.'}); return; }
      S.pfDraft=t; setQuiet({pfBusy:true,pfErr:''});
      api('/api/member/inbox',{method:'POST',body:JSON.stringify({action:'reply',id:a,text:t})})
        .then(function(d){ if(d&&d.ok&&d.vorgang){ updateVorgang(d.vorgang); setS({pfBusy:false,pfDraft:''}); } else { setS({pfBusy:false,pfErr:(d&&d.message)||'Senden fehlgeschlagen – bitte später erneut.'}); } })
        .catch(function(){ setS({pfBusy:false,pfErr:'Es ist ein Fehler aufgetreten. Bitte später erneut.'}); }); },
    pfConfirm:function(a){ setQuiet({pfBusy:true,pfErr:''});
      api('/api/member/inbox',{method:'POST',body:JSON.stringify({action:'reply',id:a,text:'Bestätigt.'})})
        .then(function(d){ if(d&&d.ok&&d.vorgang) updateVorgang(d.vorgang); setS({pfBusy:false}); })
        .catch(function(){ setS({pfBusy:false}); }); },
    pfResolve:function(a){ api('/api/member/inbox',{method:'POST',body:JSON.stringify({action:'resolve',id:a})})
        .then(function(d){ if(d&&d.ok&&d.vorgang) updateVorgang(d.vorgang); setS({}); }).catch(function(){}); }
  };
  function startPause(){ S.cancelStep=0; S.pauseDone=false; S.pauseStep=1; S.pauseReason=''; S.pauseReasonText=''; S.pausePhoto=''; S.pausePhotoName=''; S.pauseFrom=isoToday(); if(!S.pauseWeeks)S.pauseWeeks=6; setS({}); }
  function doOffer(offer){ setQuiet({busy:true});
    var extra = offer==='pause' ? (S.pauseWeeks+' Wochen Pause') : '';
    api('/api/member/cancel',{method:'POST',body:JSON.stringify({action:'offer_accepted',offer:offer,reason:(S.cancelReason||'—')+(extra?(' · '+extra):'')})})
      .then(function(){ setS({busy:false,offerDone:offer,pauseStep:0,cancelStep:0}); }).catch(function(){ setS({busy:false,offerDone:offer,pauseStep:0,cancelStep:0}); }); }
  function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function(){}); }
  function downloadCsv(){ var list=ciCurrent(); var rows=[['Datum','Uhrzeit','Dauer','Studio']].concat(list.map(function(c){return [c.in?c.in.slice(0,10):'',deTime(c.in),dur(c.in,c.out),c.studio||''];}));
    var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
    var a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='checkin-verlauf.csv'; document.body.appendChild(a); a.click(); a.remove(); }
  function logoTxt(doc,M){ doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('FIT-INN TRIER',M,17); }
  function buildPdfDoc(){
    var ns=window.jspdf; if(!ns||!ns.jsPDF){ return null; }
    var p=DATA.profile||{}; var list=ciCurrent().slice().sort(function(a,b){return new Date(b.in)-new Date(a.in);});
    var doc=new ns.jsPDF({unit:'mm',format:'a4'}); var W=210, M=14;
    doc.setFillColor(10,73,88); doc.rect(0,0,W,26,'F');
    var lh=11, lw=lh*(LOGO_RATIO||3.6); if(lw>72) lw=72;
    if(LOGO_DATAURL){ try{ doc.addImage(LOGO_DATAURL,'PNG',M,8,lw,lh); }catch(e){ logoTxt(doc,M); } } else logoTxt(doc,M);
    doc.setTextColor(21,23,27); doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('Anwesenheitsbestätigung',M,40);
    var y=50; doc.setFontSize(11);
    [['Name',p.lastName],['Vorname',p.firstName],['Mitgliedsnummer',p.customerNumber],['Geburtsdatum',deDateFull(p.dateOfBirth)],['Zeitraum',ciRangeLabel()]].forEach(function(r){ doc.setFont('helvetica','bold'); doc.setTextColor(60,66,72); doc.text(r[0]+':',M,y); doc.setFont('helvetica','normal'); doc.setTextColor(21,23,27); doc.text(String(r[1]||'—'),62,y); y+=7; });
    y+=3; doc.setFont('helvetica','normal'); doc.setTextColor(60,66,72); doc.setFontSize(10.5);
    var intro='Hiermit bestätigt das Fit-Inn Trier, dass das oben genannte Mitglied an den folgenden Terminen im Studio anwesend war:';
    var lines=doc.splitTextToSize(intro,W-2*M); doc.text(lines,M,y); y+=lines.length*5.5+6;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(21,23,27);
    doc.text('Datum',M,y); doc.text('Uhrzeit',74,y); doc.text('Dauer',104,y); doc.text('Studio',132,y);
    y+=2; doc.setDrawColor(210); doc.line(M,y,W-M,y); y+=5;
    doc.setFont('helvetica','normal'); doc.setTextColor(60,66,72);
    if(!list.length){ doc.text('Keine Besuche vorhanden.',M,y); y+=6; }
    list.forEach(function(c){ if(y>284){ doc.addPage(); y=20; } doc.text(deDateFull(c.in),M,y); doc.text(deTime(c.in)+' Uhr',74,y); doc.text(dur(c.in,c.out)||'-',104,y); doc.text(String(c.studio||'').slice(0,28),132,y); y+=6; });
    y+=8; if(y>290){ doc.addPage(); y=20; } doc.setFontSize(8.5); doc.setTextColor(150); doc.text('Ausgestellt am '+todayStr()+'  ·  Fit-Inn Trier  ·  Auf Hirtenberg 8  ·  54296 Trier  ·  '+list.length+' Besuche',M,Math.min(y,293));
    return doc;
  }
  function downloadPdf(){ var d=buildPdfDoc(); if(d) d.save('anwesenheitsbestaetigung.pdf'); else downloadCsv(); }
  function emailPdf(){
    var d=buildPdfDoc(); if(!d){ setS({dlMsg2:'PDF-Bibliothek lädt noch – bitte kurz erneut.'}); return; }
    var b64=d.output('datauristring'); var ix=b64.indexOf('base64,'); if(ix>=0) b64=b64.slice(ix+7);
    if(b64.length>6000000){ setS({dlMsg2:'Das PDF ist für den Versand zu groß – bitte wähle oben einen kürzeren Zeitraum.'}); return; }
    setQuiet({emailing:true, dlMsg2:''});
    api('/api/member/checkin-pdf',{method:'POST',body:JSON.stringify({pdf:b64})})
      .then(function(r){ setS({emailing:false, dlMsg2:(r.message||(r.ok?'Gesendet.':'Versand fehlgeschlagen.'))}); })
      .catch(function(){ setS({emailing:false, dlMsg2:'Versand fehlgeschlagen.'}); });
  }

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var act=el.getAttribute('data-act'); var arg=el.getAttribute('data-arg');
    if(ACT[act]){ e.preventDefault(); ACT[act](arg); }
  });

  // ---- boot ----
  function cleanMlt(){ try{ var u=new URL(window.location.href); var ch=false; ['mlt','go'].forEach(function(k){ if(u.searchParams.has(k)){ u.searchParams.delete(k); ch=true; } }); if(ch) window.history.replaceState({}, document.title, u.pathname+u.search+u.hash); }catch(e){} }
  function magicGo(){ var g=null; try{ g=new URL(window.location.href).searchParams.get('go'); }catch(e){} return (g&&TITLES[g])?g:'home'; }
  function bootMagic(tok){
    S.screen='login'; render();
    var go=magicGo();
    fetch('/api/member/login-magic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,remember:true})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){ cleanMlt(); if(x.ok&&x.j.token){ TOKEN=x.j.token; localStorage.setItem('fi_member_token',TOKEN); localStorage.setItem('fi_remember','1'); return loadMe().then(function(){ loadAppts(); loadPlan(); loadPlanAgg(); loadInbox(); loadPrefs(); if(DATA.checkins===null) loadCheckins(); nav(go); }); } setS({loginErr:(x.j&&x.j.message)||'Der Anmelde-Link ist ungültig oder abgelaufen.'}); })
      .catch(function(){ cleanMlt(); setS({loginErr:'Der Anmelde-Link konnte nicht geprüft werden. Bitte melde dich erneut an.'}); });
  }
  var MLT=null; try{ MLT=new URL(window.location.href).searchParams.get('mlt'); }catch(e){}
  // Face-ID-Sperre: in der eigenen App mit eingerichtetem Face ID NICHT automatisch
  // über den gespeicherten Token einloggen, sondern erst per Biometrie entsperren.
  var inApp=!!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  var bioGate=false; try{ bioGate = inApp && localStorage.getItem('fi_bio')==='1'; }catch(e){}
  ciLoad();
  if(MLT){ bootMagic(MLT); }
  else if(bioGate){ S.screen='login'; render(); }
  else if(TOKEN){ loadMe().then(function(){ loadAppts(); loadPlan(); loadPlanAgg(); loadInbox(); loadPrefs(); if(DATA.checkins===null) loadCheckins(); render(); checkArrival(); }).catch(function(){ logout(); }); }
  else render();

  // Sobald die native Brücke bereit ist: Face ID anbieten (App öffnen -> Face ID -> drin).
  function onNativeReady(){
    // Brücke ist (jetzt) da -> neu zeichnen, damit native-abhängige Elemente
    // (WLAN-Button etc.) erscheinen, auch wenn native.js nach dem ersten Render lud.
    try{ if(S.screen!=='login') render(); }catch(e){}
    // Push-Setup nachholen, falls native.js erst nach dem Login-/Boot-Render kam.
    if(TOKEN){ try{ if(window.FitInnNative && FitInnNative.onAuthed) FitInnNative.onAuthed(TOKEN); }catch(e){} try{ checkArrival(); }catch(e){} }
    if(MLT) return;
    if(S.screen==='login' && window.FitInnNative && FitInnNative.hasBiometricLogin && FitInnNative.hasBiometricLogin()){
      render();
      ACT.faceLogin();
    }
  }
  window.addEventListener('fitinn-native-ready', onNativeReady);
  if(window.FitInnNative && FitInnNative.isNative) onNativeReady();

  // App/Tab wird wieder sichtbar oder erhält Fokus -> Daten automatisch aktualisieren.
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') maybeAutoRefresh(); });
  window.addEventListener('focus', maybeAutoRefresh);
  window.addEventListener('pageshow', function(e){ if(e && e.persisted) maybeAutoRefresh(); });
})();
</script>
