<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Übersicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0}
  body{font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background:transparent;color:#211E1B}
  body.bg-light{background:#eef2f3}
  body.bg-white{background:#fff}

  .hub{max-width:980px;margin:0 auto;padding:clamp(18px,4vw,40px);
    display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.4vw,22px)}

  .tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;
    background:#fffdfb;border-radius:22px;box-shadow:0 12px 32px rgba(4,33,40,.10);padding:34px 24px 30px;
    text-decoration:none;color:inherit;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;
    animation:fiUp .5s cubic-bezier(.22,1,.36,1) both}
  .tile:nth-child(2){animation-delay:.06s}
  .tile:nth-child(3){animation-delay:.12s}
  .tile:hover{transform:translateY(-4px);box-shadow:0 22px 46px rgba(4,33,40,.16)}
  .tile:active{transform:translateY(-1px)}

  .glowCat{position:absolute;width:210px;height:210px;right:-72px;top:-86px;border-radius:50%;
    background:radial-gradient(circle,var(--gr),transparent 70%);pointer-events:none}
  .glowApr{position:absolute;width:185px;height:185px;left:-74px;bottom:-86px;border-radius:50%;
    background:radial-gradient(circle,rgba(246,169,100,.13),transparent 70%);pointer-events:none}

  .chip{position:relative;width:84px;height:84px;border-radius:22px;display:flex;align-items:center;justify-content:center;
    transition:transform .18s ease}
  .tile:hover .chip{transform:scale(1.04)}
  .chip .gloss{position:absolute;inset:0;border-radius:22px;
    background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,0) 46%);pointer-events:none}

  .t{position:relative;font-size:clamp(20px,2.2vw,23px);font-weight:900;letter-spacing:-.6px;line-height:1.05;color:#211E1B;margin-top:22px}
  .acc{position:relative;width:36px;height:4px;border-radius:3px;background:linear-gradient(90deg,#F6A964,#E08C53);margin-top:14px}
  .s{position:relative;font-size:14px;font-weight:600;color:#8B8178;margin-top:12px}

  @keyframes fiUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media(max-width:760px){
    .hub{grid-template-columns:1fr;max-width:430px;gap:14px}
    .tile{padding:28px 24px 26px}
    .chip{width:76px;height:76px;border-radius:20px}
    .chip .gloss{border-radius:20px}
  }
  @media(prefers-reduced-motion:reduce){ .tile{animation:none} }
</style>
</head>
<body>
  <div class="hub">

    <a class="tile" href="/mitglieder" target="_top" aria-label="Zum Mitgliederbereich" style="--gr:rgba(78,134,232,.16)">
      <span class="glowCat"></span><span class="glowApr"></span>
      <div class="chip" style="background:linear-gradient(150deg,#4E86E8,#2C5FB8);box-shadow:0 16px 30px -10px rgba(44,95,184,.55),inset 0 1.5px 1px rgba(255,255,255,.6)">
        <span class="gloss"></span>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2.5"></rect><path d="M9 3.5h6v3H9zM8.5 11l2 2 3.5-3.5M8.5 16h7"></path></svg>
      </div>
      <div class="t">Mitgliederbereich</div>
      <div class="acc"></div>
      <div class="s">Vertrag, Termine &amp; Daten</div>
    </a>

    <a class="tile" href="/" target="_top" aria-label="Zur Live-Auslastung" style="--gr:rgba(142,123,240,.17)">
      <span class="glowCat"></span><span class="glowApr"></span>
      <div class="chip" style="background:linear-gradient(150deg,#8E7BF0,#5B47C9);box-shadow:0 16px 30px -10px rgba(91,71,201,.55),inset 0 1.5px 1px rgba(255,255,255,.6)">
        <span class="gloss"></span>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.2v5l3.4 2"></path></svg>
      </div>
      <div class="t">Studio live</div>
      <div class="acc"></div>
      <div class="s">Auslastung &amp; Öffnungszeiten</div>
    </a>

    <a class="tile" href="/werben" target="_top" aria-label="Freunde werben" style="--gr:rgba(41,179,166,.17)">
      <span class="glowCat"></span><span class="glowApr"></span>
      <div class="chip" style="background:linear-gradient(150deg,#29B3A6,#0F8378);box-shadow:0 16px 30px -10px rgba(15,131,120,.55),inset 0 1.5px 1px rgba(255,255,255,.6)">
        <span class="gloss"></span>
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M3 12.5h18M12 8v13"></path><path d="M12 8C12 8 10 2.5 7.6 4.2 5.9 5.4 8.4 8 12 8z"></path><path d="M12 8c0 0 2-5.5 4.4-3.8C18.1 5.4 15.6 8 12 8z"></path></svg>
      </div>
      <div class="t">Freunde werben</div>
      <div class="acc"></div>
      <div class="s">4 Wochen beitragsfrei</div>
    </a>

  </div>

<script>
  // Hintergrund per URL: ?bg=transparent (Standard) | ?bg=light | ?bg=white
  (function(){
    try{
      var q = new URLSearchParams(location.search), bg = (q.get('bg')||'').toLowerCase();
      if (bg==='light' || bg==='hell') document.body.classList.add('bg-light');
      if (bg==='white' || bg==='weiss') document.body.classList.add('bg-white');
    }catch(e){}
  })();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
