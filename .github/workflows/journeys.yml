name: FINN Journeys

# Durchlauf der WhatsApp-Journeys (Leads, Onboarding, Motivation, Comeback):
# fällige Erinnerungen senden, Mitglieder täglich neu einstufen, Check-in-Historie
# nachziehen. Ohne JOURNEYS=1 (bzw. JOURNEYS_TRACK=1) in Vercel tut der Endpunkt
# nichts und antwortet sofort mit "fertig": true.
#
# Warum mehrere Aufrufe: Reicht die Funktionslaufzeit nicht, antwortet der
# Endpunkt mit "fertig": false und macht beim nächsten Aufruf weiter.
#
# Hinweise:
#  - Geplante Workflows laufen nur auf dem Default-Branch des Repos.
#  - GitHub startet Zeitpläne mit Verzögerung (oft 5–15 Minuten). Für
#    Probetraining-Erinnerungen reicht das; die 2-h-Erinnerung hat Spielraum.
#  - Schutz: Repo-Secret RECORD_SECRET wie bei den übrigen Cron-Jobs.
#  - Manuell mit „vorlagen": WhatsApp-Vorlagen bei Twilio einreichen bzw. den
#    Stand der Freigaben abrufen (statt des Durchlaufs). Die Twilio-Schlüssel
#    bleiben in Vercel; das Protokoll zeigt je Vorlage nur Status und Grund.
#  - Dasselbe per Auftragsdatei .github/journeys-vorlagen.txt: ein Push, der sie
#    ändert, startet den Workflow einmal mit dem Befehl aus ihrer ersten Zeile
#    („einreichen" oder „status"). Für Umgebungen ohne Recht auf manuellen Start.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      vorlagen:
        description: 'WhatsApp-Vorlagen: einreichen oder Status abrufen (leer = normaler Durchlauf)'
        type: choice
        options: ['-', 'einreichen', 'status']
        default: '-'
  push:
    branches: ['claude/push-das-github-12dw6q']
    paths: ['.github/journeys-vorlagen.txt']

concurrency:
  group: journeys
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Auftragsdatei holen
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/journeys-vorlagen.txt
          sparse-checkout-cone-mode: false

      - name: Auftrag bestimmen
        id: auftrag
        env:
          EREIGNIS: ${{ github.event_name }}
          EINGABE: ${{ inputs.vorlagen }}
        run: |
          a=""
          if [ "$EREIGNIS" = "workflow_dispatch" ]; then a="$EINGABE"; fi
          if [ "$EREIGNIS" = "push" ]; then a=$(head -n1 .github/journeys-vorlagen.txt | tr -d '[:space:]'); fi
          echo "Auftrag: ${a:-Durchlauf}"
          case "$a" in
            einreichen) echo "aktion=submit" >> "$GITHUB_OUTPUT" ;;
            status)     echo "aktion=sync" >> "$GITHUB_OUTPUT" ;;
            *)          echo "aktion=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: WhatsApp-Vorlagen
        if: ${{ steps.auftrag.outputs.aktion != '' }}
        env:
          RECORD_SECRET: ${{ secrets.RECORD_SECRET }}
          AKTION: ${{ steps.auftrag.outputs.aktion }}
        run: |
          for i in 1 2 3 4 5; do
            antwort=$(curl -sS -m 90 -X POST "https://anwesend.vercel.app/api/journeys-tick?templates=$AKTION" \
              ${RECORD_SECRET:+-H "Authorization: Bearer $RECORD_SECRET"}) || exit 1
            echo "$antwort" | jq . 2>/dev/null || echo "$antwort"
            case "$antwort" in
              *'"weiter":true'*) echo "Durchgang $i: weiter" ;;
              *) break ;;
            esac
          done
          case "$antwort" in '{"ok":true'*) exit 0 ;; *) exit 1 ;; esac

      - name: Journeys-Durchlauf
        if: ${{ steps.auftrag.outputs.aktion == '' && github.event_name != 'push' }}
        env:
          RECORD_SECRET: ${{ secrets.RECORD_SECRET }}
        run: |
          for i in 1 2 3 4; do
            antwort=$(curl -fsS -m 90 "https://anwesend.vercel.app/api/journeys-tick" \
              ${RECORD_SECRET:+-H "Authorization: Bearer $RECORD_SECRET"}) || exit 1
            case "$antwort" in
              *'"fertig":true'*) echo "Durchgang $i: fertig"; exit 0 ;;
              *) echo "Durchgang $i: weiter" ;;
            esac
          done
          echo "Nach 4 Durchgängen noch nicht fertig – der nächste Lauf macht weiter."
