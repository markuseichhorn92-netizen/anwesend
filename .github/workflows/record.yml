name: Auslastung mitschreiben

# Ruft alle 15 Minuten /api/record auf, damit die typische Auslastung
# ("Stoßzeiten") über die Zeit aufgebaut wird.
#
# Hinweise:
#  - Geplante Workflows laufen nur auf dem Default-Branch des Repos.
#  - GitHub kann geplante Läufe bei hoher Last etwas verzögern — für
#    Durchschnittswerte unkritisch.
#  - Nach 60 Tagen ohne Repo-Aktivität deaktiviert GitHub den Zeitplan;
#    dann im Tab "Actions" einmalig wieder aktivieren.
#  - Optionaler Schutz: Repo-Secret RECORD_SECRET anlegen UND in Vercel
#    dieselbe Env-Variable RECORD_SECRET setzen. Ohne Secret ist der
#    Endpunkt offen (für diesen anonymen Zähl-Zweck unkritisch).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Aktuellen Wert mitschreiben
        env:
          RECORD_SECRET: ${{ secrets.RECORD_SECRET }}
        run: |
          curl -fsS -m 30 "https://anwesend.vercel.app/api/record" \
            ${RECORD_SECRET:+-H "Authorization: Bearer $RECORD_SECRET"}

      - name: Vormerk-Erinnerungen senden
        if: always()
        env:
          RECORD_SECRET: ${{ secrets.RECORD_SECRET }}
        run: |
          curl -fsS -m 30 "https://anwesend.vercel.app/api/plan-remind" \
            ${RECORD_SECRET:+-H "Authorization: Bearer $RECORD_SECRET"}

      - name: Trainingspartner-Erinnerungen & Challenge-Ergebnis
        if: always()
        env:
          RECORD_SECRET: ${{ secrets.RECORD_SECRET }}
        run: |
          curl -fsS -m 30 "https://anwesend.vercel.app/api/social-remind" \
            ${RECORD_SECRET:+-H "Authorization: Bearer $RECORD_SECRET"}
