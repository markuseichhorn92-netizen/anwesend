<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Probetraining buchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:#eef2f3;color:#15171B}
  input,select,button{font-family:inherit}
  ::placeholder{color:#a9b1b6}
  input:focus,select:focus{outline:none;border-color:#0a4958 !important;box-shadow:0 0 0 3px rgba(10,73,88,.12) !important}
  a{-webkit-tap-highlight-color:transparent}
  @keyframes fiUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fiPulse{0%{box-shadow:0 0 0 0 rgba(10,73,88,.30)}70%{box-shadow:0 0 0 10px rgba(10,73,88,0)}100%{box-shadow:0 0 0 0 rgba(10,73,88,0)}}
  .nav .next.ready,.submit.ready{animation:fiPulse 1.3s ease-out 2}

  .topbar{background:#0a4958}
  .topbar .in{max-width:760px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
  .topbar img{height:26px;width:auto;display:block}
  .topbar .addr{font-size:13px;font-weight:600;color:#9fc3ca}

  .wrap{max-width:760px;margin:0 auto;padding:44px 24px 64px}
  .head{text-align:center}
  .badge{display:inline-flex;align-items:center;gap:9px;background:#fff3e8;border:1px solid #f6dcc4;border-radius:100px;padding:8px 16px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#E08C53;display:inline-block}
  .badge span{font-size:12px;font-weight:700;color:#E08C53;letter-spacing:.4px}
  .head h1{margin:18px 0 0;font-size:38px;font-weight:900;letter-spacing:-1px;color:#15171B;line-height:1.1}
  .head p{margin:12px auto 0;max-width:460px;font-size:16px;font-weight:500;color:#5a636a;line-height:1.6}

  .prog{margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .prog .l{font-size:13px;font-weight:800;color:#0a4958;letter-spacing:.2px}
  .prog .r{font-size:13px;font-weight:700;color:#8a8178}
  .track{margin-top:10px;height:7px;border-radius:100px;background:#dce3e4;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#0a4958,#0e6072);border-radius:100px;transition:width .3s ease}

  .card{margin-top:22px;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(10,73,88,.08);padding:34px;animation:fiUp .25s ease}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#E08C53}
  .q{margin-top:6px;font-size:22px;font-weight:900;letter-spacing:-.5px;color:#15171B}
  .sub{margin:8px 0 0;font-size:14px;font-weight:500;color:#6b7780;line-height:1.55}

  .opts{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{text-align:left;padding:20px;border-radius:14px;border:1.5px solid #dce3e4;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:#bcd0d3}
  .opt.sel{border-color:#0a4958;background:#eef5f6}
  .opt .oi{display:flex;align-items:center;gap:14px}
  .opt .ic{width:42px;height:42px;border-radius:11px;background:#f1f6f7;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .opt.sel .ic{background:#dceaec}
  .opt .ol{font-size:15px;font-weight:700;color:#15171B}
  .opt .ot{font-size:16px;font-weight:800;color:#15171B}
  .opt .od{margin-top:4px;font-size:13px;font-weight:500;color:#6b7780;line-height:1.5}

  .info{margin-top:16px;display:flex;gap:11px;background:#fff8ef;border:1px solid #f6e2cb;border-radius:13px;padding:14px 16px}
  .info span{font-size:13px;font-weight:600;color:#8a6a3f;line-height:1.5}

  .days{margin-top:20px;display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
  .days::-webkit-scrollbar{display:none}
  @media(min-width:721px){.days{flex-wrap:wrap;overflow-x:visible}}
  .moredays{margin-top:12px;width:100%;background:#fff;border:1.5px dashed #cbd6d8;color:#0a4958;font-weight:700;font-size:14px;padding:12px;border-radius:12px;cursor:pointer}
  .moredays:hover{border-color:#0a4958;background:#f6fafb}
  .day{flex:0 0 auto;min-width:78px;padding:14px 10px;border-radius:14px;border:1.5px solid #dce3e4;background:#fff;cursor:pointer;text-align:center}
  .day.sel{border-color:#0a4958;background:#0a4958}
  .day .dow{font-size:12px;font-weight:700;color:#8a8178;text-transform:uppercase;letter-spacing:.4px}
  .day.sel .dow{color:#9fc3ca}
  .day .dd{margin-top:4px;font-size:20px;font-weight:900;color:#15171B;letter-spacing:-.5px}
  .day.sel .dd{color:#fff}
  .day .mon{margin-top:2px;font-size:11px;font-weight:600;color:#8a8178}
  .day.sel .mon{color:#9fc3ca}
  .freelbl{margin-top:26px;font-size:14px;font-weight:700;color:#42454b}
  .slots{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .slot{padding:13px 6px;border-radius:12px;border:1.5px solid #dce3e4;background:#fff;color:#15171B;font-size:15px;font-weight:700;cursor:pointer}
  .slot.sel{border-color:#0a4958;background:#0a4958;color:#fff}

  .form{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .full{grid-column:1 / -1}
  .field label{display:block;font-size:13px;font-weight:700;color:#42454b;margin-bottom:7px}
  .field input,.field select{width:100%;padding:13px 15px;border:1.5px solid #dce3e4;border-radius:11px;font-size:15px;background:#fff;color:#15171B}
  .field input[type="date"]{min-height:50px;font-size:16px;-webkit-appearance:none;appearance:none}

  .summary{margin-top:20px;background:#f1f6f7;border-radius:14px;padding:6px 20px}
  .srow{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #e2eaeb}
  .srow:last-child{border-bottom:none}
  .srow .sk{font-size:14px;font-weight:500;color:#6b7780}
  .srow .sv{font-size:14px;font-weight:700;color:#15171B;text-align:right}
  .consent{margin-top:20px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .consent input{margin-top:3px;width:18px;height:18px;accent-color:#0a4958;flex-shrink:0}
  .consent span{font-size:13px;font-weight:500;color:#6b7780;line-height:1.5}
  .consent a{color:#0a4958}
  .submit{margin-top:24px;width:100%;background:#0a4958;color:#fff;border:none;font-size:16px;font-weight:800;padding:17px;border-radius:14px;cursor:pointer}
  .submit:hover{background:#0c5566}.submit:disabled{background:#9fb9bf;cursor:not-allowed}

  .nav{margin-top:18px;display:flex;gap:12px}
  .nav .back{flex:0 0 auto;background:#fff;border:1.5px solid #dce3e4;color:#42454b;font-size:15px;font-weight:700;padding:16px 26px;border-radius:14px;cursor:pointer}
  .nav .next{flex:1;background:#0a4958;color:#fff;border:none;font-size:16px;font-weight:800;padding:16px;border-radius:14px;cursor:pointer}
  .nav .next:disabled{background:#dce3e4;color:#9aa3a8;cursor:not-allowed}

  .msg{margin-top:14px;font-size:13px;padding:11px 14px;border-radius:11px;display:none;white-space:pre-wrap}
  .msg.err{display:block;background:#FCEBEA;color:#b53a2c;font-weight:600}

  .xsell{margin-top:24px;background:#0a4958;border-radius:18px;padding:24px 26px;display:flex;flex-wrap:wrap;align-items:center;gap:18px}
  .xsell .t1{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.2px}
  .xsell .t2{margin-top:4px;font-size:13px;font-weight:500;color:#9fc3ca;line-height:1.5}
  .xsell a{flex:0 0 auto;background:#F0A868;color:#15171B;font-size:14px;font-weight:800;padding:13px 22px;border-radius:11px;text-decoration:none}
  .xsell a:hover{background:#f2b27c}

  .done{margin-top:22px;background:#fff;border-radius:22px;box-shadow:0 8px 30px rgba(10,73,88,.08);padding:40px 34px;text-align:center;animation:fiUp .25s ease}
  .done .chk{width:64px;height:64px;border-radius:50%;background:#E7F6EC;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}

  .legal{max-width:760px;margin:0 auto;padding:8px 24px 36px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
  .legal a{color:#7a8a8e;font-size:12px;font-weight:600;text-decoration:none}
  .legal a:hover{color:#0a4958}
  .legal span{color:#aab6b8;font-size:12px}

  @media (max-width:720px){
    .topbar .addr{display:none}
    .wrap{padding:32px 18px 48px}
    .card{padding:26px 20px}
    .head h1{font-size:30px}
    .opts{grid-template-columns:1fr}
    .form{grid-template-columns:1fr}
    .slots{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

  <div class="topbar"><div class="in">
    <a href="/mitglieder"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier" /></a>
    <div class="addr">Auf Hirtenberg 8 · 54296 Trier</div>
  </div></div>

  <div class="wrap">
    <div class="head">
      <div class="badge"><span class="dot"></span><span id="badgeText">Kostenlos · unverbindlich · 90 Min</span></div>
      <h1>Probetraining buchen</h1>
      <p>Lerne unser Studio und Team kennen — wir begleiten dich durch dein Training. Kostenlos, unverbindlich, 90&nbsp;Minuten.</p>
    </div>

    <div id="flow"></div>
  </div>

  <div class="legal">
    <a href="https://www.fit-inn-trier.de/impressum-fit-inn-trier" target="_blank" rel="noopener">Impressum</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/datenschutz-fit-inn-trier" target="_blank" rel="noopener">Datenschutz</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/agbs-fit-inn-trier" target="_blank" rel="noopener">AGB</a><span>·</span>
    <a href="https://www.fit-inn-trier.de/kundigungsbedingungen-fit-inn-trier" target="_blank" rel="noopener">Widerruf</a>
  </div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  var params=new URLSearchParams(location.search);
  var REF=(params.get('ref')||params.get('code')||'').trim().toUpperCase().slice(0,40);
  var rawName=(params.get('name')||'').trim().replace(/[^\p{L}\s\-]/gu,'').slice(0,40);
  var REFNAME=rawName?(rawName.charAt(0).toUpperCase()+rawName.slice(1)):'';
  var joinHref='/mitglied-werden'+(REF?('?ref='+encodeURIComponent(REF)):'');

  // Badge personalisieren
  if(REFNAME) $('badgeText').textContent='Eingeladen von '+REFNAME+' · 2 Wochen gratis';
  else if(REF) $('badgeText').textContent='Eingeladen von einem Mitglied · 2 Wochen gratis';

  var TOTAL=7;
  var TITLES=['Fitnessziel','Freund mitbringen','Trainer','Termin','Persönliche Angaben','Adresse','Absenden'];
  var GOALS=[['fire','🔥','Abnehmen'],['heart','❤️','Allgemeine Fitness'],['health','🩺','Gesundheitliches Problem'],['muscle','💪','Muskelaufbau']];

  var S={step:1,goal:null,friend:null,trainer:null,dayKey:null,slotISO:null,consent:false,marketing:false,busy:false,err:'',showAllDays:false};
  var DAY_LIMIT=7;
  var F={gender:'',firstname:'',lastname:'',dateOfBirth:'',phone:'',email:'',street:'',houseNumber:'',zip:'',city:''};
  var DAYS=null, SLOTERR=false, loadedTrainer=null;

  var fmtDow=new Intl.DateTimeFormat('de-DE',{weekday:'short',timeZone:'Europe/Berlin'});
  var fmtDay=new Intl.DateTimeFormat('de-DE',{day:'2-digit',timeZone:'Europe/Berlin'});
  var fmtMon=new Intl.DateTimeFormat('de-DE',{month:'short',timeZone:'Europe/Berlin'});
  var fmtTime=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'});
  var fmtLong=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',timeZone:'Europe/Berlin'});
  var fmtFull=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'});

  // ---- Slots je nach Trainer-Wahl laden + nach Tagen gruppieren ----
  // trainerReq=true -> mit Trainer (weniger Termine); false -> ohne Trainer (mehr Termine).
  function loadSlots(trainerReq){
    loadedTrainer=trainerReq; DAYS=null; SLOTERR=false; S.dayKey=null; S.slotISO=null; S.showAllDays=false;
    if(S.step===4) render();
    fetch('/api/trial/slots?days=14&trainer='+(trainerReq?'1':'0'),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      if(loadedTrainer!==trainerReq) return; // zwischenzeitlich umgewählt -> veraltete Antwort verwerfen
      var slots=(d.slots||[]).filter(function(s){return s&&s.startDateTime;});
      slots.sort(function(a,b){return new Date(a.startDateTime)-new Date(b.startDateTime);});
      var map={},order=[];
      slots.forEach(function(s){ var dt=new Date(s.startDateTime); var key=dt.toLocaleDateString('de-DE',{timeZone:'Europe/Berlin'});
        if(!map[key]){ map[key]={key:key,dow:fmtDow.format(dt).replace('.',''),day:fmtDay.format(dt),mon:fmtMon.format(dt).replace('.',''),long:fmtLong.format(dt),slots:[]}; order.push(key); }
        map[key].slots.push({iso:s.startDateTime,time:fmtTime.format(dt)});
      });
      DAYS=order.map(function(k){return map[k];});
      if(DAYS.length){ S.dayKey=DAYS[0].key; }
      if(S.step===4) render();
    }).catch(function(){ if(loadedTrainer!==trainerReq) return; SLOTERR=true; if(S.step===4) render(); });
  }

  function selDay(){ if(!DAYS) return null; for(var i=0;i<DAYS.length;i++){ if(DAYS[i].key===S.dayKey) return DAYS[i]; } return DAYS[0]||null; }
  function selSlotLabel(){ if(!S.slotISO) return '–'; return fmtFull.format(new Date(S.slotISO))+' Uhr'; }

  // ---- Validierung pro Schritt ----
  function stepValid(n){
    if(n===1) return S.goal!==null;
    if(n===2) return S.friend!==null;
    if(n===3) return S.trainer!==null;
    if(n===4) return !!S.slotISO;
    if(n===5) return ['firstname','lastname','email','phone','gender','dateOfBirth'].every(function(k){return (F[k]||'').trim();}) && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email);
    if(n===6) return ['street','houseNumber','zip','city'].every(function(k){return (F[k]||'').trim();});
    if(n===7) return S.consent;
    return true;
  }

  // ---- Render ----
  function progressBar(){
    return '<div class="prog"><div class="l">Schritt '+S.step+' von '+TOTAL+'</div><div class="r">'+esc(TITLES[S.step-1])+'</div></div>'+
      '<div class="track"><div class="fill" style="width:'+Math.round(S.step/TOTAL*100)+'%"></div></div>';
  }
  function optBtn(idx,cur,inner){ var sel=(cur===idx); return '<button type="button" class="opt'+(sel?' sel':'')+'" data-opt="'+idx+'">'+inner+'</button>'; }

  function stepCard(){
    var eb='<div class="eyebrow">Schritt '+S.step+'</div>';
    if(S.step===1){
      var g=GOALS.map(function(o,i){ return optBtn(i,S.goal,'<span class="oi"><span class="ic">'+o[1]+'</span><span class="ol">'+o[2]+'</span></span>'); }).join('');
      return '<div class="card">'+eb+'<div class="q">Was ist dein wichtigstes Fitnessziel?</div><div class="opts">'+g+'</div></div>';
    }
    if(S.step===2){
      var fr=[['Ja, mit Freund','Ihr trainiert gemeinsam zur Probe.'],['Nein, allein','Ich komme zum Probetraining allein.']]
        .map(function(o,i){ return optBtn(i,S.friend,'<div class="ot">'+o[0]+'</div><div class="od">'+o[1]+'</div>'); }).join('');
      return '<div class="card">'+eb+'<div class="q">Bringst du einen Freund mit?</div><div class="sub">Trainieren macht zu zweit mehr Spaß — dein Freund kann gern zum Probetraining mitkommen.</div><div class="opts">'+fr+'</div></div>';
    }
    if(S.step===3){
      var tr=[['Mit Trainer','Empfohlen für Einsteiger – Pflicht unter 18.'],['Ohne Trainer','Eigenständig trainieren, ab 18 Jahren.']]
        .map(function(o,i){ return optBtn(i,S.trainer,'<div class="ot">'+o[0]+'</div><div class="od">'+o[1]+'</div>'); }).join('');
      return '<div class="card">'+eb+'<div class="q">Mit oder ohne Trainer?</div>'+
        '<div class="info"><span>ⓘ</span><span>Mindestalter 16 Jahre — unter 18 Jahren ist das Training nur mit Trainer möglich. Ab 18 kannst du auch ohne trainieren.</span></div>'+
        '<div class="opts">'+tr+'</div></div>';
    }
    if(S.step===4){
      var body;
      if(DAYS===null && !SLOTERR){ body='<div class="sub" style="margin-top:18px">Freie Termine werden geladen …</div>'; }
      else if(SLOTERR){ body='<div class="sub" style="margin-top:18px">Termine konnten nicht geladen werden. Bitte später erneut oder ruf uns an: <b>0651 308524</b>.</div>'; }
      else if(!DAYS.length){ body='<div class="sub" style="margin-top:18px">Aktuell sind keine freien Termine online verfügbar. Ruf uns gern an – wir finden gemeinsam einen Termin: <b>0651 308524</b>.</div>'; }
      else {
        var d=selDay();
        var visDays=S.showAllDays?DAYS:DAYS.slice(0,DAY_LIMIT);
        var chips=visDays.map(function(x){ return '<button type="button" class="day'+(x.key===S.dayKey?' sel':'')+'" data-day="'+esc(x.key)+'"><div class="dow">'+esc(x.dow)+'</div><div class="dd">'+esc(x.day)+'</div><div class="mon">'+esc(x.mon)+'</div></button>'; }).join('');
        var more=(!S.showAllDays&&DAYS.length>DAY_LIMIT)?'<button type="button" id="moreDays" class="moredays">+ '+(DAYS.length-DAY_LIMIT)+' weitere Tage anzeigen</button>':'';
        var times=(d?d.slots:[]).map(function(s){ return '<button type="button" class="slot'+(s.iso===S.slotISO?' sel':'')+'" data-slot="'+esc(s.iso)+'">'+esc(s.time)+'</button>'; }).join('');
        body='<div class="days">'+chips+'</div>'+more+'<div class="freelbl">Freie Zeiten am '+esc(d?d.long:'')+'</div><div class="slots">'+times+'</div>';
      }
      var hint=(S.trainer===0)
        ? 'Zeiten mit Trainerbegleitung — diese sind begrenzter verfügbar.'
        : 'Ohne Trainer sind meist deutlich mehr Zeiten frei.';
      return '<div class="card">'+eb+'<div class="q">Wähle deinen Termin</div><div class="sub">'+hint+'</div>'+body+'</div>';
    }
    if(S.step===5){
      return '<div class="card">'+eb+'<div class="q">Persönliche Angaben</div><div class="form">'+
        '<div class="field full"><label>Anrede</label><select data-f="gender"><option value="">Bitte wählen</option><option value="MALE"'+(F.gender==='MALE'?' selected':'')+'>Herr</option><option value="FEMALE"'+(F.gender==='FEMALE'?' selected':'')+'>Frau</option><option value="UNISEX"'+(F.gender==='UNISEX'?' selected':'')+'>Divers</option></select></div>'+
        '<div class="field"><label>Vorname</label><input data-f="firstname" autocomplete="given-name" value="'+esc(F.firstname)+'" /></div>'+
        '<div class="field"><label>Nachname</label><input data-f="lastname" autocomplete="family-name" value="'+esc(F.lastname)+'" /></div>'+
        '<div class="field"><label>Geburtsdatum</label><input data-f="dateOfBirth" type="date" max="'+new Date().toISOString().slice(0,10)+'" value="'+esc(F.dateOfBirth)+'" /></div>'+
        '<div class="field"><label>Telefon</label><input data-f="phone" type="tel" autocomplete="tel" placeholder="0151 23456789" value="'+esc(F.phone)+'" /></div>'+
        '<div class="field full"><label>E-Mail</label><input data-f="email" type="email" autocomplete="email" placeholder="max@beispiel.de" value="'+esc(F.email)+'" /></div>'+
        '</div></div>';
    }
    if(S.step===6){
      return '<div class="card">'+eb+'<div class="q">Deine Adresse</div><div class="form" style="grid-template-columns:3fr 1fr">'+
        '<div class="field"><label>Straße</label><input data-f="street" autocomplete="address-line1" value="'+esc(F.street)+'" /></div>'+
        '<div class="field"><label>Nr.</label><input data-f="houseNumber" value="'+esc(F.houseNumber)+'" /></div>'+
        '<div class="field"><label>PLZ</label><input data-f="zip" inputmode="numeric" maxlength="5" value="'+esc(F.zip)+'" /></div>'+
        '<div class="field"><label>Ort</label><input data-f="city" value="'+esc(F.city)+'" /></div>'+
        '</div></div>';
    }
    // Step 7
    var rows=[['Fitnessziel',S.goal!==null?GOALS[S.goal][2]:'–'],['Freund mitbringen',S.friend!==null?(S.friend===0?'Ja':'Nein'):'–'],['Training',S.trainer!==null?(S.trainer===0?'Mit Trainer':'Ohne Trainer'):'–'],['Termin',selSlotLabel()],['Name',((F.firstname||'')+' '+(F.lastname||'')).trim()||'–'],['E-Mail',F.email||'–']]
      .map(function(r){ return '<div class="srow"><span class="sk">'+esc(r[0])+'</span><span class="sv">'+esc(r[1])+'</span></div>'; }).join('');
    return '<div class="card">'+eb+'<div class="q">Zusammenfassung</div><div class="summary">'+rows+'</div>'+
      '<label class="consent"><input type="checkbox" data-chk="consent"'+(S.consent?' checked':'')+' /><span>Ich habe die <a href="https://www.fit-inn-trier.de/datenschutz-fit-inn-trier" target="_blank" rel="noopener">Datenschutzerklärung</a> gelesen und stimme der Verarbeitung meiner Daten zur Terminbuchung zu.</span></label>'+
      '<label class="consent" style="margin-top:12px"><input type="checkbox" data-chk="marketing"'+(S.marketing?' checked':'')+' /><span>Ich möchte Infos zu Angeboten & Kursen per E-Mail erhalten (optional).</span></label>'+
      '<button type="button" class="submit'+(S.consent&&!S.busy?' ready':'')+'" id="submitBtn"'+((!S.consent||S.busy)?' disabled':'')+'>'+(S.busy?'Wird gebucht …':'Probetraining verbindlich buchen')+'</button>'+
      '<div class="msg'+(S.err?' err':'')+'" id="msg">'+esc(S.err)+'</div></div>';
  }

  function navBar(){
    if(S.step>=TOTAL) return '';
    var back=S.step>1?'<button type="button" class="back" id="backBtn">Zurück</button>':'';
    var ok=stepValid(S.step);
    return '<div class="nav">'+back+'<button type="button" class="next'+(ok?' ready':'')+'" id="nextBtn"'+(ok?'':' disabled')+'>Weiter</button></div>';
  }

  // Schritt-Übergang (auch für Auto-Weiter bei Einzelauswahl)
  var advTimer=null;
  function goNext(){ if(advTimer){ clearTimeout(advTimer); advTimer=null; }
    if(stepValid(S.step)&&S.step<TOTAL){ S.step++; S.err='';
    if(S.step===4){ var wt=(S.trainer===0); if(loadedTrainer!==wt) loadSlots(wt); }
    render(); window.scrollTo(0,0); } }

  function xsell(){
    var bonus=REF?' und sichere dir deinen Bonus von 2 Wochen gratis':'';
    return '<div class="xsell"><div style="flex:1;min-width:220px"><div class="t1">Schon überzeugt?</div><div class="t2">Werde direkt online Mitglied'+bonus+'.</div></div><a href="'+joinHref+'">Mitglied werden →</a></div>';
  }

  function doneView(){
    return '<div class="done"><div class="chk"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1d7a3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>'+
      '<div style="font-size:24px;font-weight:900">Wir freuen uns auf dich!</div>'+
      '<div style="font-size:14px;color:#6b7780;margin-top:8px;line-height:1.55">Dein Probetraining am <b>'+esc(selSlotLabel())+'</b> ist reserviert. Eine Bestätigung kommt per E-Mail.</div>'+
      '<a href="'+joinHref+'" style="display:inline-block;margin-top:22px;background:#0a4958;color:#fff;font-weight:800;font-size:15px;padding:15px 28px;border-radius:13px;text-decoration:none">Direkt Mitglied werden</a></div>';
  }

  function render(){
    if(S.done){ $('flow').innerHTML=doneView(); window.scrollTo(0,0); return; }
    $('flow').innerHTML=progressBar()+stepCard()+navBar()+xsell();
  }

  // ---- Events (Delegation) ----
  document.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('[data-opt],[data-day],[data-slot],#moreDays,#nextBtn,#backBtn,#submitBtn'):null;
    if(!el) return;
    if(el.id==='moreDays'){ S.showAllDays=true; render(); return; }
    if(el.hasAttribute('data-opt')){ var i=+el.getAttribute('data-opt');
      if(S.step===1)S.goal=i; else if(S.step===2)S.friend=i; else if(S.step===3)S.trainer=i; render();
      // Einzelauswahl: kurz die Auswahl zeigen, dann automatisch weiter
      if(S.step<=3){ if(advTimer)clearTimeout(advTimer); advTimer=setTimeout(goNext,280); }
      return; }
    if(el.hasAttribute('data-day')){ S.dayKey=el.getAttribute('data-day'); S.slotISO=null; render(); return; }
    if(el.hasAttribute('data-slot')){ S.slotISO=el.getAttribute('data-slot'); render();
      // Termin gewählt -> automatisch weiter zu den Daten
      if(advTimer)clearTimeout(advTimer); advTimer=setTimeout(goNext,300); return; }
    if(el.id==='nextBtn'){ goNext(); return; }
    if(el.id==='backBtn'){ if(advTimer){clearTimeout(advTimer);advTimer=null;} if(S.step>1){ S.step--; S.err=''; render(); window.scrollTo(0,0); } return; }
    if(el.id==='submitBtn'){ submit(); return; }
  });
  function syncNext(){ var nb=$('nextBtn'); if(nb){ var ok=stepValid(S.step); nb.disabled=!ok; nb.classList.toggle('ready',ok); } }
  document.addEventListener('input',function(e){ var el=e.target; if(el.hasAttribute&&el.hasAttribute('data-f')){ F[el.getAttribute('data-f')]=el.value; syncNext(); } });
  document.addEventListener('change',function(e){ var el=e.target;
    if(el.hasAttribute&&el.hasAttribute('data-f')){ F[el.getAttribute('data-f')]=el.value; syncNext(); }
    if(el.hasAttribute&&el.hasAttribute('data-chk')){ S[el.getAttribute('data-chk')]=el.checked; var sb=$('submitBtn'); if(sb){ var ok=S.consent&&!S.busy; sb.disabled=!ok; sb.classList.toggle('ready',ok); } } });

  function submit(){
    if(!stepValid(7)){ S.err='Bitte stimme der Datenschutzerklärung zu.'; render(); return; }
    S.busy=true; S.err=''; render();
    var noteBits=[];
    if(S.goal!==null) noteBits.push('Ziel: '+GOALS[S.goal][2]);
    if(S.friend!==null) noteBits.push(S.friend===0?'mit Freund':'allein');
    if(S.trainer!==null) noteBits.push(S.trainer===0?'mit Trainer':'ohne Trainer');
    var data={ startDateTime:S.slotISO, referralCode:REF||undefined, marketing:S.marketing, trainerRequired:(S.trainer===0),
      gender:F.gender, firstname:F.firstname.trim(), lastname:F.lastname.trim(), email:F.email.trim(),
      phone:F.phone.trim(), dateOfBirth:F.dateOfBirth, street:F.street.trim(), houseNumber:F.houseNumber.trim(),
      zip:F.zip.trim(), city:F.city.trim(), note:'Probetraining über die Website'+(noteBits.length?(' — '+noteBits.join(' · ')):'') };
    fetch('/api/trial/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
      .then(function(r){return r.json();}).then(function(res){
        S.busy=false;
        if(res.ok){ S.done=true; render(); }
        else { S.err=res.message||'Buchung fehlgeschlagen – bitte einen anderen Termin wählen.'; render(); }
      }).catch(function(){ S.busy=false; S.err='Es ist ein Fehler aufgetreten. Bitte später erneut.'; render(); });
  }

  // Eingeloggtes Mitglied? Formular mit den Magicline-Daten vorausfüllen.
  (function prefill(){
    var tok=localStorage.getItem('fi_member_token')||sessionStorage.getItem('fi_member_token')||null;
    if(!tok) return;
    fetch('/api/member/me',{headers:{Authorization:'Bearer '+tok},cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
      if(!d||!d.profile) return; var p=d.profile;
      var set=function(k,v){ if(v&&!(F[k]||'').trim()) F[k]=v; };
      set('firstname',p.firstName); set('lastname',p.lastName); set('email',p.email); set('phone',p.phonePrivate);
      set('dateOfBirth',p.dateOfBirth); set('street',p.street); set('houseNumber',p.houseNumber); set('zip',p.zipCode); set('city',p.city);
      render();
    }).catch(function(){});
  })();

  render();
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
