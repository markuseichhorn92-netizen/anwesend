<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fit-Inn Trier · Probetraining buchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;}
  body{margin:0; min-height:100dvh; background:linear-gradient(165deg,#0e6072 0%,#063540 100%);
    font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased;
    color:#15171B; display:flex; align-items:flex-start; justify-content:center; padding:max(env(safe-area-inset-top,0px),24px) 16px 48px;}
  .card{width:100%; max-width:460px; background:#fff; border-radius:22px; box-shadow:0 18px 50px rgba(4,33,40,.30); padding:24px 22px;}
  .brand img{height:24px; filter:invert(1) brightness(.3);}
  h1{font-size:21px; font-weight:900; margin:10px 0 2px;}
  .sub{color:#6b7780; font-size:13px; margin:0 0 16px; line-height:1.5;}
  label{display:block; font-size:12px; font-weight:700; color:#42454b; margin:12px 0 5px;}
  input,select{width:100%; padding:12px 13px; border:1px solid #d6dee0; border-radius:11px; font-size:15px; font-family:inherit; color:#15171B; background:#fff;}
  input:focus,select:focus{outline:none; border-color:#0a4958; box-shadow:0 0 0 3px rgba(10,73,88,.12);}
  button{width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px; background:#0a4958; color:#fff; font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;}
  button:hover{background:#0c5566;} button:disabled{opacity:.55; cursor:default;}
  .row2{display:flex; gap:10px;} .row2 > div{flex:1;}
  .msg{margin-top:14px; font-size:13px; padding:10px 12px; border-radius:10px; display:none;}
  .msg.ok{display:block; background:#E7F6EC; color:#1d7a3e;}
  .msg.err{display:block; background:#FCEBEA; color:#b53a2c;}
  .ref{display:flex; gap:10px; align-items:center; background:linear-gradient(100deg,#E7F1F3,#D6E8EB); border:1px solid #C2DCE0; border-radius:14px; padding:11px 13px; margin:0 0 16px; font-size:13px; color:#0a4958;}
  .ref b{font-weight:900; letter-spacing:1px;}
  .sec{margin-top:22px; padding-top:18px; border-top:1px solid #eaf0f1;}
  .sec h2{font-size:14px; font-weight:800; margin:0 0 10px;}
  .days{display:flex; flex-direction:column; gap:14px;}
  .day .dh{font-size:13px; font-weight:800; color:#0a4958; margin-bottom:7px;}
  .slots{display:flex; flex-wrap:wrap; gap:8px;}
  .slot{flex:0 0 auto; width:auto; margin:0; padding:9px 14px; background:#eef3f4; color:#0a4958; font-size:14px; font-weight:700; border-radius:10px; border:2px solid transparent;}
  .slot.sel{background:#0a4958; color:#fff;}
  .consent{display:flex; gap:9px; align-items:flex-start; margin-top:14px; font-size:12px; color:#5a636b; line-height:1.45;}
  .consent input{width:18px; height:18px; flex:none; margin-top:1px;}
  .center{text-align:center;}
  .badge{display:inline-block; background:#0a4958; color:#fff; font-size:34px; line-height:1; padding:14px; border-radius:16px; margin:6px 0 12px;}
  .big{font-size:19px; font-weight:900; margin:4px 0 2px;}
  .muted{color:#8a929a; font-size:12px; margin-top:8px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/assets/fitinn-logo-white.png" alt="Fit-Inn Trier"></div>

    <!-- Buchungsansicht -->
    <div id="bookView">
      <h1>Probetraining buchen</h1>
      <p class="sub" id="intro">Lerne uns unverbindlich kennen – such dir einfach einen freien Termin aus.</p>
      <div class="ref" id="refBadge" style="display:none">🎁 <span>Du wurdest von einem Mitglied eingeladen – Code <b id="refShow">—</b></span></div>

      <!-- Termin wählen -->
      <div class="sec" style="border-top:none;padding-top:0;margin-top:0">
        <h2>1 · Termin wählen</h2>
        <div id="slotsBox"><p class="muted" id="slotsState">Lade freie Termine …</p></div>
      </div>

      <!-- Daten -->
      <div class="sec">
        <h2>2 · Deine Daten</h2>
        <div class="row2">
          <div><label for="firstname">Vorname</label><input id="firstname" autocomplete="given-name"></div>
          <div><label for="lastname">Nachname</label><input id="lastname" autocomplete="family-name"></div>
        </div>
        <label for="email">E-Mail</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@beispiel.de">
        <label for="phone">Telefon / Handy</label>
        <input id="phone" type="tel" autocomplete="tel" placeholder="0651 …">
        <div class="row2">
          <div><label for="gender">Anrede</label>
            <select id="gender"><option value="">Bitte wählen</option><option value="FEMALE">Weiblich</option><option value="MALE">Männlich</option><option value="UNISEX">Divers</option></select>
          </div>
          <div><label for="dateOfBirth">Geburtsdatum</label><input id="dateOfBirth" type="date"></div>
        </div>
        <div class="row2">
          <div><label for="street">Straße</label><input id="street" autocomplete="address-line1"></div>
          <div style="flex:0 0 90px"><label for="houseNumber">Nr.</label><input id="houseNumber"></div>
        </div>
        <div class="row2">
          <div style="flex:0 0 120px"><label for="zip">PLZ</label><input id="zip" inputmode="numeric" maxlength="5"></div>
          <div><label for="city">Ort</label><input id="city" autocomplete="address-level2"></div>
        </div>

        <label class="consent"><input id="marketing" type="checkbox">
          <span>Ich bin einverstanden, dass das Fit-Inn Trier mich zu meinem Probetraining und passenden Angeboten per E-Mail/Telefon kontaktiert. (optional, jederzeit widerrufbar)</span>
        </label>

        <button id="submit" type="button">Probetraining verbindlich buchen</button>
        <div id="msg" class="msg"></div>
      </div>
    </div>

    <!-- Erfolg -->
    <div id="doneView" style="display:none" class="center">
      <div class="badge">✓</div>
      <div class="big">Probetraining gebucht!</div>
      <p class="sub" id="doneText" style="margin-top:8px"></p>
    </div>
  </div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function msg(ok,t){ var e=$('msg'); e.className='msg '+(ok?'ok':'err'); e.textContent=t; }
  function hideMsg(){ $('msg').className='msg'; $('msg').textContent=''; }

  // Referral-Code aus der URL
  var params = new URLSearchParams(location.search);
  var REF = (params.get('ref') || params.get('code') || '').trim().toUpperCase();
  if(REF){ $('refShow').textContent = REF; $('refBadge').style.display='flex'; }

  var SELECTED = null;
  var fmtDay = new Intl.DateTimeFormat('de-DE', { weekday:'short', day:'2-digit', month:'2-digit', timeZone:'Europe/Berlin' });
  var fmtTime = new Intl.DateTimeFormat('de-DE', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/Berlin' });
  var fmtFull = new Intl.DateTimeFormat('de-DE', { weekday:'long', day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Berlin' });

  function loadSlots(){
    fetch('/api/trial/slots', { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.name){ $('intro').textContent = 'Lerne uns beim ' + d.name + ' unverbindlich kennen – such dir einfach einen freien Termin aus.'; }
        var slots = (d.slots||[]).filter(function(s){ return s && s.startDateTime; });
        if(!slots.length){ $('slotsState').textContent = 'Aktuell sind keine freien Termine verfügbar. Bitte später erneut schauen oder ruf uns an: 0651 308524.'; return; }
        renderSlots(slots);
      })
      .catch(function(){ $('slotsState').textContent = 'Termine konnten nicht geladen werden. Bitte später erneut.'; });
  }

  function renderSlots(slots){
    // nach Tag (Berlin) gruppieren
    var groups = {}; var order = [];
    slots.forEach(function(s){
      var d = new Date(s.startDateTime);
      var key = fmtDay.format(d);
      if(!groups[key]){ groups[key]=[]; order.push(key); }
      groups[key].push(s);
    });
    var box = $('slotsBox'); box.innerHTML='';
    var wrap = document.createElement('div'); wrap.className='days';
    order.forEach(function(key){
      var day = document.createElement('div'); day.className='day';
      var h = document.createElement('div'); h.className='dh'; h.textContent=key; day.appendChild(h);
      var sl = document.createElement('div'); sl.className='slots';
      groups[key].forEach(function(s){
        var b = document.createElement('button'); b.type='button'; b.className='slot';
        b.textContent = fmtTime.format(new Date(s.startDateTime));
        b.addEventListener('click', function(){
          SELECTED = s;
          var all = box.querySelectorAll('.slot'); for(var i=0;i<all.length;i++) all[i].classList.remove('sel');
          b.classList.add('sel'); hideMsg();
        });
        sl.appendChild(b);
      });
      day.appendChild(sl); wrap.appendChild(day);
    });
    box.appendChild(wrap);
  }

  var FIELDS = ['firstname','lastname','email','phone','gender','dateOfBirth','street','houseNumber','zip','city'];

  $('submit').addEventListener('click', function(){
    hideMsg();
    if(!SELECTED){ msg(false,'Bitte zuerst einen Termin auswählen.'); return; }
    var data = { startDateTime: SELECTED.startDateTime, referralCode: REF || undefined, marketing: $('marketing').checked };
    for(var i=0;i<FIELDS.length;i++){
      var v = ($(FIELDS[i]).value||'').trim();
      if(!v){ msg(false,'Bitte alle Felder ausfüllen.'); $(FIELDS[i]).focus(); return; }
      data[FIELDS[i]] = v;
    }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)){ msg(false,'Bitte eine gültige E-Mail-Adresse angeben.'); return; }

    var b=$('submit'); b.disabled=true; b.textContent='Wird gebucht …';
    fetch('/api/trial/book', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok){
          $('doneText').textContent = 'Dein Termin am ' + fmtFull.format(new Date(SELECTED.startDateTime)) + ' Uhr ist reserviert. Du bekommst eine Bestätigung per E-Mail. Wir freuen uns auf dich!';
          $('bookView').style.display='none'; $('doneView').style.display='block';
          window.scrollTo(0,0);
        } else { msg(false, d.message || 'Buchung fehlgeschlagen.'); }
      })
      .catch(function(){ msg(false,'Es ist ein Fehler aufgetreten. Bitte später erneut.'); })
      .finally(function(){ b.disabled=false; b.textContent='Probetraining verbindlich buchen'; });
  });

  loadSlots();
})();
</script>
</body>
</html>
